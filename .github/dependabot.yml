# Dependabot configuration for Comfy-Org/github-workflows.
# Docs: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# This repo had NO Dependabot config until now, which is a sharper gap here than
# in a normal repo: everything this repo ships is a *reusable workflow*, and it
# pins every third-party action by full commit SHA (the correct practice — a tag
# is mutable, and a compromised action runs inside consumers' CI with their
# secrets). SHAs do not float, so without Dependabot they simply rot: a security
# fix in actions/checkout never reaches any of the ~5 consumer repos that call
# these reusables, and it rots silently, because nothing fails.
#
# Blast radius is the reason this matters more than the repo's size suggests. A
# stale action here is stale in EVERY caller simultaneously — cloud,
# comfy-cloud-mcp-server, comfy-local-mcp, comfy-infra — and several of these
# workflows hold a bot App token with contents/pull-requests/issues write.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      # Monthly, matching the cloud repo's github-actions cadence. These are CI
      # actions, not runtime dependencies; weekly churn here buys noise, and the
      # security-updates group below is not rate-limited by this interval.
      interval: "monthly"
    groups:
      # One grouped PR rather than a dozen singles. Every caller pins THIS repo by
      # SHA, so each merge here obliges a fleet-wide caller bump
      # (bump-*-callers.yml opens those PRs automatically) — batching keeps that
      # to one bump per cycle instead of one per action.
      github-actions:
        patterns: ["*"]
    labels: ["dependencies"]
    open-pull-requests-limit: 2
    cooldown:
      # Let a freshly-published version sit for a day before we adopt it, so a
      # botched release is usually yanked before it reaches consumer CI.
      default-days: 1
    ignore:
      # NEVER let Dependabot touch this repo's self-references.
      #
      # A caller of a reusable in this repo pins it TWICE — the `uses:` SHA and a
      # `workflows_ref:` input that loads the matching briefs/scripts at run time
      # — and the two MUST stay in lock-step or a run executes one version's
      # workflow against another version's scripts. Dependabot only understands
      # `uses:`; it rewrites the SHA and leaves `workflows_ref:` behind, producing
      # exactly that split state. This is not hypothetical: Comfy-Org/cloud#5676
      # does it to four callers right now.
      #
      # `bump-callers.sh` is the tool that rewrites BOTH, and it is the only thing
      # that should ever move these pins. The same ignore belongs in every
      # consumer repo's dependabot.yml.
      - dependency-name: "Comfy-Org/*"

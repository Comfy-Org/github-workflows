name: Assign Reviewers (reusable)

# Assigns owners using configured expertise and recent human approvals on
# the changed code. Workload breaks ties; extra owners must add coverage.
# NOTE: this org routes/alerts people via the ASSIGNEE field, so this workflow
# writes assignees (github.rest.issues.addAssignees) — NOT reviewer requests.
# Models its structure on cursor-review-auto-label.yml: a workflow_call
# contract, caller-side `vars` for config, a GitHub App token, and defensive
# draft/skip handling that never fails the PR.
#
# WHY AN APP TOKEN: assignments are made with the CLOUD_CODE_BOT app token
# (vars.APP_ID + secrets.CLOUD_CODE_BOT_PRIVATE_KEY), not the default
# GITHUB_TOKEN. On fork PRs the GITHUB_TOKEN is read-only, so a
# GITHUB_TOKEN-driven addAssignees would 403 (same class of failure seen in
# github-workflows#12). The app token sidesteps that, so the calling job only
# needs `contents: read`. NOTE: assigning users on PRs uses the app's
# `Pull requests: write` permission, which CLOUD_CODE_BOT already carries.
#
# REVIEWER CONFIG (in the CALLER repo, default `.github/reviewers.yml`): a
# top-level `default_pool` plus a `rules` list mapping path globs to reviewers.
#
#   default_pool: [octocat, hubot]        # fallback when no rule matches
#   rules:
#     - paths: ["frontend/**", "*.css"]   # globs (*, **, ? supported)
#       reviewers: [alice, bob]
#     - paths:
#         - backend/**
#       reviewers:
#         - carol
#
# Both flow (`[a, b]`) and block (`- a`) sequences are accepted. The config is
# read from the PR base SHA, so proposed routing edits cannot select their
# own owners before the edits have been reviewed.
#
# AUTHOR SCOPING: vars.REVIEWER_AUTHOR_ALLOWLIST, when set, restricts routing to
# that list of PR authors and skips everyone else. It is the opt-in alternative to
# switching the automation off for the whole repo when only some people want their
# PRs routed (BE-11575). Unset/empty keeps the historical run-for-every-author
# behavior, so adding it breaks no existing caller.
#
# BASE-BRANCH SCOPING: vars.REVIEWER_SKIP_BASE_BRANCHES, when set, skips any PR
# whose BASE ref matches one of its whitespace-separated globs (same glob
# semantics as the path rules, so `stack/**` covers `stack/anything`). Unset/empty
# keeps routing on for every base, so adding it breaks no existing caller. The case
# it exists for is a stacked-PR lane: many small child PRs land on one long-lived
# integration branch and review is deferred to the single promotion PR, so routing
# an owner onto each child pages a human per commit for a review nobody intends to
# do there. Orthogonal to the skip_label input — that is per-PR and manual, this is
# per-lane and automatic.
#
# SELECTION: configured path expertise plus recent approvals on the same files
# or directories, then greedy coverage of the diff. Load breaks expertise ties.
# No random substitutions. A second owner must cover previously uncovered code.
# Decisions and supporting historical PR numbers appear in the run summary.
#
# CACHING: a scheduled/manual caller uses generate_history: true to publish a
# neutral history manifest from the default branch. The PR job opts in with
# history_workflow: <caller-filename.yml>. Only successful default-branch
# scheduled/manual runs supply snapshots, valid for 12 hours; all live routing
# policy still applies. Missing/unusable snapshots fall back to the same live
# collector. App Actions: read is needed for artifact lookup/download. See the
# caller guide for the complete two-job schedule + PR wiring.
#
# Example caller (consumer repo):
#
#   name: CI - Assign Reviewers
#   on:
#     pull_request:
#       types: [opened, ready_for_review]
#   jobs:
#     assign:
#       permissions:
#         contents: read
#       uses: Comfy-Org/github-workflows/.github/workflows/assign-reviewers.yml@<sha>  # v1
#       with:
#         num_reviewers: 2
#       secrets:
#         CLOUD_CODE_BOT_PRIVATE_KEY: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
#
# Caller-side configuration:
#   vars.APP_ID                    - CLOUD_CODE_BOT app id (same as cursor-review-auto-label)
#   vars.REVIEWER_GROWTH_POOL      - deprecated, ignored (no random assignments)
#   vars.REVIEWER_LOAD_CAP         - max open reviews before a candidate is steered off (optional)
#   vars.REVIEWER_EXCLUDE          - whitespace-separated logins to hard-exclude (optional)
#   vars.REVIEWER_AUTHOR_ALLOWLIST - whitespace-separated logins; when non-empty, ONLY
#                                    these authors' PRs are routed at all (optional)
#   vars.REVIEWER_SKIP_BASE_BRANCHES - whitespace-separated globs; a PR whose BASE ref
#                                    matches any of them is skipped (optional)

on:
  workflow_call:
    inputs:
      generate_history:
        description: Generate a shared history artifact on schedule or manual dispatch from the default branch.
        type: boolean
        required: false
        default: false
      history_workflow:
        description: Caller workflow filename that generates the artifact; empty disables cached history.
        type: string
        required: false
        default: ''
      reviewer_config_path:
        description: >-
          Path in the caller repo to the expertise/path-glob reviewer config.
        type: string
        required: false
        default: .github/reviewers.yml
      num_reviewers:
        description: Maximum owners to assign (1-10); extra owners must add coverage.
        type: number
        required: false
        default: 2
      skip_label:
        description: >-
          If this label is present on the PR, reviewer assignment is suppressed.
        type: string
        required: false
        default: skip-auto-assign
    secrets:
      CLOUD_CODE_BOT_PRIVATE_KEY:
        description: >-
          Private key for the CLOUD_CODE_BOT GitHub App (app id = vars.APP_ID).
          Required: assignments are made by the app so they succeed even on
          fork PRs where the default GITHUB_TOKEN is read-only.
        required: true

permissions:
  contents: read

jobs:
  assign-reviewers:
    name: ${{ inputs.generate_history && 'Refresh reviewer history' || 'Assign expertise-aware owners' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: intelligent-assignment-${{ github.repository }}-${{ inputs.generate_history && 'history' || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}

      - name: Collect history or select owners
        id: selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GENERATE_HISTORY: ${{ inputs.generate_history }}
          HISTORY_WORKFLOW: ${{ inputs.history_workflow }}
          REVIEWER_CONFIG_PATH: ${{ inputs.reviewer_config_path }}
          NUM_REVIEWERS: ${{ inputs.num_reviewers }}
          SKIP_LABEL: ${{ inputs.skip_label }}
          LOAD_CAP: ${{ vars.REVIEWER_LOAD_CAP }}
          EXCLUDE: ${{ vars.REVIEWER_EXCLUDE }}
          AUTHOR_ALLOWLIST: ${{ vars.REVIEWER_AUTHOR_ALLOWLIST }}
          SKIP_BASE_BRANCHES: ${{ vars.REVIEWER_SKIP_BASE_BRANCHES }}
        with:
          # Authenticate the octokit with the APP token so assignment works on
          # fork PRs (read-only GITHUB_TOKEN would 403).
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const normalizeLogin = (s) => s.replace(/^@/, '').toLowerCase();
            const validLogin = (s) => typeof s === 'string' && /^[a-z\d](?:[a-z\d-]{0,38})$/i.test(s);
            const MAX_BYTES = 2 * 1024 * 1024;
            const MAX_AGE = 12 * 60 * 60 * 1000;
            const artifactName = 'reviewer-history-v1';
            const sameRepo = (value) => typeof value === 'string' && value.toLowerCase() === `${owner}/${repo}`.toLowerCase();

            // Collect author-neutral evidence. Both live selection and scheduled refresh
            // use this exact collector; current author/exclusion/load policy applies later.
            const collectHistory = async (base) => {
              const since = new Date(Date.now() - 90 * 86400000).toISOString().slice(0, 10);
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:merged base:"${base}" merged:>=${since}`,
                sort: 'updated', order: 'desc', per_page: 50,
              });
              if (search.data.incomplete_results) throw new Error('incomplete history search');
              const records = [];
              for (const item of search.data.items) {
                const reviews = await github.paginate(github.rest.pulls.listReviews, {owner, repo, pull_number: item.number, per_page: 100});
                const final = new Map();
                for (const review of reviews) {
                  if (!review.user || review.user.type !== 'User' ||
                      !['MEMBER', 'OWNER', 'COLLABORATOR'].includes(review.author_association)) continue;
                  if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)) final.set(normalizeLogin(review.user.login), review.state);
                }
                const approvers = [...final].filter(([login, state]) => state === 'APPROVED' && validLogin(login)).map(([login]) => login);
                if (!approvers.length) continue;
                // Fetch at most three pages: sweeps of 300+ files are intentionally ignored.
                const files = [];
                for (let page = 1; page <= 3; page++) {
                  const response = await github.rest.pulls.listFiles({owner, repo, pull_number: item.number, per_page: 100, page});
                  files.push(...response.data);
                  if (response.data.length < 100) break;
                }
                if (files.length >= 300) continue;
                records.push({number: item.number, approvers, files: files.map(({filename, previous_filename}) => ({filename, ...(previous_filename ? {previous_filename} : {})}))});
              }
              return records;
            };

            if (process.env.GENERATE_HISTORY === 'true') {
              const repository = (await github.rest.repos.get({owner, repo})).data;
              if (!['schedule', 'workflow_dispatch'].includes(context.eventName) ||
                  context.ref !== `refs/heads/${repository.default_branch}`) {
                core.setFailed('History generation requires schedule or manual dispatch on the default branch.');
                return;
              }
              // Any API failure aborts this refresh. Never publish a partial snapshot.
              const records = await collectHistory(repository.default_branch);
              const manifest = {
                version: 1, repository: `${owner}/${repo}`, base: repository.default_branch,
                generated_at: new Date().toISOString(),
                run_id: String(context.runId), records,
              };
              const payload = JSON.stringify(manifest);
              if (Buffer.byteLength(payload) > MAX_BYTES) throw new Error('History manifest exceeds the 2 MiB limit');
              const fs = require('node:fs');
              const path = require('node:path');
              const directory = path.join(process.env.RUNNER_TEMP, 'reviewer-history');
              fs.mkdirSync(directory, {recursive: true});
              fs.writeFileSync(path.join(directory, 'manifest.json'), payload);
              core.setOutput('manifest_ready', 'true');
              core.info(`Generated ${records.length} history records (${Buffer.byteLength(payload)} bytes).`);
              return;
            }

            const readHistory = async (base) => {
              const workflow = process.env.HISTORY_WORKFLOW || '';
              if (!workflow) return null;
              try {
                if (!/^[a-zA-Z0-9_.-]+\.ya?ml$/.test(workflow)) throw new Error('invalid workflow identity');
                const repository = (await github.rest.repos.get({owner, repo})).data;
                if (base !== repository.default_branch) throw new Error('snapshot targets a different base');
                // Bound lookups and never accept PR/workflow_run artifacts, even if named
                // identically. Listing by workflow ID alone does not establish provenance.
                const runs = (await Promise.all(['schedule', 'workflow_dispatch'].map(async (event) =>
                  (await github.rest.actions.listWorkflowRuns({
                    owner, repo, workflow_id: workflow, branch: base, status: 'success', event,
                    created: `>=${new Date(Date.now() - MAX_AGE).toISOString()}`, per_page: 1,
                  })).data.workflow_runs
                ))).flat().sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
                const run = runs.find((r) => r.status === 'completed' && r.conclusion === 'success' &&
                  ['schedule', 'workflow_dispatch'].includes(r.event) && r.head_branch === base &&
                  r.path === `.github/workflows/${workflow}` && sameRepo(r.head_repository?.full_name) &&
                  Date.now() - Date.parse(r.created_at) >= 0 && Date.now() - Date.parse(r.created_at) <= MAX_AGE);
                if (!run) throw new Error('no recent trusted generator run');
                const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id, per_page: 100})).data.artifacts;
                const artifact = artifacts.find((a) => a.name === artifactName && !a.expired);
                if (!artifact || artifact.size_in_bytes > MAX_BYTES) throw new Error('missing, expired or oversized artifact');
                const download = await github.rest.actions.downloadArtifact({owner, repo, artifact_id: artifact.id, archive_format: 'zip'});
                const archive = Buffer.from(download.data);
                if (archive.length > MAX_BYTES) throw new Error('oversized archive');
                // Parse one JSON member in memory, never extract paths or execute content.
                // Python is preinstalled on ubuntu-latest; only its stdlib is used.
                const payload = require('node:child_process').execFileSync('python3', ['-c', [
                  'import io, sys, zipfile',
                  'z = zipfile.ZipFile(io.BytesIO(sys.stdin.buffer.read()))',
                  'assert len(z.infolist()) == 1',
                  'entry = z.infolist()[0]',
                  'assert entry.filename == "manifest.json" and entry.file_size <= 2 * 1024 * 1024',
                  'sys.stdout.buffer.write(z.read(entry))',
                ].join('\n')], {input: archive, maxBuffer: MAX_BYTES, timeout: 5000, stdio: ['pipe', 'pipe', 'pipe']});
                const manifest = JSON.parse(payload.toString('utf8'));
                const age = Date.now() - Date.parse(manifest.generated_at);
                if (manifest.version !== 1 || !sameRepo(manifest.repository) || manifest.base !== base ||
                    manifest.run_id !== String(run.id) ||
                    !Number.isFinite(age) || age < 0 || age > MAX_AGE ||
                    Date.parse(manifest.generated_at) < Date.parse(run.created_at) ||
                    !Array.isArray(manifest.records) || manifest.records.length > 50) throw new Error('invalid or stale manifest');
                const seen = new Set();
                const validPath = (p) => typeof p === 'string' && p.length > 0 && p.length <= 4096 && !/[\x00-\x1f]/.test(p);
                for (const record of manifest.records) {
                  if (!Number.isSafeInteger(record.number) || record.number <= 0 || seen.has(record.number) ||
                      !Array.isArray(record.approvers) || record.approvers.length > 1000 || !record.approvers.every(validLogin) ||
                      new Set(record.approvers.map(normalizeLogin)).size !== record.approvers.length ||
                      !Array.isArray(record.files) || record.files.length >= 300 ||
                      !record.files.every((f) => f && validPath(f.filename) && (f.previous_filename === undefined || validPath(f.previous_filename)))) throw new Error('invalid history record');
                  seen.add(record.number);
                }
                core.info(`History cache hit: run ${run.id}, ${Math.round(age / 60000)} minutes old, ${manifest.records.length} records.`);
                return manifest.records;
              } catch (error) {
                core.info(`History cache unavailable (${error.message}); fetching live history.`);
                return null;
              }
            };

            let pr = context.payload.pull_request;
            if (!pr) { core.info('Not a pull_request event — nothing to do.'); return; }
            const pull_number = pr.number;

            // Dependency-free glob -> RegExp (`*` within a segment, `**` across
            // segments, `?` single non-slash char). minimatch/picomatch are not
            // reliably available inside github-script, so we roll our own. Defined
            // here rather than with the other helpers below because the base-branch
            // early exit needs it before any API call is made.
            const globToRegExp = (glob) => {
              let re = '';
              for (let i = 0; i < glob.length; i++) {
                const c = glob[i];
                if (c === '*') {
                  if (glob[i + 1] === '*') {
                    if (glob[i + 2] === '/') { re += '(?:.*/)?'; i += 2; }
                    else { re += '.*'; i += 1; }
                  } else { re += '[^/]*'; }
                } else if (c === '?') {
                  re += '[^/]';
                } else if ('.+^${}()|[]\\/'.includes(c)) {
                  re += '\\' + c;
                } else {
                  re += c;
                }
              }
              return new RegExp('^' + re + '$');
            };
            const matchesAny = (p, globs) => globs.some((g) => globToRegExp(g).test(p));

            // --- 1. Early exits (never fail the PR) ---
            if (pr.draft) { core.info('PR is a draft — skipping.'); return; }
            if (pr.user && pr.user.type === 'Bot') { core.info('Author is a bot — skipping.'); return; }
            // Opt-in base-branch scoping. UNSET/empty => route PRs against every
            // base, exactly as before, so no existing caller changes behavior until
            // it sets the var. NON-EMPTY => skip any PR whose BASE ref matches one
            // of these globs.
            //
            // The case this exists for: a stacked-PR lane, where many small child
            // PRs land on one long-lived integration branch and review is deferred
            // to the single promotion PR at the end. Routing an owner onto each
            // child pages a human per commit for a review nobody intends to do
            // there, and the noise is what makes people mute the automation
            // wholesale. `stack/**` turns that off without touching the routing
            // that runs on PRs to the default branch.
            //
            // Matched against the base ref with the same glob semantics as the
            // path rules, so `stack/**` covers `stack/anything` and
            // `stack/a/b`, while a bare `release` matches only `release`.
            const skipBaseBranches = (process.env.SKIP_BASE_BRANCHES || '')
              .split(/\s+/).filter(Boolean);
            const baseRef = (pr.base && pr.base.ref) || '';
            if (skipBaseBranches.length > 0 && baseRef && matchesAny(baseRef, skipBaseBranches)) {
              core.info(`Base branch ${baseRef} matches REVIEWER_SKIP_BASE_BRANCHES — skipping.`);
              return;
            }
            const authorLogin = pr.user && pr.user.login;
            // Opt-in author scoping (BE-11575). UNSET/empty => route every
            // eligible author, exactly as before, so no existing caller changes
            // behavior until it sets the var. NON-EMPTY => route ONLY these
            // authors and skip every other PR with an informational log, never a
            // failing check. This is the knob that lets a repo keep the routing
            // on for the people who want it instead of turning it off for all.
            // Logins are matched case-insensitively and tolerate a leading `@`
            // because this gate fails CLOSED: one typo'd entry would otherwise
            // silently disable routing repo-wide with no error to notice.
            const authorAllowlist = (process.env.AUTHOR_ALLOWLIST || '')
              .split(/\s+/).filter(Boolean).map(normalizeLogin);
            if (authorAllowlist.length > 0) {
              if (!authorLogin || !authorAllowlist.includes(normalizeLogin(authorLogin))) {
                core.info(`Author ${authorLogin || '(unknown)'} is not in REVIEWER_AUTHOR_ALLOWLIST — skipping.`);
                return;
              }
              core.info(`Author ${authorLogin} is in REVIEWER_AUTHOR_ALLOWLIST — routing.`);
            }
            const skipLabel = process.env.SKIP_LABEL;
            const labels = (pr.labels || []).map((l) => l.name);
            if (skipLabel && labels.includes(skipLabel)) {
              core.info(`${skipLabel} present — skipping.`);
              return;
            }
            // Respect an existing MANUAL assignment: if someone other than the
            // author is already assigned, a human picked their own owner — skip
            // and add nothing (this lets a contributor assign a reviewer at PR
            // creation and have the bot leave it alone). Read the CURRENT
            // assignees live from the API rather than trusting pr.assignees from
            // the trigger payload — a creation-time assignee is missed by the
            // payload (github-workflows BE-4008), which is what let the bot stack
            // onto an already-assigned PR. Author-only (or no) assignees fall
            // through to expertise selection; extra owners must add coverage.
            // Live read of the non-author assignees. Returns `null` when the API
            // read fails: callers treat "can't confirm" as "skip", never as
            // "fall back to the payload" — the payload is exactly the value that
            // misses creation-time assignees (BE-4008), so trusting it on failure
            // would re-open the race this change exists to close.
            const readNonAuthorAssignees = async () => {
              let live;
              try {
                live = await github.rest.pulls.get({ owner, repo, pull_number });
              } catch (e) {
                core.info(`Could not read live assignees (${e.message}).`);
                return null;
              }
              if (live.data.state !== 'open' || live.data.draft ||
                  (live.data.labels || []).some((label) => label.name === skipLabel) ||
                  (live.data.requested_reviewers || []).length ||
                  (live.data.requested_teams || []).length) return null;
              if (live.data.head.sha !== pr.head.sha ||
                  live.data.base.sha !== pr.base.sha || live.data.base.ref !== pr.base.ref) return null;
              pr = live.data;
              return (live.data.assignees || [])
                .map((a) => a && a.login)
                .filter((login) => login && normalizeLogin(login) !== normalizeLogin(authorLogin || ''));
            };
            const nonAuthorAssignees = await readNonAuthorAssignees();
            if (nonAuthorAssignees === null) {
              core.info('Live assignee state unreadable — skipping to avoid stacking onto a possible manual assignment.');
              return;
            }
            if (nonAuthorAssignees.length > 0) {
              core.info(`Already assigned to ${nonAuthorAssignees.join(', ')} — skipping.`);
              return;
            }

            // --- helpers ---
            // Minimal YAML parser scoped to the documented reviewers.yml schema
            // (default_pool + rules[{paths, reviewers}], flow or block seqs).
            // js-yaml is not bundled with github-script; the schema is small and
            // fixed, so a focused parser is safer than an unavailable dependency.
            const parseReviewerConfig = (text) => {
              const out = { default_pool: [], rules: [] };
              const stripComment = (s) => {
                let inS = false, inD = false;
                for (let i = 0; i < s.length; i++) {
                  const ch = s[i];
                  if (ch === "'" && !inD) inS = !inS;
                  else if (ch === '"' && !inS) inD = !inD;
                  else if (ch === '#' && !inS && !inD && (i === 0 || /\s/.test(s[i - 1]))) return s.slice(0, i);
                }
                return s;
              };
              const unquote = (s) => {
                s = s.trim();
                if ((s.startsWith('"') && s.endsWith('"')) || (s.startsWith("'") && s.endsWith("'"))) return s.slice(1, -1);
                return s;
              };
              const parseFlow = (s) => {
                s = s.trim();
                if (!s.startsWith('[')) return null;
                const end = s.indexOf(']');
                const inner = s.slice(1, end === -1 ? s.length : end);
                return inner.split(',').map((x) => unquote(x)).filter((x) => x.length > 0);
              };
              const indentOf = (l) => l.match(/^ */)[0].length;
              const lines = text.split(/\r?\n/).map(stripComment);
              let i = 0;
              while (i < lines.length) {
                const raw = lines[i];
                if (!raw.trim()) { i++; continue; }
                const line = raw.trim();
                if (indentOf(raw) === 0 && line.startsWith('default_pool:')) {
                  const rest = line.slice('default_pool:'.length).trim();
                  const flow = parseFlow(rest);
                  if (flow) { out.default_pool = flow; i++; continue; }
                  i++;
                  while (i < lines.length) {
                    const r = lines[i];
                    if (!r.trim()) { i++; continue; }
                    if (indentOf(r) === 0) break;
                    const t = r.trim();
                    if (t.startsWith('- ')) out.default_pool.push(unquote(t.slice(2)));
                    i++;
                  }
                  continue;
                }
                if (indentOf(raw) === 0 && line.startsWith('rules:')) {
                  i++;
                  let current = null, listKey = null, ruleIndent = -1;
                  const setKey = (seg) => {
                    const m = seg.match(/^(paths|reviewers):(.*)$/);
                    if (!m) return;
                    const key = m[1];
                    const val = m[2].trim();
                    const flow = parseFlow(val);
                    if (flow) { if (current) current[key] = flow; listKey = null; }
                    else if (val === '') { listKey = key; }
                    else { if (current) current[key] = [unquote(val)]; listKey = null; }
                  };
                  while (i < lines.length) {
                    const r = lines[i];
                    if (!r.trim()) { i++; continue; }
                    if (indentOf(r) === 0) break;
                    const ind = indentOf(r);
                    const t = r.trim();
                    const isDash = t === '-' || t.startsWith('- ');
                    if (isDash && (ruleIndent === -1 || ind === ruleIndent)) {
                      if (ruleIndent === -1) ruleIndent = ind;
                      current = { paths: [], reviewers: [] };
                      out.rules.push(current);
                      listKey = null;
                      const afterDash = t.slice(1).trim();
                      if (afterDash) setKey(afterDash);
                    } else if (isDash && listKey && current) {
                      current[listKey].push(unquote(t.slice(1).trim()));
                    } else {
                      setKey(t);
                    }
                    i++;
                  }
                  continue;
                }
                i++;
              }
              return out;
            };

            // --- 2. Changed paths ---
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number, per_page: 100,
            });
            if (files.length !== pr.changed_files) {
              core.warning('Changed-file list is incomplete; skipping routing.');
              return;
            }
            const changed = files.map((f) => f.filename);
            core.info(`PR #${pull_number}: ${changed.length} changed file(s).`);

            // --- 3. Read + parse the caller's reviewer config from the reviewed base SHA ---
            const configPath = process.env.REVIEWER_CONFIG_PATH;
            let config;
            try {
              const res = await github.rest.repos.getContent({
                owner, repo, path: configPath, ref: pr.base.sha,
              });
              if (Array.isArray(res.data) || !res.data.content) {
                core.info(`${configPath} is not a file — nothing to do.`);
                return;
              }
              const text = Buffer.from(res.data.content, 'base64').toString('utf8');
              config = parseReviewerConfig(text);
            } catch (e) {
              core.info(`Could not read ${configPath}@${pr.base.sha} (${e.message}) — nothing to do.`);
              return;
            }

            // Each file contributes one unit, so generated line counts cannot swamp
            // a smaller source change. Known mechanical artifacts contribute less.
            const weight = (path) => /(^|\/)(vendor|generated|dist)\/|(?:\.gen\.|\.generated\.|(?:^|\/)go\.sum$|(?:^|\/)(?:package-lock\.json|pnpm-lock\.yaml|yarn\.lock|bun\.lockb?|Cargo\.lock|poetry\.lock|uv\.lock|Pipfile\.lock|composer\.lock|Gemfile\.lock|packages\.lock\.json)$)/.test(path) ? 0.1 : 1;
            const paths = (file) => [file.filename, file.previous_filename].filter(Boolean);
            const sameArea = (a, b) => {
              if (a === b) return 1;
              const parent = (p) => p.slice(0, p.lastIndexOf('/'));
              // Never infer expertise just from the repository root or a top-level
              // directory such as services/. Sibling files need a shared deeper folder.
              return a.includes('/') && b.includes('/') && parent(a).includes('/') && parent(a) === parent(b) ? 0.5 : 0;
            };
            const exclude = new Set((process.env.EXCLUDE || '').split(/\s+/).filter(Boolean).map(normalizeLogin));
            exclude.add(normalizeLogin(authorLogin || ''));
            const eligible = (login) => /^[a-z\d](?:[a-z\d-]{0,38})$/i.test(login) && !exclude.has(login);
            const candidates = new Map();
            const candidate = (raw) => {
              const login = normalizeLogin(raw);
              if (!eligible(login)) return null;
              if (!candidates.has(login)) candidates.set(login, {login, configured: new Set(), history: new Map(), load: null});
              return candidates.get(login);
            };
            const matched = new Set();
            for (const rule of config.rules) {
              files.forEach((file, index) => {
                if (!paths(file).some((path) => matchesAny(path, rule.paths || []))) return;
                matched.add(index);
                for (const login of rule.reviewers || []) candidate(login)?.configured.add(index);
              });
            }

            let historyComplete = true;
            let historySource = 'live';
            try {
              const cached = await readHistory(pr.base.ref);
              const history = cached ?? await collectHistory(pr.base.ref);
              historySource = cached === null ? 'live' : 'cached';
              for (const record of history) {
                if (record.number === pull_number) continue;
                const oldFiles = record.files;
                files.forEach((file, index) => {
                  const affinity = Math.max(0, ...oldFiles.flatMap((old) => paths(file).flatMap((a) => paths(old).map((b) => sameArea(a, b)))));
                  if (!affinity) return;
                  for (const login of record.approvers.map(normalizeLogin).filter(eligible)) {
                    // A maintained rule defines eligibility for its area. History refines
                    // that roster; it only discovers new owners for unmapped files.
                    const person = candidate(login);
                    if (matched.has(index) && !person.configured.has(index)) continue;
                    if (!person.history.has(index)) person.history.set(index, []);
                    person.history.get(index).push({number: record.number, affinity});
                  }
                });
              }
            } catch (error) {
              historyComplete = false;
              // Discard partial evidence: API order must not favor the people read first.
              for (const person of candidates.values()) person.history.clear();
              core.warning(`Review history unavailable (${error.message}); using configured expertise only.`);
            }

            // Exact-file approval is sufficient; directory-only inference needs two
            // separate merged PRs. The configured fallback is used only if NO rule or
            // credible historical evidence covers ANY changed file. It adds one owner.
            const coverage = (person) => new Set([
              ...person.configured,
              ...[...person.history].filter(([, evidence]) => evidence.some((e) => e.affinity === 1) || evidence.length >= 2).map(([index]) => index),
            ]);
            for (const [login, person] of candidates) if (!coverage(person).size) candidates.delete(login);
            const fallback = !matched.size && !candidates.size;
            if (fallback) for (const login of config.default_pool || []) candidate(login);
            if (!candidates.size) {
              core.info('No eligible owner with evidence; leaving PR unassigned.');
              return;
            }

            // Unknown load never means zero. Use repository-local load because the app
            // token is scoped to this repository and cannot report org-wide load reliably.
            for (const person of candidates.values()) {
              try {
                const response = await github.rest.search.issuesAndPullRequests({
                  q: `repo:${owner}/${repo} is:open is:pr assignee:${person.login} -author:${person.login}`,
                });
                if (!response.data.incomplete_results && Number.isFinite(response.data.total_count)) person.load = response.data.total_count;
              } catch (error) {
                core.warning(`Load unavailable for ${person.login}; treating as unknown.`);
              }
            }
            const num = Math.min(10, Math.max(1, Math.floor(Number(process.env.NUM_REVIEWERS) || 2)));
            const parsedCap = Number(process.env.LOAD_CAP);
            const cap = process.env.LOAD_CAP && Number.isFinite(parsedCap) && parsedCap >= 0 ? parsedCap : Infinity;
            const covered = new Set();
            const selected = [];
            const decisions = [];
            const unavailable = new Set();
            while (selected.length < (fallback ? 1 : num)) {
              const ranked = [...candidates.values()].filter((p) => !selected.includes(p.login) && !unavailable.has(p.login)).map((person) => {
                const fresh = [...coverage(person)].filter((index) => !covered.has(index));
                const gain = fresh.reduce((sum, index) => sum + weight(files[index].filename), 0);
                const evidence = fresh.reduce((sum, index) => sum + Math.min(3, (person.history.get(index) || []).reduce((n, e) => n + e.affinity, 0)) * weight(files[index].filename), 0);
                return {...person, fresh, gain, evidence};
              }).filter((p) => fallback || p.gain > 0);
              if (!ranked.length) break;
              // Expertise is primary; cap/load steer only among candidates with equal
              // added coverage. A busy expert still beats someone unrelated to the diff.
              ranked.sort((a, b) => b.gain - a.gain ||
                Number(a.load === null || a.load >= cap) - Number(b.load === null || b.load >= cap) ||
                b.evidence - a.evidence || (a.load ?? Infinity) - (b.load ?? Infinity) || a.login.localeCompare(b.login));
              const pick = ranked[0];
              try {
                await github.rest.issues.checkUserCanBeAssigned({owner, repo, assignee: pick.login});
              } catch (error) {
                unavailable.add(pick.login);
                core.warning(`Cannot confirm ${pick.login} is assignable; trying the next qualified owner.`);
                continue;
              }
              selected.push(pick.login);
              pick.fresh.forEach((index) => covered.add(index));
              const supporting = [...new Set(pick.fresh.flatMap((index) => (pick.history.get(index) || []).map((e) => `#${e.number}`)))];
              decisions.push(`${pick.login}: ${fallback ? 'configured default pool (low confidence; no path evidence)' : `${pick.fresh.length} additional file(s), ${pick.fresh.filter((i) => pick.configured.has(i)).length} from path rules; approval evidence ${supporting.slice(0, 8).join(', ') + (supporting.length > 8 ? ` (+${supporting.length - 8} more)` : '') || 'none'}`} [open review load: ${pick.load ?? 'unknown'}]`);
            }
            const explanation = [
              `PR #${pull_number}: ${files.length} changed files; ${covered.size} covered by expertise.`,
              ...decisions,
              `History: ${historyComplete ? `${historySource}; up to 50 recently updated merged PRs, last 90 days` : 'unavailable; configured expertise only'}.`,
            ];
            explanation.forEach((line) => core.info(line));
            // Escape all external text. Summary only, no comments or extra notifications.
            const escape = (value) => value.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
            try {
              await core.summary.addHeading('Proposed owner selection').addRaw(`<pre>${escape(explanation.join('\n'))}</pre>`).write();
            } catch (error) {
              core.warning('Could not write the summary; decision evidence is in the run log.');
            }

            // --- 7. Assign the selected users (never fail the PR) ---
            // This org routes/alerts people via the ASSIGNEE field, not the
            // reviewer-request field, so we assign rather than requestReviewers.
            // Note: addAssignees caps at 10 and silently drops non-collaborators.
            if (selected.length === 0) {
              core.info('No one selected — nothing to assign.');
              return;
            }
            // TOCTOU guard: the early skip check ran before the async config
            // read + candidate selection above. A human (or a concurrent run —
            // another workflow may not share our `concurrency:` group) may have assigned
            // someone in that window, and GitHub assignment is additive, so
            // re-read the live state immediately before mutating and bail if a
            // non-author assignee now exists. Unreadable state → skip, same as
            // the early check.
            const preAssign = await readNonAuthorAssignees();
            if (preAssign === null) {
              core.info('Live assignee state unreadable before assigning — skipping.');
              return;
            }
            if (preAssign.length > 0) {
              core.info(`Assigned to ${preAssign.join(', ')} during processing — skipping.`);
              return;
            }
            try {
              const assigned = await github.rest.issues.addAssignees({
                owner, repo, issue_number: pull_number, assignees: selected,
              });
              const actual = new Set((assigned.data.assignees || []).map((a) => normalizeLogin(a.login)));
              const confirmed = selected.filter((login) => actual.has(login));
              const missing = selected.filter((login) => !actual.has(login));
              core.info(`Assigned: ${confirmed.join(', ') || 'none'}`);
              if (missing.length) core.warning(`GitHub did not assign: ${missing.join(', ')}.`);
            } catch (e) {
              core.warning(`addAssignees failed (${e.message}) — leaving PR unassigned.`);
            }

      - name: Publish reviewer history manifest
        if: inputs.generate_history && steps.selection.outputs.manifest_ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reviewer-history-v1
          path: ${{ runner.temp }}/reviewer-history/manifest.json
          archive: true
          retention-days: 2
          if-no-files-found: error

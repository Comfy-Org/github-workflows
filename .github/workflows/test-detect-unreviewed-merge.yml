name: Test detect-unreviewed-merge

on:
  pull_request:
    paths:
      - '.github/detect-unreviewed-merge/**'
      - '.github/workflows/detect-unreviewed-merge.yml'
      - '.github/workflows/test-detect-unreviewed-merge.yml'
  push:
    branches: [main]
    paths:
      - '.github/detect-unreviewed-merge/**'
      - '.github/workflows/detect-unreviewed-merge.yml'
      - '.github/workflows/test-detect-unreviewed-merge.yml'

permissions:
  contents: read

jobs:
  test:
    name: node test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test human-review classification
        run: node --test .github/detect-unreviewed-merge/tests/*.test.cjs

name: CI - Groom

# Thin caller enrolling THIS repo as the FIRST groom pilot (BE-3873 / Groom
# Phase 3). The groom logic (two-phase finder -> independent verifier audit, the
# durable dedup/rejection ledger, the GitHub-issue sink) lives in groom.yml in
# this same repo; the caller pins it by full commit SHA like every external
# consumer — a local `uses: ./...` path would run the PR's OWN copy of the
# auditor, letting a PR weaken the reviewer judging it. Named ci-groom.yml
# because the canonical caller path (groom.yml) is occupied here by the reusable
# itself (same reason as ci-cursor-review.yml / ci-assign-reviewers.yml).
#
# It fires on a DAILY base cron (never on-PR), but the EFFECTIVE cadence is the
# runtime interval gate in the reusable (BE-4004): a tick inside the interval
# no-ops cheaply before the finder ever spins up. Plus a manual dispatch carrying
# a `dry_run` toggle (which ALWAYS runs, bypassing the interval gate) so a run
# can be spot-checked before trusting live output.
#
# BUILDER ON (BE-6851) — parity with the fleet's other live groom callers. The
# top `max_prs` CONFIRMED, non-security findings become REVIEW-GATED PRs instead
# of `groom` issues; the remainder still file as issues (hybrid). groom never
# merges: builder PRs are opened by the bot carrying `cursor-review`, run this
# repo's full CI, and wait for a human — the reusable contains no `gh pr merge`
# and enables auto-merge nowhere.
#
# WHY THAT IS SAFE *HERE* — the pre-review-CI question, asked the way a
# private caller had to ask it. "A human reads the PR first" gates the MERGE,
# not CI EXECUTION: opening a PR runs this repo's checks against the PR's own
# checkout before anyone has read the diff, so the real question is whether any
# of those checks hold credentials. Audited 2026-08-08:
#
#   * the `test-*.yml` suites DO execute the PR's checkout (unittest + shellcheck
#     over `.github/**` — `test-groom-scripts.yml` literally runs
#     `bash .github/groom/tests/sandbox-tests.sh` from the PR's tree), and every
#     one of them is `permissions: contents: read` with NO `secrets:` — the
#     ordinary untrusted-PR-CI posture of any public repo, and the structural
#     limit groom.yml's own header already states.
#   * ci-assign-reviewers (the App private key) never EXECUTES the PR's code: it
#     reads metadata and pins the reusable by merged-main SHA, which loads its
#     scripts from that same pinned ref, never the caller's checkout (the
#     AGENTS.md "scripts are the single source of truth" property).
#   * ci-cursor-review is the one that does NOT fit that sentence, and the
#     builder makes it self-triggering, so state it exactly. `build_pr` opens
#     every builder PR with `--label cursor-review` (groom.yml), which is this
#     repo's review trigger; each panel cell then checks out the PR
#     (`persist-credentials: false`, `permissions: contents: read`) and runs
#     `cursor-agent --print --trust` — tool use auto-approved, `--sandbox`
#     deliberately omitted — with CURSOR_API_KEY in the step env. So this is not
#     merely "machine-written text reaches an LLM as DATA": an agent with tool
#     use is pointed at a machine-written checkout inside a job holding a
#     third-party API key. Two jobs do this, not one, and the second is the
#     wider of the pair — the `consolidate` judge ALSO checks out the PR and
#     ALSO runs `cursor-agent --print --trust`, and it is the job carrying
#     `pull-requests: write`. Blast radius: CURSOR_API_KEY, the findings
#     artifact, and a review comment posted under that write grant. It stops
#     there — every one of those jobs is `contents: read`, both checkouts set
#     `persist-credentials: false`, and the prompts/scripts load from a pinned
#     ref of this repo rather than the PR's tree, so a patch cannot rewrite the
#     panel judging it. Accepted because it is the SAME path any outside
#     contributor's PR already takes here the moment the label lands — but the
#     honest delta is that the builder both raises the volume AND removes the
#     human who used to apply that label.
#
# So this caller needs NO authorship gate on a job holding *repo write*
# (one caller needed one because its CI executes PR-supplied code while this
# repo's groom surface is pure lint). If a workflow that holds write
# authority — repo, cloud, or publish — ever starts EXECUTING the PR's own
# scripts, that conclusion dies with it and this caller goes back to
# `builder: false`.
#
# WHAT THE BUILDER CAN ACTUALLY PR IN THIS REPO — less than you would guess, by
# design. The patch-path policy (BE-4404, `.github/groom/patch_policy.py`) denies
# `.github/workflows/` and `.github/actions/` root-anchored, and this repo's
# deliverable IS `.github/workflows/`. A finding in a workflow file therefore
# cannot become a PR here; it bails to a `groom` issue instead. Builder PRs will
# come from the script directories (`.github/{groom,cursor-review,bump-callers,
# agents-md-integrity,refresh-reviewers}/`) and the docs. Bail issues are NOT
# capped by `max_findings` (BE-6157), so a bailed finding is recorded rather than
# discarded — which matters given the live config below.
#
# Note what that leaves in scope, because the deny list is target-repo-agnostic
# and this repo is an awkward target for it: those same script directories are
# exactly what the credential-free `test-*.yml` jobs EXECUTE on a PR, and they
# include the suites guarding `ledger.py` and `patch_policy.py` themselves. A
# builder patch under `.github/groom/tests/` is therefore both pre-review code
# execution and a patch to groom's own guard rails. The containment is that
# those jobs hold no secrets and the PR is never auto-merged — a human reading
# the diff is what stops a weakened assertion from landing, so read builder PRs
# touching `**/tests/**` as the diffs that most need a careful reviewer.
#
# LIVE CONFIG IS NOT IN THIS FILE. `vars.GROOM_CONFIG` (BE-5227) OUTRANKS every
# `with:` below, and it is set on this repo:
#
#   {"interval_days":"1","cadence":"1","max_prs":"2","max_findings":0}
#
# i.e. daily, a ceiling of 2 builder PRs, and the FINDINGS-issue sink parked
# (`max_findings: 0` — cleanup work for this repo is tracked in Linear, not in
# GitHub issues). The `with:` values below are the REVIEWED FALLBACKS that apply
# if that variable is cleared; read a run's real numbers off the gate job's
# `Resolved knobs:` line, never off this file. Retuning takes no PR:
#
#   gh variable set GROOM_CONFIG --repo Comfy-Org/github-workflows \
#     --body '{"interval_days":"1","cadence":"1","max_prs":"1","max_findings":0}'
#
# KNOW WHAT `max_findings: 0` COSTS in builder mode — it is not just "no issue
# noise". The `file` job slices `to_file[:max_findings]`, and `to_file` in
# builder mode is everything that did NOT become a PR: DOWNGRADE verdicts, every
# security / auth-adjacent finding (which `build_select` fail-closes and NEVER
# builds), and everything past `max_prs`. At 0 they are all discarded. The ledger
# dedups off LIVE issue/PR state, so no issue means no memory of the finding,
# which at `interval_days: 1` means it is re-found and re-verified — re-billed —
# every day, with no durable record beyond an expiring public run log. That is
# accepted here only because this repo's cleanup work is tracked in Linear and
# the builder PRs themselves are the sink that matters; if a security finding
# ever needs to persist, raise `max_findings` rather than relying on the run log.
#
# `builder` is deliberately NOT settable that way (`config.py` `_LOCKED_KEYS` =
# `builder`, `sink`, `bot_app_id`, `workflows_ref`, `config`): turning the
# auto-builder on is a decision to let an agent author code in the repo that
# defines the org's CI, so it belongs in a reviewed commit — this one — and not
# in a variable edit that leaves no diff. `pr_size_limit` is NOT locked, despite
# what you might assume from that list: it is the one OPERATIONAL knob that
# WIDENS (BE-6345), so anyone with repo write can raise the machine-written-patch
# ceiling by variable, with no diff. `config.py` argues why that is accepted
# (size is not what stops a patch landing; review is) — the point here is only
# that this file cannot promise otherwise. `dry_run` is likewise operational, so
# a `{"dry_run": false}` key in the variable would turn the hand-dispatched
# preview below into a LIVE run; the variable does not carry that key today and
# should not acquire it. The older `GROOM_INTERVAL_DAYS` variable is still read
# as the pre-GROOM_CONFIG fallback below; it is unset on this repo.
#
# PREREQUISITE (operator): `secrets.ANTHROPIC_API_KEY` must be available to this
# repo (org- or repo-level) — the finder, verifier and builder agents bill
# through it. Until it exists the run fails loudly at the agent step,
# deliberately, so the caller is never silently inert.
#
# BOT IDENTITY — a HARD PRECONDITION now, not the nicety it was in finds-only
# mode. In finds-only mode an empty `bot_app_id` merely DEGRADED the identity:
# the issue sink reads `steps.bot_token.outputs.token || github.token`, so it
# still filed, as github-actions[bot]. With `builder: true` that graceful path is
# unreachable, and the failure is total rather than partial:
#
#   * `build_select`'s "Validate builder config" step exits 1 when `builder` is
#     true and `bot_app_id` is empty — deliberately, since the PR sink
#     (`build_pr`) reads `steps.bot_token.outputs.token` with NO fallback for
#     both the checkout `token:` and its `GH_TOKEN`, and this caller grants only
#     `contents: read`, so there is no second way to push a branch.
#   * `file` is `needs: [gate, build_select]` and its `if:` uses no status
#     function, so the implicit `success()` skips the ISSUE sink too.
#
# So with the builder ON and no App token the WHOLE run is discarded — no PRs,
# no issues, no ledger markers — after the finder and verifier have already
# billed. Read `vars.APP_ID` as load-bearing for both sinks, not just the PR one.
#
# SATISFIED here, and verified by BEHAVIOUR rather than by a permissions read:
# `vars.APP_ID` (2016716) and `secrets.CLOUD_CODE_BOT_PRIVATE_KEY` are both
# provisioned on this repo, and cloud-code-bot ALREADY pushes branches and opens
# PRs in it today — the `ci/bump-groom` / `ci/bump-cursor-review` pin bumps
# (#132, #131, #130, …). An App can hold a valid key and still fail to mint for a
# repo its installation does not cover, so "the secret exists" would not have
# been enough; a merged bot-authored PR proves the installation covers this repo
# with contents:write + pull-requests:write.
#
# Read the `permissions:` block below narrowly: it bounds the GITHUB_TOKEN and
# NOTHING ELSE. The real write authority in builder mode is the App INSTALLATION
# token `build_pr` mints, whose scope is granted on the installation — outside
# this repo and outside this diff.
#
# If either credential is ever re-provisioned, ORDER MATTERS: the reusable mints
# the token whenever `bot_app_id` is non-empty and hard-fails on an empty private
# key ("The 'private-key' input must be set to a non-empty string"), so setting
# the variable first is itself the broken state. Key first, variable second — and
# an empty-but-present secret is WORSE than an absent one: it passes startup
# validation and fails inside the job.
#
# FIRST TICK (operator, on merge): nothing in this file enforces a dry-run pilot
# — the daily cron resolves `dry_run` to false, so the first scheduled tick after
# merge is an unattended LIVE builder run. Dispatch the preview by hand first; it
# is a one-liner and the only chance to eyeball patch quality before PRs exist:
#
#   gh workflow run ci-groom.yml --repo Comfy-Org/github-workflows -f dry_run=true
#
# A dry run still executes the whole builder, so the expected result is a
# `groom-build-<idx>` artifact (the patch) per selected finding and ZERO PRs
# opened — `build_pr` prints what it WOULD have opened and stops.

on:
  schedule:
    # DAILY base tick at 09:17 UTC. Off-peak + a non-round minute to dodge the
    # top-of-hour GitHub scheduler congestion. Never fires on a PR. This is the
    # frequent base cron for the interval-gate pattern (GH Actions cron is static
    # in the file — there is no runtime "every N days"); the reusable's interval
    # gate turns this daily tick into an effective every-GROOM_INTERVAL_DAYS run.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run the full audit + dedup + builder but do NOT open any issues or PRs
          — print what WOULD be produced to the job summary. The builder still
          runs and still uploads its patch artifact, so this is how you eyeball
          patch quality before a machine-authored PR exists.
        type: boolean
        default: false
      max_prs:
        description: >-
          One-run override of the builder PR ceiling. Ranks BELOW
          vars.GROOM_CONFIG.max_prs, which IS set on this repo — so this input is
          inert until that key is removed from the variable. Kept for parity with
          the fleet's other builder callers, and so the knob already exists the
          moment the variable stops pinning it. (A reusable cannot read its
          caller's dispatch inputs; making this outrank the variable would mean
          forwarding it through the reusable's `config` JSON input instead of
          `max_prs`.)
        # `choice`, not `string`, matching the reusable's documented caller
        # pattern: the reusable enforces NO upper bound — it treats this
        # `options:` list as the guard — and clamps anything non-numeric to zero
        # PRs with a warning. An API dispatch can still post a value past this
        # list; that is a typo guard, not a security boundary, and anyone who can
        # dispatch this workflow already has repo write.
        #
        # '0' is listed because the expression below is built to pass it through
        # ("audit + file, build nothing this run") and a value you can only reach
        # via an API dispatch is a knob nobody uses. The reusable honours it:
        # `max(0, int(float(x)))`.
        type: choice
        required: false
        default: '1'
        options: ['0', '1', '2', '3', '5']

# NOTE: intentionally NO caller-level `concurrency:` here. The reusable groom.yml
# already declares `concurrency: groom-${{ github.repository }}` (cancel-in-
# progress: false), which serializes runs per target repo across ALL callers —
# that is the real TOCTOU guard for the read-then-file dedup ledger. Duplicating
# the identical group in this caller would DEADLOCK the run: the caller holds the
# group while its reusable `uses:` job waits to acquire the SAME group with
# cancel-in-progress:false, so the reusable never gets the slot and the run hangs
# until timeout (GitHub Actions caller/callee same-group deadlock). Serialization
# lives in the reusable; the caller deliberately stays out of the group.

jobs:
  groom:
    permissions:
      # A reusable's nested jobs cannot request more GITHUB_TOKEN scope than the
      # calling job grants — GitHub validates this at STARTUP (before any job runs,
      # regardless of `if:` guards or the bot App token doing the real writes). A
      # short grant fails the whole run with an opaque "workflow file issue" / 0
      # jobs. groom.yml's jobs need: file -> issues: write; build_select ->
      # issues: read + pull-requests: read. The finder/verifier/builder agent jobs
      # need NOTHING beyond contents: read — they invoke the Claude CLI directly
      # and mint no GitHub token, so `id-token: write` is no longer required
      # (BE-4214). Grant the union below or the call is rejected.
      # ORDERING: the pinned SHA below is at/after the BE-4214 CLI migration —
      # its groom.yml carries the agent jobs (audit_find / audit_verify / build /
      # build_pr) and declares `id-token: write` on NONE of them — so the shorter
      # grant is verified safe against it, not merely safe-by-predating.
      # Never hand-bump this pin BACKWARDS to an intermediate main SHA (#55 /
      # #64): those still declare `id-token: write` on the agent jobs and would
      # be rejected at startup by this grant.
      contents: read
      issues: write
      pull-requests: read
      # REQUIRED for the interval gate (BE-4004): the reusable's `gate` job reads
      # this repo's Actions run history to find the last real groom run. That job
      # DECLARES `actions: read`, so the STARTUP subset check above applies —
      # omitting it here does NOT degrade to a fail-open run, it REJECTS the whole
      # run ("requesting 'actions: read', but is only allowed 'actions: none'").
      # The gate's fail-open path is the other case: the grant is present but the
      # history read errors (fresh repo, API hiccup) -> run rather than skip.
      actions: read
    # Pinned by full SHA like every other caller — self-enrollment still loads
    # the reusable from a MERGED main commit, never a local `./` path (AGENTS.md
    # "Scripts are the single source of truth"). The pinned SHA was main HEAD
    # when written and already carries the BE-4004 `gate` job plus the
    # `interval_days` / `cadence` / `volume_gate` inputs passed below, so this
    # call resolves — replacing the REPLACE_AT_MERGE placeholder that had been
    # failing every daily tick at startup since it was written (the
    # reusable-lands-then-bump-caller two-step whose second half never happened).
    #
    # The pin is unchanged by this commit, and it does NOT need to move for the
    # builder: eb4b26c is still main's tip for both `groom.yml` and
    # `.github/groom/**`, and it already carries every protection the header
    # relies on — `patch_policy.py` with its root-anchored `.github/workflows/`
    # deny (BE-4404), `config.py`'s `_LOCKED_KEYS` (BE-5227), and the
    # uncapped-bail `bail_sink` path (BE-6157). Re-verify with
    # `git log eb4b26c..origin/main -- .github/workflows/groom.yml .github/groom/`
    # (empty today) before assuming otherwise.
    #
    # This pin and `workflows_ref` below MUST stay byte-identical. They are
    # auto-bumped together: this repo IS enrolled in the `GROOM_CALLERS` roster as
    # `.github/workflows/ci-groom.yml`, and bump-callers.sh rewrites both pins
    # and both `# main @ <short>` annotations in one pass. (The bump-callers
    # README / AGENTS.md tell the story of this caller being MISSING from that
    # roster in the PAST tense — a cautionary tale, not current state. Verify
    # against the variable, not the prose, before "fixing" it.) Never hand-bump
    # one of the pair alone.
    uses: Comfy-Org/github-workflows/.github/workflows/groom.yml@f8eec04e7923f4719d5b7dbc342e5c15580e22ba # main @ f8eec04
    with:
      # File groom's issues AND open its builder PRs as cloud-code-bot (App
      # token), not github-actions[bot]. With `builder: true` this is no longer
      # optional — an empty value fails `build_select`'s "Validate builder
      # config" step, which skips BOTH sinks (`file` needs it), so the run is
      # discarded rather than degraded. See BOT IDENTITY in the header.
      bot_app_id: ${{ vars.APP_ID }}
      # Auto-builder ON (BE-6851). Locked against vars.GROOM_CONFIG on purpose
      # (config.py `_LOCKED_KEYS`) — turning this on is reviewable here, in a
      # diff, and nowhere else.
      builder: true
      # Reviewed builder PR ceiling. It starts at 1 deliberately (BE-6017): the
      # fleet is nine groom callers, and three PRs each is a queue nobody
      # reviews — raise it per repo once finding quality is proven there. The
      # LIVE value is vars.GROOM_CONFIG.max_prs (2 today), which outranks this;
      # clearing that key falls back to the 1 below.
      #
      # Tested for EMPTY, not for truthiness. `|| '1'` would in fact also work
      # here — GitHub's truthiness for a string is non-emptiness, with no numeric
      # cast, so the string '0' is truthy and survives it (the numeric-falsy trap
      # is real only for a genuine NUMBER 0, which `github.event.inputs` never
      # yields). The explicit `== ''` is kept anyway because it states the actual
      # question — "did the dispatcher supply a value?" — without depending on
      # that rule, and '0' is a value this caller means to honour.
      #
      # Both events resolve correctly: on a DISPATCH this is a same-type string
      # comparison (so '0' is not swallowed), and on the SCHEDULE event, which
      # carries no inputs, it is null-vs-string — both coerce to 0, the test is
      # true, and the reviewed fallback applies. Note the expression can never
      # yield an empty string, which matters: an empty `max_prs` reaching the
      # reusable is dropped by `config.py`'s numeric coercer, leaving
      # `resolved.max_prs` absent and `build_select` falling back to its own
      # MAX_PRS_DEFAULT of 5 — five PRs, not the 1 promised above. Preserve that
      # property in any rewrite.
      max_prs: ${{ github.event.inputs.max_prs == '' && '1' || github.event.inputs.max_prs }}
      # Keep the assets ref (finder/verifier briefs + interval gate + dedup
      # ledger) in lock-step with the `uses:` ref above, so a run always loads the
      # scripts that match the workflow filing them. Bump the two together.
      workflows_ref: f8eec04e7923f4719d5b7dbc342e5c15580e22ba  # main @ f8eec04
      # Manual dispatch can dry-run; the daily schedule always runs live — for
      # PRs as well as issues, now that the builder is on (github.event.inputs is
      # null on a schedule event -> '' != 'true' -> false).
      #
      # `== 'true'` is correct and not a boolean-vs-string bug: `github.event.
      # inputs.*` carries a `type: boolean` dispatch input as the STRING 'true'
      # (only the typed `inputs` context preserves it as a boolean). Confirmed on
      # the real thing — the 2026-08-04 dry_run dispatch of this workflow (run
      # 30956077668) resolved `"dry_run": true` in the gate's `Resolved knobs:`
      # line and the file job logged `[dry-run] WOULD file`.
      #
      # This is a baseline the variable outranks: `dry_run` is an OPERATIONAL key
      # in config.py, so a `{"dry_run": false}` entry in vars.GROOM_CONFIG would
      # make this dispatch toggle inert. It carries no such key today.
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
      # Effective cadence knob (BE-4004): the daily base cron only produces a real
      # run every interval_days days. OUTRANKED by vars.GROOM_CONFIG.interval_days,
      # which is set to 1 (daily) on this repo. GROOM_INTERVAL_DAYS is the older
      # pre-GROOM_CONFIG variable and is unset here, so the reviewed fallback of 7
      # applies only if BOTH are cleared.
      interval_days: ${{ vars.GROOM_INTERVAL_DAYS || '7' }}
      # Match the volume-gate window to that same effective cadence, not the daily
      # base cron — so the merge-activity check spans how often a real run happens.
      cadence: ${{ vars.GROOM_INTERVAL_DAYS || '7' }}
      # A dry-run is the pre-flight spot-check — and, with `builder: true`, the
      # only way to see a patch before a PR carries it — so it must ALWAYS
      # exercise the full audit + dedup + builder: bypass the volume gate when
      # dispatched with dry_run:true. Otherwise a quiet window (nothing merged in
      # `cadence` days) would gate the dry-run to nothing and print no summary,
      # defeating the dispatch's whole purpose. Live runs (the daily schedule,
      # where inputs is null -> '' != 'true' -> true, or a dry_run:false
      # dispatch) keep the gate on so a quiescent repo still skips the spend.
      # (Note: a schedule tick still
      # passes the interval gate first — the volume gate is the second throttle.)
      volume_gate: ${{ github.event.inputs.dry_run != 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}

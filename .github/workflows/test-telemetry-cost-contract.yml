# CONTRACT: this is one of THIS repo's own path-filtered script tests, NOT a reusable
# workflow. It is not callable and has no caller pattern:
#   TRIGGERS — `pull_request` and `push` to main, both filtered to
#              scripts/telemetry-cost-contract/** and this file.
#   INPUTS   — none. SECRETS — none. Read-only `contents: read`; the suite is hermetic and
#              makes no network call.
# The reusable workflow these scripts back is .github/workflows/telemetry-cost-contract.yml.

name: Test telemetry-cost-contract scripts

# Runs the hermetic lib.py unittest suite for the telemetry-cost-contract gate. The gate
# decides whether every consuming repo's PRs can merge once enforced, so a regression in
# pattern parsing, diff-added-line extraction, or the Cost-impact-section check silently
# passes or blocks PRs — cheap to guard with a unit run on change.

on:
  pull_request:
    paths:
      - 'scripts/telemetry-cost-contract/**'
      - '.github/workflows/test-telemetry-cost-contract.yml'
      - '.github/workflows/telemetry-cost-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/telemetry-cost-contract/**'
      - '.github/workflows/test-telemetry-cost-contract.yml'
      - '.github/workflows/telemetry-cost-contract.yml'

permissions:
  contents: read

jobs:
  test:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile the validator (syntax gate for validate.py, which the suite does not import)
        run: python3 -m py_compile scripts/telemetry-cost-contract/lib.py scripts/telemetry-cost-contract/validate.py
      - name: lib suite
        run: python3 -m unittest discover -s scripts/telemetry-cost-contract/tests -p 'test_*.py' -v

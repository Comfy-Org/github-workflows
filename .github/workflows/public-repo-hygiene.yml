name: Public Repo Hygiene (reusable)

# Reusable workflow that scans a PUBLIC repo's TRACKED files for internal-only
# references, in three categories: ticket-style identifiers (`TEAM-1234`),
# internal collaboration-tool links (Notion, Slack archives, Google Docs/Drive,
# Datadog, PostHog projects, Linear, `incident-NNN`), and `Comfy-Org/<repo>`
# references outside a DEFAULT-DENY known-public allowlist (including the
# `@Comfy-Org/<team>` CODEOWNERS-handle case). It is a lightweight regression
# guard, not a secrets scanner. It runs in the CALLER's context, so
# `actions/checkout` checks out the calling repo and the scan operates on that
# repo's tracked files. Fails with a non-zero exit (and GitHub annotations) so
# it can be wired as a required status check.
#
# The check script is loaded from THIS repo (public, pinned via `workflows_ref`)
# — never from the caller's checkout — so a PR can't rewrite the checker OR its
# allowlist (see "WHERE THAT GUARANTEE STOPS" below for the one thing this
# cannot enforce). That is the whole point (BE-8654): the two per-repo copies this
# replaces were run straight out of the PR's own checkout, so a PR could add a
# private repo name to the in-tree allowlist and then leak it, green. The
# known-public repo/team allowlist is deliberately NOT an input — an allowlist a
# caller can pass is an allowlist a PR in the caller repo can widen.
#
# Hosting the allowlist here leaks nothing: it lists public repo names only, by
# design. No private repo name is ever listed — that is what default-deny buys.
#
# WHERE THAT GUARANTEE STOPS. What is enforced here is that the checker comes
# from the commit the caller's `uses:` line resolved to — `workflows_ref` must
# be a 40-hex SHA equal to `job.workflow_sha` (below). What is NOT enforceable
# from inside a reusable workflow is which `uses:` line runs: a `pull_request`
# caller executes its workflow FILE from the PR head, so a PR in the caller repo
# that rewrites BOTH the `uses:` line and `workflows_ref` — to another commit of
# this repo, or to a fork of it altogether — runs a different reusable, and the
# equality check inside THAT one proves nothing about this one. This is true of
# every reusable workflow on GitHub, not a defect specific to this one, and the
# control for it is out of band: protect the caller's `.github/workflows/`
# directory with a branch-protection rule or repository ruleset that REQUIRES an
# approving review from someone other than the author, so the `uses:` line
# cannot move unreviewed. CODEOWNERS alone is not that control — it only
# REQUESTS reviewers and blocks nothing until a rule requires Code Owner
# approval, so an adopter who reads "CODEOWNERS" as sufficient leaves the
# `uses:` line editable by the very PR it is meant to gate. Adopters wiring this as
# a REQUIRED status check should do that; without it the honest claim is the
# narrower one — a PR cannot reach the checker or the allowlist *through this
# workflow's inputs*. (BE-8654 review.)
#
# Caller pattern (place in the consumer repo at
# .github/workflows/public-repo-hygiene.yml):
#
#   name: Public Repo Hygiene
#   on:
#     pull_request:
#     push:
#       branches: [main, master]
#   jobs:
#     hygiene:
#       permissions:
#         contents: read
#       uses: Comfy-Org/github-workflows/.github/workflows/public-repo-hygiene.yml@<sha>  # v1
#       with:
#         workflows_ref: <same-sha>   # REQUIRED — same SHA as `uses:` above
#
# INPUTS (`workflows_ref` is REQUIRED; all others optional):
#   ticket_allowlist   Newline- or comma-separated acronyms that LOOK like
#                      ticket IDs but are not (`GPU-100`, a product SKU, a spec
#                      number). ADDITIVE on top of the built-in list (UTF-8,
#                      SHA-256, RFC-3339, …) — a caller can extend it, never
#                      shrink it. Matched case-insensitively. Default empty.
#   exclude_paths      Newline- or comma-separated tracked paths to skip.
#                      `src/generated/` (trailing slash) excludes that subtree;
#                      `scripts/thing.py` excludes that exact file. This is the
#                      per-repo scanning scope — vendored specs, generated
#                      clients, fixtures. Every entry is echoed to the run log
#                      with the number of files it skipped, INCLUDING an entry
#                      that skipped none, so a typo can't rot coverage
#                      invisibly. A value naming the repo root (`/`, `.`) is
#                      rejected and the run fails. Default empty.
#   workflows_ref      REQUIRED. Ref of Comfy-Org/github-workflows to load the
#                      check script from. Must be a full 40-hex commit SHA and
#                      must EQUAL the SHA `uses:` above is pinned to — both are
#                      ENFORCED at run time against `job.workflow_sha`, not
#                      merely documented. No default, so a caller can't pin the
#                      workflow while loading the checker from a mutable branch.
#
# No secrets required.

on:
  workflow_call:
    inputs:
      ticket_allowlist:
        description: >-
          Newline- or comma-separated acronyms to treat as NOT ticket IDs (e.g.
          `GPU-100`). Additive on top of the built-in allowlist; a caller can
          extend it, never shrink it. Default empty.
        type: string
        required: false
        default: ''
      exclude_paths:
        description: >-
          Newline- or comma-separated tracked paths to skip. A trailing slash
          means "this subtree" (`src/generated/`); otherwise it is one exact
          file. Every entry is reported in the run log with its skipped-file
          count. A value naming the repo root is rejected. Default empty.
        type: string
        required: false
        default: ''
      workflows_ref:
        description: >-
          REQUIRED. A full 40-hex commit SHA, equal to the one you pin `uses:`
          to — otherwise the workflow is pinned but the code it runs is not.
          Both halves are enforced, not just documented: the job fails on a ref
          that is not a 40-hex SHA and on one that differs from the commit this
          workflow itself was resolved from. There is deliberately no default —
          a floating `main` default would silently load a mutable checker, which
          is the exact hole this workflow exists to close.
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    name: public-repo-hygiene
    runs-on: ubuntu-latest
    # The scan reads every tracked file in the caller's repo, and both the file
    # list and the file contents are things a PR author controls. Without this,
    # a pathological tree burns the 6-hour default before anyone notices the
    # required check never reported.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout caller repo
        # Default depth (1) on purpose: the scan reads the working tree, never
        # history, so there is nothing a deeper fetch would let it see.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        #
        # Non-empty is not enough here, and this workflow is the reason. A
        # `pull_request` caller runs the workflow FILE from the PR head, so a PR
        # can edit `workflows_ref:` without touching the far more visible
        # `uses:` line — point it at `refs/pull/<n>/head` of a PR opened against
        # this public repo and the next step checks THAT out, running the PR
        # author's own `check_public_repo_hygiene.py` and reporting the required
        # check green. Every claim this workflow makes about a PR being unable
        # to weaken the check judging it rests on the two tests below, so they
        # fail the run rather than warn:
        #
        #   1. a full 40-hex SHA — a branch, tag or `refs/pull/*` ref is mutable
        #      and can be moved after review;
        #   2. equal to `job.workflow_sha` — the commit THIS reusable workflow
        #      was itself resolved from, i.e. exactly what the caller's `uses:`
        #      pin points at. It is computed by the runner from the `uses:`
        #      line, so a caller cannot set it, and matching against it is what
        #      makes "the checker comes from the commit you pinned" a fact
        #      rather than a convention. (`job.workflow_sha`, NOT
        #      `github.job_workflow_sha` — that one is an OIDC claim, absent
        #      from the `github` context, and expands to ''.)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::workflows_ref '$REF' is not a full 40-hex commit SHA. Branch, tag and refs/pull/* refs are MUTABLE, so the checker they load is not the one that was reviewed. Set workflows_ref: to the same 40-hex SHA the caller's uses: line pins."
            exit 1
          fi
          # Lower-case both sides: the grep above already fixes REF's case, and
          # job.workflow_sha is lower-case hex, so this is belt-and-braces
          # against a runner that ever changes that.
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # FAIL, not warn. job.workflow_sha needs an Actions runner >=
            # 2.334.0, so an older runner is the only way this is empty — but
            # degrading to a warning leaves the 40-hex shape test as the ONLY
            # surviving check, and shape is not the property that matters here.
            # Immutability is not the attack; picking a DIFFERENT immutable
            # commit is. Any commit reachable in this public repo is 40-hex and
            # immutable, including the head of a PR anyone can open against it,
            # which actions/checkout will happily fetch by raw SHA. Equality
            # with the commit the caller's `uses:` line resolved to is the only
            # thing binding the loaded checker to the reviewed one, so a runner
            # that cannot supply it cannot run this workflow. Runners older than
            # v2.334.0 are unsupported here, deliberately. (BE-8654 review.)
            echo "::error::job.workflow_sha is empty, so workflows_ref cannot be cross-checked against the commit this workflow was called at. That equality is the ONLY check binding the hygiene checker to your uses: pin — a 40-hex ref alone is satisfied by any immutable commit, including one an attacker chose. This needs an Actions runner >= v2.334.0; runners older than that are not supported by this workflow. Upgrade the runner (GitHub-hosted runners are already past it)."
            exit 1
          fi
          if [ "$REF" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but the checker and its allowlist are loaded from somewhere else, which is the exact hole this workflow exists to close. Set both to $SHA."
            exit 1
          fi

      - name: Reject a collision at the reserved checkout path
        # The checker rejects TRACKED content at `_public_repo_hygiene/` too
        # (exit 2), but it runs two steps below this — AFTER the checkout has
        # already resolved that path, so it reports the collision rather than
        # preventing it. `actions/checkout` resolves `path:` lexically and then
        # stats it FOLLOWING symlinks, so a caller that tracks a directory
        # symlink by that name passes the under-workspace test and has the
        # contents of the link TARGET cleaned out before the clone — outside
        # the workspace, and outside the job's lifetime on a self-hosted
        # runner. Refuse before anything is deleted; the checker's own guard
        # stays as the in-tree backstop for the ordinary case. (BE-8654 review.)
        env:
          RESERVED: _public_repo_hygiene
        run: |
          if [ -e "$RESERVED" ] || [ -L "$RESERVED" ]; then
            echo "::error::'$RESERVED' already exists in the workspace and is a RESERVED path — it is where this workflow checks the hygiene checker out. Refusing to continue: the checkout would replace it, and if it is a symlink the contents of its TARGET would be removed. Rename the directory in your repo."
            exit 1
          fi
          tracked="$(git ls-files -- "$RESERVED")"
          if [ -n "$tracked" ]; then
            echo "::error::your repo tracks content under '$RESERVED/' — a RESERVED path, where this workflow checks the hygiene checker out inside your workspace. That checkout shadows your content, so nothing tracked there could ever be scanned. Rename the directory."
            exit 1
          fi

      - name: Load hygiene check script
        # The checker AND its known-public allowlist come from THIS repo
        # (public, pinned via workflows_ref), never from the caller's checkout,
        # so a PR can't rewrite the check that is judging it. `path:` matches
        # SCRIPT_CHECKOUT_DIR in the checker; it lands untracked in the caller's
        # workspace, so `git ls-files` never scans it.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _public_repo_hygiene
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Scan for internal-only references
        env:
          HYGIENE_CHECK_ROOT: ${{ github.workspace }}
          TICKET_ALLOWLIST: ${{ inputs.ticket_allowlist }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: |
          # Each optional flag is added ONLY when the caller set a non-blank
          # value, so a caller that never heard of these inputs runs the exact
          # bare command.
          args=(--root "$HYGIENE_CHECK_ROOT")
          if [ -n "$(printf '%s' "$EXCLUDE_PATHS" | tr -d '[:space:]')" ]; then
            # Attached form: as a separate token, a legitimate path starting
            # with a hyphen is parsed by argparse as an unknown option and the
            # job dies with a usage error.
            args+=("--exclude=$EXCLUDE_PATHS")
          fi
          if [ -n "$(printf '%s' "$TICKET_ALLOWLIST" | tr -d '[:space:]')" ]; then
            args+=("--ticket-allow=$TICKET_ALLOWLIST")
          fi
          python3 "$GITHUB_WORKSPACE/_public_repo_hygiene/.github/public-repo-hygiene/check_public_repo_hygiene.py" \
            "${args[@]}"

name: Cursor axis (business)

# The business axis of cursor-approve: a thin wrapper over cursor-axis-base.yml.
# No checkout and no shell: the agent sees the PR title, body and
# changed-file list with line counts, fetched by the workflow.
# Company context comes through context-proxy.py (tools: linear,notion), which
# holds the tokens; the agent never does. No Slack: it is where people debate
# before deciding, not a record of the decision, and anyone can post in it, so
# it is neither evidence of business intent nor safe to feed an approver. Declares ONLY the secrets below, all
# but CURSOR_API_KEY optional (a missing token leaves that tool unconfigured).
# Runs only on same-repo PRs in a PRIVATE repo; otherwise it skips with a
# notice. See docs/callers/cursor-approve.md for the caller and accepted risk.
#
# Inputs (passed through): commit_sha, model, runs_on.
# Secrets: CURSOR_API_KEY, LINEAR_KEY, NOTION_TOKEN.

on:
  workflow_call:
    inputs:
      commit_sha:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5-xhigh
      runs_on:
        type: string
        default: '"ubuntu-latest"'
    secrets:
      CURSOR_API_KEY:
        required: true
      LINEAR_KEY:
        required: false
      NOTION_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  skipped:
    if: github.event.pull_request.head.repo.full_name != github.repository || github.event.repository.private != true
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain the skip
        run: echo "::notice::the business axis runs only on same-repo PRs in a private repository; skipped"

  business:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.repository.private == true
    uses: ./.github/workflows/cursor-axis-base.yml
    permissions:
      contents: read
    with:
      axis: business
      checkout: false
      no_shell: true
      context_sources: linear,notion
      commit_sha: ${{ inputs.commit_sha }}
      model: ${{ inputs.model }}
      runs_on: ${{ inputs.runs_on }}
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      LINEAR_KEY: ${{ secrets.LINEAR_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}

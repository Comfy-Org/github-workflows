name: PR Risk Grade (reusable)

# Reusable ADVISORY PR risk grader — the shadow-check rung of the PR risk-grading ladder.
# Grades every PR event into a tier R0 (safest) .. R3 (riskiest) and syncs ONE label
# (`risk:R0` .. `risk:R3`, or `risk:ungraded` when an input was unreadable). That label is
# the entire product: nothing is gated, nothing is blocked, nothing merges, no comment is
# posted. Humans look at the label and agree or disagree; disagreement is recorded by adding
# the `risk-dispute` label (which this workflow never touches) plus a comment saying why.
#
# grade = worst(path_floor, provenance, reversibility) — three deterministic axes; the worst
# tier wins, so no axis can move a PR into a safer lane than another axis put it. No LLM, no
# model call anywhere: `gh` + `jq` over the PR's own API record. See
# scripts/pr-risk/grade-pr-risk.sh for the axes and the unknown contract.
#
# The grader and its default risk map load from THIS repo at the pinned `workflows_ref`,
# never from the graded PR's checkout (no PR code is checked out at all) — a PR cannot edit
# the rules that judge it. A consumer repo sharpens the generic defaults by committing
# `.github/risk.json` (map) / `.github/risk-runbooks.json` (runbook registry), which are read
# from the PR's BASE ref: present-but-invalid fails the run loudly; absent falls back to the
# defaults in scripts/pr-risk/.
#
# CHECKS SETTLE BEFORE THE LABEL DOES: the reversibility axis asks "did tests covering these
# lines actually run", and at event time the rest of the rollup is usually still running (the
# grading job itself is excluded from the rollup it reads — see --self-context in the
# grader). The job re-polls until the other checks settle or `wait_for_checks_minutes` runs
# out, then labels what it has. Pair the caller with a per-PR cancel-in-progress concurrency
# group so a new push supersedes a waiting run instead of stacking behind it.
#
# SECRETS: none. This workflow declares no `secrets:` inputs and callers pass none — the only
# credential in the job is the automatic `GITHUB_TOKEN` (`github.token`), used for the PR read
# and the one label write. There is no `secrets: inherit` to add and nothing to rotate.
#
# The label is applied with the plain GITHUB_TOKEN on purpose: GITHUB_TOKEN-applied labels
# cannot fire `labeled` triggers, so the shadow check is structurally unable to start a
# workflow cascade. Fork PRs under a plain `pull_request` trigger get a read-only token and
# the label write will fail — enroll public repos with `pull_request_target` instead (safe
# here by construction: this workflow never checks out or executes PR code).
#
# ENROLL THIS AS ITS OWN WORKFLOW, not as one job inside an existing CI workflow. The grading
# job is part of the check rollup it reads, so it excludes its own RUN from that rollup; a job
# sharing a run with the rest of CI therefore excludes its siblings too and lands on the honest
# R2 floor instead of grading off a full rollup. (It can never grade a red PR green either way
# — a FAILING check is never excluded.)
#
# Caller pattern (consumer repo, .github/workflows/ci-pr-risk.yml):
#
#   name: CI - PR Risk Grade
#   on:
#     pull_request:
#       types: [opened, synchronize, reopened, ready_for_review]
#   concurrency:
#     group: pr-risk-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   permissions:
#     contents: read
#   jobs:
#     pr-risk:
#       permissions:
#         contents: read
#         issues: write         # the risk label rides the issues API
#         pull-requests: read
#         checks: read          # the check rollup the reversibility axis reads
#         statuses: read
#       uses: Comfy-Org/github-workflows/.github/workflows/pr-risk.yml@<sha>  # v1
#       with:
#         workflows_ref: <same sha>

on:
  workflow_call:
    inputs:
      fleet_logins:
        description: >-
          GitHub logins whose PRs are supervised-agent output (comma-separated).
          Grades provenance `agent-supervised` alongside the `agent-coded` label.
        type: string
        required: false
        default: mattmillerai
      bot_logins:
        description: >-
          Extra logins treated as bots, on top of any `[bot]`-suffixed login
          (comma-separated). A bot with no runbook registry entry grades as
          human — identity alone never buys trust.
        type: string
        required: false
        default: github-actions,dependabot,renovate,coderabbitai,cursor,comfy-pr-bot,web-flow
      label_map:
        description: >-
          Rename the five grader-owned labels, as `tier=label` pairs
          (comma-separated). Default:
          `R0=risk:R0,R1=risk:R1,R2=risk:R2,R3=risk:R3,unknown=risk:ungraded`.
          Tier KEYS are fixed; only the label text is yours. Missing labels are
          created on first use, color-coded green through red.
        type: string
        required: false
        default: ''
      wait_for_checks_minutes:
        description: >-
          How long to wait for the REST of the check rollup to settle before
          labeling (the grading run itself is excluded from the rollup it
          reads). 0 labels immediately — expect R2 floors from still-pending
          checks. CLAMPED to what a 30-minute job can actually spend waiting (25),
          so an over-large value degrades to a shorter wait instead of a job
          cancelled mid-sleep with the label never applied.
        type: number
        required: false
        default: 10
      repo_map_path:
        description: Path of the consumer repo's risk-map override, read from the PR base ref.
        type: string
        required: false
        default: .github/risk.json
      repo_runbooks_path:
        description: Path of the consumer repo's runbook-registry override, read from the PR base ref.
        type: string
        required: false
        default: .github/risk-runbooks.json
      workflows_ref:
        description: >-
          Ref of Comfy-Org/github-workflows to load the grader + default map
          from. REQUIRED, and pin it to the SAME full commit SHA you pin `uses:`
          to. There is deliberately no default: a floating default (`main`) let a
          caller SHA-pin `uses:` and then download the grader from HEAD of main,
          so the two halves of one tool drifted apart and the grading logic
          stayed mutable after review. A supply chain with a floating link in it
          is not a chain.
        type: string
        required: true

permissions:
  contents: read

jobs:
  grade:
    name: Grade PR risk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # read the consumer's .github/risk.json override from the BASE ref
      issues: write         # THE ONLY WRITE: sync the one risk label (a PR is an issue to the
                            # labels API). Nothing else is written — no comment, no review, no
                            # merge — and a GITHUB_TOKEN-applied label cannot fire `labeled`
                            # triggers, so this write cannot start a workflow cascade.
      pull-requests: read   # the PR record itself: author, association, fork flag, file list
      checks: read          # the check rollup the reversibility axis reads (CheckRun contexts)
      statuses: read        # the same rollup's legacy commit-status contexts
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Load pr-risk tool
        # The grader + default map come from THIS workflow's repo (public, pinned
        # via workflows_ref) — never from the graded PR. No PR code is checked
        # out anywhere in this job.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _pr_risk_tool
          persist-credentials: false

      - name: Fetch per-repo overrides from the base ref
        id: overrides
        env:
          MAP_PATH: ${{ inputs.repo_map_path }}
          RB_PATH: ${{ inputs.repo_runbooks_path }}
        run: |
          set -uo pipefail
          # Read from the BASE ref, so the PR being graded cannot edit the rules
          # that judge it. Absent (a genuine 404) falls back to the shipped
          # defaults; present-but-invalid is left for the grader's structural
          # validation to reject loudly — a repo that commits a corrupt map must
          # see red, not silent generic grading.
          #
          # ONLY A 404 MEANS ABSENT. Treating any non-zero exit as "no override"
          # meant a 403 rate-limit, a 5xx or a network blip silently graded the
          # PR against the generic default map instead of the repo's sharpened
          # one — a LOWER tier computed from an input nobody read, which is the
          # confident-answer-from-an-unread-source failure the unknown contract
          # forbids everywhere else. So the status code is captured and anything
          # that is not 200-or-404 fails the run.
          errf="$(mktemp)"
          fetch_override() { # <path> <outfile> -> prints the outfile, or nothing when absent
            local p="$1" out="$2"
            if gh api "repos/${REPO}/contents/${p}?ref=${BASE_REF}" \
                 -H "Accept: application/vnd.github.raw" > "$out" 2>"$errf"; then
              echo "using ${p} from ${BASE_REF}" >&2
              printf '%s' "$out"
            elif grep -q '(HTTP 404)' "$errf"; then
              rm -f "$out"   # the redirect already created it empty; nothing must read it
              echo "no ${p} on ${BASE_REF} — using the generic default" >&2
            else
              echo "::error::could not read ${p} from ${BASE_REF}: $(tr '\n' ' ' < "$errf"). NOT falling back to the generic default: that would grade this PR against rules nobody read." >&2
              return 1
            fi
          }
          map="$(fetch_override "$MAP_PATH" repo-risk-map.json)" || exit 1
          rb="$(fetch_override "$RB_PATH" repo-risk-runbooks.json)" || exit 1
          rm -f "$errf"
          echo "map=$map"       >> "$GITHUB_OUTPUT"
          echo "runbooks=$rb"   >> "$GITHUB_OUTPUT"

      - name: Grade (waits for the rest of the rollup to settle)
        id: grade
        env:
          FLEET_LOGINS: ${{ inputs.fleet_logins }}
          BOT_LOGINS: ${{ inputs.bot_logins }}
          SELF_CONTEXT: ${{ github.workflow }}
          SELF_RUN_ID: ${{ github.run_id }}
          WAIT_MINUTES: ${{ inputs.wait_for_checks_minutes }}
          MAP_OVERRIDE: ${{ steps.overrides.outputs.map }}
          RB_OVERRIDE: ${{ steps.overrides.outputs.runbooks }}
          JOB_TIMEOUT_MINUTES: 30      # keep in sync with timeout-minutes on the job
        run: |
          set -uo pipefail
          TOOL="_pr_risk_tool/scripts/pr-risk/grade-pr-risk.sh"
          ARGS=( --repo "$REPO" --pr "$PR_NUMBER"
                 --self-context "$SELF_CONTEXT" --self-run-id "$SELF_RUN_ID" )
          [ -n "$FLEET_LOGINS" ] && ARGS+=( --fleet-logins "$FLEET_LOGINS" )
          [ -n "$BOT_LOGINS" ]   && ARGS+=( --bot-logins "$BOT_LOGINS" )
          [ -n "$MAP_OVERRIDE" ] && ARGS+=( --map "$MAP_OVERRIDE" )
          [ -n "$RB_OVERRIDE" ]  && ARGS+=( --runbooks "$RB_OVERRIDE" )

          # CLAMP THE WAIT TO THE JOB'S OWN BUDGET rather than trusting the input
          # description. A caller who passes 40 against a 30-minute timeout gets a
          # job cancelled mid-sleep: the label step never runs, the PR keeps
          # whatever label the previous push left, and the check goes red for a
          # reason nobody would guess. 5 minutes of headroom is left for the
          # label + summary steps.
          max_wait=$(( JOB_TIMEOUT_MINUTES - 5 ))
          wait_minutes="${WAIT_MINUTES:-10}"
          [ "$wait_minutes" -ge 0 ] 2>/dev/null || wait_minutes=10
          if [ "$wait_minutes" -gt "$max_wait" ]; then
            echo "::warning::wait_for_checks_minutes=${wait_minutes} exceeds what a ${JOB_TIMEOUT_MINUTES}-minute job can spend waiting — clamped to ${max_wait}"
            wait_minutes="$max_wait"
          fi
          deadline=$(( $(date +%s) + 60 * wait_minutes ))
          empty_deadline=$(( $(date +%s) + 120 ))   # grace for checks to REGISTER at all
          waited=0
          # Poll backoff: 15s doubling to 120s. The fixed 30s poll idled a runner
          # up to the full wait on every `synchronize` event, per PR, across the
          # fleet, for a grade that is one API call — increasing backoff cuts both
          # runner minutes and API calls without changing the settle behaviour.
          delay=15
          settled_once=0
          # rc=3 (the PR could not be read) covers rate limits, secondary rate
          # limits and transient 5xx as well as a genuinely missing PR. Labeling
          # `ungraded` on the first blip turns a momentary hiccup into a durable
          # verdict, so it is retried with backoff. This gets its OWN budget, not
          # the settle deadline: a transient API failure has nothing to do with
          # how long the caller wants to wait for CI, and sharing the deadline
          # would leave `wait_for_checks_minutes: 0` with no retry at all.
          unreadable_tries=0
          max_unreadable_tries=4
          read_deadline=$(( $(date +%s) + 150 ))
          read_delay=10
          while :; do
            rc=0
            bash "$TOOL" "${ARGS[@]}" > record.json || rc=$?
            case "$rc" in
              0|1) ;;                     # graded (1 = graded but unknown — still labeled)
              3)  unreadable_tries=$(( unreadable_tries + 1 ))
                  if [ "$unreadable_tries" -lt "$max_unreadable_tries" ] && [ "$(date +%s)" -lt "$read_deadline" ]; then
                    echo "PR read failed (attempt ${unreadable_tries}/${max_unreadable_tries}) — retrying in ${read_delay}s"
                    sleep "$read_delay"; waited=$(( waited + read_delay ))
                    read_delay=$(( read_delay * 2 )); [ "$read_delay" -le 60 ] || read_delay=60
                    continue
                  fi
                  echo "PR unreadable via the API after ${unreadable_tries} attempt(s) — labeling ungraded"
                  printf '{}' > record.json
                  break ;;
              *)  echo "grader failed (rc=$rc)"; exit 1 ;;   # setup/usage bug: fail loud
            esac
            pending="$(jq -r '.checks_pending_excl_self // false' record.json)"
            state="$(jq -r '.checks_state // "none"' record.json)"
            now="$(date +%s)"
            [ "$now" -lt "$deadline" ] || break
            if [ "$pending" = "true" ]; then
              settled_once=0
            elif [ "$state" = "none" ] && [ "$now" -lt "$empty_deadline" ]; then
              # An EMPTY rollup is checks that have not registered yet, not CI
              # that finished — exiting the poll here would apply a label that a
              # check appearing a second later never revises. Bounded by a SHORT
              # grace window rather than the whole budget, so a repo with
              # genuinely no CI is not made to wait 25 minutes on every PR to
              # arrive at the same honest R2.
              settled_once=0
            elif [ "$settled_once" -eq 0 ]; then
              # First settled reading. Require it to REPEAT before labeling: one
              # transiently-quiet poll is not a settled rollup.
              settled_once=1
            else
              break
            fi
            sleep "$delay"; waited=$(( waited + delay ))
            delay=$(( delay * 2 )); [ "$delay" -le 120 ] || delay=120
          done
          tier="$(jq -r '.risk.tier // "unknown"' record.json)"
          echo "tier=$tier"   >> "$GITHUB_OUTPUT"
          echo "waited=$waited" >> "$GITHUB_OUTPUT"
          echo "graded tier: $tier (waited ${waited}s for the rollup)"

      - name: Apply risk label
        env:
          TIER: ${{ steps.grade.outputs.tier }}
          LABEL_MAP: ${{ inputs.label_map }}
        run: |
          set -uo pipefail
          bash _pr_risk_tool/scripts/pr-risk/apply-risk-label.sh

      - name: Step summary
        if: always()
        env:
          TIER: ${{ steps.grade.outputs.tier }}
          WAITED: ${{ steps.grade.outputs.waited }}
        run: |
          set -uo pipefail
          {
            echo "## PR risk grade: ${TIER:-unknown} (advisory)"
            echo
            if [ -s record.json ] && jq -e '.risk' record.json >/dev/null 2>&1; then
              jq -r '
                "Grade = worst(path_floor, provenance, reversibility) — \(.risk.reason)\n",
                "| axis | tier | reason |", "|---|---|---|",
                (.risk.axes | to_entries[] | "| \(.key) | \(.value.tier // "unknown") | \(.value.reason) |"),
                "\nMap `\(.risk.map_version)` · registry `\(.risk.registry_version)` · waited \($waited)s for the rollup · checks `\(.checks_state // "none")`"
              ' --arg waited "${WAITED:-0}" record.json
            else
              echo "The PR could not be read via the API; nothing was graded (labeled ungraded — this is NOT a low-risk verdict)."
            fi
            echo
            echo "This label routes nothing and gates nothing. Disagree with the grade? Add the \`risk-dispute\` label and say why in a comment — the grader never touches that label."
          } >> "$GITHUB_STEP_SUMMARY"

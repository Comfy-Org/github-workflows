name: Test agents-md-integrity script

# Runs the unit tests for the AGENTS.md integrity checker plus a CLI smoke test
# that exercises one passing and one failing repo fixture end-to-end. The
# checker gates every consumer repo's CI, so a regression here silently breaks
# their required status check — cheap to guard with a unit + smoke run on change.

on:
  pull_request:
    paths:
      - '.github/agents-md-integrity/**'
      - '.github/workflows/test-agents-md-integrity.yml'
      - '.github/workflows/agents-md-integrity.yml'
  push:
    branches: [main]
    paths:
      - '.github/agents-md-integrity/**'
      - '.github/workflows/test-agents-md-integrity.yml'
      - '.github/workflows/agents-md-integrity.yml'

permissions:
  contents: read

jobs:
  test:
    name: unittest + smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run agents-md-integrity unit tests
        run: python3 -m unittest discover -s .github/agents-md-integrity/tests -p 'test_*.py' -v

      - name: Smoke test — a compliant repo passes
        run: |
          root="$(mktemp -d)"
          printf 'thin agents file\n' > "$root/AGENTS.md"
          printf '@AGENTS.md\n' > "$root/CLAUDE.md"
          mkdir -p "$root/.github"
          printf '* @comfy-org/backend\n' > "$root/.github/CODEOWNERS"
          python3 .github/agents-md-integrity/check_agents_md.py --root "$root"

      - name: Smoke test — a drifted repo fails
        run: |
          root="$(mktemp -d)"
          python3 -c "open('$root/AGENTS.md','w').write(chr(10).join('l%d'%i for i in range(250)))"
          printf 'divergent copy, no import\n' > "$root/CLAUDE.md"
          printf 'legacy rules\n' > "$root/.cursorrules"
          if python3 .github/agents-md-integrity/check_agents_md.py --root "$root"; then
            echo "::error::checker passed a drifted repo — expected a non-zero exit"
            exit 1
          fi
          echo "checker correctly failed the drifted repo"

      - name: Smoke test — --exclude carves out a payload subtree, and is logged
        run: |
          # A repo that SHIPS agent instructions as plugin payload: the nested
          # pair is real content, not a shim, so it can only pass via exclusion.
          root="$(mktemp -d)"
          printf 'thin agents file\n' > "$root/AGENTS.md"
          printf '@AGENTS.md\n' > "$root/CLAUDE.md"
          mkdir -p "$root/.github" "$root/plugins/demo"
          printf '* @comfy-org/backend\n' > "$root/.github/CODEOWNERS"
          printf 'plugin payload\n' > "$root/plugins/demo/AGENTS.md"
          printf 'Claude-only instructions shipped to plugin consumers.\n' > "$root/plugins/demo/CLAUDE.md"

          if python3 .github/agents-md-integrity/check_agents_md.py --root "$root"; then
            echo "::error::payload repo passed WITHOUT --exclude — check_nested is not firing"
            exit 1
          fi

          out="$(python3 .github/agents-md-integrity/check_agents_md.py --root "$root" --exclude 'plugins/**')"
          echo "$out"
          grep -qF 'EXCLUDED: plugins/demo (matched plugins/**)' <<<"$out" || {
            echo "::error::exclusion applied but left no trace in the log"
            exit 1
          }
          echo "checker correctly excluded the payload subtree and logged it"

      - name: Smoke test — a root-excluding glob is rejected
        run: |
          root="$(mktemp -d)"
          printf 'thin agents file\n' > "$root/AGENTS.md"
          printf '@AGENTS.md\n' > "$root/CLAUDE.md"
          set +e
          python3 .github/agents-md-integrity/check_agents_md.py --root "$root" --exclude '**'
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit 2 for a root-excluding glob, got $code"
            exit 1
          fi
          echo "checker correctly rejected a root-excluding glob"

name: Bump groom callers

# When groom.yml (or the briefs/ledger it loads) is updated on main, open a
# SHA-bump PR in every repo that pins a groom caller against it. PRs are opened
# by Cloud Code Bot so they are easy to filter and merge.
#
# This is a thin entrypoint over the shared bumper at
# .github/bump-callers/bump-callers.sh — the same script drives the
# cursor-review, agents-md-integrity, pr-size and assign-reviewers fleets.
# Keeping ONE implementation is deliberate: a forked copy is how other shared
# machinery in the org has drifted. The entrypoints differ only in their
# path-filter trigger and the parameters passed below.
#
# WHY groom needs a bumper at all, more than most fleets: a groom caller pins the
# reusable TWICE — the `uses:` SHA and the `workflows_ref:` input that loads the
# finder/verifier/builder briefs + the dedup ledger. Those two must stay in
# lock-step or a run executes one version's workflow against another version's
# briefs. bump-callers.sh rewrites both — it targets the pin TOKEN
# (`Comfy-Org/github-workflows…@<ref>` and the `workflows_ref:` key), so the ref's
# shape does not matter and both halves move whatever they are pinned to — and it
# then asserts every pin in the file reached the new SHA before staging it. So the
# fleet cannot drift into that split state by hand-bumping only one of them, nor
# ship a half-bumped caller (BE-4662).
#
# The caller list is NOT hardcoded here. This repo is PUBLIC (workflow file and
# Actions run logs are both publicly viewable) and callers may be private, so
# their names must never appear in this file or its logs. The list lives in the
# repo-level Actions variable `GROOM_CALLERS` (config, not a credential — a
# variable, not a secret, since secrets are write-only via the API) as a JSON
# array of {"repo","file","label"} objects. Every repo name is `::add-mask::`ed
# out of the (public) run logs before it is ever echoed.
#
# No WIRE_BOT_SCRIPT here: bot-identity injection is a cursor-review-only concern
# (BE-1814). A groom caller must set `bot_app_id` itself — the reusable requires
# it for `builder: true` — so there is nothing for the bumper to wire.
#
# Update flow — adding/removing a caller needs NO public commit:
#   gh variable set GROOM_CALLERS --repo Comfy-Org/github-workflows \
#     --body "$(jq -c . callers.json)"
# Keep the canonical callers.json in a PRIVATE infra/ops repo so variable edits
# have a reviewed source of truth; the org audit log records each edit. (The
# specific home repo is intentionally not named here — this file is public.)

on:
  workflow_dispatch: {}   # allow on-demand runs (e.g. to re-bump callers)
  push:
    branches: [main]
    paths:
      - .github/workflows/groom.yml
      # The briefs + ledger consumers actually run live here, loaded at run time
      # from the `workflows_ref` SHA a caller pins (see groom.yml's header) — a
      # behavior change here (a finder/verifier/builder brief edit, or ledger.py
      # dedup logic) needs the same caller bump as a workflow-file change, or
      # pinned callers silently drift onto stale audit behavior.
      - .github/groom/**

permissions:
  contents: read

# Serialize runs of this fleet. The bumper pushes to a STABLE branch
# (ci/bump-groom) shared across runs, so two overlapping runs (a rapid second
# main push, or a push racing a manual re-run) would force-reset that branch and
# race the PR update — an older run finishing last could leave the committed diff
# pinned to a stale SHA. cancel-in-progress: false lets the running bump finish;
# GitHub keeps only the newest pending run, so the latest SHA always wins
# (BE-3882).
concurrency:
  group: bump-groom-callers
  cancel-in-progress: false

jobs:
  bump:
    # Guard against a workflow_dispatch run from a non-main ref: github.sha is
    # the tip of whatever ref was selected, and the bumper force-resets a stable
    # shared branch — a manual run from an older ref would pin every caller to a
    # stale SHA (and run this job's script, with the App token minted below,
    # from an unreviewed commit). The push trigger is already main-only, so this
    # only ever skips stray manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Cloud Code Bot token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0 — pinned: see dependabot.yml ignore (v2+ breaks cross-repo `owner:` token scoping)
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
          # `owner:` with no `repositories:` is deliberate and cannot be narrowed:
          # the caller list is a runtime variable (see the header), so the repos
          # this token must reach are not knowable at authoring time — and naming
          # them here would leak private caller names into a public file.
          #
          # The PERMISSIONS can be narrowed without naming anything, so they are:
          # unset, the minted token carries every permission the app holds on every
          # repo it is installed on, far past what this bumper needs. It commits
          # the rewritten caller file via the Git Data API (contents) and opens or
          # updates the bump PR (pull-requests); `gh pr create --label` stamps the
          # caller's label through the issues API (issues) — same trio, and the
          # same reasoning, as groom.yml's own PR job.
          owner: Comfy-Org
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      # The shared staleness/decommission guard — one implementation for every
      # fleet, documented in .github/bump-callers/README.md "Preflight". It
      # decides whether this run is a stale re-run (a later commit already
      # touched the watched surface and has its own run) or the surface has been
      # decommissioned, and emits the SHA the bump below pins.
      # WATCHED/WATCHED_ASSETS are LITERAL paths, never the `paths:` globs, and
      # must cover EVERY entry in this fleet's filter above — which matters twice
      # over here, because a groom caller pins BOTH surfaces (`uses:` and
      # `workflows_ref:`), so either one missing is a broken pin. Widen these
      # inputs in the same change if you ever widen that filter.
      - name: Preflight (staleness / decommission guard)
        id: preflight
        env:
          NEW_SHA: ${{ github.sha }}
          WATCHED: .github/workflows/groom.yml
          WATCHED_ASSETS: .github/groom
        run: bash .github/bump-callers/preflight.sh

      - name: Bump SHA in caller repos
        # Stale run or decommissioned surface — nothing to bump.
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # NOT github.sha: when main moved on but the watched surface is
          # unchanged, the preflight re-points this run at the verified tip, and
          # reading github.sha here would silently discard that re-point.
          NEW_SHA: ${{ steps.preflight.outputs.new_sha }}
          VAR_NAME: GROOM_CALLERS
          TAG: groom
          WORKFLOW_FILE: groom.yml
          # JSON array of {"repo","file","label"} — see the header comment for the
          # update flow. Kept in a variable (not the file) so caller names never
          # land in this public repo or its logs.
          CALLERS_JSON: ${{ vars.GROOM_CALLERS }}
          # groom is still rolling out repo by repo, so an empty list is a clean
          # no-op rather than a hard failure — same posture as the agents-md /
          # pr-size / assign-reviewers fleets. Flip to the default (unset) once
          # the fleet is expected to always have callers, so a silently empty
          # variable can never leave every caller un-bumped unnoticed.
          ALLOW_EMPTY: 'true'
        run: bash .github/bump-callers/bump-callers.sh

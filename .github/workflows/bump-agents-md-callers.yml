name: Bump agents-md-integrity callers

# When the agents-md-integrity reusable workflow (or its checker script) is
# updated on main, open a SHA-bump PR in every repo that pins a caller against
# it. PRs are opened by Cloud Code Bot so they are easy to filter and merge.
#
# This is a thin entrypoint over the shared bumper at
# .github/bump-callers/bump-callers.sh — the same script drives the
# cursor-review and pr-size caller fleets (bump-cursor-review-callers.yml,
# bump-pr-size-callers.yml). Keeping ONE implementation is deliberate: a forked
# copy is how other shared machinery in the org has drifted. The entrypoints
# differ only in their path-filter trigger and the three parameters passed
# below. (They stay separate rather than a single matrix
# because their triggers differ — a cursor-review.yml change must not spuriously
# bump agents-md callers, and vice versa.)
#
# The caller list is NOT hardcoded here. This repo is PUBLIC (workflow file and
# Actions run logs are both publicly viewable), and most callers are private, so
# their names must never appear in this file or its logs. The list lives in the
# repo-level Actions SECRET `AGENTS_MD_CALLERS` as a JSON array of
# {"repo","file","label"} objects, same shape as CURSOR_REVIEW_CALLERS. An empty
# list (`[]`, or an unset secret) is a clean no-op here (ALLOW_EMPTY below); the
# rollout's per-repo caller tickets add entries as callers land.
#
# A SECRET, not a variable (BE-6472): the roster reaches the script through the
# step's `env:` below, and Actions prints that env block BEFORE the step runs —
# so a variable's raw value was published in this public repo's run log ahead of
# any masking the script could do (the KNOWN GAP this header used to carry). A
# secret is runner-masked everywhere, that dump included. The cost is read-back:
# there is no `gh secret get`, so the canonical callers.json in the private ops
# repo is the sole source of truth, and the run instead logs a count + sha256
# fingerprint of the roster it used (reproduce with `jq -cS . callers.json |
# sha256sum`) so an edit can be audited against it.
# `bump-callers.sh` still `::add-mask::`es every repo name before IT echoes
# anything — Actions masks the roster as ONE exact string, not each name inside
# it, so a name echoed on its own would otherwise print in the clear.
#
# Update flow — adding/removing a caller needs NO public commit:
#   jq -c . callers.json | gh secret set AGENTS_MD_CALLERS --repo Comfy-Org/github-workflows
# Keep the canonical callers.json in a PRIVATE infra/ops repo so roster edits
# have a reviewed source of truth; the org audit log records each edit. (The
# specific home repo is intentionally not named here — this file is public.)

on:
  workflow_dispatch: {}   # allow on-demand runs (e.g. to re-bump callers)
  push:
    branches: [main]
    paths:
      - .github/workflows/agents-md-integrity.yml
      - .github/agents-md-integrity/**

permissions:
  contents: read
  # Read-only, and read by the PREFLIGHT step alone (BE-10008): before it
  # honors a `Skip-caller-bump: true` trailer, the guard reads this fleet's own
  # Actions run history to check no earlier watched change is still owed a bump.
  # It stays well ahead of the org-wide write token minted further down.
  actions: read

# Serialize runs of this fleet. The bumper now pushes to a STABLE branch
# (ci/bump-agents-md-integrity) shared across runs, so two overlapping runs (a
# rapid second main push, or a push racing a manual re-run) would force-reset
# that branch and race the PR update — an older run finishing last could leave
# the committed diff pinned to a stale SHA. cancel-in-progress: false lets the
# running bump finish; GitHub keeps only the newest pending run, so the latest
# SHA always wins (BE-3882).
concurrency:
  group: bump-agents-md-callers
  cancel-in-progress: false

jobs:
  bump:
    # Guard against a workflow_dispatch run from a non-main ref: github.sha is
    # the tip of whatever ref was selected, and the bumper force-resets a stable
    # shared branch — a manual run from an older ref would pin every caller to a
    # stale SHA (and run this job's script, with the App token minted below,
    # from an unreviewed commit). The push trigger is already main-only, so this
    # only ever skips stray manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The job is a bounded loop of `git`/`gh` network calls, plus the preflight's
    # deepening fetch; nothing here should take minutes. Without this a hung call
    # would hold a runner for the default 6 hours (and, via the serializing
    # concurrency group above, block every later bump behind it).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The shared staleness/decommission guard — one implementation for every
      # fleet, documented in .github/bump-callers/README.md "Preflight". It
      # decides whether this run is a stale re-run (a later commit already
      # touched the watched surface and has its own run) or the surface has been
      # decommissioned, and emits the SHA the bump below pins.
      # WATCHED/WATCHED_ASSETS are LITERAL paths, never the `paths:` globs, and
      # must cover EVERY entry in this fleet's filter above: the re-point only
      # pins callers to a tip whose watched content it compared, so widen these
      # inputs in the same change if you ever widen that filter.
      - name: Preflight (staleness / decommission guard)
        id: preflight
        env:
          NEW_SHA: ${{ github.sha }}
          WATCHED: .github/workflows/agents-md-integrity.yml
          WATCHED_ASSETS: .github/agents-md-integrity
          # Read-only ambient token, for the owed-bump probe's `actions: read`
          # history lookup only (BE-10008). Never a write credential: the
          # Cloud Code Bot token is minted after — and only if — this step says
          # proceed. Absent, the probe reads as "cannot determine" and bumps.
          GH_TOKEN: ${{ github.token }}
        run: bash .github/bump-callers/preflight.sh

      - name: Generate Cloud Code Bot token
        # Stale run or decommissioned surface — don't mint an org-wide
        # write token for a job that is about to bump nothing.
        if: steps.preflight.outputs.proceed == 'true'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0 — pinned: see dependabot.yml ignore (v2+ breaks cross-repo `owner:` token scoping)
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
          owner: Comfy-Org

      - name: Bump SHA in caller repos
        # Stale run or decommissioned surface — nothing to bump.
        if: steps.preflight.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          # NOT github.sha: when main moved on but the watched surface is
          # unchanged, the preflight re-points this run at the verified tip, and
          # reading github.sha here would silently discard that re-point.
          NEW_SHA: ${{ steps.preflight.outputs.new_sha }}
          # Names the roster to fix in an error message. It is a SECRET now, not a
          # variable; the env key keeps its historical name so every fleet's
          # entrypoint and the shared script stay in step.
          VAR_NAME: AGENTS_MD_CALLERS
          TAG: agents-md-integrity
          WORKFLOW_FILE: agents-md-integrity.yml
          # An empty roster — `[]`, or a secret nobody has set — is a clean no-op
          # here, not an error.
          ALLOW_EMPTY: "true"
          # JSON array of {"repo","file","label"} — see the header comment for the
          # update flow. Kept in a repo-level SECRET (not this file, and not a
          # variable) so private caller names never land in this public repo — nor,
          # since a secret is masked in the step's env dump too, in its run logs.
          CALLERS_JSON: ${{ secrets.AGENTS_MD_CALLERS }}
        run: bash .github/bump-callers/bump-callers.sh

name: Cursor Review Auto-Label (reusable)

# Reusable companion to cursor-review.yml. Translates the moment an opted-in
# person becomes responsible for a PR into the review label that
# cursor-review.yml triggers on — keeping the "fire on label" contract intact
# while letting people opt in without UI clicks.
#
# Which moments fire is decided by the CALLER's `on:` triggers; this workflow
# just reacts to whatever pull_request event was passed through:
#   - assigned            -> the newly-assigned reviewer
#   - opened              -> the PR author (skipped while the PR is a draft)
#   - ready_for_review    -> the PR author
# A caller that lists only `[assigned]` keeps the original assignment-only
# behavior; add `opened` / `ready_for_review` to also label on PR creation.
#
# The opt-in roster is NOT baked into this file. It lives in the CALLER repo's
# `vars.CURSOR_REVIEW_OPTED_IN_LOGINS` (whitespace-separated GitHub logins). The
# `vars` context in a reusable workflow resolves to the caller's repository/org
# variables, so each consumer manages its own roster by editing the variable,
# not this workflow.
#
# IMPORTANT: the label MUST be applied with a GitHub App token, not the default
# GITHUB_TOKEN. Label events triggered by GITHUB_TOKEN do not create new
# workflow runs, so a GITHUB_TOKEN-applied label would silently fail to fire the
# review. So the caller must hand this workflow an App to mint from, in one of
# two ways:
#   - DEFAULT (unchanged): pass `secrets.CLOUD_CODE_BOT_PRIVATE_KEY` and leave
#     `bot_app_id` unset — the token is minted from the caller's `vars.APP_ID`
#     (the CLOUD_CODE_BOT app id), exactly as before.
#   - NARROW APP: set the `bot_app_id` input and pass the matching
#     `BOT_APP_PRIVATE_KEY` secret — useful on a `pull_request` caller that
#     would rather not expose the write-broad app's key. App IDs aren't secret,
#     so the id is an input and only the key is a secret.
# EXACTLY ONE of those two pairs may be supplied, and it must be complete. The
# preflight step below rejects every other shape loudly rather than falling
# back: an id with no key, a key with no id, neither key, an empty `vars.APP_ID`
# on the default path, and — because avoiding the write-broad app is the whole
# point of `bot_app_id` — the MIX, i.e. `bot_app_id` alongside a
# `CLOUD_CODE_BOT_PRIVATE_KEY` mapping. Any fallback would silently mint from
# the very app the caller asked not to use.
#
# Example caller (consumer repo) — default CLOUD_CODE_BOT mint:
#
#   name: CI - Cursor Review Auto-Label
#   on:
#     pull_request:
#       types: [assigned, opened, ready_for_review]   # or just [assigned]
#   jobs:
#     auto-label:
#       permissions:
#         contents: read
#       uses: Comfy-Org/github-workflows/.github/workflows/cursor-review-auto-label.yml@<sha>
#       secrets:
#         CLOUD_CODE_BOT_PRIVATE_KEY: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
#
# Example caller — mint from a narrower App instead:
#
#       with:
#         bot_app_id: ${{ vars.APP_ID_PR }}
#       secrets:
#         BOT_APP_PRIVATE_KEY: ${{ secrets.CLOUD_CODE_BOT_PR_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      review_label:
        description: >-
          Label to apply. MUST match the label cursor-review.yml triggers on
          (its `review_label` input, default `cursor-review`).
        type: string
        required: false
        default: cursor-review
      skip_label:
        description: >-
          If this label is already present on the PR, auto-labeling is
          suppressed — don't fight an explicit opt-out.
        type: string
        required: false
        default: skip-cursor-review
      runs_on:
        description: >-
          JSON-encoded runs-on value for this workflow's single job. Default
          '"ubuntu-latest"' (a JSON string) preserves existing GitHub-hosted
          behavior for all callers. Override with a JSON array to target a
          self-hosted runner, e.g. '["self-hosted", "macOS"]' — useful for
          repos that would otherwise burn GitHub-hosted minutes (private repos
          over quota). Parsed with fromJSON, so the value MUST be valid JSON.
          Matches the same input on cursor-review.yml so a caller can pin both
          workflows to one runner.
        type: string
        required: false
        default: '"ubuntu-latest"'
      bot_app_id:
        description: >-
          GitHub App ID to mint the labelling token from. Optional — when
          empty the workflow keeps its original behaviour and uses the
          caller's `vars.APP_ID` (the CLOUD_CODE_BOT app). Set it (with the
          BOT_APP_PRIVATE_KEY secret) so a `pull_request` caller can mint from
          a narrower App instead of the write-broad one. App IDs aren't
          secret, so this is an input, not a secret.
        type: string
        required: false
        default: ''
    secrets:
      CLOUD_CODE_BOT_PRIVATE_KEY:
        description: >-
          Private key for the CLOUD_CODE_BOT app (`vars.APP_ID`). Required when
          `bot_app_id` is NOT set — the label must be applied by a GitHub App so
          it triggers the downstream review run (GITHUB_TOKEN-applied labels do
          not). Declared optional so a caller can supply BOT_APP_PRIVATE_KEY
          instead; the preflight below fails a run that supplies neither, and
          also one that supplies this ALONGSIDE `bot_app_id`.
        required: false
      BOT_APP_PRIVATE_KEY:
        description: >-
          PEM private key matching the bot_app_id input. Required when
          bot_app_id is set. Passing it WITHOUT bot_app_id fails the preflight
          rather than falling back to CLOUD_CODE_BOT — an empty-resolving
          `bot_app_id` expression is a typo, not a request for the broad app.
        required: false

permissions:
  contents: read

jobs:
  auto-label:
    name: Auto-apply review label
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
    steps:
      # Both keys are optional at the `secrets:` declaration so either pairing
      # can be used, which means neither is enforced at startup any more. Catch
      # every incomplete or mixed shape here instead. Every arm fails closed:
      # there is no path on which a caller who named a narrow `bot_app_id` ends
      # up minting from write-broad CLOUD_CODE_BOT, because that fail-open is
      # exactly what `bot_app_id` exists to prevent.
      - name: Refuse an incomplete or mixed App pair
        env:
          BOT_APP_ID: ${{ inputs.bot_app_id }}
          HAS_BOT_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY != '' }}
          HAS_LEGACY_KEY: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY != '' }}
          HAS_APP_ID: ${{ vars.APP_ID != '' }}
        run: |
          if [ -n "$BOT_APP_ID" ]; then
            if [ "$HAS_BOT_KEY" != "true" ]; then
              echo "::error::bot_app_id is set but BOT_APP_PRIVATE_KEY is empty — pass the key paired with that App id." ; exit 1
            fi
            if [ "$HAS_LEGACY_KEY" = "true" ]; then
              echo "::error::bot_app_id is set AND CLOUD_CODE_BOT_PRIVATE_KEY was passed — exactly one pair, not a mix. Drop the CLOUD_CODE_BOT_PRIVATE_KEY mapping (or stop using 'secrets: inherit') so the write-broad key never enters a run that asked for a narrower App." ; exit 1
            fi
          else
            # A bot key with no id is almost always a caller whose 'bot_app_id:'
            # expression resolved empty (variable unset or misspelled). Silently
            # using CLOUD_CODE_BOT there would hand out the write-broad token
            # with a green run and nothing in the log to say so.
            if [ "$HAS_BOT_KEY" = "true" ]; then
              echo "::error::BOT_APP_PRIVATE_KEY was passed but bot_app_id is empty — set the bot_app_id input to the matching App id (if you passed a vars expression, that variable is unset or misspelled). Refusing to fall back to the write-broad CLOUD_CODE_BOT app." ; exit 1
            fi
            if [ "$HAS_LEGACY_KEY" != "true" ]; then
              echo "::error::bot_app_id is unset and CLOUD_CODE_BOT_PRIVATE_KEY is empty — nothing to mint with." ; exit 1
            fi
            if [ "$HAS_APP_ID" != "true" ]; then
              echo "::error::bot_app_id is unset and the caller repo's vars.APP_ID is empty — the default pair needs the CLOUD_CODE_BOT app id there, not just the key." ; exit 1
            fi
          fi

      # Two mutually exclusive mints rather than one `||`-selected pair. A single
      # step would need `inputs.bot_app_id != '' && secrets.BOT_APP_PRIVATE_KEY
      # || secrets.CLOUD_CODE_BOT_PRIVATE_KEY`, which GitHub parses as an `||`
      # fallback: an empty BOT_APP_PRIVATE_KEY would hand the write-broad key to
      # a caller who asked for the narrow App. Gating each step on bot_app_id
      # keeps that invariant HERE instead of borrowing it from the preflight's
      # ordering, which an added `if:`/`continue-on-error` could quietly void.
      - name: Generate GitHub App token (narrow App)
        id: app-token-narrow
        if: inputs.bot_app_id != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The only call made with this token is `gh pr edit --add-label`.
          permission-pull-requests: write
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Generate GitHub App token (default CLOUD_CODE_BOT)
        id: app-token-default
        if: inputs.bot_app_id == ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          permission-pull-requests: write
          # `vars` resolves in the CALLER's context, so this reads the caller's
          # vars.APP_ID — the same value this step read before bot_app_id existed.
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}

      - name: Apply label when an opted-in person opens / readies / is assigned
        env:
          GH_TOKEN: ${{ steps.app-token-narrow.outputs.token || steps.app-token-default.outputs.token }}
          ACTION: ${{ github.event.action }}
          ASSIGNEE: ${{ github.event.assignee.login }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          # Whitespace-separated GitHub logins, from the caller repo's variable.
          OPTED_IN_LOGINS: ${{ vars.CURSOR_REVIEW_OPTED_IN_LOGINS }}
          REVIEW_LABEL: ${{ inputs.review_label }}
          SKIP_LABEL: ${{ inputs.skip_label }}
        run: |
          # Empty/unset roster -> nothing is opted in. Don't fail the run;
          # consumers that haven't set the variable just get a no-op.
          if [ -z "$(echo "$OPTED_IN_LOGINS" | tr -d '[:space:]')" ]; then
            echo "vars.CURSOR_REVIEW_OPTED_IN_LOGINS is empty/unset — no-op."
            exit 0
          fi

          # Pick the login this event is "about":
          #   assigned                  -> the newly-assigned reviewer
          #   opened / ready_for_review -> the PR author
          case "$ACTION" in
            assigned)
              candidate="$ASSIGNEE" ;;
            opened|ready_for_review)
              candidate="$AUTHOR" ;;
            *)
              echo "Unhandled action '$ACTION' — no-op."
              exit 0 ;;
          esac

          # Don't fire on a PR opened as a draft — the ready_for_review event
          # re-triggers this workflow once it's marked ready.
          if [ "$ACTION" = "opened" ] && [ "$IS_DRAFT" = "true" ]; then
            echo "PR opened as a draft — deferring until marked ready for review."
            exit 0
          fi

          matched=false
          for login in $OPTED_IN_LOGINS; do
            if [ "$candidate" = "$login" ]; then
              matched=true
              break
            fi
          done

          if [ "$matched" = "false" ]; then
            echo "$candidate is not opted in (action=$ACTION) — no-op."
            exit 0
          fi

          # Already labeled — don't re-add (would just no-op anyway).
          if echo "$PR_LABELS" | jq -e --arg l "$REVIEW_LABEL" 'index($l)' > /dev/null; then
            echo "$REVIEW_LABEL already present — no-op."
            exit 0
          fi

          # An explicit skip label wins — don't silently fight the user's intent.
          if echo "$PR_LABELS" | jq -e --arg l "$SKIP_LABEL" 'index($l)' > /dev/null; then
            echo "$SKIP_LABEL present — not auto-applying."
            exit 0
          fi

          echo "Applying $REVIEW_LABEL label for $candidate (action=$ACTION)."
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$REVIEW_LABEL"

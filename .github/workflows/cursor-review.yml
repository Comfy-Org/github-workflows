          MSG="*${PR_TITLE}*"$'\n'"${PR_URL}"$'\n'"8-cell panel running, then a judge consolidates."
          "$CURSOR_REVIEW_ASSETS/slack-notify.sh" \
            "warning" \
            "Cursor review starting" \
            "$MSG"

  notify-complete:
    name: Notify complete
    needs: [gate, diff-size, review, consolidate, post-review]
    # `!cancelled()` for the same reason `consolidate` above uses it, plus one
    # of its own: this job reads a skipped/cancelled `post-review` as a posting
    # failure and DMs the triggerer "Cursor review failed to post". On a
    # cancelled run that message is simply false — the veto label, or a newer
    # push, stopped the panel on purpose — so a run someone deliberately
    # stopped should not page anyone. Genuine failures are untouched: a failed
    # cell, judge or post is not a cancelled RUN and still notifies. (It also
    # keeps this job's `needs: consolidate` honest now that `consolidate` is
    # itself `!cancelled()` and no longer runs on a cancelled run.)
    if: ${{ !cancelled() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true' && needs.review.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$GH_ACTOR" == *"[bot]" ]]; then
            ASSIGNEE=$(echo "$PR_ASSIGNEES" | jq -r '.[0] // empty')
            # Prefer PR author for DM routing — they opened the work and most want
            # the review status. Falls back to assignee, then empty (skips DM) if
            # the author is also a bot (e.g. Dependabot PRs).
            RESOLVED="${PR_AUTHOR:-${ASSIGNEE:-}}"
            if [[ "$RESOLVED" == *"[bot]" ]]; then RESOLVED=""; fi
            echo "triggered_by=$RESOLVED" >> "$GITHUB_OUTPUT"
          else
            echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
          fi

      - name: DM triggerer — review complete
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DM_GITHUB_USER: ${{ steps.triggerer.outputs.triggered_by }}
          # See notify-start: JSON handle → email-prefix overrides, supplied as
          # an org/repo Actions variable so the roster stays out of this repo.
          DM_EMAIL_MAP: ${{ vars.CURSOR_REVIEW_DM_EMAIL_MAP }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CONSOLIDATE_RESULT: ${{ needs.consolidate.result }}
          POST_REVIEW_RESULT: ${{ needs.post-review.result }}
          # Not redundant with the result above (BE-10017): post-review.py exits
          # 0 — so the job is green — after a read-only-token 403, having written
          # the review to the run's job summary instead of the PR. Deliberate (a
          # caller that forgot `pull-requests: write` still gets its review
          # somewhere), but it made the success DM claim a review that is not
          # there. Unset reads as not-'true', which is the fail-closed direction:
          # the worst case is a degraded DM on a review that did post.
          REVIEW_POSTED: ${{ needs.post-review.outputs.posted }}
          # `posted` and `delivered` disagree in BOTH directions, so the DM needs
          # both: the "Review failed" error review and the all-cells-failed review
          # DO reach the PR (posted) while adjudicating nothing (not delivered).
          # Claiming "review complete" over those is the same class of lie this
          # ticket fixes, one branch further in — the blocking gate refuses that
          # exact round. Unset reads as not-'true', i.e. fail-closed here too.
          REVIEW_DELIVERED: ${{ needs.post-review.outputs.delivered }}
        run: |
          chmod +x "$CURSOR_REVIEW_ASSETS/slack-notify.sh"
          # Keyed on the POST job, not on consolidate: since the credential
          # split it is `post-review` that puts the review on the PR, so a green
          # consolidate alone no longer justifies "one consolidated review is on
          # the PR". The two failures are distinguished so the DM says which
          # half broke.
          if [ "$POST_REVIEW_RESULT" = "success" ] && [ "$REVIEW_POSTED" = "true" ] && [ "$REVIEW_DELIVERED" = "true" ]; then
            STATUS="success"
            TITLE="Cursor review complete"
            DETAIL="One consolidated review is on the PR."
          elif [ "$POST_REVIEW_RESULT" = "success" ] && [ "$REVIEW_POSTED" = "true" ]; then
            # A body reached the PR but adjudicated nothing: the "Review failed"
            # error review, or the review a round posts when every panel cell
            # errored. Pointing at the PR is right — there IS something to read
            # there — but calling it complete is not.
            STATUS="warning"
            TITLE="Cursor review incomplete"
            DETAIL="A review was posted on the PR, but it adjudicated nothing — the judge failed, or every reviewer in the panel errored. See the run for the underlying cause."
          elif [ "$POST_REVIEW_RESULT" = "success" ]; then
            # Green job, nothing on the PR. The designed-for case is the
            # read-only-token degradation, but this branch is reached by every
            # green run that did not post, so state the OBSERVATION as fact and
            # the cause as likelihood: is_read_only_token_error treats every 403
            # EXCEPT a throttle as read-only (BE-12612), so an SSO/IP-allowlist
            # or archived-repo rejection lands here too, as does an App
            # installation without pull-request write (where the caller's
            # permissions block is not the knob) and a workflows_ref resolving
            # to a post-review.py too old to emit `posted` at all. A throttle
            # GitHub WORDS as one no longer arrives here: it takes the
            # landed-review check instead and fails red if nothing landed, which
            # the failure branch below already covers. An unworded 403 — what an
            # edge, a WAF or a GHES proxy returns with no JSON body — carries
            # nothing to tell those apart by, so it is read as standing and does
            # still land here; hence "most often", not "always".
            STATUS="warning"
            TITLE="Cursor review degraded"
            DETAIL="No review was posted on the PR — the full text is in the run's job summary. Most often the run's token lacks pull-requests: write (check the caller's permissions block); another standing 403 (SSO/IP allowlist, archived repo) or a stale workflows_ref pin reaches this too. A 403 GitHub worded as a rate limit does not reach this — it takes the landed-review check and fails the job red if nothing landed — but a 403 carrying no message at all (an edge or proxy) is indistinguishable from a standing refusal and does, so check the run log for the actual error before ruling a throttle out."
          elif [ "$CONSOLIDATE_RESULT" != "success" ]; then
            STATUS="warning"
            TITLE="Cursor review failed to post"
            DETAIL="Consolidate step did not succeed — see the run for details."
          else
            STATUS="warning"
            TITLE="Cursor review failed to post"
            DETAIL="The panel consolidated, but the post-review job did not succeed — see the run for details."
          fi
          MSG="*${PR_TITLE}*"$'\n'"${PR_URL}"$'\n'"${DETAIL}"
          "$CURSOR_REVIEW_ASSETS/slack-notify.sh" \
            "$STATUS" \
            "$TITLE" \
            "$MSG"

  auto-retry:
    # BE-19526: re-run a round the head outran, once per PR. `Auto-approve
    # decision` decides it and leaves the marked standing block and the card;
    # this job only does the relabel, and runs LAST on purpose. Removing and
    # re-adding the label fires `unlabeled`/`labeled` events that land in the
    # documented caller's `cancel-in-progress` group (and this reusable's own
    # `trigger` slot), cancelling whatever of THIS run is still going — so every
    # job that reports on the round (the Blocking gate and Panel integrity
    # checks, the completion DM) must be done first. `needs:` them all, with
    # `!cancelled()` so a skipped or red one does not skip the retry; a push that
    # cancels this run before it gets here leaves the card's "if no new round
    # starts, re-run it by hand" as the recovery.
    name: Re-run the round (head moved)
    needs: [post-review, panel-integrity, blocking-gate, notify-complete]
    if: ${{ !cancelled() && needs.post-review.outputs.auto_retry == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Mint bot-identity token (optional)
        id: bot_token
        if: ${{ inputs.bot_app_id != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Remove and re-add the review label
        env:
          # The token decide held (same precedence), never GITHUB_TOKEN: a
          # GITHUB_TOKEN-applied label fires no workflow run. decide only sets
          # `auto_retry` when one of these two is configured.
          APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REVIEW_LABEL: ${{ inputs.review_label }}
        run: |
          if [ -n "$APPROVER_TOKEN" ]; then
            export GH_TOKEN="$APPROVER_TOKEN"
          elif [ -n "$BOT_TOKEN" ]; then
            export GH_TOKEN="$BOT_TOKEN"
          else
            echo "::error::No APPROVER_TOKEN or bot App token, so the round cannot be re-run (a GITHUB_TOKEN label fires no run). Re-run it by hand."
            exit 1
          fi
          python3 "$CURSOR_REVIEW_ASSETS/auto-approve.py" auto-retry \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --review-label "$REVIEW_LABEL"

name: Cursor Review (reusable)

# Reusable, label-triggered multi-model code review. A 4-lab × 2-review-type
# panel (8 cursor-agent cells) runs adversarial + edge-case passes, then a
# judge model consolidates the findings into ONE review posted on the PR,
# with per-finding severity badges (critical/high/medium/low/nit).
#
# Single source of truth: the prompts and the extract/post/notify scripts
# live in THIS repo under .github/cursor-review/. Consumer repos add only a
# thin caller — they don't carry copies of the review logic, so there's no
# drift to keep in sync.
#
# Caller pattern (place in source repo at .github/workflows/ci-cursor-review.yml):
#
#   name: CI - Cursor Review
#   on:
#     pull_request:
#       types: [labeled, unlabeled]
#   permissions:
#     contents: read
#     pull-requests: write
#   concurrency:
#     group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
#     cancel-in-progress: true
#   jobs:
#     cursor-review:
#       uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@<sha>  # v1
#       with:
#         # Repo-specific generated/vendored paths. Fed to the shared
#         # check-pr-size classifier, so they're excluded from BOTH the size gate
#         # and the reviewed diff — the same codegen detection the PR-size cap
#         # uses (lockfiles, base-ref linguist-generated, Go markers are already
#         # built in). Use diff_excludes only for diff-only, non-generated paths.
#         # Setting this REPLACES the default list, so the defaults are re-stated
#         # verbatim here before the repo's own paths — a pattern with no `/`
#         # matches the base name only, so the `**/…/**` form is load-bearing.
#         extra_generated_globs: >-
#           **/node_modules/**
#           **/dist/**
#           **/vendor/**
#           **/*.generated.*
#           **/*.min.js
#           **/*.min.css
#           data/object_info.json.gz
#           **/*.snap
#         # REQUIRED. Pin the assets ref to the SAME commit SHA you pin `uses:`
#         # to — otherwise the workflow is pinned but its scripts are not.
#         workflows_ref: <same-sha-as-uses>
#         # Optional: post the review under your own GitHub App so its threads are
#         # a distinct, queryable identity instead of github-actions[bot]. Supply
#         # your App's id + private key (App IDs aren't secret, so id is an input).
#         bot_app_id: ${{ vars.REVIEW_BOT_APP_ID }}
#       secrets:
#         CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
#         SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
#         # Optional — the private key paired with bot_app_id.
#         BOT_APP_PRIVATE_KEY: ${{ secrets.REVIEW_BOT_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      judge_model:
        description: >-
          Single judge model that adjudicates panel findings into one
          consolidated review. Picked to match the highest reasoning tier in
          the panel.
        type: string
        required: false
        default: claude-opus-5-thinking-max
      diff_size_cap:
        description: >-
          Max counted changed lines. PRs over the cap are skipped — too large
          for a useful single-pass review. "Counted" is added + removed lines
          after the shared classifier's generated-file exclusion and (when
          ignore_comments is true) blank/comment-line discounting.
        type: number
        required: false
        default: 5000
      ignore_comments:
        description: >-
          Discount blank lines and comment-only lines from the counted total, so
          AI-generated comment volume doesn't push a PR over the cap and skip the
          review. Count-only: comments are still sent to the review panel (a
          reviewer should catch wrong or misleading comments). Heuristic
          (per-language, single-line comment markers; multi-line block-comment
          bodies and string literals aren't lexed), so it's approximate. Default
          true; set false to count every changed line.
        type: boolean
        required: false
        default: true
      review_label:
        description: Label whose addition triggers the review.
        type: string
        required: false
        default: cursor-review
      extra_generated_globs:
        description: >-
          Extra glob patterns treated as generated, fed to the shared
          check-pr-size classifier. Matching files are excluded from BOTH the
          diff-size gate AND the diff handed to the review panel + judge — the
          exact same "what is codegen" logic the PR-size cap uses, so the two
          workflows can't drift. `*` matches within a path segment, `**` across
          segments, `?` one character; a pattern without `/` matches the base
          name at any depth. This is the preferred knob for generated/vendored
          paths: the classifier already covers dependency lockfiles, files
          marked `linguist-generated` in the BASE ref's `.gitattributes` (so a
          PR can't exempt itself), and the canonical Go
          `// Code generated ... DO NOT EDIT.` marker — so you rarely need more.
          Because this classification decides what the review panel SEES, the
          Go marker is honored only from the BASE blob (same base-ref invariant
          as `.gitattributes`): a PR cannot hide a file from review by adding
          the marker, and a file NEW in the PR never matches it — cover newly
          generated files with a glob here or a base `.gitattributes` rule.
          Supplying this input REPLACES the default list wholesale, so restate
          the defaults you still want: a repo whose `.claude/` tree is
          vendored/tool-installed output (a BMAD-method install, say) rather
          than hand-authored agent instructions should pass the defaults plus
          its own `**/.claude/**` glob — hand-authored agent instructions are
          prose worth reviewing, so the default no longer excludes them. Until
          such a repo does, that tree counts against `diff_size_cap`, and a PR
          over the cap is skipped silently (no review, no Slack notice).
        type: string
        required: false
        default: >-
          **/node_modules/**
          **/dist/**
          **/vendor/**
          **/*.generated.*
          **/*.min.js
          **/*.min.css
      extra_lockfiles:
        description: >-
          Extra dependency-lockfile base names to exclude (count + diff), on top
          of the classifier's built-ins (go.sum, go.work.sum, package-lock.json,
          pnpm-lock.yaml, yarn.lock, Cargo.lock, poetry.lock, uv.lock).
          Whitespace- or comma-separated; matched at any directory depth.
        type: string
        required: false
        default: ''
      diff_excludes:
        description: >-
          Additional git pathspecs excluded from the reviewed diff ONLY (not the
          size gate), applied verbatim ON TOP of the shared classifier's
          generated-file exclusion. Back-compat escape hatch for one-off paths
          that aren't "generated" per se; for generated/vendored paths prefer
          `extra_generated_globs`, which also keeps them out of the size gate.
          Folded scalar collapses newlines to spaces so the value word-splits
          into pathspec args. Paths with a leading underscore need the long-form
          `:(exclude)` syntax — the short-form `:!` parser reads `_` as pathspec
          magic. (Previously this fed both the count and the diff and defaulted
          to the lockfile/vendored list; that list now lives in the classifier
          and `extra_generated_globs`, so the default here is empty. Callers that
          listed generated paths here should move them to `extra_generated_globs`
          to keep them out of the size gate too.)
        type: string
        required: false
        default: ''
      workflows_ref:
        description: >-
          REQUIRED. Ref of Comfy-Org/github-workflows to load the prompts and
          scripts from. Must be the SAME commit SHA you pin `uses:` to —
          otherwise the workflow is pinned but the code it runs is not. There is
          deliberately no default: a floating `main` default would silently load
          mutable scripts into jobs that hold write permissions.
        type: string
        required: true
      bot_app_id:
        description: >-
          GitHub App ID. When set (with the bot_app_private_key secret), the
          consolidated review + per-finding line comments post under that App's
          identity (your App's "<app>[bot]" login) instead of
          github-actions[bot], so its threads are distinct and queryable.
          Optional — omit to post as github-actions[bot] (default; unchanged for
          OSS consumers). App IDs aren't secret, so this is an input, not a secret.
        type: string
        required: false
        default: ''
      ledger_prior_review:
        description: >-
          Give each review round the PRIOR rounds' findings and the author's
          replies (the "prior-review ledger"), so a finding that was refuted,
          declined, or deferred earlier is not silently re-litigated. Set false
          to disable the ledger — the kill switch for the case where it degrades
          reviews after rollout; flipping this input beats reverting SHA pins
          across every consumer. With it false the panel/judge prompts are
          exactly the pre-ledger ones. Default true.
        type: boolean
        required: false
        default: true
      run_without_label:
        description: >-
          Run on plain pull_request events (opened / reopened / ready_for_review
          / synchronize) instead of requiring the trigger label — for repos with
          no labeling automation. The fork skip, the skip-cursor-review label,
          and the same-commit dedupe all still apply. Default false
          (label-triggered, unchanged for existing callers).
        type: boolean
        required: false
        default: false
    secrets:
      CURSOR_API_KEY:
        description: Cursor API key for cursor-agent (the panel + judge models bill through it).
        required: true
      SLACK_BOT_TOKEN:
        description: Slack bot token for the start/complete DM notifications. Optional — DMs are skipped if absent.
        required: false
      BOT_APP_PRIVATE_KEY:
        description: PEM private key matching the bot_app_id input. Required only when bot_app_id is set.
        required: false

# DIFF_SIZE_CAP / REVIEW_LABEL / JUDGE_MODEL / DIFF_EXCLUDES are mapped from
# `inputs` here so the run steps below read them verbatim from the original
# (private-repo) workflow without per-step plumbing. `inputs` is available to
# workflow-level env in a called workflow; `secrets` is not (those stay in jobs).
env:
  DIFF_SIZE_CAP: ${{ inputs.diff_size_cap }}
  REVIEW_LABEL: ${{ inputs.review_label }}
  JUDGE_MODEL: ${{ inputs.judge_model }}
  DIFF_EXCLUDES: ${{ inputs.diff_excludes }}
  EXTRA_GENERATED_GLOBS: ${{ inputs.extra_generated_globs }}
  EXTRA_LOCKFILES: ${{ inputs.extra_lockfiles }}
  # Where the assets checkout lands (this repo, .github/cursor-review/*).
  CURSOR_REVIEW_ASSETS: ${{ github.workspace }}/_cursor_review_assets/.github/cursor-review
  # Cursor CLI pin — a versioned, checksummed artifact instead of the mutable
  # cursor.com/install script (BE-5869). Old versions stay downloadable, so a
  # Cursor release never breaks this; the pin moves only via a reviewed PR.
  # Consumed by .github/cursor-review/install-cursor-cli.sh, the ONE installer
  # all three CLI-using jobs run (preflight, review matrix, consolidate).
  CURSOR_CLI_VERSION: 2026.08.04-aaa8809
  # sha256 of the linux/x64 agent-cli-package.tar.gz (all jobs run ubuntu-latest).
  # Cross-checked against nixpkgs pkgs/by-name/cu/cursor-cli at pin time.
  CURSOR_CLI_SHA256: e282068dcb5cdd668b8ce2e3456c58be13bb64a834e1ad49f8534b5cd7aa2fe5

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      already_reviewed: ${{ steps.dup.outputs.already_reviewed }}
    steps:
      - name: Check trigger label
        id: check
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_EVENT_ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          RUN_WITHOUT_LABEL: ${{ inputs.run_without_label }}
        run: |
          # PRs from forks can't run this review. The pull_request event grants
          # fork PRs no access to secrets — so CURSOR_API_KEY is empty and every
          # panel cell produces empty output — and a read-only GITHUB_TOKEN, so
          # posting the consolidated review returns HTTP 403. The review can
          # neither analyze nor post, so skip cleanly instead of burning the
          # 8-cell matrix + judge and failing red on every external contribution.
          # (head.repo.full_name != github.repository is the cross-repo signal.)
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PR is from a fork ($HEAD_REPO != $BASE_REPO) — review needs secrets and write access a fork PR can't have. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # skip-cursor-review wins even if the trigger label is also present.
          if echo "$PR_LABELS" | jq -e 'index("skip-cursor-review")' > /dev/null; then
            echo "skip-cursor-review label present — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Label-free mode (run_without_label input): callers in repos with no
          # labeling automation opt in to running on plain PR events. Sits
          # BELOW the fork skip and skip-cursor-review checks — those still
          # veto — and the same-commit dedupe below still prevents re-reviews.
          if [ "$RUN_WITHOUT_LABEL" = "true" ]; then
            case "$GH_EVENT_ACTION" in
              opened|reopened|ready_for_review|synchronize)
                echo "run_without_label mode — running on '$GH_EVENT_ACTION'."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          # Only adding the trigger label fires the matrix. Removing it cancels
          # any in-progress run via the concurrency group and then no-ops here.
          if [ "$LABEL_NAME" = "$REVIEW_LABEL" ] && [ "$GH_EVENT_ACTION" = "labeled" ]; then
            echo "$REVIEW_LABEL label added — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Removing skip-cursor-review while the trigger label is present
          # unblocks a previously skipped review — treat it as a fresh trigger.
          if [ "$LABEL_NAME" = "skip-cursor-review" ] && [ "$GH_EVENT_ACTION" = "unlabeled" ]; then
            if echo "$PR_LABELS" | jq -e --arg l "$REVIEW_LABEL" 'index($l)' > /dev/null; then
              echo "skip-cursor-review removed while $REVIEW_LABEL is present — running."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Label '$LABEL_NAME' is not the trigger label — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Check for prior review on this commit
        id: dup
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Idempotency: skip the matrix if a Cursor Review consolidated
          # review already exists for this exact HEAD SHA. Protects against
          # label remove+re-add (or any other event-replay path) from
          # re-running the panel on unchanged content.
          #
          # Escape hatches:
          # - Push commits → new HEAD SHA, check finds nothing, runs.
          # - Dismiss the existing review → DISMISSED state filtered out
          #   below, so re-applying the label fires a fresh run.
          #
          # API failure falls through to running, not skipping — better to
          # double-review than silently no-op.
          EXISTING=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>/dev/null \
            | jq --arg sha "$HEAD_SHA" '[.[] | select(.commit_id == $sha and .state != "DISMISSED" and (.body | startswith("## 🔍 Cursor Review — Consolidated panel")))] | length' \
            2>/dev/null || echo 0)

          if [ "$EXISTING" -gt 0 ]; then
            echo "Already reviewed at $HEAD_SHA ($EXISTING existing review(s)) — skipping matrix."
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior review for $HEAD_SHA — proceeding."
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

  ledger:
    # Prior-review ledger: what earlier rounds already raised on THIS PR, and how
    # the author answered. Without it every round re-derives the PR from zero, so
    # a finding refuted/declined/deferred in round 1 comes back in rounds 2 and 3
    # and the author hand-writes the same rebuttal again. A dedupe filter can't
    # fix that — the judge rewrites each finding's prose every round, so a true
    # repeat pair scores LOWER on text similarity than two unrelated findings on
    # the same file. The prior context has to enter the prompt.
    #
    # One fetch, nine consumers: the 8 review cells and consolidate all download
    # the `cursor-review-ledger` artifact this job publishes.
    #
    # This job must never fail the run — the review matrix `needs:` it, so a hard
    # failure here would skip the whole panel. Every step is continue-on-error
    # and a fallback guarantees the artifact exists, degrading to status=unknown
    # (which is reported, never silently reported as `empty`).
    name: Prior-review ledger
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    # Deliberately longer than the per-step timeouts below: a hung step must
    # trip its OWN timeout (which continue-on-error absorbs) rather than the
    # job's, because a FAILED job here would skip the entire review matrix.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.build.outputs.status || steps.fallback.outputs.status }}
      rounds: ${{ steps.build.outputs.rounds || steps.fallback.outputs.rounds }}
      last_reviewed_sha: ${{ steps.build.outputs.last_reviewed_sha }}
    steps:
      - name: Load cursor-review assets
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@v6
        with:
          repository: Comfy-Org/github-workflows
          # This job must never fail (see the job comment), so an empty-ref
          # guard that exits non-zero is not an option here. Fall back to the
          # exact commit THIS reusable workflow was resolved from
          # (github.job_workflow_sha, same pattern as groom.yml/BE-4169)
          # instead: an omitted workflows_ref still pins to an immutable SHA,
          # never to this repo's moving default branch.
          ref: ${{ inputs.workflows_ref || github.job_workflow_sha }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Build prior-review ledger
        id: build
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LEDGER_ENABLED: ${{ inputs.ledger_prior_review }}
        run: |
          mkdir -p /tmp/ledger
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" build \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --pr-author "$PR_AUTHOR" \
            --out-dir /tmp/ledger \
            --enabled "$LEDGER_ENABLED"

      - name: Ensure ledger artifact exists
        id: fallback
        if: always()
        run: |
          # The build step handles its own fetch failures (status=unknown). This
          # covers the harder failure — the checkout or the interpreter itself
          # died — so the downstream download always finds a well-formed ledger
          # and the review body still tells the reader context was missing.
          mkdir -p /tmp/ledger
          if [ -f /tmp/ledger/ledger.json ]; then
            exit 0
          fi
          echo '{"status": "unknown", "rounds": 0, "total_rounds": 0, "entries": [], "entry_count": 0, "unanswered_count": 0, "failed_call": "ledger job", "reason": "the ledger step did not produce an output file (see the job log)"}' > /tmp/ledger/ledger.json
          : > /tmp/ledger/ledger.md
          : > /tmp/ledger/ledger-judge.md
          printf '%s' "⚠️ prior-review context unavailable (ledger job: the ledger step did not produce an output file) — findings may repeat earlier rounds." > /tmp/ledger/ledger-note.txt
          {
            echo "status=unknown"
            echo "rounds=0"
          } >> "$GITHUB_OUTPUT"
          echo "::warning::Prior-review ledger step produced no output — running without prior-round context."

      - name: Upload ledger artifact
        if: always()
        # continue-on-error like every other step in this job, for the reason in
        # the job comment: `review` needs this job and has no always() guard, and
        # `consolidate` then drops out on `needs.review.result != 'skipped'`. An
        # artifact-upload hiccup failing THIS job would therefore post no review
        # at all — strictly worse than the degraded path, where the panel simply
        # runs without prior context and the review body says so (the consumers
        # of the artifact all download it continue-on-error, and consolidate
        # emits the unavailable banner when the file does not arrive).
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: cursor-review-ledger
          path: /tmp/ledger
          if-no-files-found: error
          retention-days: 7

  diff-size:
    name: Diff size check
    # Needs `ledger` (not just `gate`) so it can build the incremental
    # "hunks new since the last reviewed round" diff here too, alongside the
    # main reviewed diff — one checkout, one artifact, instead of every panel
    # cell (plus consolidate) re-deriving it from its own PR checkout.
    needs: [gate, ledger]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # within_cap is derived from the shared check-pr-size tool's `over_cap`
    # output: counted = non-generated changed lines (minus any comment/blank
    # discount), compared against the review cap passed as --max. Failure
    # handling is explicit and two-tier (see the classify step): a git-level
    # failure fails THIS JOB — fail closed, no review — while a tool-level
    # failure falls back to the RAW changed-line count with no exclusions
    # (strictly >= the classified count), so a degraded run can still review a
    # small PR but can never feed an unbounded diff to the panel.
    outputs:
      within_cap: ${{ steps.check.outputs.over_cap != 'true' }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE...HEAD three-dot diff resolves and the
          # tool's base-ref reads (linguist-generated via `check-attr --source`,
          # deleted-file blob fallbacks) work without a separate fetch.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load check-pr-size tool
        # The SAME classifier the PR-size cap uses — the single source of truth
        # for "what is codegen". Comes from THIS repo (public, pinned via
        # workflows_ref), never the PR checkout, so a malicious PR can't rewrite
        # the logic that decides which of its files skip review.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _pr_size_tool
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version-file: _pr_size_tool/scripts/check-pr-size/go.mod
          # Dependency-free module (no go.sum) — nothing to cache.
          cache: false

      - name: Build check-pr-size
        env:
          # See pr-size.yml: the tool is checked out UNDER the consumer repo's
          # checkout, so a root go.work would otherwise refuse the build. The
          # tool is dependency-free; disable workspace mode and build standalone.
          # Quoted "off" — unquoted off is coerced to GOWORK=false by the Actions
          # YAML parser, which Go then rejects as a bad workspace-file path.
          GOWORK: "off"
        run: |
          # Drop anything the PR checkout could have pre-seeded under the tool
          # path so the build compiles only the pinned sources.
          git -C _pr_size_tool clean -ffdx
          (cd _pr_size_tool/scripts/check-pr-size && go build -o "${RUNNER_TEMP}/check-pr-size" .)

      - name: Classify generated files, check size, and build reviewed diff
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Read by the tool's --ignore-comments default: discount blank/comment
          # lines from the counted total (count-only; the reviewed diff keeps them).
          PR_SIZE_IGNORE_COMMENTS: ${{ inputs.ignore_comments }}
        run: |
          # Reuse the PR-size classifier as the single source of truth. --max is
          # THIS review's cap (DIFF_SIZE_CAP), so the tool's `over_cap` output
          # means "non-generated changed lines exceed the review cap" — exactly
          # the gate we want. --mode warn: the tool never exits non-zero on
          # overage (this workflow gates via within_cap, not the tool's own
          # pass/fail). The same run writes the reviewed diff (the PR's patch
          # with every generated file's section filtered out, minus any caller
          # diff_excludes pathspecs) to --reviewed-diff-out, so classification
          # happens ONCE and the count and the reviewed diff can never disagree.
          # Filtering the patch — instead of expanding one exclude pathspec per
          # generated file onto argv — means an unbounded number of generated
          # files (they cost nothing against the cap) can't overflow ARG_MAX.
          #
          # --marker-from-base: this classification decides what a (potentially
          # blocking) review SEES, so the Go generated marker is honored only
          # from the BASE blob — a PR can't hide hand-written code from the
          # panel by prepending the one-line marker. Matches the base-ref
          # invariant the linguist-generated attribute path already enforces.
          #
          # Failure handling is two-tier, both explicit:
          #   - git-level breakage (bad ref, missing history): the fallback
          #     `git diff --numstat` below dies under `set -e` and FAILS this
          #     job — fail closed, a loud red X, never a silent skip.
          #   - tool-level failure (classifier bug, patch-write error): fall
          #     back to the RAW changed-line count with no exclusions —
          #     strictly >= the classified count, so a degraded run still
          #     reviews a small PR but can never feed an unbounded diff to the
          #     eight panel jobs. The next step rebuilds the diff with
          #     diff_excludes only (the pre-classifier behavior).
          rc=0
          "${RUNNER_TEMP}/check-pr-size" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --max "${DIFF_SIZE_CAP}" \
            --mode warn \
            --marker-from-base \
            --extra-generated-globs "${EXTRA_GENERATED_GLOBS}" \
            --extra-lockfiles "${EXTRA_LOCKFILES}" \
            --diff-excludes "${DIFF_EXCLUDES}" \
            --reviewed-diff-out "${RUNNER_TEMP}/pr-diff.patch" || rc=$?
          if [ "$rc" -eq 0 ]; then
            if [ -f "${RUNNER_TEMP}/pr-diff.patch" ]; then
              echo "Reviewed diff size: $(wc -l < "${RUNNER_TEMP}/pr-diff.patch") lines"
            fi
          else
            echo "::warning::check-pr-size exited ${rc} — gating on the raw line count and reviewing with no generated-file exclusions (diff_excludes still apply)."
            rm -f "${RUNNER_TEMP}/pr-diff.patch"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            # Raw-count gate: no exclusions, so always >= the classified count.
            # Appended after any over_cap the tool already wrote — the last
            # value wins, so a raw overage can only tighten the gate. The
            # numstat runs as its own statement (not inside a pipeline, whose
            # exit status `set -e` would ignore) so git-level breakage fails
            # the job here (fail closed, above).
            git diff --numstat "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/raw-numstat"
            RAW=$(awk '{ if ($1 != "-") total += $1; if ($2 != "-") total += $2 } END { print total + 0 }' "${RUNNER_TEMP}/raw-numstat")
            echo "Raw changed lines (no exclusions): ${RAW} (cap: ${DIFF_SIZE_CAP})"
            if [ "${RAW}" -gt "${DIFF_SIZE_CAP}" ]; then
              echo "over_cap=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build reviewed diff (degraded fallback)
        # Only when the classifier tool failed but the raw count is within the
        # cap: no generated-file exclusions are available, so build the diff
        # with just the caller's diff_excludes (the pre-classifier behavior).
        # The raw-count gate above already bounded this diff's size.
        if: steps.check.outputs.over_cap != 'true' && steps.check.outputs.degraded == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # $DIFF_EXCLUDES is intentionally unquoted so bash word-splits it into
          # pathspec args.
          # shellcheck disable=SC2086
          git diff "${BASE_SHA}...${HEAD_SHA}" -- . $DIFF_EXCLUDES \
            > "${RUNNER_TEMP}/pr-diff.patch"
          echo "Reviewed diff size: $(wc -l < "${RUNNER_TEMP}/pr-diff.patch") lines"

      - name: Build incremental diff since last review
        # The subset of the reviewed diff that changed since the last reviewed
        # round — PRIORITIZATION, not narrowing, the full diff above stays the
        # primary input; this just tells the panel where to spend budget. Built
        # here (this job already holds the fetch-depth:0 checkout) so it can
        # ride the same shared artifact instead of every consumer re-deriving it.
        # Best-effort: an unresolvable SHA (force-push, base-branch rewrite)
        # simply produces no incremental block.
        if: steps.check.outputs.over_cap != 'true'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAST_REVIEWED_SHA: ${{ needs.ledger.outputs.last_reviewed_sha }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          : > "${RUNNER_TEMP}/pr-diff-new.patch"
          if [ -n "$LAST_REVIEWED_SHA" ] && [ "$LAST_REVIEWED_SHA" != "$HEAD_SHA" ] \
             && git cat-file -e "${LAST_REVIEWED_SHA}^{commit}" 2>/dev/null; then
            # shellcheck disable=SC2086
            git diff "${LAST_REVIEWED_SHA}...${HEAD_SHA}" -- . $DIFF_EXCLUDES \
              > "${RUNNER_TEMP}/pr-diff-new.patch" || : > "${RUNNER_TEMP}/pr-diff-new.patch"
            echo "Incremental diff since round ${LEDGER_ROUNDS:-?} (${LAST_REVIEWED_SHA}): $(wc -l < "${RUNNER_TEMP}/pr-diff-new.patch") lines"
          else
            echo "No usable last-reviewed SHA — skipping the incremental diff block."
          fi

      - name: Upload reviewed diff
        # Shared with the panel cells + judge so the diff is generated ONCE, and
        # those jobs need no PR checkout of their own.
        if: steps.check.outputs.over_cap != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr-diff
          path: |
            ${{ runner.temp }}/pr-diff.patch
            ${{ runner.temp }}/pr-diff-new.patch
          if-no-files-found: error
          retention-days: 7

  preflight:
    # Validate the panel's pinned model ids against the LIVE Cursor catalog
    # once, before the 8-cell fan-out. When Cursor delists a pinned id the
    # per-cell `cursor-agent --model <id>` call fails with 0 bytes of stdout,
    # which downstream reads as an `empty` cell — indistinguishable from "the
    # model ran and found nothing", so the panel silently runs a lab short for
    # weeks. Failing here turns that drift into a loud, visible job failure on
    # the very next run. This job is ALSO the single source of truth for the
    # matrix model list (emitted as an output the `review` matrix consumes), so
    # the validated list and the reviewed list can never drift apart.
    name: Preflight — validate model catalog
    needs: [gate, diff-size]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      models: ${{ steps.models.outputs.models }}
    steps:
      - name: Define panel models
        id: models
        # Single source of truth for the per-lab model pins. The `review`
        # matrix consumes this list via fromJSON, and the catalog check below
        # validates every entry — so a bump only ever touches this one list.
        # Keep in sync with the README model table.
        #
        # Pinned to each lab's newest highest-reasoning tier in Cursor's
        # catalog (last checked 2026-07-28). OpenAI: GPT-5.6 Sol is the
        # 5.6-family coding flagship (Luna is the cost tier, Terra mid; the
        # Codex line stops at 5.3). Anthropic: Fable 5 tops the catalog but
        # all Fable entries are marked NO ZDR in Cursor, and this panel
        # reviews private-repo diffs, so it is excluded; Opus 5 thinking at
        # its max tier is ZDR-eligible (confirmed against the live catalog —
        # no NO-ZDR marker, see PR BE-4818 for the run link) and replaces
        # Opus 4.8 at identical per-token pricing. Gemini: 3.1 Pro is still
        # the only Pro-line entry (3.5/3.6 are Flash tier). Moonshot: Kimi K3
        # (max tier) supersedes K2.7 Code; no NO-ZDR marker in the catalog
        # (same evidentiary bar as every other pin), ~3.2x/3.75x the
        # per-token cost of K2.7 on this lab's two panel cells (~+10-15%
        # total panel cost per PR).
        run: |
          cat > /tmp/models.json <<'JSON'
          [
            "gpt-5.6-sol-max",
            "claude-opus-5-thinking-max",
            "gemini-3.1-pro",
            "kimi-k3-max"
          ]
          JSON
          echo "models=$(jq -c . /tmp/models.json)" >> "$GITHUB_OUTPUT"

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load cursor-review assets
        # Same trusted-assets checkout the review/consolidate jobs do — this
        # job needs it for install-cursor-cli.sh.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Install Cursor agent CLI
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # Fork PRs (and any run without the secret) get no CURSOR_API_KEY, so
          # `cursor-agent models` can't authenticate. Skip cleanly — matches the
          # gate's fork handling, which already sets should_run=false for forks.
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "No CURSOR_API_KEY (fork PR or unset secret) — skipping catalog preflight."
            exit 0
          fi
          bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Validate model pins against live catalog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "No CURSOR_API_KEY — skipping catalog preflight (matches fork handling)."
            exit 0
          fi

          # Capture the live catalog. A failure here (auth/network) is itself a
          # hard fail — better red than a silently degraded panel.
          if ! cursor-agent models > /tmp/catalog.txt 2>/tmp/catalog-stderr.txt; then
            echo "::error::'cursor-agent models' failed — cannot verify the panel model pins."
            cat /tmp/catalog-stderr.txt
            exit 1
          fi
          echo "=== Cursor catalog ==="
          cat /tmp/catalog.txt

          python3 - <<'PY'
          import json
          import re
          import sys

          with open("/tmp/models.json", encoding="utf-8") as f:
              pins = json.load(f)
          with open("/tmp/catalog.txt", encoding="utf-8") as f:
              catalog_raw = f.read()

          catalog_lines = [ln.strip() for ln in catalog_raw.splitlines() if ln.strip()]

          def present(model_id):
              # Match the id as a whole token so `kimi-k2.5` doesn't match inside
              # `kimi-k2.55`; ids contain `.`/`-`, so bound on those too.
              pattern = r"(?<![\w.-])" + re.escape(model_id) + r"(?![\w.-])"
              return re.search(pattern, catalog_raw) is not None

          missing = [m for m in pins if not present(m)]
          if not missing:
              print("All pinned models present in the Cursor catalog:")
              for m in pins:
                  print(f"  - {m}")
              sys.exit(0)

          print(f"::error::Cursor catalog is missing pinned model id(s): {', '.join(missing)}")
          for m in missing:
              lab = re.split(r"[-.]", m, maxsplit=1)[0]
              hints = sorted({ln for ln in catalog_lines if lab.lower() in ln.lower()})
              hint = ", ".join(hints) if hints else "(no same-lab id found)"
              print(f"  - {m}: closest available for lab '{lab}': {hint}")
          print(
              "Update the pin in the preflight 'Define panel models' step (and the "
              "README model table) to a current catalog id."
          )
          sys.exit(1)
          PY

  review:
    # Each cell produces a findings artifact. No cell posts a review —
    # consolidate adjudicates the panel and posts ONE review at the end.
    name: '${{ matrix.review_type }} (${{ matrix.model }})'
    # `preflight` gates the fan-out: if a pinned model is delisted it fails
    # there, and this job is skipped instead of quietly running a lab short.
    needs: [gate, diff-size, preflight, ledger]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Model list comes from the preflight job (single source of truth); it
        # is validated against the live catalog there.
        model: ${{ fromJSON(needs.preflight.outputs.models) }}
        review_type: [adversarial, edge-case]
    steps:
      - name: Seed default findings artifact
        # Pre-seed a minimal artifact tagged status=error so this cell
        # ALWAYS shows up in the panel summary, even if a later step
        # (checkout, Cursor install, prompt build, extract) fails. The
        # `Extract findings` step overwrites this on success. Without
        # this, an early-failing cell silently disappears from the panel
        # and the consolidated review undercounts the matrix.
        env:
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          mkdir -p /tmp/findings-out
          python3 - <<'PY'
          import json, os
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "status": "error",
              "error": "Cell did not reach the extraction step.",
              "findings": [],
          }
          with open("/tmp/findings-out/findings.json", "w", encoding="utf-8") as f:
              json.dump(record, f)
          PY

      - name: Checkout PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load cursor-review assets
        # Trusted prompts/scripts come from THIS workflow's repo (public,
        # pinned via workflows_ref) — never from the PR checkout, so a
        # malicious PR can't rewrite the prompt to exfiltrate the diff or
        # smuggle instructions to the model.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # The generated-file-excluded diff (plus the incremental "hunks new
        # since the last reviewed round" diff) is built ONCE in the diff-size
        # job and shared here, so this cell needs no PR checkout of its own —
        # the only PR-authored content it ever sees is the diff text it reviews.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pr-diff
          path: /tmp

      - name: Download prior-review ledger
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Install Cursor agent CLI
        run: bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Verify Cursor agent version
        # The installer already asserts this once. Re-asserted here, on the
        # PATH-resolved binary immediately before the review runs, so a swap
        # between install and use (a CLI self-update, a stale symlink) can't
        # quietly hand the review to unpinned bits — and the version still
        # lands in the log for forensics.
        run: |
          installed="$(cursor-agent --version)"
          if [ "$installed" != "$CURSOR_CLI_VERSION" ]; then
            echo "::error::cursor-agent reports '${installed}', expected the pinned '${CURSOR_CLI_VERSION}'."
            exit 1
          fi
          echo "cursor-agent ${installed} (matches CURSOR_CLI_VERSION)."

      - name: Build prompt
        env:
          REVIEW_TYPE: ${{ matrix.review_type }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          # Splice the prior-review ledger in AFTER the static instructions and
          # BEFORE the diff. With no ledger (first round, kill switch off, or a
          # failed fetch) the spliced prompt is BYTE-IDENTICAL to the prompt file
          # — that is the no-regression property this whole feature rests on.
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-${REVIEW_TYPE}.md" \
            --marker '=== BEGIN DIFF ===' \
            --insert /tmp/ledger/ledger.md \
            --out /tmp/prompt-head.txt

          {
            cat /tmp/prompt-head.txt
            cat /tmp/pr-diff.patch
            echo ""
            echo "=== END DIFF ==="
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              echo "=== HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?} ==="
              echo "The subset of the diff above that changed since the last reviewed"
              echo "commit. Prioritize it — but the full diff above is still in scope."
              cat /tmp/pr-diff-new.patch
              echo ""
              echo "=== END HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?} ==="
            fi
          } > /tmp/prompt.txt

          echo "Prompt size: $(wc -c < /tmp/prompt.txt) bytes"

      - name: Run cursor review
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ matrix.model }}
        run: |
          # --sandbox is intentionally omitted. The hosted runner is already
          # an ephemeral VM, so the agent's AppArmor sandbox doesn't add
          # protection — and as of cursor-agent 2026.05.05 it fails to start
          # on ubuntu-latest, producing empty output.
          #
          # Capture the exit code instead of swallowing it with `|| true`: a
          # delisted/unavailable model exits non-zero with empty stdout, and
          # the extract step uses the code + stderr to tag the cell `error`
          # (loud) rather than `empty` (silent). The `&& ... || ...` idiom
          # records the code without tripping the shell's `set -e`.
          cursor-agent \
            --print \
            --trust \
            --model "$MODEL" \
            < /tmp/prompt.txt \
            > /tmp/review-raw.txt 2>/tmp/review-stderr.txt \
            && CURSOR_EXIT=0 || CURSOR_EXIT=$?
          echo "$CURSOR_EXIT" > /tmp/review-exit-code
          echo "cursor-agent exit code: $CURSOR_EXIT"

          echo "=== Raw output (first 500 chars) ==="
          head -c 500 /tmp/review-raw.txt
          echo ""
          echo "=== Stderr ==="
          cat /tmp/review-stderr.txt

      - name: Extract findings
        if: always()
        env:
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          mkdir -p /tmp/findings-out
          # Pass the run's exit code + stderr so a delisted-model failure is
          # classified `error`, not `empty`. Both are best-effort: a blank
          # exit code (run step skipped) reads as "unknown", and a missing
          # stderr file is tolerated by extract-findings.py.
          CURSOR_EXIT="$(cat /tmp/review-exit-code 2>/dev/null || true)"
          python3 "$CURSOR_REVIEW_ASSETS/extract-findings.py" \
            --raw /tmp/review-raw.txt \
            --out /tmp/findings-out/findings.json \
            --model "$MODEL" \
            --review-type "$REVIEW_TYPE" \
            --exit-code "$CURSOR_EXIT" \
            --stderr /tmp/review-stderr.txt

          echo "=== Extracted findings ==="
          cat /tmp/findings-out/findings.json
          echo ""

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-${{ matrix.review_type }}-${{ matrix.model }}
          path: /tmp/findings-out/findings.json
          if-no-files-found: error
          retention-days: 7

  consolidate:
    # Adjudicates the 8 cell artifacts into one consolidated review.
    # Calls cursor-agent one more time as the judge, with prompt-judge.md.
    name: Consolidate panel
    needs: [gate, diff-size, review, ledger]
    if: always() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # Same generated-file-excluded diff (plus the incremental "hunks new
        # since the last reviewed round" diff) the panel reviewed, built once
        # in diff-size — so the judge adjudicates against exactly what the
        # panel saw, and this job needs no PR checkout.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Install Cursor agent CLI
        run: bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Download prior-review ledger
        id: ledger_download
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Download panel findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/panel
          pattern: findings-*

      - name: Aggregate panel findings
        id: aggregate
        run: |
          # Each artifact directory contains one findings.json. Combine into
          # a single panel.json array preserving cell metadata.
          python3 - <<'PY'
          import json, os, glob

          panel = []
          for path in sorted(glob.glob("/tmp/panel/findings-*/findings.json")):
              with open(path, encoding="utf-8") as f:
                  panel.append(json.load(f))

          with open("/tmp/panel.json", "w", encoding="utf-8") as f:
              json.dump(panel, f, indent=2)

          ok = sum(1 for c in panel if c.get("status") == "ok")
          print(f"Panel: {ok}/{len(panel)} cells contributed findings.")

          # Emit metadata for the next step to gate on.
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"ok_count={ok}\n")
              g.write(f"total={len(panel)}\n")
          PY

      - name: Build judge prompt
        if: steps.aggregate.outputs.ok_count != '0'
        env:
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          # The judge is the repeat-policy enforcement point, so it gets the
          # judge-flavored ledger block (repeat_of requirement + the per-review
          # repeat cap). Byte-identical to the old prompt when there's no ledger.
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-judge.md" \
            --marker '=== BEGIN PANEL FINDINGS ===' \
            --insert /tmp/ledger/ledger-judge.md \
            --out /tmp/judge-prompt-head.txt

          {
            cat /tmp/judge-prompt-head.txt
            cat /tmp/panel.json
            echo ""
            echo "=== END PANEL FINDINGS ==="
            echo ""
            echo "=== BEGIN DIFF ==="
            cat /tmp/pr-diff.patch
            echo ""
            echo "=== END DIFF ==="
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              echo "=== HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?} ==="
              cat /tmp/pr-diff-new.patch
              echo ""
              echo "=== END HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?} ==="
            fi
          } > /tmp/judge-prompt.txt

          echo "Judge prompt size: $(wc -c < /tmp/judge-prompt.txt) bytes"

      - name: Run judge
        if: steps.aggregate.outputs.ok_count != '0'
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          run_judge() {
            cursor-agent \
              --print \
              --trust \
              --model "$JUDGE_MODEL" \
              < "$1" \
              > /tmp/judge-raw.txt 2>/tmp/judge-stderr.txt || true
          }

          run_judge /tmp/judge-prompt.txt

          echo "=== Judge raw output (first 1000 chars) ==="
          head -c 1000 /tmp/judge-raw.txt
          echo ""
          echo "=== Judge stderr ==="
          cat /tmp/judge-stderr.txt

          # LLMs intermittently wrap the findings array in prose. extract-findings.py
          # recovers most of that (fenced block / embedded brace-match), but if it
          # still can't parse, retry the judge ONCE with a terse strict-JSON
          # reminder appended — a single retry clears the large majority of these
          # transient parse failures. The retry overwrites /tmp/judge-raw.txt, so
          # the parse step below reads whichever attempt the judge last produced.
          python3 "$CURSOR_REVIEW_ASSETS/extract-findings.py" \
            --raw /tmp/judge-raw.txt \
            --out /tmp/judge-probe.json \
            --model "$JUDGE_MODEL" \
            --review-type judge
          PROBE_STATUS=$(python3 -c "import json; print(json.load(open('/tmp/judge-probe.json')).get('status','?'))")

          if [ "$PROBE_STATUS" != "ok" ]; then
            echo "Judge output did not parse (status=$PROBE_STATUS) — retrying once with a strict-JSON reminder."
            {
              cat /tmp/judge-prompt.txt
              echo ""
              echo "=== REMINDER ==="
              echo "Your previous response could not be parsed as JSON. Return ONLY the JSON array of findings — no prose, no explanation, no markdown code fences. Your entire response must be a single JSON array (return [] if there are no findings). You have no shell, filesystem, or web tools here, so do not narrate attempts to use them or your verification reasoning; emit only the array."
            } > /tmp/judge-prompt-retry.txt
            run_judge /tmp/judge-prompt-retry.txt
            echo "=== Judge retry raw output (first 1000 chars) ==="
            head -c 1000 /tmp/judge-raw.txt
            echo ""
            echo "=== Judge retry stderr ==="
            cat /tmp/judge-stderr.txt
          fi

      - name: Build consolidated findings file
        id: consolidated
        env:
          OK_COUNT: ${{ steps.aggregate.outputs.ok_count }}
        run: |
          # If at least one cell produced findings, parse the judge output
          # into a findings file. Otherwise short-circuit — post-review.py
          # will render a "no contributors" review with the panel summary.
          if [ "$OK_COUNT" = "0" ]; then
            echo "No panel cells contributed findings — skipping judge parse."
            echo '{"status": "ok", "findings": []}' > /tmp/judge-findings.json
          else
            python3 "$CURSOR_REVIEW_ASSETS/extract-findings.py" \
              --raw /tmp/judge-raw.txt \
              --out /tmp/judge-findings.json \
              --model "$JUDGE_MODEL" \
              --review-type judge
          fi

          # If the judge errored or its output couldn't be parsed, surface
          # that to the next step so we post an honest error review rather
          # than silently claiming "no findings" when the panel did produce
          # content.
          JUDGE_STATUS=$(python3 -c "import json,sys; print(json.load(open('/tmp/judge-findings.json')).get('status','?'))")
          echo "Judge status: $JUDGE_STATUS"
          echo "judge_status=$JUDGE_STATUS" >> "$GITHUB_OUTPUT"

          # Combine judge findings with panel metadata (model, review_type,
          # status only — drop full per-cell findings to keep the post payload
          # small) for the post-review script. If the judge FAILED (still no
          # parseable verdict after the retry), fall back to the raw per-cell
          # findings so the run surfaces what the panel found instead of a bare
          # "Review failed".
          python3 - <<'PY'
          import json, os

          with open("/tmp/panel.json", encoding="utf-8") as f:
              panel = json.load(f)
          panel_meta = [
              {"model": c.get("model"), "review_type": c.get("review_type"), "status": c.get("status")}
              for c in panel
          ]
          with open("/tmp/judge-findings.json", encoding="utf-8") as f:
              judge = json.load(f)

          degraded = judge.get("status") != "ok"
          if not degraded:
              findings = judge.get("findings") or []
          else:
              # Judge unusable — union the per-cell findings, deduping identical
              # (file, line, body) across cells to cut the obvious cross-cell
              # repetition the judge would normally collapse.
              seen, findings = set(), []
              for cell in panel:
                  if cell.get("status") != "ok":
                      continue
                  for fnd in cell.get("findings") or []:
                      if not isinstance(fnd, dict):
                          continue
                      key = (fnd.get("file"), fnd.get("line"), fnd.get("body"))
                      if key in seen:
                          continue
                      seen.add(key)
                      findings.append(fnd)

          consolidated = {"findings": findings, "panel": panel_meta}
          with open("/tmp/consolidated.json", "w", encoding="utf-8") as f:
              json.dump(consolidated, f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"consolidated_count={len(findings)}\n")
              g.write(f"degraded={'true' if degraded else 'false'}\n")
          print(
              f"Consolidated: {len(findings)} finding(s) "
              f"({'degraded panel fallback' if degraded else 'judge-adjudicated'}), "
              f"{len(panel_meta)} panel cells."
          )
          PY

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
        run: |
          # github.actor on pull_request.labeled is the user who applied the
          # label — but when the auto-labeler workflow applies it via a bot
          # App token, github.actor becomes "<app>[bot]" and the human who
          # actually triggered the chain (by assigning themselves) is lost.
          # Recover them by falling back to the PR's first assignee whenever
          # the actor is a bot.
          if [[ "$GH_ACTOR" == *"[bot]" ]]; then
            FALLBACK=$(echo "$PR_ASSIGNEES" | jq -r '.[0] // empty')
            if [ -n "$FALLBACK" ]; then
              echo "Actor $GH_ACTOR is a bot — using assignee '$FALLBACK' for attribution."
              echo "triggered_by=$FALLBACK" >> "$GITHUB_OUTPUT"
            else
              echo "Actor $GH_ACTOR is a bot and no assignee found — keeping bot attribution."
              echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint bot-identity token (optional)
        id: bot_token
        if: ${{ inputs.bot_app_id != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post review
        env:
          # Dedicated bot identity when configured (bot_app_id), else github-actions[bot].
          GH_TOKEN: ${{ steps.bot_token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGERED_BY: ${{ steps.triggerer.outputs.triggered_by }}
          JUDGE_STATUS: ${{ steps.consolidated.outputs.judge_status }}
          CONSOLIDATED_COUNT: ${{ steps.consolidated.outputs.consolidated_count }}
          LEDGER_STATUS: ${{ needs.ledger.outputs.status }}
          LEDGER_DOWNLOAD: ${{ steps.ledger_download.outcome }}
        run: |
          # Prior-review ledger line for the review header: either the
          # round/ledger summary, or the "context unavailable" banner naming the
          # failed call. A guard that could not read its input SAYS SO — a
          # context-free re-review must never render identically to a genuine
          # first-round review.
          #
          # The DELIVERY of the ledger is checked separately from its CONTENT.
          # Both downloads are continue-on-error, so an upload or download that
          # failed leaves no ledger-note.txt while the ledger job still reports
          # status=ok — and the panel prompts were spliced with an EMPTY block.
          # Reading only LEDGER_STATUS there would emit no banner and the
          # context-free re-review would render as a genuine first round, the
          # exact partial failure the banner exists to catch. So: file ABSENT
          # (delivery failed) is a banner; file PRESENT but empty is a real
          # "nothing to say" (first round / kill switch / no prior findings).
          LEDGER_NOTE=""
          if [ "${LEDGER_DOWNLOAD:-failure}" != "success" ] || [ ! -f /tmp/ledger/ledger-note.txt ]; then
            LEDGER_NOTE="⚠️ prior-review context unavailable (ledger artifact did not reach the consolidate job: download=${LEDGER_DOWNLOAD:-missing}) — the panel ran without prior-round context, so findings may repeat earlier rounds."
          else
            LEDGER_NOTE="$(cat /tmp/ledger/ledger-note.txt)"
            if [ -z "$LEDGER_NOTE" ]; then
              case "${LEDGER_STATUS:-missing}" in
                ok|empty|disabled) ;;
                *)
                  LEDGER_NOTE="⚠️ prior-review context unavailable (ledger job: status=${LEDGER_STATUS:-missing}) — findings may repeat earlier rounds."
                  ;;
              esac
            fi
          fi

          # Three cases:
          # 1. Judge ok                       → normal consolidated review.
          # 2. Judge failed, panel has findings → post the raw per-cell findings
          #    with a notice banner (degraded, but NOT a bare "Review failed").
          # 3. Judge failed, no findings       → honest error review.
          if [ "$JUDGE_STATUS" = "ok" ]; then
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              --ledger-note "$LEDGER_NOTE"
          elif [ "${CONSOLIDATED_COUNT:-0}" != "0" ]; then
            JUDGE_ERROR=$(python3 -c "import json; print(json.load(open('/tmp/judge-findings.json')).get('error','(no error message)'))")
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              --ledger-note "$LEDGER_NOTE" \
              --notice "⚠️ The judge step could not produce a parseable verdict after a retry (status=${JUDGE_STATUS}). The findings below are the raw, un-adjudicated panel output — they may contain duplicates or false positives the judge would normally filter."
          else
            JUDGE_ERROR=$(python3 -c "import json; print(json.load(open('/tmp/judge-findings.json')).get('error','(no error message)'))")
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              --ledger-note "$LEDGER_NOTE" \
              --error-message "Judge call failed (status=${JUDGE_STATUS}): ${JUDGE_ERROR}"
          fi

  notify-start:
    name: Notify start
    needs: [gate, diff-size]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$GH_ACTOR" == *"[bot]" ]]; then
            ASSIGNEE=$(echo "$PR_ASSIGNEES" | jq -r '.[0] // empty')
            # Prefer PR author for DM routing — they opened the work and most want
            # the review status. Falls back to assignee, then empty (skips DM) if
            # the author is also a bot (e.g. Dependabot PRs).
            RESOLVED="${PR_AUTHOR:-${ASSIGNEE:-}}"
            if [[ "$RESOLVED" == *"[bot]" ]]; then RESOLVED=""; fi
            echo "triggered_by=$RESOLVED" >> "$GITHUB_OUTPUT"
          else
            echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
          fi

      - name: DM triggerer — review starting
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DM_GITHUB_USER: ${{ steps.triggerer.outputs.triggered_by }}
          # JSON GitHub-handle → email-prefix overrides, kept out of this public
          # repo. Set it as an org/repo Actions variable; absent = handle is used
          # as the email prefix verbatim.
          DM_EMAIL_MAP: ${{ vars.CURSOR_REVIEW_DM_EMAIL_MAP }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          chmod +x "$CURSOR_REVIEW_ASSETS/slack-notify.sh"
          MSG="*${PR_TITLE}*"$'\n'"${PR_URL}"$'\n'"8-cell panel running, then a judge consolidates."
          "$CURSOR_REVIEW_ASSETS/slack-notify.sh" \
            "warning" \
            "Cursor review starting" \
            "$MSG"

  notify-complete:
    name: Notify complete
    needs: [gate, diff-size, review, consolidate]
    if: always() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$GH_ACTOR" == *"[bot]" ]]; then
            ASSIGNEE=$(echo "$PR_ASSIGNEES" | jq -r '.[0] // empty')
            # Prefer PR author for DM routing — they opened the work and most want
            # the review status. Falls back to assignee, then empty (skips DM) if
            # the author is also a bot (e.g. Dependabot PRs).
            RESOLVED="${PR_AUTHOR:-${ASSIGNEE:-}}"
            if [[ "$RESOLVED" == *"[bot]" ]]; then RESOLVED=""; fi
            echo "triggered_by=$RESOLVED" >> "$GITHUB_OUTPUT"
          else
            echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
          fi

      - name: DM triggerer — review complete
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          DM_GITHUB_USER: ${{ steps.triggerer.outputs.triggered_by }}
          # See notify-start: JSON handle → email-prefix overrides, supplied as
          # an org/repo Actions variable so the roster stays out of this repo.
          DM_EMAIL_MAP: ${{ vars.CURSOR_REVIEW_DM_EMAIL_MAP }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          CONSOLIDATE_RESULT: ${{ needs.consolidate.result }}
        run: |
          chmod +x "$CURSOR_REVIEW_ASSETS/slack-notify.sh"
          if [ "$CONSOLIDATE_RESULT" = "success" ]; then
            STATUS="success"
            TITLE="Cursor review complete"
            DETAIL="One consolidated review is on the PR."
          else
            STATUS="warning"
            TITLE="Cursor review failed to post"
            DETAIL="Consolidate step did not succeed — see the run for details."
          fi
          MSG="*${PR_TITLE}*"$'\n'"${PR_URL}"$'\n'"${DETAIL}"
          "$CURSOR_REVIEW_ASSETS/slack-notify.sh" \
            "$STATUS" \
            "$TITLE" \
            "$MSG"

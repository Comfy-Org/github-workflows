            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}

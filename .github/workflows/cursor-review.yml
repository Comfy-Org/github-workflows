            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        # Trusted prompts/scripts come from THIS workflow's repo (public,
        # pinned via workflows_ref) — never from the PR checkout, so a
        # malicious PR can't rewrite the prompt to exfiltrate the diff or
        # smuggle instructions to the model.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # The generated-file-excluded diff (plus the incremental "hunks new
        # since the last reviewed round" diff) is built ONCE in the diff-size
        # job and shared here, so this cell needs no PR checkout of its own —
        # the only PR-authored content it ever sees is the diff text it reviews.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Download prior-review ledger
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Install Cursor agent CLI
        run: bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Verify Cursor agent version
        # The installer already asserts this once. Re-asserted here, on the
        # PATH-resolved binary immediately before the review runs, so a swap
        # between install and use (a CLI self-update, a stale symlink) can't
        # quietly hand the review to unpinned bits — and the version still
        # lands in the log for forensics.
        run: |
          installed="$(cursor-agent --version)"
          if [ "$installed" != "$CURSOR_CLI_VERSION" ]; then
            echo "::error::cursor-agent reports '${installed}', expected the pinned '${CURSOR_CLI_VERSION}'."
            exit 1
          fi
          echo "cursor-agent ${installed} (matches CURSOR_CLI_VERSION)."

      - name: Configure structured review output
        env:
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          python3 "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
            --mode reviewer \
            --out /tmp/findings-out/findings.json \
            --model "$MODEL" \
            --review-type "$REVIEW_TYPE" \
            --init

          rm -rf -- .cursor
          mkdir -m 700 .cursor
          python3 - <<'PY'
          import json, os, sys, tempfile

          if os.path.islink(".cursor"):
              raise SystemExit("Refusing to write Cursor config through a symlinked .cursor directory")

          config = {
              "mcpServers": {
                  "cursor-review-output": {
                      "type": "stdio",
                      "command": sys.executable,
                      "args": [
                          os.path.join(os.environ["CURSOR_REVIEW_ASSETS"], "review-output-mcp.py"),
                          "--mode", "reviewer",
                          "--out", "/tmp/findings-out/findings.json",
                          "--model", os.environ["MODEL"],
                          "--review-type", os.environ["REVIEW_TYPE"],
                      ],
                  }
              }
          }
          cli_config = {
              "permissions": {
                  "allow": [
                      "Mcp(cursor-review-output:cursor_review_record_finding)",
                      "Mcp(cursor-review-output:cursor_review_finish)",
                  ],
                  "deny": [],
              }
          }
          for filename, value in (("mcp.json", config), ("cli.json", cli_config)):
              fd, temporary = tempfile.mkstemp(dir=".cursor", prefix=f".{filename}-")
              with os.fdopen(fd, "w", encoding="utf-8") as output:
                  json.dump(value, output)
              os.replace(temporary, os.path.join(".cursor", filename))
          PY

      - name: Build prompt
        env:
          REVIEW_TYPE: ${{ matrix.review_type }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          # Splice the prior-review ledger in AFTER the static instructions and
          # BEFORE the diff. With no ledger (first round, kill switch off, or a
          # failed fetch) the spliced prompt is BYTE-IDENTICAL to the prompt file
          # — that is the no-regression property this whole feature rests on.
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-${REVIEW_TYPE}.md" \
            --marker '=== BEGIN DIFF ===' \
            --insert /tmp/ledger/ledger.md \
            --out /tmp/prompt-head.txt

          # The reviewed diff is `git diff BASE...HEAD` — attacker-authored PR
          # file bytes — spliced straight into this prompt, so static literal
          # fences are no control at all: the diff can contain the close fence.
          # The BEGIN/END markers carry an unguessable per-prompt nonce instead
          # (BE-7645), minted HERE, long after the head SHA the diff is built
          # from was fixed, so a PR cannot have written it into its own bytes.
          #
          # Minted into a SHELL variable, never a step `env:` entry and never a
          # job output: Actions prints a step's env map into the run log before
          # the script runs, and consumer run logs are public. Each of the 8
          # panel cells (and the judge) mints its own, so a nonce that does leak
          # — a model quoting a marker back in its printed output — cannot forge
          # a fence anywhere else.
          diff_nonce="$(python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" mint)"

          # The prompt files END with the bare `=== BEGIN DIFF ===` line, which
          # is also the splice --marker above, so it has to stay verbatim in the
          # .md. Drop it here and let fence-diff.py re-emit it carrying the
          # nonce, so the whole attacker-authored region — the diff AND the
          # incremental hunks — sits inside fences a PR cannot forge.
          # fence-diff.py copies the diff bytes through unchanged.
          python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" strip-marker \
            --file /tmp/prompt-head.txt \
            --marker '=== BEGIN DIFF ==='

          {
            cat /tmp/prompt-head.txt
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/pr-diff.patch --label DIFF --nonce "$diff_nonce"
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              # Guidance ABOUT the block stays OUTSIDE it: instructions to the
              # reviewer never share a fence with untrusted data. It names the
              # block BELOW it, since it now sits between two closed regions.
              echo "The block below is the subset of the diff above that changed since"
              echo "the last reviewed commit. Prioritize it — but the full diff above"
              echo "is still in scope."
              python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
                --body /tmp/pr-diff-new.patch \
                --label "HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?}" \
                --nonce "$diff_nonce"
            fi
          } > /tmp/prompt.txt

          echo "Prompt size: $(wc -c < /tmp/prompt.txt) bytes"

      - name: Run cursor review
        # Step cap (`cell_timeout_minutes`, default 15), absorbed by
        # continue-on-error (same idiom as the judge step): healthy cells finish
        # in 3-7 min and every cell's p90 is under 12 min, but a stalled agent —
        # almost always one that never reaches its MCP submission — used to run
        # to the JOB timeout, which GitHub reports as a cancelled job and a
        # cancelled run, and stretched the whole review past it. Killing the
        # step instead leaves the pre-seeded status=error artifact for the judge
        # to count as a non-contributing cell, exactly what the job timeout
        # produced, but a cap earlier and without CANCELLING the run. The job
        # cap is derived as this + 15, so that ordering holds at every value.
        #
        # The cap is what this `continue-on-error` absorbs, and that is all it
        # absorbs: the LEG is not green on this path. `Fail the leg when the
        # cell did not submit` reads the artifact back at the end of the job and
        # fails it deliberately, so a cell that never submitted is a red check in
        # the PR's rollup instead of a silent hole in the panel count. Keeping
        # the absorption HERE rather than dropping `continue-on-error` is what
        # lets the artifact upload still run, so the panel keeps consolidating.
        #
        # The cap is for cells that never submit. A cell that HAS submitted —
        # its findings.json parses and reads `status: ok` — is ended by
        # stop-on-submit.py within 30 seconds of the submission instead of
        # idling to the cap (some agents keep running after
        # `cursor_review_finish`). The wrapper only READS findings.json, so the
        # artifact is byte-for-byte what the MCP tool wrote; it exits 0 on that
        # path, and a cell that never reaches `status: ok` is not stopped, so
        # it still runs to this cap and fails its leg exactly as before.
        #
        # The wrapper also retries Cursor's own transient capacity error: an
        # agent that exits non-zero with `RetriableError: [resource_exhausted]`
        # (~25s in, before recording anything) is re-run after 30s, then 90s.
        # Only a cell with no recorded findings is re-run, and no retry starts
        # later than 300s in, so the last attempt still has all but ~5 min of
        # this cap for a full review — which is why the cap's floor is 10, not
        # lower. Each retry is a `::warning::` naming the cell; a
        # cell that exhausts them fails its leg exactly as before. A retry
        # re-reads the whole prompt because the wrapper rewinds its stdin, so
        # keep feeding it as `< /tmp/prompt.txt`: a pipe cannot be rewound,
        # and turns the retries off.
        continue-on-error: true
        timeout-minutes: ${{ inputs.cell_timeout_minutes }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          # --sandbox is intentionally omitted. The hosted runner is already
          # an ephemeral VM — and a `runs_on` pool must be one too: one job per
          # fresh pod, no cloud identity, no private-network reach (see the
          # input) — so the agent's AppArmor sandbox doesn't add
          # protection — and as of cursor-agent 2026.05.05 it fails to start
          # on ubuntu-latest, producing empty output.
          #
          # Capture the exit code without tripping the shell's `set -e`. If the
          # agent fails before finishing its MCP submission, the pre-seeded
          # structured artifact remains status=error. stop-on-submit.py writes
          # its own `stop-on-submit:` status lines into the stderr capture.
          #
          # The step cap and a run cancel signal THIS shell, which would die
          # without passing the signal on, leaving the wrapper and the agent's
          # own process group running past the step and still able to write
          # findings.json while the always() steps below read and upload it.
          # So the wrapper runs in the background with the signals forwarded,
          # and the shell waits it out (a trapped signal interrupts `wait`, so
          # keep waiting until the wrapper is actually gone, then collect its
          # real status).
          CURSOR_PID=
          CURSOR_SIGNALLED=
          forward_signal() {
            CURSOR_SIGNALLED=1
            if [ -n "$CURSOR_PID" ]; then kill "-$1" "$CURSOR_PID" 2>/dev/null || true; fi
          }
          trap 'forward_signal INT' INT
          trap 'forward_signal TERM' TERM
          trap 'forward_signal HUP' HUP
          python3 "$CURSOR_REVIEW_ASSETS/stop-on-submit.py" \
            --retry-delays 30,90 --retry-window 300 \
            --cell "$REVIEW_TYPE/$MODEL" \
            --findings /tmp/findings-out/findings.json -- \
            cursor-agent \
              --print \
              --trust \
              --approve-mcps \
              --model "$MODEL" \
            < /tmp/prompt.txt \
            > /tmp/review-raw.txt 2>/tmp/review-stderr.txt &
          CURSOR_PID=$!
          while kill -0 "$CURSOR_PID" 2>/dev/null; do
            wait "$CURSOR_PID" || true
          done
          wait "$CURSOR_PID" && CURSOR_EXIT=0 || CURSOR_EXIT=$?
          trap - INT TERM HUP
          echo "$CURSOR_EXIT" > /tmp/review-exit-code
          echo "cursor-agent exit code: $CURSOR_EXIT"

          echo "=== Raw output (first 500 chars) ==="
          head -c 500 /tmp/review-raw.txt
          echo ""
          echo "=== Stderr ==="
          cat /tmp/review-stderr.txt
          # A signalled step still fails as one, as it did before the wrapper.
          if [ -n "$CURSOR_SIGNALLED" ]; then exit "$CURSOR_EXIT"; fi

      - name: Show structured findings
        if: always()
        run: |
          echo "=== Structured findings ==="
          cat /tmp/findings-out/findings.json
          echo ""

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-${{ matrix.review_type }}-${{ matrix.model }}
          path: /tmp/findings-out/findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail the leg when the cell did not submit
        # Panel integrity has to be readable from the CHECK-RUN ROLLUP, not only
        # from a line in this job's log. Before this step a cell that never
        # submitted — overwhelmingly the 15-minute `Run cursor review` cap above,
        # absorbed by its `continue-on-error` — left the pre-seeded status=error
        # artifact and exited GREEN, so a reader of `statusCheckRollup` saw a
        # complete panel while `Aggregate panel findings` was quietly reporting
        # "2/6 cells contributed findings". Measured on one consumer repo over 92
        # panel runs: 38 runs had at least one errored leg, 52 of 552 cells
        # errored, and every leg check in every one of those runs reported
        # `success` (BE-15554).
        #
        # Deliberately AFTER the upload, so failing here costs the panel nothing:
        # the artifact is already published, `consolidate` and `notify-complete`
        # gate on `needs.review.result != 'skipped'` (a FAILED matrix is not a
        # skipped one), and `post-review` gates on `consolidate`. The
        # consolidated review still posts — the only thing that changes is that
        # the gap is now visible. `Panel integrity` further down aggregates the
        # same fact into one panel-level context.
        #
        # SCOPE, because the check reads stronger than it is: the verdict is the
        # `status` this cell's OWN agent wrote, and that agent runs `--trust`
        # with shell access over attacker-authored diff text, so a prompt-injected
        # cell can write status=ok with no findings and green both this leg and
        # the panel count. This is an AVAILABILITY signal — it catches the stalls,
        # crashes and step caps that are what every observed failure has been —
        # not an attestation that a review happened. A forgery-resistant count
        # needs the submission recorded outside the cell's own writable job.
        if: always()
        env:
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          # findings.json is untrusted: this cell's own agent runs `--trust`
          # with shell access in this job, so it can write whatever it likes
          # there. Read the status defensively (a missing or unparseable file is
          # "did not submit", not a traceback) and sanitize before it reaches a
          # ::workflow command:: line. The substitution REPLACES a disallowed
          # character rather than dropping it — deleting would let a crafted
          # "o k" collapse into the one value that passes.
          #
          # `ValueError`, not `json.JSONDecodeError`: the file is opened as
          # utf-8, so invalid UTF-8 — reachable precisely BECAUSE these bytes
          # are agent-written — raises `UnicodeDecodeError`, which is NOT a
          # JSONDecodeError. Under `set -e` that traceback would kill the step
          # and lose the `::error::` naming which cell failed, turning the one
          # case this step exists to report into an unlabelled crash. Both
          # exception types subclass `ValueError`, so one clause covers the pair.
          status=$(python3 - <<'PY'
          import json, re

          try:
              with open("/tmp/findings-out/findings.json", encoding="utf-8") as f:
                  cell = json.load(f)
          except (OSError, ValueError):
              cell = None
          value = cell.get("status") if isinstance(cell, dict) else None
          if not isinstance(value, str):
              value = "error"
          print(re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:32] or "error")
          PY
          )
          if [ "$status" != "ok" ]; then
            echo "::error::Reviewer cell ${REVIEW_TYPE}/${MODEL} did not submit a review (status=$status). Its findings artifact was uploaded and the panel still consolidates; this leg is red so the gap is visible in the rollup."
            exit 1
          fi
          echo "Reviewer cell ${REVIEW_TYPE}/${MODEL} submitted its findings."

  review-openai-direct:
    # An OPT-IN pair of cells (adversarial + edge-case, the same two passes and
    # prompts as a Cursor model) that reach their model through the OpenAI API
    # directly, via the Codex CLI, instead of through Cursor. By default they
    # REPLACE the Cursor-hosted OpenAI cells (preflight drops that id from the
    # panel list) so the lane is reviewed once, not twice; set
    # `openai_direct_replaces_cursor_openai: false` to run both for a
    # side-by-side comparison. Default OFF:
    # `openai_direct_model` is '' unless a caller sets it, and this job is then
    # skipped outright, so every enrolled repo sees exactly today's behaviour
    # until it opts in.
    #
    # Why a SEPARATE job rather than another entry in the `review` matrix:
    # that matrix's model list is validated against the live CURSOR catalog in
    # `preflight`, and a delisted id there fails the run loud by design
    # (BE-2627). A direct-API id is not in Cursor's catalog at all, so feeding
    # it to that list would fail preflight for the right reason and the wrong
    # cause. Separation also means a failure here can neither cancel nor skip
    # a Cursor matrix leg.
    #
    # How the judge picks it up: `consolidate` downloads `pattern: findings-*`
    # and globs `findings-*/findings.json`, so this cell's artifact
    # (`findings-direct-...`) is read alongside the others, and `consolidate`
    # lists this job in `needs:` so it never downloads before the upload
    # lands. The `direct-` prefix is what `Aggregate panel findings` keys on
    # to tell these cells apart from the Cursor ones (aggregate-panel.py).
    #
    # Credential posture: `contents: read` only, no write-scoped token (see
    # SECURITY.md), and the only PR-authored content the agent sees is the
    # same nonce-fenced diff text — this job does NOT check out the PR. The
    # OpenAI key reaches `codex exec` as CODEX_API_KEY in that ONE step's env
    # and is never written to disk (no `codex login`, whose auth.json the
    # read-only sandbox could still read), and the sandboxed shell's env is
    # cut to the core set so the agent cannot echo it back.
    #
    # Gating follows the role (preflight's `openai_direct_counts`):
    # - REPLACING the Cursor OpenAI lane: these cells ARE that lane, so they
    #   gate exactly like a Cursor cell — counted in ok_count/total, which
    #   `Panel integrity` and the auto-approve gate read, and the leg goes red
    #   when the cell did not submit. While they were advisory, a failed
    #   direct cell cost nothing against `approve_max_failed_reviewers`, so a
    #   run could approve with the OpenAI lane silent; counted, it spends that
    #   allowance like a failed Cursor cell, so the gate covers the full panel
    #   again.
    # - SIDE BY SIDE (replace false): ADVISORY, as when the backend was first
    #   characterised — job-level `continue-on-error`, never counted — since
    #   the Cursor OpenAI cells already gate that lane.
    #
    # Scope: one model, one round, no retry.
    name: '${{ matrix.review_type }} direct (${{ inputs.openai_direct_model }})'
    needs: [gate, diff-size, preflight, ledger]
    if: >-
      needs.preflight.outputs.openai_direct == 'true'
      && needs.gate.outputs.should_run == 'true'
      && needs.gate.outputs.already_reviewed != 'true'
      && needs.diff-size.outputs.within_cap == 'true'
    # GitHub-hosted, NOT the caller's `runs_on` pool: this job holds
    # OPENAI_API_KEY, and a pool is where a prompt-injected model cell may
    # have run. Only CURSOR_API_KEY-only, read-only jobs may follow `runs_on`.
    runs-on: ubuntu-latest
    # Advisory only side by side; when replacing, a failed cell is as red as a
    # failed Cursor cell.
    continue-on-error: ${{ needs.preflight.outputs.openai_direct_counts != 'true' }}
    # Matches the `review` job's cap so the judge's budget reasoning (see
    # `review`) holds for this cell too; the agent step caps lower, at
    # `cell_timeout_minutes`. DERIVED from that input, the same +15 as the
    # Cursor cells above and for the same overhead; see that job's note.
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.cell_job_timeout) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        review_type: [adversarial, edge-case]
    steps:
      - name: Seed default findings artifact
        # Same contract as the `review` job: pre-seed status=error so the cell
        # ALWAYS appears in the panel summary even if a later step dies. The
        # MCP output tool overwrites this on success.
        env:
          MODEL: ${{ inputs.openai_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          mkdir -p /tmp/findings-out
          python3 - <<'PY'
          import json, os
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "status": "error",
              "error": "Direct-API cell did not reach the submission step.",
              "findings": [],
          }
          with open("/tmp/findings-out/findings.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
          PY

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # Built once in the diff-size job (generated files already excluded),
        # shared here, so this cell needs no PR checkout of its own.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Download prior-review ledger
        # Same artifact, same tolerance as the `review` job: absent on round 1.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Check the API key is present
        id: key
        # Belt and braces: preflight already keeps this job off when the key is
        # absent. Should the two ever disagree, this attributes the errored
        # record clearly rather than leaving a confusing CLI auth failure.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::openai_direct_model is set but the OPENAI_API_KEY secret is absent, so the direct-API cell is skipped. Pass the secret through from the caller to enable it."
            python3 -c 'import json; p = "/tmp/findings-out/findings.json"; r = json.load(open(p)); r["error"] = "OPENAI_API_KEY secret was not provided to the reusable workflow."; json.dump(r, open(p, "w"), indent=2)'
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Codex CLI
        if: steps.key.outputs.present == 'true'
        # The pin lives in .github/cursor-review/package.json in THIS repo and
        # arrives with the assets checkout above, so it is resolved at the same
        # SHA as the prompts and scripts. Mirrors the groom precedent exactly,
        # including rejecting a non-exact pin: an inline `npm install -g
        # pkg@1.2.3` is invisible to every dependency ecosystem.
        run: |
          manifest="$CURSOR_REVIEW_ASSETS/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing — it is the single source of truth for the direct-API cell's CLI pin."
            exit 1
          fi
          if ! version=$(jq -r '
            if type != "object" then ""
            elif (.dependencies | type) != "object" then ""
            else (.dependencies["@openai/codex"] // "")
            end' "$manifest"); then
            echo "::error::$manifest is not valid JSON — it is the single source of truth for the direct-API cell's CLI pin."
            exit 1
          fi
          version="$(printf '%s' "$version" | tr -d '\r\n')"
          case "$version" in
            ""|*[!0-9.]*)
              echo "::error::dependencies[\"@openai/codex\"] must be an EXACT version (digits and dots only, no ^ or ~); got a value this job will not install."
              exit 1 ;;
          esac
          echo "CODEX_CLI_VERSION=$version" >> "$GITHUB_ENV"
          npm install -g "@openai/codex@${version}"

      - name: Verify Codex CLI version
        if: steps.key.outputs.present == 'true'
        # Re-asserted on the PATH-resolved binary immediately before the review,
        # so a swap between install and use cannot hand the review to unpinned
        # bits, and the version lands in the log for forensics.
        run: |
          # stdout only, first line (`codex-cli 0.162.0`): a stray stderr
          # notice must not become the last field compared below.
          installed="$(codex --version 2>/dev/null | head -n 1 | tr -d '\r' | awk '{print $NF}')"
          if [ "$installed" != "$CODEX_CLI_VERSION" ]; then
            echo "::error::codex reports '${installed}', expected the pinned '${CODEX_CLI_VERSION}'."
            exit 1
          fi
          echo "codex ${installed}"

      - name: Build prompt
        if: steps.key.outputs.present == 'true'
        # Byte-identical construction to the Cursor cells' `Build prompt`, so a
        # finding difference is attributable to the model or the backend rather
        # than to the prompt: the same prompt-<review_type>.md with the same
        # prior-review ledger spliced in, the same marker stripped and
        # re-emitted by fence-diff.py, the same new-hunks block from round 2
        # on, and a fresh per-prompt nonce minted into a shell variable (never
        # a step `env:`) so a leaked marker from one cell cannot forge a fence
        # in another. See that step for the full rationale.
        env:
          REVIEW_TYPE: ${{ matrix.review_type }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-${REVIEW_TYPE}.md" \
            --marker '=== BEGIN DIFF ===' \
            --insert /tmp/ledger/ledger.md \
            --out /tmp/prompt-head.txt
          diff_nonce="$(python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" mint)"
          python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" strip-marker \
            --file /tmp/prompt-head.txt \
            --marker '=== BEGIN DIFF ==='
          {
            cat /tmp/prompt-head.txt
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/pr-diff.patch --label DIFF --nonce "$diff_nonce"
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              echo "The block below is the subset of the diff above that changed since"
              echo "the last reviewed commit. Prioritize it — but the full diff above"
              echo "is still in scope."
              python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
                --body /tmp/pr-diff-new.patch \
                --label "HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?}" \
                --nonce "$diff_nonce"
            fi
          } > /tmp/prompt.txt

      - name: Run direct-API review
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        # Capped well under the job so a hung agent trips the STEP and the
        # seeded artifact still uploads below, rather than tripping the job and
        # discarding the cell. Same `cell_timeout_minutes` the Cursor cells get.
        timeout-minutes: ${{ inputs.cell_timeout_minutes }}
        env:
          MODEL: ${{ inputs.openai_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          # `codex exec` reads its API key from this variable, so the key lives
          # only in this step's process env: never argv (visible in the process
          # list), never a file (`codex login` writes ~/.codex/auth.json, which
          # the read-only sandbox can still READ, so a prompt-injected agent
          # could encode it into a finding). Verified against 0.162.0.
          CODEX_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p /tmp/findings-out
          # A fresh, empty home under RUNNER_TEMP (emptied after every job): no
          # stale credential or config from anything else that ran on this
          # runner, nothing persisted for the next, and not under /tmp, where
          # 0.162.0 refuses to create its helper binaries.
          CODEX_HOME="$(mktemp -d -p "$RUNNER_TEMP")"
          export CODEX_HOME
          python3 "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
            --mode reviewer \
            --out /tmp/findings-out/findings.json \
            --model "$MODEL" \
            --review-type "$REVIEW_TYPE" \
            --init
          # The SAME MCP submission tool the Cursor cells use, so the findings
          # schema the judge reads is produced by one implementation for both
          # backends. `default_tools_approval_mode=approve` is required: under
          # `codex exec`'s default policy the tool calls are rejected and the
          # cell submits nothing. `shell_environment_policy.inherit=core` hands
          # the agent's shell only HOME/PATH/etc., never CODEX_API_KEY.
          args_toml="$(python3 - <<'PY'
          import json, os
          print(json.dumps([
              os.path.join(os.environ["CURSOR_REVIEW_ASSETS"], "review-output-mcp.py"),
              "--mode", "reviewer",
              "--out", "/tmp/findings-out/findings.json",
              "--model", os.environ["MODEL"],
              "--review-type", os.environ["REVIEW_TYPE"],
          ]))
          PY
          )"
          codex exec --json --ignore-user-config --skip-git-repo-check \
            -s read-only \
            -c shell_environment_policy.inherit=core \
            -c model="$MODEL" \
            -c model_reasoning_effort=max \
            -c mcp_servers.cursor_review_output.command=python3 \
            -c mcp_servers.cursor_review_output.default_tools_approval_mode=approve \
            -c "mcp_servers.cursor_review_output.args=$args_toml" \
            < /tmp/prompt.txt > /tmp/codex-events.jsonl

      - name: Report cell outcome
        if: always()
        env:
          MODEL: ${{ inputs.openai_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          COUNTS: ${{ needs.preflight.outputs.openai_direct_counts }}
        # Status and a count only — NOT the findings verbatim, unlike the Cursor
        # cells: the run log is public, and finding bodies are model output
        # steered by PR-authored text. The full record still reaches the judge
        # through the artifact below.
        run: |
          read -r status count < <(python3 - <<'PY'
          import json, re
          try:
              with open("/tmp/findings-out/findings.json", encoding="utf-8") as f:
                  cell = json.load(f)
          except (OSError, ValueError):
              cell = None
          value = cell.get("status") if isinstance(cell, dict) else None
          if not isinstance(value, str):
              value = "error"
          findings = cell.get("findings") if isinstance(cell, dict) else None
          print(re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:32] or "error",
                len(findings) if isinstance(findings, list) else 0)
          PY
          )
          echo "Direct-API cell: status=${status}, ${count} finding(s)."
          if [ "$status" = "ok" ]; then
            echo "Direct-API cell ${REVIEW_TYPE}/${MODEL} submitted its findings."
          else
            # WHY it failed, not just THAT it did. The agent reports an
            # API-level failure in its STRUCTURED OUTPUT, which is redirected
            # to a file and — unlike the Cursor cells, which echo 500 chars of
            # raw output and all of stderr — never echoed, because that file
            # also holds the agent's prose. So a real outage
            # (`insufficient_quota` / `credit_balance_exhausted`, naming its
            # own cause) was discarded and this log showed only a non-zero
            # exit, leaving the lane's failures to be inferred from job
            # DURATION. agent-error.py prints an ALLOWLIST of provider error
            # metadata and never the prose, and exits 0 on anything — a
            # truncated or non-JSON file must not turn the diagnosis into a
            # second failure.
            python3 "$CURSOR_REVIEW_ASSETS/agent-error.py" \
              --events /tmp/codex-events.jsonl \
              --label "${REVIEW_TYPE}/${MODEL}"
            if [ "$COUNTS" = "true" ]; then
              # Failed AFTER the upload below, by `Fail the leg when the cell did
              # not submit`, so the errored record still reaches the judge.
              echo "Direct-API cell ${REVIEW_TYPE}/${MODEL} did not submit (status=$status); it replaces the Cursor OpenAI lane, so it counts as a failed reviewer."
            else
              echo "::warning::Direct-API cell ${REVIEW_TYPE}/${MODEL} did not submit (status=$status). Its record still reaches the judge; this leg stays green because the cell is advisory."
            fi
          fi

      - name: Upload findings artifact
        if: always()
        # `findings-*` so `consolidate` globs it; `direct-` so it can never
        # collide with a Cursor cell's `findings-<review_type>-<model>` (with
        # replacement off the two may share an id) and so `consolidate` can
        # tell it apart. The id is charset-checked in preflight.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-direct-${{ matrix.review_type }}-${{ inputs.openai_direct_model }}
          path: /tmp/findings-out/findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Fail the leg when the cell did not submit
        # Only when these cells REPLACE the Cursor OpenAI lane — the same
        # rollup-visibility contract as the `review` job's step of this name
        # (BE-15554), and like it deliberately AFTER the upload, so the errored
        # record still reaches the judge and the consolidated review still
        # posts. Side by side the cell is advisory and this step is skipped.
        # Same availability-not-attestation scope as that step: the status is
        # read from a file this cell's own agent could write.
        if: always() && needs.preflight.outputs.openai_direct_counts == 'true'
        env:
          MODEL: ${{ inputs.openai_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          # Read defensively and sanitized for a ::workflow command:: line, as
          # in the `review` job (`ValueError` covers invalid UTF-8 too).
          status=$(python3 - <<'PY'
          import json, re

          try:
              with open("/tmp/findings-out/findings.json", encoding="utf-8") as f:
                  cell = json.load(f)
          except (OSError, ValueError):
              cell = None
          value = cell.get("status") if isinstance(cell, dict) else None
          if not isinstance(value, str):
              value = "error"
          print(re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:32] or "error")
          PY
          )
          if [ "$status" != "ok" ]; then
            echo "::error::Direct-API reviewer cell ${REVIEW_TYPE}/${MODEL} did not submit a review (status=$status). It replaces the Cursor OpenAI lane, so it counts as a failed reviewer; its findings artifact was uploaded and the panel still consolidates."
            exit 1
          fi
          echo "Direct-API reviewer cell ${REVIEW_TYPE}/${MODEL} submitted its findings."

  review-anthropic-direct:
    # The Anthropic twin of `review-openai-direct`: the same OPT-IN pair of
    # cells (adversarial + edge-case), reaching their model through the
    # Anthropic API directly, via the Claude Code CLI, instead of through
    # Cursor. Everything that job's header says — why it is a separate job, how
    # the judge picks it up, gating by role (here preflight's
    # `anthropic_direct_counts`), scope — holds here; only the differences are
    # noted below.
    #
    # The one deliberate difference: this agent ALSO reads a read-only
    # checkout of the PR (`_pr`, its working directory) with Read, Grep and
    # Glob — no Bash or other code-running tool — because a diff-only cell
    # misses every finding that needs a file outside the diff.
    #
    # Credential posture: `contents: read` only, no write-scoped token (see
    # SECURITY.md); the PR checkout persists no credential. ANTHROPIC_API_KEY
    # reaches `claude` in that ONE step's env and is never written to disk.
    # The agent cannot run code, and its file tools cannot reach
    # `/proc/self/environ`: `--restricted` confines them to the checkout, and
    # deny rules on /proc and /sys hold independently of that flag. The
    # literal-match guard on the record before upload is a last tripwire.
    name: '${{ matrix.review_type }} direct (${{ inputs.anthropic_direct_model }})'
    needs: [gate, diff-size, preflight, ledger]
    if: >-
      needs.preflight.outputs.anthropic_direct == 'true'
      && needs.gate.outputs.should_run == 'true'
      && needs.gate.outputs.already_reviewed != 'true'
      && needs.diff-size.outputs.within_cap == 'true'
    # GitHub-hosted, never `runs_on`: this job holds ANTHROPIC_API_KEY (see
    # `review-openai-direct`).
    runs-on: ubuntu-latest
    continue-on-error: ${{ needs.preflight.outputs.anthropic_direct_counts != 'true' }}
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.cell_job_timeout) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        review_type: [adversarial, edge-case]
    steps:
      - name: Seed default findings artifact
        # Same contract as `review-openai-direct`'s seed.
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          mkdir -p /tmp/findings-out
          python3 - <<'PY'
          import json, os
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "status": "error",
              "error": "Direct-API cell did not reach the submission step.",
              "findings": [],
          }
          with open("/tmp/findings-out/findings.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
          PY

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Checkout PR repo
        # The read-only tree the agent's file tools read: the PR head, the
        # RIGHT side of the reviewed diff (the default merge ref would mix in
        # base-only changes and shift line numbers). No credential persisted.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: _pr
          fetch-depth: 1
          persist-credentials: false

      - name: Remove symlinks from the PR checkout
        # A symlink planted in the PR could lead the file tools outside the
        # tree (e.g. to the runner's home), so none survive into the review.
        run: find _pr -type l -delete

      - name: Remove PR-authored Claude config
        # The Cursor cells' `rm -rf .cursor`, for this CLI: `_pr` is claude's
        # cwd, so a PR-planted `.claude/settings*.json` (env such as
        # ANTHROPIC_BASE_URL, hooks, extra directories) or `.mcp.json` must
        # never be there to load. `--restricted` and `--setting-sources ""`
        # already ignore them; this removes them outright. CLAUDE.md stays:
        # `--setting-sources ""` keeps it from loading as instructions (on the
        # pinned CLI a planted "reply with one word" CLAUDE.md was ignored),
        # and the agent can still Read it as ordinary review context.
        run: rm -rf _pr/.claude _pr/.mcp.json _pr/CLAUDE.local.md

      - name: Download reviewed diff
        # Built once in the diff-size job (generated files already excluded),
        # shared here, so this cell needs no PR checkout of its own.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Download prior-review ledger
        # Same artifact, same tolerance as the `review` job: absent on round 1.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Check the API key is present
        id: key
        # Belt and braces, as in `review-openai-direct`.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::warning::anthropic_direct_model is set but the ANTHROPIC_API_KEY secret is absent, so the direct-API Anthropic cell is skipped. Pass the secret through from the caller to enable it."
            python3 -c 'import json; p = "/tmp/findings-out/findings.json"; r = json.load(open(p)); r["error"] = "ANTHROPIC_API_KEY secret was not provided to the reusable workflow."; json.dump(r, open(p, "w"), indent=2)'
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Claude Code CLI
        if: steps.key.outputs.present == 'true'
        # Pinned in .github/cursor-review/package.json, read exactly as
        # `review-openai-direct`'s `Install Codex CLI` reads its pin.
        run: |
          manifest="$CURSOR_REVIEW_ASSETS/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing — it is the single source of truth for the direct-API cell's CLI pin."
            exit 1
          fi
          if ! version=$(jq -r '
            if type != "object" then ""
            elif (.dependencies | type) != "object" then ""
            else (.dependencies["@anthropic-ai/claude-code"] // "")
            end' "$manifest"); then
            echo "::error::$manifest is not valid JSON — it is the single source of truth for the direct-API cell's CLI pin."
            exit 1
          fi
          version="$(printf '%s' "$version" | tr -d '\r\n')"
          case "$version" in
            ""|*[!0-9.]*)
              echo "::error::dependencies[\"@anthropic-ai/claude-code\"] must be an EXACT version (digits and dots only, no ^ or ~); got a value this job will not install."
              exit 1 ;;
          esac
          echo "CLAUDE_CLI_VERSION=$version" >> "$GITHUB_ENV"
          npm install -g "@anthropic-ai/claude-code@${version}"

      - name: Verify Claude Code CLI version
        if: steps.key.outputs.present == 'true'
        # As `Verify Codex CLI version`: `claude --version` prints
        # `2.1.286 (Claude Code)`, so the FIRST field is the version.
        run: |
          installed="$(claude --version 2>/dev/null | head -n 1 | tr -d '\r' | awk '{print $1}')"
          if [ "$installed" != "$CLAUDE_CLI_VERSION" ]; then
            echo "::error::claude reports '${installed}', expected the pinned '${CLAUDE_CLI_VERSION}'."
            exit 1
          fi
          echo "claude ${installed}"
          # The confinement rests on these flags, so a bump whose CLI dropped
          # or renamed one fails HERE, by name, rather than at argv parsing
          # mid-review — or, worse, by silently running unconfined.
          help="$(claude --help 2>&1)"
          for flag in --restricted --setting-sources --strict-mcp-config \
                      --disallowedTools --permission-prompts --no-session-persistence; do
            if ! printf '%s\n' "$help" | grep -qE -- "(^|[[:space:],])${flag}([[:space:],]|$)"; then
              echo "::error::claude ${installed} does not advertise ${flag}, which the direct-API cell's confinement relies on."
              exit 1
            fi
          done

      - name: Build prompt
        if: steps.key.outputs.present == 'true'
        # Byte-identical construction to the Cursor cells' `Build prompt`, so a
        # finding difference is attributable to the model or the backend rather
        # than to the prompt: the same prompt-<review_type>.md with the same
        # prior-review ledger spliced in, the same marker stripped and
        # re-emitted by fence-diff.py, the same new-hunks block from round 2
        # on, and a fresh per-prompt nonce minted into a shell variable (never
        # a step `env:`) so a leaked marker from one cell cannot forge a fence
        # in another. See that step for the full rationale.
        env:
          REVIEW_TYPE: ${{ matrix.review_type }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-${REVIEW_TYPE}.md" \
            --marker '=== BEGIN DIFF ===' \
            --insert /tmp/ledger/ledger.md \
            --out /tmp/prompt-head.txt
          diff_nonce="$(python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" mint)"
          python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" strip-marker \
            --file /tmp/prompt-head.txt \
            --marker '=== BEGIN DIFF ==='
          {
            cat /tmp/prompt-head.txt
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/pr-diff.patch --label DIFF --nonce "$diff_nonce"
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              echo "The block below is the subset of the diff above that changed since"
              echo "the last reviewed commit. Prioritize it — but the full diff above"
              echo "is still in scope."
              python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
                --body /tmp/pr-diff-new.patch \
                --label "HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?}" \
                --nonce "$diff_nonce"
            fi
          } > /tmp/prompt.txt

      - name: Run direct-API review
        if: steps.key.outputs.present == 'true'
        continue-on-error: true
        # Step-capped below the job, as in `review-openai-direct`.
        timeout-minutes: ${{ inputs.cell_timeout_minutes }}
        working-directory: _pr
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          EFFORT: ${{ needs.preflight.outputs.anthropic_direct_effort }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          # Process env of this ONE step only: never argv, never a file.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # No telemetry or error report may carry private-diff context.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          mkdir -p /tmp/findings-out
          # A fresh, empty config dir under RUNNER_TEMP, as CODEX_HOME is.
          CLAUDE_CONFIG_DIR="$(mktemp -d -p "$RUNNER_TEMP")"
          export CLAUDE_CONFIG_DIR
          # `-I` on every python3 here: the cwd is the PR checkout, and a stdin
          # script puts '' (the cwd) first on sys.path, so a PR-planted json.py
          # would run with ANTHROPIC_API_KEY in its env. Isolated mode drops it.
          python3 -I "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
            --mode reviewer \
            --out /tmp/findings-out/findings.json \
            --model "$MODEL" \
            --review-type "$REVIEW_TYPE" \
            --init
          # The SAME MCP submission tool the Cursor and Codex cells use, as the
          # only MCP server (`--strict-mcp-config`). The agent's tools are
          # Read, Grep and Glob, confined to this checkout by `--restricted`,
          # plus the two submission calls. The `--disallowedTools` deny rules
          # (a Read rule covers Grep and Glob too) are a second, independent
          # layer over /proc and /sys — `/proc/self/environ` holds the key — so
          # a CLI bump that loosened `--restricted` alone still cannot reach it.
          mcp_config="$(python3 -I - <<'PY'
          import json, os
          print(json.dumps({"mcpServers": {"cursor-review-output": {
              "command": "python3",
              "args": [
                  "-I",
                  os.path.join(os.environ["CURSOR_REVIEW_ASSETS"], "review-output-mcp.py"),
                  "--mode", "reviewer",
                  "--out", "/tmp/findings-out/findings.json",
                  "--model", os.environ["MODEL"],
                  "--review-type", os.environ["REVIEW_TYPE"],
              ],
          }}}))
          PY
          )"
          # The result JSON goes to a file that is never echoed: the run log
          # is public and the result is model output steered by PR text.
          # Deliberately NOT `--bare`: on the pinned CLI it drops Grep and Glob
          # from `--tools`, leaving the agent Read alone, which cannot search
          # the checkout. What `--bare` would skip is already off here: no
          # settings, hooks or plugins (`--setting-sources ""` and a fresh
          # CLAUDE_CONFIG_DIR, which also keep CLAUDE.md from loading as
          # instructions), no other MCP server (`--strict-mcp-config`), no
          # telemetry (CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC), and auth is
          # the env key alone.
          claude -p --restricted --setting-sources "" \
            --tools "Read,Grep,Glob" \
            --strict-mcp-config --mcp-config "$mcp_config" \
            --allowedTools "Read,Grep,Glob,mcp__cursor-review-output__cursor_review_record_finding,mcp__cursor-review-output__cursor_review_finish" \
            --disallowedTools "Read(//proc/**),Read(//sys/**)" \
            --permission-prompts none \
            --model "$MODEL" --effort "$EFFORT" \
            --output-format json --no-session-persistence \
            < /tmp/prompt.txt > /tmp/claude-result.json

      - name: Refuse a record carrying the API key
        # groom.yml's finder guard: should a prompt-injected agent get the key
        # into its findings, error the record rather than publish it (to the
        # judge, and from there to the PR). Literal match only.
        if: always()
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          out=/tmp/findings-out/findings.json
          if [ -n "${ANTHROPIC_API_KEY:-}" ] && [ -f "$out" ] \
             && LC_ALL=C grep -qF -- "$ANTHROPIC_API_KEY" "$out"; then
            echo "::error::direct-API Anthropic findings contain ANTHROPIC_API_KEY — refusing to publish (possible prompt-injection exfil)."
            python3 - <<'PY'
          import json, os
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "status": "error",
              "error": "findings contained the API key; refusing to publish",
              "findings": [],
          }
          with open("/tmp/findings-out/findings.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
          PY
          fi

      - name: Report cell outcome
        if: always()
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          COUNTS: ${{ needs.preflight.outputs.anthropic_direct_counts }}
        # Status and a count only — NOT the findings verbatim, unlike the Cursor
        # cells: the run log is public, and finding bodies are model output
        # steered by PR-authored text. The full record still reaches the judge
        # through the artifact below.
        run: |
          read -r status count < <(python3 - <<'PY'
          import json, re
          try:
              with open("/tmp/findings-out/findings.json", encoding="utf-8") as f:
                  cell = json.load(f)
          except (OSError, ValueError):
              cell = None
          value = cell.get("status") if isinstance(cell, dict) else None
          if not isinstance(value, str):
              value = "error"
          findings = cell.get("findings") if isinstance(cell, dict) else None
          print(re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:32] or "error",
                len(findings) if isinstance(findings, list) else 0)
          PY
          )
          echo "Direct-API cell: status=${status}, ${count} finding(s)."
          if [ "$status" = "ok" ]; then
            echo "Direct-API cell ${REVIEW_TYPE}/${MODEL} submitted its findings."
          else
            # WHY it failed, not just THAT it did. The agent reports an
            # API-level failure in its STRUCTURED OUTPUT, which is redirected
            # to a file and — unlike the Cursor cells, which echo 500 chars of
            # raw output and all of stderr — never echoed, because that file
            # also holds the agent's prose. So a real outage
            # (`insufficient_quota` / `credit_balance_exhausted`, naming its
            # own cause) was discarded and this log showed only a non-zero
            # exit, leaving the lane's failures to be inferred from job
            # DURATION. agent-error.py prints an ALLOWLIST of provider error
            # metadata and never the prose, and exits 0 on anything — a
            # truncated or non-JSON file must not turn the diagnosis into a
            # second failure.
            python3 "$CURSOR_REVIEW_ASSETS/agent-error.py" \
              --events /tmp/claude-result.json \
              --label "${REVIEW_TYPE}/${MODEL}"
            if [ "$COUNTS" = "true" ]; then
              # Failed AFTER the upload below, by `Fail the leg when the cell did
              # not submit`, so the errored record still reaches the judge.
              echo "Direct-API cell ${REVIEW_TYPE}/${MODEL} did not submit (status=$status); it replaces the Cursor Anthropic lane, so it counts as a failed reviewer."
            else
              echo "::warning::Direct-API cell ${REVIEW_TYPE}/${MODEL} did not submit (status=$status). Its record still reaches the judge; this leg stays green because the cell is advisory."
            fi
          fi

      - name: Upload findings artifact
        if: always()
        # `findings-*` so `consolidate` globs it; `direct-` so it can never
        # collide with a Cursor cell's `findings-<review_type>-<model>` (with
        # replacement off the two may share an id) and so `consolidate` can
        # tell it apart. The id is charset-checked in preflight.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: findings-direct-${{ matrix.review_type }}-${{ inputs.anthropic_direct_model }}
          path: /tmp/findings-out/findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Record token usage
        # The API's own token counts for this cell, as Claude Code totals them
        # across its calls, so a caller can measure what the cells cost without
        # an Admin API key. Counts only — no prices (they vary by contract and
        # over time) and nothing model-written: the result JSON is model output
        # steered by PR text, so only its integers and model ids are copied.
        # `measured` is false when the cell left no result (a timeout kills
        # it first) or any count in it is malformed, never a guessed zero.
        # Best effort, like the upload: accounting must never fail a cell.
        if: always() && steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/usage-out
          python3 -I - <<'PY'
          import json, os, re

          malformed = []

          def count(value, field):
              # A token count is a plain non-negative integer; absent reads as
              # 0. Anything else makes the whole record unmeasured.
              if value is None:
                  return 0
              if type(value) is int and value >= 0:
                  return value
              malformed.append(field)
              return 0

          def mapping(value, field):
              if value is None or isinstance(value, dict):
                  return value or {}
              malformed.append(field)
              return {}

          try:
              with open("/tmp/claude-result.json", encoding="utf-8") as f:
                  result = json.load(f)
          except (OSError, ValueError):
              result = None
          if not isinstance(result, dict):
              result = {}
          usage = result.get("usage")
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "run_attempt": int(os.environ.get("RUN_ATTEMPT") or 0),
              "measured": False,
          }
          if isinstance(usage, dict):
              written = mapping(usage.get("cache_creation"), "cache_creation")
              totals = {
                  "input_tokens": count(usage.get("input_tokens"), "input_tokens"),
                  "output_tokens": count(usage.get("output_tokens"), "output_tokens"),
                  "cache_read_input_tokens": count(usage.get("cache_read_input_tokens"), "cache_read_input_tokens"),
                  "cache_creation_input_tokens": count(usage.get("cache_creation_input_tokens"), "cache_creation_input_tokens"),
                  "ephemeral_5m_input_tokens": count(written.get("ephemeral_5m_input_tokens"), "ephemeral_5m_input_tokens"),
                  "ephemeral_1h_input_tokens": count(written.get("ephemeral_1h_input_tokens"), "ephemeral_1h_input_tokens"),
              }
              # Per model, in case the CLI ever spends on a second one.
              models = {}
              for name, m in mapping(result.get("modelUsage"), "modelUsage").items():
                  if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", name) or not isinstance(m, dict):
                      malformed.append("modelUsage")
                      continue
                  models[name] = {
                      "input_tokens": count(m.get("inputTokens"), "inputTokens"),
                      "output_tokens": count(m.get("outputTokens"), "outputTokens"),
                      "cache_read_input_tokens": count(m.get("cacheReadInputTokens"), "cacheReadInputTokens"),
                      "cache_creation_input_tokens": count(m.get("cacheCreationInputTokens"), "cacheCreationInputTokens"),
                  }
              if not malformed:
                  record.update(measured=True, usage=totals, models=models)
                  for field in ("num_turns", "duration_ms"):
                      value = result.get(field)
                      record[field] = value if type(value) is int and value >= 0 else 0
          with open("/tmp/usage-out/usage.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
          # Field names only, never values: the run log is public.
          print(f"Token usage recorded: measured={str(record['measured']).lower()}"
                + (f" (malformed: {', '.join(sorted(set(malformed)))})." if malformed else "."))
          PY

      - name: Upload usage artifact
        # Not `findings-*`, so `consolidate` never reads it as a cell. Kept
        # longer than the findings so a weekly cost report can still read it.
        # Best effort: accounting must never fail a review cell.
        if: always() && steps.key.outputs.present == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usage-direct-${{ matrix.review_type }}-${{ inputs.anthropic_direct_model }}
          path: /tmp/usage-out/usage.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail the leg when the cell did not submit
        # Only when these cells REPLACE the Cursor Anthropic lane — the same
        # rollup-visibility contract as the `review` job's step of this name
        # (BE-15554), and like it deliberately AFTER the upload, so the errored
        # record still reaches the judge and the consolidated review still
        # posts. Side by side the cell is advisory and this step is skipped.
        # Same availability-not-attestation scope as that step: the status is
        # read from a file this cell's own agent could write.
        if: always() && needs.preflight.outputs.anthropic_direct_counts == 'true'
        env:
          MODEL: ${{ inputs.anthropic_direct_model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          # Read defensively and sanitized for a ::workflow command:: line, as
          # in the `review` job (`ValueError` covers invalid UTF-8 too).
          status=$(python3 - <<'PY'
          import json, re

          try:
              with open("/tmp/findings-out/findings.json", encoding="utf-8") as f:
                  cell = json.load(f)
          except (OSError, ValueError):
              cell = None
          value = cell.get("status") if isinstance(cell, dict) else None
          if not isinstance(value, str):
              value = "error"
          print(re.sub(r"[^A-Za-z0-9_.-]", "_", value)[:32] or "error")
          PY
          )
          if [ "$status" != "ok" ]; then
            echo "::error::Direct-API reviewer cell ${REVIEW_TYPE}/${MODEL} did not submit a review (status=$status). It replaces the Cursor Anthropic lane, so it counts as a failed reviewer; its findings artifact was uploaded and the panel still consolidates."
            exit 1
          fi
          echo "Direct-API reviewer cell ${REVIEW_TYPE}/${MODEL} submitted its findings."

  judge-direct:
    # The direct-Anthropic judge (`judge_direct_model`, preflight's
    # `judge_direct`): `consolidate`'s Cursor judge, through `claude -p` and
    # the Anthropic API. Its own job so ANTHROPIC_API_KEY — sent to a job for
    # every step that references it, skipped steps included — reaches ONLY a
    # job whose one agent has Read, Grep and Glob and no shell, on
    # GitHub-hosted `ubuntu-latest`, never `consolidate` (a Cursor shell agent
    # over PR text, on the caller's `runs_on` pool).
    #
    # It rebuilds the judge's input exactly as `consolidate` does — the
    # `Aggregate panel findings` and `Build judge prompt` steps are
    # byte-identical to consolidate's (pinned by test_workflow_judge_direct.py)
    # — then hands back ONE file, /tmp/judge-findings.json, as the
    # `cursor-review-judge-direct` artifact. `consolidate` adopts it over its
    # own seed, so everything downstream (the degraded fallback, the
    # consolidated file, the post) is the Cursor judge's path unchanged.
    # It also uploads the API's token counts for the judge as
    # `usage-direct-judge-<model>`, which nothing in this workflow reads.
    name: Direct judge
    needs: [gate, diff-size, preflight, review, review-openai-direct, review-anthropic-direct, ledger]
    # `consolidate`'s condition, plus the direct judge being in effect.
    if: ${{ !cancelled() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true' && needs.review.result != 'skipped' && needs.preflight.outputs.judge_direct == 'true' }}
    # Holds ANTHROPIC_API_KEY: never the caller's `runs_on` pool.
    runs-on: ubuntu-latest
    # `consolidate`'s cap, for the same reason: the judge step below trips
    # first and is absorbed, so the upload always runs. The 10m slack covers
    # this job's overhead — checkout, three downloads, the CLI install
    # (itself capped at 5m) and its check (2m), and the upload.
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.judge_job_timeout) }}
    permissions:
      contents: read
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # Same generated-file-excluded diff (plus the incremental "hunks new
        # since the last reviewed round" diff) the panel reviewed, built once
        # in diff-size — so the judge adjudicates against exactly what the
        # panel saw, and this job needs no PR checkout.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Install Claude Code CLI
        id: claude_install
        # `review-anthropic-direct`'s install, verbatim: the pin is read out of
        # .github/cursor-review/package.json, its one home. Absorbed, unlike
        # there: a judge that cannot start must cost the adjudication only, so
        # `Run judge (direct)` is skipped and the seed takes the degraded
        # panel-union path, as a failed Cursor judge does. Time-boxed for the
        # same reason: a hung registry fetch must trip this step, not the job
        # cap, whose kill never reaches the upload below.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          manifest="$CURSOR_REVIEW_ASSETS/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is missing — it is the single source of truth for the direct judge's CLI pin."
            exit 1
          fi
          if ! version=$(jq -r '
            if type != "object" then ""
            elif (.dependencies | type) != "object" then ""
            else (.dependencies["@anthropic-ai/claude-code"] // "")
            end' "$manifest"); then
            echo "::error::$manifest is not valid JSON — it is the single source of truth for the direct judge's CLI pin."
            exit 1
          fi
          version="$(printf '%s' "$version" | tr -d '\r\n')"
          case "$version" in
            ""|*[!0-9.]*)
              echo "::error::dependencies[\"@anthropic-ai/claude-code\"] must be an EXACT version (digits and dots only, no ^ or ~); got a value this job will not install."
              exit 1 ;;
          esac
          echo "CLAUDE_CLI_VERSION=$version" >> "$GITHUB_ENV"
          npm install -g "@anthropic-ai/claude-code@${version}"

      - name: Verify Claude Code CLI version
        id: claude_verify
        if: steps.claude_install.outcome == 'success'
        # `review-anthropic-direct`'s check, verbatim, and absorbed for the
        # same reason as the install: a CLI that is off-pin, or no longer
        # advertises a flag the confinement relies on, never runs.
        continue-on-error: true
        timeout-minutes: 2
        run: |
          installed="$(claude --version 2>/dev/null | head -n 1 | tr -d '\r' | awk '{print $1}')"
          if [ "$installed" != "$CLAUDE_CLI_VERSION" ]; then
            echo "::error::claude reports '${installed}', expected the pinned '${CLAUDE_CLI_VERSION}'."
            exit 1
          fi
          echo "claude ${installed}"
          help="$(claude --help 2>&1)"
          for flag in --restricted --setting-sources --strict-mcp-config \
                      --disallowedTools --permission-prompts --no-session-persistence; do
            if ! printf '%s\n' "$help" | grep -qE -- "(^|[[:space:],])${flag}([[:space:],]|$)"; then
              echo "::error::claude ${installed} does not advertise ${flag}, which the direct judge's confinement relies on."
              exit 1
            fi
          done

      - name: Download prior-review ledger
        id: ledger_download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Download panel findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/panel
          pattern: findings-*

      - name: Configure structured final review
        # The `--init` seed, as in `consolidate`: a judge that never submits
        # leaves status=error, and `consolidate` takes the degraded path.
        env:
          JUDGE_DIRECT_MODEL: ${{ inputs.judge_direct_model }}
        run: |
          python3 -I "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
            --mode judge \
            --out /tmp/judge-findings.json \
            --model "$JUDGE_DIRECT_MODEL (direct)" \
            --review-type judge \
            --init

      - name: Aggregate panel findings
        id: aggregate
        env:
          PANEL_MODELS: ${{ needs.preflight.outputs.models }}
          # The direct-API cells COUNT only when they replace the Cursor OpenAI
          # lane; side by side they stay advisory. See aggregate-panel.py.
          DIRECT_MODEL: ${{ needs.preflight.outputs.openai_direct == 'true' && inputs.openai_direct_model || '' }}
          DIRECT_COUNTS: ${{ needs.preflight.outputs.openai_direct_counts }}
          # The matrices' RESULTS, not their artifacts: a cell can upload under
          # another cell's name, but it cannot turn the honest leg's 409 green.
          # `Fail the leg when the cell did not submit` reds every non-ok cell,
          # so a red matrix whose artifacts all read ok is a forgery or a
          # post-review failure — either way, panel_inconsistent=true.
          REVIEW_RESULT: ${{ needs.review.result }}
          DIRECT_RESULT: ${{ needs.review-openai-direct.result }}
          # The same three for the direct Anthropic cells, counted per lab.
          ANTHROPIC_DIRECT_MODEL: ${{ needs.preflight.outputs.anthropic_direct == 'true' && inputs.anthropic_direct_model || '' }}
          ANTHROPIC_DIRECT_COUNTS: ${{ needs.preflight.outputs.anthropic_direct_counts }}
          ANTHROPIC_DIRECT_RESULT: ${{ needs.review-anthropic-direct.result }}
        run: |
          # Each artifact directory contains one findings.json. Combine into
          # a single panel.json array preserving cell metadata, and emit the
          # ok_count/total/panel_inconsistent `Panel integrity` and auto-approve
          # gate on.
          python3 "$CURSOR_REVIEW_ASSETS/aggregate-panel.py" \
            --panel-dir /tmp/panel \
            --models "$PANEL_MODELS" \
            --direct-model "$DIRECT_MODEL" \
            --direct-counts "${DIRECT_COUNTS:-false}" \
            --review-result "$REVIEW_RESULT" \
            --direct-result "${DIRECT_RESULT:-skipped}" \
            --anthropic-direct-model "$ANTHROPIC_DIRECT_MODEL" \
            --anthropic-direct-counts "${ANTHROPIC_DIRECT_COUNTS:-false}" \
            --anthropic-direct-result "${ANTHROPIC_DIRECT_RESULT:-skipped}" \
            --out /tmp/panel.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Build judge prompt
        if: steps.aggregate.outputs.ok_count != '0'
        env:
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          # The judge is the repeat-policy enforcement point, so it gets the
          # judge-flavored ledger block (repeat_of requirement + the per-review
          # repeat cap). Byte-identical to the old prompt when there's no ledger.
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-judge.md" \
            --marker '=== BEGIN PANEL FINDINGS ===' \
            --insert /tmp/ledger/ledger-judge.md \
            --out /tmp/judge-prompt-head.txt

          # Nonce'd fences as in the panel (BE-7645) — the judge reads the same
          # attacker-authored diff, so it gets the same delimiting. Its nonce is
          # minted HERE and is its OWN: the panel jobs never see it. That is
          # what stops a laundering path — panel.json is model output produced
          # with the panel's nonce in context, and it is spliced ABOVE the diff
          # here, so a shared value could be echoed by a steered panel model into
          # a region the judge has been told is authoritative and used to forge a
          # close/open fence pair around a fake diff.
          #
          # panel.json is fenced with the same nonce for the same reason: it is
          # model output derived from the untrusted diff, so "only a marker
          # carrying this nonce ends a region" has to hold for it too, not just
          # for the diff. Today only json.dump's newline escaping keeps a forged
          # marker off a line start — that is not a control to rely on.
          judge_nonce="$(python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" mint)"

          python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" strip-marker \
            --file /tmp/judge-prompt-head.txt \
            --marker '=== BEGIN PANEL FINDINGS ==='

          {
            cat /tmp/judge-prompt-head.txt
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/panel.json --label "PANEL FINDINGS" --nonce "$judge_nonce"
            echo ""
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/pr-diff.patch --label DIFF --nonce "$judge_nonce"
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
                --body /tmp/pr-diff-new.patch \
                --label "HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?}" \
                --nonce "$judge_nonce"
            fi
          } > /tmp/judge-prompt.txt

          echo "Judge prompt size: $(wc -c < /tmp/judge-prompt.txt) bytes"

      - name: Run judge (direct)
        # `consolidate`'s `Run judge`, through the Anthropic API instead of Cursor: the
        # same /tmp/judge-prompt.txt, the same `review-output-mcp.py --mode
        # judge` writing the same /tmp/judge-findings.json, the same step cap
        # and the same absorption — a judge that fails, times out or never
        # submits leaves the seed, and `Build consolidated findings file` takes
        # the degraded panel-union path exactly as it does for Cursor. Skipped
        # (seed left in place, same path) when the CLI did not install clean.
        #
        # Confinement, as in `review-anthropic-direct`: ANTHROPIC_API_KEY is
        # in this ONE step's env (never argv, never a file), and the agent has
        # Read, Grep and Glob — no Bash or other code-running tool — confined
        # to the PR checkout (its cwd) by `--restricted`, with /proc and /sys
        # denied independently of that flag, since /proc/self/environ is the
        # key. The result JSON is never echoed: the run log is public and the
        # result is model output steered by PR text.
        id: judge_direct
        if: steps.aggregate.outputs.ok_count != '0' && steps.claude_verify.outcome == 'success'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(needs.preflight.outputs.judge_step_timeout) }}
        env:
          JUDGE_DIRECT_MODEL: ${{ inputs.judge_direct_model }}
          JUDGE_DIRECT_EFFORT: ${{ needs.preflight.outputs.judge_direct_effort }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # No telemetry or error report may carry private-diff context.
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            # Belt and braces: preflight already required the key.
            echo "::warning::judge_direct_model is in effect but ANTHROPIC_API_KEY is empty here, so the judge did not run."
            exit 0
          fi
          # A planted symlink could lead the file tools outside the tree, and
          # a planted .claude/settings*.json or .mcp.json must never be there
          # to load (`--restricted` and `--setting-sources ""` ignore them
          # already; this removes them outright).
          find . -type l -delete
          rm -rf ./.claude ./.mcp.json ./CLAUDE.local.md
          CLAUDE_CONFIG_DIR="$(mktemp -d -p "$RUNNER_TEMP")"
          export CLAUDE_CONFIG_DIR
          # `-I`: the cwd is the PR checkout, and a stdin script puts '' first
          # on sys.path, so a PR-planted json.py would run beside the key.
          mcp_config="$(python3 -I - <<'PY'
          import json, os
          print(json.dumps({"mcpServers": {"cursor-review-output": {
              "command": "python3",
              "args": [
                  "-I",
                  os.path.join(os.environ["CURSOR_REVIEW_ASSETS"], "review-output-mcp.py"),
                  "--mode", "judge",
                  "--out", "/tmp/judge-findings.json",
                  "--model", os.environ["JUDGE_DIRECT_MODEL"] + " (direct)",
                  "--review-type", "judge",
              ],
          }}}))
          PY
          )"
          # Deliberately NOT `--bare`: on the pinned CLI it drops Grep and
          # Glob from `--tools` (see `review-anthropic-direct`). What it would
          # skip is already off: `--setting-sources ""` and a fresh
          # CLAUDE_CONFIG_DIR, `--strict-mcp-config`, and
          # CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC.
          claude -p --restricted --setting-sources "" \
            --tools "Read,Grep,Glob" \
            --strict-mcp-config --mcp-config "$mcp_config" \
            --allowedTools "Read,Grep,Glob,mcp__cursor-review-output__cursor_review_submit_final" \
            --disallowedTools "Read(//proc/**),Read(//sys/**)" \
            --permission-prompts none \
            --model "$JUDGE_DIRECT_MODEL" --effort "$JUDGE_DIRECT_EFFORT" \
            --output-format json --no-session-persistence \
            < /tmp/judge-prompt.txt > /tmp/judge-claude-result.json \
            && JUDGE_EXIT=0 || JUDGE_EXIT=$?
          echo "claude (judge) exit code: $JUDGE_EXIT"

      - name: Refuse a judge review carrying the API key
        # The direct cells' exfil guard, for the judge: should a
        # prompt-injected judge get the key into its final review, replace the
        # review with the `--init` error seed, so the degraded path posts the
        # panel union instead. Literal match only. `always()`, so a judge
        # killed by its step cap AFTER submitting is still checked. Then the
        # status and finding count — never the review itself (see above).
        if: always()
        env:
          JUDGE_DIRECT_MODEL: ${{ inputs.judge_direct_model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          out=/tmp/judge-findings.json
          if [ -n "${ANTHROPIC_API_KEY:-}" ] && [ -f "$out" ] \
             && LC_ALL=C grep -qF -- "$ANTHROPIC_API_KEY" "$out"; then
            echo "::error::the direct judge's final review contains ANTHROPIC_API_KEY — refusing to publish it (possible prompt-injection exfil); the panel union is posted instead."
            python3 -I "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
              --mode judge \
              --out "$out" \
              --model "$JUDGE_DIRECT_MODEL (direct)" \
              --review-type judge \
              --init
          fi
          # `-I`, as everywhere in this job: the cwd is the PR checkout, and a
          # stdin script puts '' first on sys.path, so a PR-planted json.py
          # would run beside the key.
          python3 -I - <<'PY'
          import json
          try:
              with open("/tmp/judge-findings.json", encoding="utf-8") as f:
                  record = json.load(f)
          except (OSError, ValueError):
              record = {}
          if not isinstance(record, dict):
              record = {}
          status = record.get("status")
          findings = record.get("findings")
          # Fixed vocabulary only: `status` is written by a tool the agent
          # drives, so anything else is reported as `?`, never echoed.
          status = status if status in ("ok", "error") else "?"
          count = len(findings) if isinstance(findings, list) else 0
          print(f"Direct judge: status={status}, {count} finding(s).")
          PY

      - name: Upload direct judge review
        # Always, so `consolidate` sees the seed rather than nothing on a
        # judge that did not submit. NOT absorbed: a failed upload (a 409
        # because something else took the name first included) fails this
        # job, and `consolidate` adopts only from a job that succeeded.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cursor-review-judge-direct
          path: /tmp/judge-findings.json
          if-no-files-found: error
          retention-days: 7

      - name: Record token usage
        # `review-anthropic-direct`'s step, over the judge's result: the API's
        # own token counts for the judge, so a caller can measure what the
        # direct judge costs as it does the direct cells. Counts only — nothing
        # model-written, no prices — and `measured` is false when the judge
        # left no usable result. The script is the cells', byte for byte, but
        # for the result path (test_workflow_judge_direct.py pins that). It
        # runs whenever the judge step did, so a judge its cap killed is still
        # recorded, as unmeasured. Best effort, and after the review's upload:
        # accounting must never fail or delay the judge's hand-off. Time-boxed
        # too: `continue-on-error` does not absorb the JOB cap, and a job that
        # ends cancelled loses its already-uploaded review to `consolidate`.
        if: always() && steps.judge_direct.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 1
        env:
          MODEL: ${{ inputs.judge_direct_model }}
          REVIEW_TYPE: judge
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          mkdir -p /tmp/usage-out
          python3 -I - <<'PY'
          import json, os, re

          malformed = []

          def count(value, field):
              # A token count is a plain non-negative integer; absent reads as
              # 0. Anything else makes the whole record unmeasured.
              if value is None:
                  return 0
              if type(value) is int and value >= 0:
                  return value
              malformed.append(field)
              return 0

          def mapping(value, field):
              if value is None or isinstance(value, dict):
                  return value or {}
              malformed.append(field)
              return {}

          try:
              with open("/tmp/judge-claude-result.json", encoding="utf-8") as f:
                  result = json.load(f)
          except (OSError, ValueError):
              result = None
          if not isinstance(result, dict):
              result = {}
          usage = result.get("usage")
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "run_attempt": int(os.environ.get("RUN_ATTEMPT") or 0),
              "measured": False,
          }
          if isinstance(usage, dict):
              written = mapping(usage.get("cache_creation"), "cache_creation")
              totals = {
                  "input_tokens": count(usage.get("input_tokens"), "input_tokens"),
                  "output_tokens": count(usage.get("output_tokens"), "output_tokens"),
                  "cache_read_input_tokens": count(usage.get("cache_read_input_tokens"), "cache_read_input_tokens"),
                  "cache_creation_input_tokens": count(usage.get("cache_creation_input_tokens"), "cache_creation_input_tokens"),
                  "ephemeral_5m_input_tokens": count(written.get("ephemeral_5m_input_tokens"), "ephemeral_5m_input_tokens"),
                  "ephemeral_1h_input_tokens": count(written.get("ephemeral_1h_input_tokens"), "ephemeral_1h_input_tokens"),
              }
              # Per model, in case the CLI ever spends on a second one.
              models = {}
              for name, m in mapping(result.get("modelUsage"), "modelUsage").items():
                  if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", name) or not isinstance(m, dict):
                      malformed.append("modelUsage")
                      continue
                  models[name] = {
                      "input_tokens": count(m.get("inputTokens"), "inputTokens"),
                      "output_tokens": count(m.get("outputTokens"), "outputTokens"),
                      "cache_read_input_tokens": count(m.get("cacheReadInputTokens"), "cacheReadInputTokens"),
                      "cache_creation_input_tokens": count(m.get("cacheCreationInputTokens"), "cacheCreationInputTokens"),
                  }
              if not malformed:
                  record.update(measured=True, usage=totals, models=models)
                  for field in ("num_turns", "duration_ms"):
                      value = result.get(field)
                      record[field] = value if type(value) is int and value >= 0 else 0
          with open("/tmp/usage-out/usage.json", "w", encoding="utf-8") as f:
              json.dump(record, f, indent=2)
          # Field names only, never values: the run log is public.
          print(f"Token usage recorded: measured={str(record['measured']).lower()}"
                + (f" (malformed: {', '.join(sorted(set(malformed)))})." if malformed else "."))
          PY

      - name: Upload usage artifact
        # The cells' `usage-direct-<review_type>-<model>` family, review type
        # `judge`. Neither `findings-*` nor `cursor-review-judge-direct`, so
        # neither `consolidate` nor the hand-back ever reads it. Best effort,
        # and time-boxed for the same reason as `Record token usage`.
        id: usage_upload
        if: always() && steps.judge_direct.outcome != 'skipped'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: usage-direct-judge-${{ inputs.judge_direct_model }}
          path: /tmp/usage-out/usage.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Warn on unrecorded usage
        # The name is fixed and known before the job runs, so a panel cell (an
        # agent over PR code that runs first) can upload under it and make this
        # upload 409. `continue-on-error` would hide that, leaving the squatter's
        # counts as the judge's record; say so on the run. `usage-direct-*`
        # records are unauthenticated either way: treat them as indicative.
        if: always() && steps.usage_upload.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 1
        run: echo "::warning::The direct judge's usage artifact did not upload; any usage-direct-judge-* record on this run is not the judge's."

  consolidate:
    # Adjudicates the panel cell artifacts into one consolidated review.
    # Calls cursor-agent one more time as the judge, with prompt-judge.md —
    # or, with `judge_direct_model` in effect (preflight's `judge_direct`),
    # adopts the review the `judge-direct` job above wrote instead: same
    # prompt, same structured-output tool, same file, same degraded fallback.
    # That judge runs in its OWN job so ANTHROPIC_API_KEY never shares one
    # with this job's Cursor judge (an unsandboxed shell agent over PR text)
    # or its `runs_on` pool.
    #
    # Holds no write credential: the payload is handed to the `post-review` job
    # below as an artifact, and that job does the mint + post. See the header's
    # "Credential isolation" note for why the judge must not share a job with
    # a write-scoped token.
    name: Consolidate panel
    # `review-openai-direct` and `review-anthropic-direct` are here for
    # ORDERING — their artifacts must land before `Download panel findings`
    # runs (and `judge-direct`'s before `Download direct judge review`). None
    # gates this job: when one is skipped (the default) or
    # fails, `!cancelled()` below still runs, and a failed cell is counted
    # from its artifact (or its absence) instead. Each one's result is read
    # once, by `Aggregate panel findings`, as a consistency check on those
    # artifacts (see aggregate-panel.py).
    needs: [gate, diff-size, preflight, review, review-openai-direct, review-anthropic-direct, ledger, judge-direct]
    # `!cancelled()`, not `always()`: the judge is the most expensive call in
    # the workflow, and the only job that does anything with its payload,
    # `post-review`, is itself `!cancelled()`. On a cancelled run — now an
    # advertised escape hatch, since applying `skip-cursor-review` mid-panel
    # cancels the run — `always()` spent up to 30 minutes adjudicating partial
    # cell output that nothing could ever post. Individual cell FAILURES are a
    # different thing and are still judged: `cancelled()` asks whether the RUN
    # was cancelled, so a red or cancelled matrix cell still reaches the judge,
    # which is what `always()` was here for.
    if: ${{ !cancelled() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true' && needs.review.result != 'skipped' }}
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    # ABOVE the `review` cap, never under it. The judge reads every cell's
    # artifact with the same top reasoning tier one cell uses, so it is the
    # strictly harder call — yet at 15m it was capped at HALF the panel it
    # adjudicates. A diff slow enough to stretch the panel stretches the judge
    # with it, so the failure mode was the expensive one: every cell runs green
    # for ~25m, then the judge is killed at the last step and every cell's work
    # is discarded with nothing posted to the PR. GitHub reports a
    # timeout-minutes kill as `cancelled`, not `failed`, so it reads on the run
    # page like a human stopped it — which is how this went unnoticed. Observed
    # twice in one day on a consumer repo, both at 15m0Xs (~3% of runs).
    #
    # Deliberately longer than the `Run judge` step cap below, same idiom as
    # the `ledger` job: raising the JOB cap alone would only move the cliff,
    # since a job-level kill takes `Build consolidated findings file` and the
    # payload upload with it and is the one failure mode that can never reach
    # the degraded panel-union fallback. The step trips first and is absorbed,
    # so a hung judge costs the adjudication, not the panel. The slack over
    # the step (10m) covers this job's own overhead — a `fetch-depth: 0`
    # checkout, the CLI install, three artifact downloads and the upload —
    # which a panel cell does not all pay, so the judge's effective MODEL
    # budget is the step cap, not this one.
    #
    # DERIVED from `cell_timeout_minutes` (step = max(30, x 2), job = step
    # + 10 slack), so raising a
    # cell's cap carries the judge with it instead of leaving it behind.
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.judge_job_timeout) }}
    # contents: read ONLY. This job checks out PR-authored code and runs the
    # judge agent over it, so it must carry nothing write-scoped — `post-review`
    # below holds pull-requests: write and the bot credentials instead.
    permissions:
      contents: read
    # Panel-integrity facts, for the `Panel integrity` job at the bottom of this
    # file. They are the same numbers the steps below already print; a job output
    # is what makes them readable from OUTSIDE this job's log, which is the whole
    # point — `Aggregate panel findings` reporting "2/6 cells contributed" in a
    # log nobody opens is not a signal a merge gate can act on.
    outputs:
      ok_count: ${{ steps.aggregate.outputs.ok_count }}
      total: ${{ steps.aggregate.outputs.total }}
      # 'true' when a counted cell artifact may not be its own cell's: a
      # reviewer matrix did not succeed although every counted cell of it
      # reads `ok`, or a record is `mismatch`. Written by aggregate-panel.py
      # BEFORE the judge runs in this job; `Auto-approve decision` and `Panel
      # integrity` read it from here, never from consolidated.json.
      panel_inconsistent: ${{ steps.aggregate.outputs.panel_inconsistent }}
      degraded: ${{ steps.consolidated.outputs.degraded }}
      # Untrusted: this is whatever string the judge agent's own tool wrote as
      # `status` in /tmp/judge-findings.json, in a job running `cursor-agent
      # --trust` over PR-authored text. It is neither validated against an enum
      # nor escaped on the way out. Anything that consumes it must flatten AND
      # percent-escape it before it reaches a ::workflow command:: line —
      # stripping newlines alone is not enough, because the runner unescapes
      # `%0A` back into one. `Panel integrity` does both.
      judge_status: ${{ steps.consolidated.outputs.judge_status }}
    steps:
      - name: Checkout PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download reviewed diff
        # Same generated-file-excluded diff (plus the incremental "hunks new
        # since the last reviewed round" diff) the panel reviewed, built once
        # in diff-size — so the judge adjudicates against exactly what the
        # panel saw, and this job needs no PR checkout.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Install Cursor agent CLI
        # Not needed when the judge runs direct, and a transient Cursor
        # download failure here would fail this job before the degraded
        # panel-union path, discarding a completed panel.
        if: needs.preflight.outputs.judge_direct != 'true'
        run: bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Download prior-review ledger
        id: ledger_download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Download panel findings
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/panel
          pattern: findings-*

      - name: Configure structured final review
        env:
          # The seed names the judge that will run: `<id> (direct)` for the
          # direct judge, so a judge that never submits is not attributed to
          # the Cursor model.
          JUDGE_DIRECT: ${{ needs.preflight.outputs.judge_direct }}
          JUDGE_DIRECT_MODEL: ${{ inputs.judge_direct_model }}
        run: |
          judge_label="$JUDGE_MODEL"
          if [ "$JUDGE_DIRECT" = "true" ]; then
            judge_label="$JUDGE_DIRECT_MODEL (direct)"
          fi
          python3 "$CURSOR_REVIEW_ASSETS/review-output-mcp.py" \
            --mode judge \
            --out /tmp/judge-findings.json \
            --model "$judge_label" \
            --review-type judge \
            --init

          rm -rf -- .cursor
          mkdir -m 700 .cursor
          python3 - <<'PY'
          import json, os, sys, tempfile

          if os.path.islink(".cursor"):
              raise SystemExit("Refusing to write Cursor config through a symlinked .cursor directory")

          config = {
              "mcpServers": {
                  "cursor-review-output": {
                      "type": "stdio",
                      "command": sys.executable,
                      "args": [
                          os.path.join(os.environ["CURSOR_REVIEW_ASSETS"], "review-output-mcp.py"),
                          "--mode", "judge",
                          "--out", "/tmp/judge-findings.json",
                          "--model", os.environ["JUDGE_MODEL"],
                          "--review-type", "judge",
                      ],
                  }
              }
          }
          cli_config = {
              "permissions": {
                  "allow": [
                      "Mcp(cursor-review-output:cursor_review_submit_final)",
                  ],
                  "deny": [],
              }
          }
          for filename, value in (("mcp.json", config), ("cli.json", cli_config)):
              fd, temporary = tempfile.mkstemp(dir=".cursor", prefix=f".{filename}-")
              with os.fdopen(fd, "w", encoding="utf-8") as output:
                  json.dump(value, output)
              os.replace(temporary, os.path.join(".cursor", filename))
          PY

      - name: Aggregate panel findings
        id: aggregate
        env:
          PANEL_MODELS: ${{ needs.preflight.outputs.models }}
          # The direct-API cells COUNT only when they replace the Cursor OpenAI
          # lane; side by side they stay advisory. See aggregate-panel.py.
          DIRECT_MODEL: ${{ needs.preflight.outputs.openai_direct == 'true' && inputs.openai_direct_model || '' }}
          DIRECT_COUNTS: ${{ needs.preflight.outputs.openai_direct_counts }}
          # The matrices' RESULTS, not their artifacts: a cell can upload under
          # another cell's name, but it cannot turn the honest leg's 409 green.
          # `Fail the leg when the cell did not submit` reds every non-ok cell,
          # so a red matrix whose artifacts all read ok is a forgery or a
          # post-review failure — either way, panel_inconsistent=true.
          REVIEW_RESULT: ${{ needs.review.result }}
          DIRECT_RESULT: ${{ needs.review-openai-direct.result }}
          # The same three for the direct Anthropic cells, counted per lab.
          ANTHROPIC_DIRECT_MODEL: ${{ needs.preflight.outputs.anthropic_direct == 'true' && inputs.anthropic_direct_model || '' }}
          ANTHROPIC_DIRECT_COUNTS: ${{ needs.preflight.outputs.anthropic_direct_counts }}
          ANTHROPIC_DIRECT_RESULT: ${{ needs.review-anthropic-direct.result }}
        run: |
          # Each artifact directory contains one findings.json. Combine into
          # a single panel.json array preserving cell metadata, and emit the
          # ok_count/total/panel_inconsistent `Panel integrity` and auto-approve
          # gate on.
          python3 "$CURSOR_REVIEW_ASSETS/aggregate-panel.py" \
            --panel-dir /tmp/panel \
            --models "$PANEL_MODELS" \
            --direct-model "$DIRECT_MODEL" \
            --direct-counts "${DIRECT_COUNTS:-false}" \
            --review-result "$REVIEW_RESULT" \
            --direct-result "${DIRECT_RESULT:-skipped}" \
            --anthropic-direct-model "$ANTHROPIC_DIRECT_MODEL" \
            --anthropic-direct-counts "${ANTHROPIC_DIRECT_COUNTS:-false}" \
            --anthropic-direct-result "${ANTHROPIC_DIRECT_RESULT:-skipped}" \
            --out /tmp/panel.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Build judge prompt
        if: steps.aggregate.outputs.ok_count != '0'
        env:
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          # The judge is the repeat-policy enforcement point, so it gets the
          # judge-flavored ledger block (repeat_of requirement + the per-review
          # repeat cap). Byte-identical to the old prompt when there's no ledger.
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" splice \
            --prompt "$CURSOR_REVIEW_ASSETS/prompt-judge.md" \
            --marker '=== BEGIN PANEL FINDINGS ===' \
            --insert /tmp/ledger/ledger-judge.md \
            --out /tmp/judge-prompt-head.txt

          # Nonce'd fences as in the panel (BE-7645) — the judge reads the same
          # attacker-authored diff, so it gets the same delimiting. Its nonce is
          # minted HERE and is its OWN: the panel jobs never see it. That is
          # what stops a laundering path — panel.json is model output produced
          # with the panel's nonce in context, and it is spliced ABOVE the diff
          # here, so a shared value could be echoed by a steered panel model into
          # a region the judge has been told is authoritative and used to forge a
          # close/open fence pair around a fake diff.
          #
          # panel.json is fenced with the same nonce for the same reason: it is
          # model output derived from the untrusted diff, so "only a marker
          # carrying this nonce ends a region" has to hold for it too, not just
          # for the diff. Today only json.dump's newline escaping keeps a forged
          # marker off a line start — that is not a control to rely on.
          judge_nonce="$(python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" mint)"

          python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" strip-marker \
            --file /tmp/judge-prompt-head.txt \
            --marker '=== BEGIN PANEL FINDINGS ==='

          {
            cat /tmp/judge-prompt-head.txt
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/panel.json --label "PANEL FINDINGS" --nonce "$judge_nonce"
            echo ""
            python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
              --body /tmp/pr-diff.patch --label DIFF --nonce "$judge_nonce"
            if [ -s /tmp/pr-diff-new.patch ]; then
              echo ""
              python3 "$CURSOR_REVIEW_ASSETS/fence-diff.py" emit \
                --body /tmp/pr-diff-new.patch \
                --label "HUNKS NEW SINCE ROUND ${LEDGER_ROUNDS:-?}" \
                --nonce "$judge_nonce"
            fi
          } > /tmp/judge-prompt.txt

          echo "Judge prompt size: $(wc -c < /tmp/judge-prompt.txt) bytes"

      - name: Run judge
        if: steps.aggregate.outputs.ok_count != '0' && needs.preflight.outputs.judge_direct != 'true'
        # Time-boxed BELOW the job cap and absorbed, so a hung judge loses only
        # the adjudication: the steps below then read the `--init` seed left by
        # `Configure structured final review` (status=error), take the degraded
        # panel-union path and still post what the cells found. At least the
        # `review` job cap at the default (30) and always at least twice the
        # cell step cap, so the judge is never given less model time than one of
        # the cells it reads. `continue-on-error` is what makes the
        # timeout absorbable — without it the step failure fails the job and
        # lands back on the all-cells-discarded outcome this is fixing. It
        # hides no real signal: the cursor-agent exit code is already captured
        # in-script, and a judge that did not submit is reported to the PR as
        # `judge_status` by `Post review`.
        continue-on-error: true
        # DERIVED: twice `cell_timeout_minutes`, never below 30. The judge
        # adjudicates EVERY cell's findings at the same reasoning tier, so a
        # budget equal to one cell's is the floor, not the target — and its
        # workload scales with the panel, so a tightened cell cap must not
        # shrink it below today's 30.
        timeout-minutes: ${{ fromJSON(needs.preflight.outputs.judge_step_timeout) }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          cursor-agent \
            --print \
            --trust \
            --approve-mcps \
            --model "$JUDGE_MODEL" \
            < /tmp/judge-prompt.txt \
            > /tmp/judge-raw.txt 2>/tmp/judge-stderr.txt \
            && JUDGE_EXIT=0 || JUDGE_EXIT=$?
          echo "cursor-agent (judge) exit code: $JUDGE_EXIT"

          echo "=== Judge raw output (first 1000 chars) ==="
          head -c 1000 /tmp/judge-raw.txt
          echo ""
          echo "=== Judge stderr ==="
          cat /tmp/judge-stderr.txt

          echo "=== Structured final review ==="
          cat /tmp/judge-findings.json
          echo ""

      - name: Download direct judge review
        # Only from a `judge-direct` job that SUCCEEDED. A panel cell runs an
        # agent over PR code before that job starts and could upload an
        # artifact under this name first; the job's own upload then 409s, the
        # job fails, and nothing is adopted — the seed below stays and the
        # degraded panel-union path posts instead.
        if: steps.aggregate.outputs.ok_count != '0' && needs.preflight.outputs.judge_direct == 'true' && needs.judge-direct.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-judge-direct
          path: /tmp/judge-direct

      - name: Adopt direct judge review
        # Over the `--init` seed `Configure structured final review` wrote,
        # and only when it is a JSON object: anything else leaves the seed,
        # so `Build consolidated findings file` takes the degraded path
        # exactly as for a Cursor judge that never submitted.
        if: steps.aggregate.outputs.ok_count != '0' && needs.preflight.outputs.judge_direct == 'true'
        run: |
          python3 -I - <<'PY'
          import json, os, shutil

          src = "/tmp/judge-direct/judge-findings.json"
          try:
              if os.path.islink(src):
                  raise ValueError("symlink")
              with open(src, encoding="utf-8") as f:
                  record = json.load(f)
          except (OSError, ValueError):
              record = None
          if isinstance(record, dict):
              shutil.copyfile(src, "/tmp/judge-findings.json")
              print("Adopted the direct judge's review.")
          else:
              print("No usable direct judge review — the seed stays (degraded panel-union path).")
          PY

      - name: Build consolidated findings file
        id: consolidated
        env:
          OK_COUNT: ${{ steps.aggregate.outputs.ok_count }}
          # From the step output, not /tmp/panel.json: the judge ran in this job
          # since `Aggregate panel findings` wrote it, and can rewrite the file.
          PANEL_INCONSISTENT: ${{ steps.aggregate.outputs.panel_inconsistent }}
        run: |
          # If no cells completed, short-circuit — post-review.py will render
          # a "no contributors" review with the panel summary. Otherwise the
          # judge's MCP tool has already written /tmp/judge-findings.json.
          if [ "$OK_COUNT" = "0" ]; then
            echo "No panel cells contributed findings — skipping judge."
            echo '{"status": "ok", "findings": []}' > /tmp/judge-findings.json
          fi

          # If the judge did not call its final-review tool, surface that to
          # the next step rather than silently claiming "no findings".
          JUDGE_STATUS=$(python3 -c "import json,sys; print(json.load(open('/tmp/judge-findings.json')).get('status','?'))")
          echo "Judge status: $JUDGE_STATUS"
          echo "judge_status=$JUDGE_STATUS" >> "$GITHUB_OUTPUT"

          # Combine judge findings with panel metadata (model, review_type,
          # status only — drop full per-cell findings to keep the post payload
          # small) for the post-review script. If the judge did not submit,
          # fall back to the raw per-cell findings so the run still surfaces
          # what the panel found.
          python3 - <<'PY'
          import json, os

          with open("/tmp/panel.json", encoding="utf-8") as f:
              panel = json.load(f)
          # Counted cells only: auto-approve counts failed reviewers from this
          # list, so an ADVISORY direct-API cell must not appear here. A counted
          # one does, tagged `direct` so the posted review names its backend.
          # Advisory findings still reach the degraded fallback via `panel`.
          panel_meta = []
          for c in panel:
              if c.get("advisory") is True:
                  continue
              meta = {"model": c.get("model"), "review_type": c.get("review_type"), "status": c.get("status")}
              if c.get("direct_api") is True:
                  meta["direct"] = True
              panel_meta.append(meta)
          with open("/tmp/judge-findings.json", encoding="utf-8") as f:
              judge = json.load(f)

          degraded = judge.get("status") != "ok"
          if not degraded:
              findings = judge.get("findings") or []
          else:
              # Judge unusable — union the per-cell findings, deduping identical
              # (file, line, body) across cells to cut the obvious cross-cell
              # repetition the judge would normally collapse.
              seen, findings = set(), []
              for cell in panel:
                  if cell.get("status") != "ok":
                      continue
                  for fnd in cell.get("findings") or []:
                      if not isinstance(fnd, dict):
                          continue
                      key = (fnd.get("file"), fnd.get("line"), fnd.get("body"))
                      if key in seen:
                          continue
                      seen.add(key)
                      findings.append(fnd)

          # auto-approve withholds on it (a reviewer leg did not succeed
          # although every panel cell reports ok).
          panel_inconsistent = os.environ.get("PANEL_INCONSISTENT") == "true"
          consolidated = {"findings": findings, "panel": panel_meta, "panel_inconsistent": panel_inconsistent}
          with open("/tmp/consolidated.json", "w", encoding="utf-8") as f:
              json.dump(consolidated, f)

          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write(f"consolidated_count={len(findings)}\n")
              g.write(f"degraded={'true' if degraded else 'false'}\n")
          print(
              f"Consolidated: {len(findings)} finding(s) "
              f"({'degraded panel fallback' if degraded else 'judge-adjudicated'}), "
              f"{len(panel_meta)} panel cells."
          )
          PY

      - name: Resolve triggerer
        id: triggerer
        env:
          GH_ACTOR: ${{ github.actor }}
          PR_ASSIGNEES: ${{ toJSON(github.event.pull_request.assignees.*.login) }}
        run: |
          # github.actor on pull_request.labeled is the user who applied the
          # label — but when the auto-labeler workflow applies it via a bot
          # App token, github.actor becomes "<app>[bot]" and the human who
          # actually triggered the chain (by assigning themselves) is lost.
          # Recover them by falling back to the PR's first assignee whenever
          # the actor is a bot.
          if [[ "$GH_ACTOR" == *"[bot]" ]]; then
            FALLBACK=$(echo "$PR_ASSIGNEES" | jq -r '.[0] // empty')
            if [ -n "$FALLBACK" ]; then
              echo "Actor $GH_ACTOR is a bot — using assignee '$FALLBACK' for attribution."
              echo "triggered_by=$FALLBACK" >> "$GITHUB_OUTPUT"
            else
              echo "Actor $GH_ACTOR is a bot and no assignee found — keeping bot attribution."
              echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "triggered_by=$GH_ACTOR" >> "$GITHUB_OUTPUT"
          fi

      - name: Bundle consolidate outputs
        # Hand the review payload to the isolated `post-review` job below.
        # The step outputs ride in a small JSON file rather than as job outputs
        # so a single artifact download reconstitutes everything that job needs.
        # `ledger_download` travels with them because the ledger banner asks two
        # separate questions — did the JUDGE get prior-round context (this job's
        # download), and can the poster READ the note (its own download).
        # `degraded` is diagnostic as far as the REVIEW is concerned: the
        # review's own degradation banner keys on `judge_status`, so nothing it
        # carries here reaches the PR body. It is also a job output of this job,
        # read by `Panel integrity`.
        env:
          JUDGE_STATUS: ${{ steps.consolidated.outputs.judge_status }}
          CONSOLIDATED_COUNT: ${{ steps.consolidated.outputs.consolidated_count }}
          DEGRADED: ${{ steps.consolidated.outputs.degraded }}
          TRIGGERED_BY: ${{ steps.triggerer.outputs.triggered_by }}
          LEDGER_DOWNLOAD: ${{ steps.ledger_download.outcome }}
        run: |
          python3 - <<'PY'
          import json, os

          # Collapse newlines: every value below is written back out as one
          # `key=value` GITHUB_OUTPUT line in the post job, and triggered_by is
          # derived from PR data, so a smuggled newline must not become a second
          # line there.
          def one_line(value):
              return " ".join(value.splitlines()).strip()

          meta = {
              key.lower(): one_line(os.environ.get(key, ""))
              for key in (
                  "JUDGE_STATUS",
                  "CONSOLIDATED_COUNT",
                  "DEGRADED",
                  "TRIGGERED_BY",
                  "LEDGER_DOWNLOAD",
              )
          }
          with open("/tmp/consolidated-meta.json", "w", encoding="utf-8") as f:
              json.dump(meta, f)
          print(json.dumps(meta, indent=2))
          PY

      - name: Upload consolidated review payload
        # An artifact, not job outputs: the job holding the bot write-token must
        # never run in the same context as the PR checkout and the judge agent.
        # Deliberately NOT `if: always()` — a consolidate that died before this
        # step produced no review to post, and a half-built payload must not be
        # posted. `post-review` is gated on this job SUCCEEDING, so it simply
        # does not run; the failure stays visible as this job's own red status
        # and `notify-complete` names which half broke.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cursor-review-consolidated
          path: |
            /tmp/consolidated.json
            /tmp/judge-findings.json
            /tmp/consolidated-meta.json
          if-no-files-found: error
          retention-days: 7

  post-review:
    # Posts the ONE consolidated review on the PR, under the bot identity when
    # the caller configured one.
    #
    # This is the write half of the credential split described in the header.
    # It checks out NO PR code — just this repo's assets at the pinned
    # `workflows_ref`, plus artifacts. Both untrusted inputs it renders (the consolidated
    # findings, the reviewed diff) are downloaded, not re-derived from a
    # checkout, and the diff comes from the `pr-diff` artifact `diff-size`
    # published rather than from the copy the judge job had shell access to.
    name: Post review
    # `diff-size` for its `merge_base_sha` alone (BE-15598) — the round sentinel this
    # job writes has to record the merge base THIS round's reviewed diff was taken
    # against. Already a transitive dependency (consolidate → review → diff-size), so
    # this adds no ordering, only the outputs. `round-cap` likewise (diff-size
    # already `needs:` it), for the round number on the status card decide
    # writes (BE-19489).
    needs: [gate, consolidate, ledger, diff-size, round-cap]
    # `!cancelled()` rather than `always()`, for the same reason
    # `over-cap-comment` documents at its own `if:`: the documented caller sets
    # `cancel-in-progress: true`, and `always()` runs a job even when the RUN is
    # cancelled. In the common supersede ordering `consolidate` has already
    # finished and uploaded before the new push cancels the run, so its result
    # is still `success` and a `needs.consolidate.result != 'cancelled'` test
    # sails right past — this job would then post a review pinned to the
    # superseded head SHA, alongside the new run's. Splitting the post into its
    # own job WIDENED that window (cancellation used to kill the post step
    # mid-job), so the run-level test is the one that has to be here.
    #
    # `== 'success'` rather than "ran at all": this job's whole input is a
    # downloaded artifact, and artifact names are run-global. A prompt-injected
    # panel cell (the header concedes those have shell access) can claim
    # `cursor-review-consolidated` first; v4+ artifacts are immutable without
    # `overwrite`, so the REAL upload then fails, `consolidate` goes red — and a
    # gate that accepted a failed consolidate would download the spoofed payload
    # and post it under the bot's write token. A failed `consolidate` is already
    # visible as its own red job and is reported by `notify-complete`; there is
    # nothing here worth posting on that path. A judge that never submitted is
    # NOT this case: its step is `continue-on-error`, so `consolidate` still
    # succeeds and the degraded review still posts.
    if: ${{ !cancelled() && needs.consolidate.result == 'success' }}
    runs-on: ubuntu-latest
    # Three artifact downloads, a token mint, and post-review.py's ONE
    # `gh api POST /pulls/N/reviews` carrying every inline comment in a single
    # payload — plus, on a POST failure that is not a pre-write rejection, at most
    # one paginated read of the PR's reviews (one `gh` command, but one request PER
    # PAGE), to tell a review that never landed from one that landed despite the
    # error (`pull-requests: write` already implies that read, so no permission
    # changes here) — minutes of work at most. Every one of those calls is bounded:
    # the reads by GH_LIST_REVIEWS_TIMEOUT_SECONDS and the POSTs by
    # GH_POST_REVIEW_TIMEOUT_SECONDS, both well under this budget, so a wedged call
    # cannot eat the job's whole allowance and take the fallback POST — or the job
    # summary that is written after it — down with it.
    #
    # A THROTTLED write (429, one of the 403 wordings that mean "slow down", or a 403
    # carrying its own `Retry-After`) adds a bounded WAIT in front of the landed-review
    # read — otherwise that read goes out on the token GitHub just throttled and comes
    # back "could not tell", which is the answer that used to cost a duplicate review.
    # The wait is `Retry-After` (or the `X-RateLimit-Reset` window) clamped to
    # THROTTLE_DELAY_MAX_SECONDS, and it is ONE window per throttled POST: the inline
    # path's read and its body-only fallback share a single deadline, so the fallback
    # finishes the remainder rather than sitting out a second full wait. Worst case is
    # therefore two 90s waits plus two bounded reads and two bounded POSTs — 7 minutes,
    # inside this budget with the artifact downloads and the token mint alongside it.
    #
    # Nothing here retries an unconfirmed write: a throttle whose landed-review read is
    # still unreadable after the wait declines the fallback and goes red with the review
    # in the job summary. Nor does anything call the API inside a window GitHub closed —
    # a declared embargo longer than THROTTLE_DELAY_MAX_SECONDS (a primary rate limit
    # sends hour-long values) skips the wait, the read and the fallback outright and
    # goes straight to the job summary, since retrying inside it escalates the limit for
    # the whole App installation.
    #
    # Bounded like every other job here so a rate-limited or hung call cannot hold a
    # runner for the 6-hour default.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # The blocking gate's POSITIVE delivery signal (BE-4691). This job's
    # `result` cannot answer "did a review carrying resolvable finding threads
    # land on the PR" — post-review.py exits 0 after a read-only-token 403, after
    # the body-only "Review failed" review, after the all-cells-failed
    # no-findings review and after the 422 inline fallback, and every one of
    # those leaves the gate's thread query empty. So the script states it
    # instead; see its emit_delivery for the contract. Unset (the script died
    # before deciding) reads as false at the gate — fail-closed by default.
    #
    # `posted` is the DM's weaker sibling (BE-10017), not a duplicate of
    # `delivered`: it says only that SOME review body reached the PR. The two
    # disagree in both directions of interest — the error review and the
    # all-cells-failed review post but do not deliver, and the read-only-403
    # degradation neither posts nor delivers while still exiting 0. The gate
    # wants `delivered`; `notify-complete`'s "one consolidated review is on the
    # PR" wants `posted`, or it congratulates the author over a PR with no
    # review on it.
    outputs:
      delivered: ${{ steps.post.outputs.delivered }}
      gated_findings: ${{ steps.post.outputs.gated_findings }}
      ungated_findings: ${{ steps.post.outputs.ungated_findings }}
      posted: ${{ steps.post.outputs.posted }}
      # pass / fail / untrusted / capped, written by auto-approve.py `decide`;
      # empty when auto-approve is off (the workflow-level output then says
      # `off`) or the step died before deciding (it then says `untrusted`).
      approve_gate: ${{ steps.approve.outputs.approve_gate }}
      # `delta` or `full`, written by the same `decide`; empty when it never ran.
      approve_scope_effective: ${{ steps.approve.outputs.approve_scope_effective }}
      # BE-19526: `true` when decide left a marked block and the `auto-retry`
      # job should relabel; see that job.
      auto_retry: ${{ steps.approve.outputs.auto_retry }}
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Download consolidated review payload
        id: payload
        # Tolerated here so the guard below can name the real cause; a bare
        # download failure reads as "artifact plumbing broke" when what actually
        # happened is upstream.
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-consolidated
          path: /tmp/consolidated

      - name: Require the consolidated payload
        env:
          PAYLOAD_OUTCOME: ${{ steps.payload.outcome }}
        run: |
          if [ "$PAYLOAD_OUTCOME" != "success" ]; then
            echo "::error::The consolidate job did not publish cursor-review-consolidated, so there is no review to post — see that job for the failure."
            exit 1
          fi

          # A successful download is not a complete bundle. `if-no-files-found:
          # error` on the upload fires only when ZERO of its three paths match,
          # so a partial artifact uploads cleanly. Name the missing file here:
          # the alternative is an unhandled FileNotFoundError inside `Read
          # consolidate outputs` or inside the JUDGE_ERROR one-liner, which
          # reads as "the poster is broken" when what happened is upstream —
          # and which kills the run on exactly the degraded path the panel-union
          # fallback exists to survive.
          MISSING=""
          for f in consolidated.json consolidated-meta.json judge-findings.json; do
            [ -f "/tmp/consolidated/$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "::error::cursor-review-consolidated downloaded but is missing:${MISSING} — the consolidate job uploaded a partial payload, see that job."
            exit 1
          fi

      - name: Download reviewed diff
        # The same generated-file-excluded diff the panel and the judge read,
        # taken from `diff-size`'s artifact — post-review.py anchors its inline
        # comments against it, so this job needs no PR checkout.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: pr-diff
          path: /tmp

      - name: Download prior-review ledger
        id: ledger_download
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cursor-review-ledger
          path: /tmp/ledger

      - name: Read consolidate outputs
        id: meta
        run: |
          python3 - <<'PY'
          import json, os, re

          # `triggered_by` is the one header field post-review.py interpolates
          # RAW — `_Triggered by @{value}._`, not routed through
          # neutralize_mentions. That was safe while the value was `github.actor`
          # read in the posting job itself; since the split it arrives out of a
          # meta file assembled inside the job this workflow declares
          # prompt-injectable, so it now crosses the trust boundary the split
          # draws. Pin it to the shape of a GitHub login (39 chars max,
          # alphanumerics and hyphens, plus the `[bot]` suffix `Resolve
          # triggerer` can legitimately emit) and drop anything else: an
          # `@org/team` mass-mention, a `[text](url)` phishing link or arbitrary
          # markdown must not reach a review posted under the bot's write-scoped
          # identity. post-review.py omits the attribution line entirely for an
          # empty value, so dropping degrades to "no attribution", not to a lie.
          LOGIN = re.compile(r"^[A-Za-z0-9-]{1,39}(\[bot\])?$")

          with open("/tmp/consolidated/consolidated-meta.json", encoding="utf-8") as f:
              meta = json.load(f)
          print(json.dumps(meta, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as g:
              # `degraded` is deliberately absent: it is diagnostic, printed
              # above with the rest of the payload, and no step below reads it.
              for key in (
                  "judge_status",
                  "consolidated_count",
                  "triggered_by",
                  "ledger_download",
              ):
                  value = " ".join(str(meta.get(key, "")).splitlines()).strip()
                  if key == "triggered_by" and value and not LOGIN.match(value):
                      print(
                          f"::warning::meta triggered_by is not a GitHub login shape "
                          f"({len(value)} chars) — dropping the attribution line."
                      )
                      value = ""
                  g.write(f"{key}={value}\n")
          PY

      - name: Mint bot-identity token (optional)
        id: bot_token
        if: ${{ inputs.bot_app_id != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post review
        id: post
        env:
          # Dedicated bot identity when configured (bot_app_id), else github-actions[bot].
          GH_TOKEN: ${{ steps.bot_token.outputs.token || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The two halves of the round sentinel post-review.py writes under the review
          # header (BE-15598). BASE_SHA is diagnostic; MERGE_BASE_SHA is the one the
          # NEXT round pins its "already reviewed" patch to, and an empty value is
          # recorded as empty so that round skips its block rather than guessing.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ needs.diff-size.outputs.merge_base_sha }}
          TRIGGERED_BY: ${{ steps.meta.outputs.triggered_by }}
          JUDGE_STATUS: ${{ steps.meta.outputs.judge_status }}
          CONSOLIDATED_COUNT: ${{ steps.meta.outputs.consolidated_count }}
          LEDGER_STATUS: ${{ needs.ledger.outputs.status }}
          # This job's own download (can the poster READ the note) …
          LEDGER_DOWNLOAD: ${{ steps.ledger_download.outcome }}
          # … and the consolidate job's (did the JUDGE get prior-round context).
          LEDGER_DOWNLOAD_JUDGE: ${{ steps.meta.outputs.ledger_download }}
          # approve_scope: post-review.py marks the threads auto-approve will not
          # count, from the same inputs `Auto-approve decision` passes below.
          # Empty for an author approve_authors does not list: no decision is
          # taken for them, so no thread may claim it is "not blocking" one.
          APPROVE_THRESHOLD: ${{ needs.gate.outputs.approve_author_ok != 'false' && inputs.approve_max_severity || '' }}
          APPROVE_SCOPE: ${{ inputs.approve_scope }}
          INCREMENTAL_STATE: ${{ needs.diff-size.outputs.incremental_state }}
        run: |
          # Prior-review ledger line for the review header: either the
          # round/ledger summary, or the "context unavailable" banner naming the
          # failed call. A guard that could not read its input SAYS SO — a
          # context-free re-review must never render identically to a genuine
          # first-round review.
          #
          # The DELIVERY of the ledger is checked separately from its CONTENT.
          # Every ledger download is continue-on-error, so an upload or download
          # that failed leaves no ledger-note.txt while the ledger job still
          # reports status=ok — and the panel prompts were spliced with an EMPTY
          # block. Reading only LEDGER_STATUS there would emit no banner and the
          # context-free re-review would render as a genuine first round, the
          # exact partial failure the banner exists to catch. So: file ABSENT
          # (delivery failed) is a banner; file PRESENT but empty is a real
          # "nothing to say" (first round / kill switch / no prior findings).
          #
          # The two halves are reported SEPARATELY because they mean different
          # things to the author. If the JUDGE's download failed, the panel
          # genuinely reviewed without prior-round context and findings may
          # repeat earlier rounds. If only the POSTER's download failed — a case
          # that exists only because this job now fetches the note itself — the
          # panel and judge DID have the context and only this header could not
          # be rendered; telling the author "findings may repeat" there would be
          # false.
          LEDGER_NOTE=""
          JUDGE_LEDGER_OK=true
          if [ "${LEDGER_DOWNLOAD_JUDGE:-failure}" != "success" ]; then
            JUDGE_LEDGER_OK=false
          fi
          POST_LEDGER_OK=true
          if [ "${LEDGER_DOWNLOAD:-failure}" != "success" ] || [ ! -f /tmp/ledger/ledger-note.txt ]; then
            POST_LEDGER_OK=false
          fi

          if [ "$JUDGE_LEDGER_OK" != "true" ]; then
            LEDGER_NOTE="⚠️ prior-review context unavailable (the ledger artifact did not reach the review jobs: judge=${LEDGER_DOWNLOAD_JUDGE:-missing}, post=${LEDGER_DOWNLOAD:-missing}) — the panel ran without prior-round context, so findings may repeat earlier rounds."
          elif [ "$POST_LEDGER_OK" != "true" ]; then
            LEDGER_NOTE="⚠️ prior-review summary unavailable (the ledger note did not reach the posting job: post=${LEDGER_DOWNLOAD:-missing}). The panel and judge DID read prior-round context, so findings are not repeats for want of it — only this header could not be rendered."
          else
            LEDGER_NOTE="$(cat /tmp/ledger/ledger-note.txt)"
            if [ -z "$LEDGER_NOTE" ]; then
              case "${LEDGER_STATUS:-missing}" in
                ok|empty|disabled) ;;
                *)
                  LEDGER_NOTE="⚠️ prior-review context unavailable (ledger job: status=${LEDGER_STATUS:-missing}) — findings may repeat earlier rounds."
                  ;;
              esac
            fi
          fi

          # What post-review.py adjudicates a judge `repeat_of` against (BE-12630).
          # `--ledger` is passed UNCONDITIONALLY — the download is continue-on-error
          # and load_shown_repeat_urls degrades on a missing file, so gating on the
          # POSTER's download would only convert a graceful degradation into a
          # different one.
          #
          # `--no-judge-ledger` is a different question with a different answer. The
          # two downloads fail independently, and it is the JUDGE's that decides what
          # the judge was SHOWN: when it failed, the judge prompt was spliced an EMPTY
          # ledger block, so every repeat_of it emitted is unfounded — even though this
          # job's own copy of ledger.json may have arrived intact and be full of real
          # thread URLs. Without this flag the membership check would treat those URLs
          # as "shown" and wave the re-raise through on exactly the degraded run
          # $LEDGER_NOTE already banners above.
          LEDGER_FLAGS=(--ledger /tmp/ledger/ledger.json)
          # --open-anchors-out: the earlier rounds' open threads, read before this
          # review posts; `Auto-approve decision` gates on that same snapshot, and
          # without it (an unreadable thread list) fails closed to `full`.
          SCOPE_FLAGS=(--approve-threshold "$APPROVE_THRESHOLD" --approve-scope "$APPROVE_SCOPE"
                       --incremental /tmp/pr-diff-new.patch --incremental-state "$INCREMENTAL_STATE"
                       --open-anchors-out /tmp/open-anchors.json)
          if [ "$JUDGE_LEDGER_OK" != "true" ]; then
            LEDGER_FLAGS+=(--no-judge-ledger)
          fi

          # Three cases:
          # 1. Judge ok                       → normal consolidated review.
          # 2. Judge failed, panel has findings → post the raw per-cell findings
          #    with a notice banner (degraded, but NOT a bare "Review failed").
          # 3. Judge failed, no findings       → honest error review.
          if [ "$JUDGE_STATUS" = "ok" ]; then
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --merge-base-sha "$MERGE_BASE_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              --diff /tmp/pr-diff.patch \
              "${LEDGER_FLAGS[@]}" \
              "${SCOPE_FLAGS[@]}" \
              --ledger-note "$LEDGER_NOTE"
          elif [ "${CONSOLIDATED_COUNT:-0}" != "0" ]; then
            # No JUDGE_ERROR is read here on purpose: this branch passes --notice with
            # $JUDGE_STATUS and never --error-message, so the message had nowhere to go
            # — and extracting it could still kill the step. json.load accepts an
            # escaped lone surrogate in `error`, print() then raises UnicodeEncodeError,
            # and under this step's `bash -e` a standalone assignment inherits its
            # command substitution's exit status, so the shell would exit before the raw
            # un-adjudicated panel review is posted. That review is the whole point of
            # this branch.
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --merge-base-sha "$MERGE_BASE_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              --diff /tmp/pr-diff.patch \
              "${LEDGER_FLAGS[@]}" \
              "${SCOPE_FLAGS[@]}" \
              --ledger-note "$LEDGER_NOTE" \
              --notice "⚠️ The judge step did not submit a final review through its structured-output tool (status=${JUDGE_STATUS}). The findings below are the raw, un-adjudicated panel output — they may contain duplicates or false positives the judge would normally filter."
          else
            # Bound the message HERE, before it becomes a single argv element: Linux
            # rejects one argument over ~128 KiB at execve, so an unbounded
            # $JUDGE_ERROR would fail the exec and produce no error review and no job
            # summary at all — precisely the largest failures post-review.py's own
            # message budget was added for, which can only run once Python has started.
            # A BYTE cut cannot guarantee post-review.py's CHARACTER budget
            # (MAX_ERROR_MESSAGE_CHARS) then trips: 100 KB of emoji decodes to 25,000
            # characters and of CJK to ~33,000, both under it, so a message severed here
            # would reach post_error_review looking complete and carry no "(truncated…)"
            # marker. Raising the byte cut to make that impossible would breach
            # MAX_ARG_STRLEN, so say it HERE instead — the marker is appended only when
            # the cut actually fired. (Command substitution also strips trailing
            # newlines and cannot carry NUL; neither changes what the reader is told.)
            JUDGE_ERROR=$(python3 -c "import json; e = str(json.load(open('/tmp/consolidated/judge-findings.json')).get('error', '(no error message)')).encode('utf-8', 'replace'); cut = e[:100000]; print(cut.decode('utf-8', 'ignore') + ('' if len(cut) == len(e) else ' …(truncated: the error message exceeded the 100 KB argument budget)'))")
            python3 "$CURSOR_REVIEW_ASSETS/post-review.py" \
              --findings /tmp/consolidated/consolidated.json \
              --pr-number "$PR_NUMBER" \
              --repo "$REPO" \
              --commit-sha "$HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --merge-base-sha "$MERGE_BASE_SHA" \
              --triggered-by "$TRIGGERED_BY" \
              "${LEDGER_FLAGS[@]}" \
              --ledger-note "$LEDGER_NOTE" \
              --error-message "Judge call failed (status=${JUDGE_STATUS}): ${JUDGE_ERROR}"
          fi

      - name: Auto-approve decision
        # Opt-in (inputs.approve_max_severity). Runs only after `Post review`
        # succeeded, so the decision is about a review that is on the PR. All of
        # the fail-closed rules live in auto-approve.py (see its docstring); this
        # job checks out no PR code, so the PR cannot rewrite the logic judging it.
        # continue-on-error: the decision is advisory to THIS job. A refused
        # approval (e.g. the github-actions[bot] fallback with "Allow GitHub
        # Actions to create and approve pull requests" off) must not turn
        # `post-review` red, because the blocking gate reads that job's result as
        # "the review did not land" — and it did land. The step's own ::error::
        # and red step mark still show the refusal.
        id: approve
        if: ${{ inputs.approve_max_severity != '' }}
        continue-on-error: true
        env:
          APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
          APP_SLUG: ${{ steps.bot_token.outputs.app-slug }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THRESHOLD: ${{ inputs.approve_max_severity }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          JUDGE_STATUS: ${{ steps.meta.outputs.judge_status }}
          DELIVERED: ${{ steps.post.outputs.delivered }}
          UNGATED: ${{ steps.post.outputs.ungated_findings }}
          # The base this round diffed against (`BASE_SHA` above is this
          # event's too): decide refuses if the live base differs, and records
          # it in the review so a later retarget is caught from live state.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFER_APPROVAL: ${{ inputs.defer_approval }}
          APPROVE_SCOPE: ${{ inputs.approve_scope }}
          INCREMENTAL_STATE: ${{ needs.diff-size.outputs.incremental_state }}
          MAX_FAILED_REVIEWERS: ${{ inputs.approve_max_failed_reviewers }}
          # aggregate-panel.py's step output, written before the judge ran —
          # not consolidated.json, which `consolidate` builds after the judge
          # (`--trust`, same job) could have rewritten its inputs.
          PANEL_INCONSISTENT: ${{ needs.consolidate.outputs.panel_inconsistent }}
          # approve_authors, resolved by `gate`: `false` → decide posts nothing
          # and reports `off` for this author.
          AUTHOR_ENABLED: ${{ needs.gate.outputs.approve_author_ok }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # For the cursor-approve status card decide writes every round
          # (BE-19489): round-cap's count is the heading's "round R of M".
          ROUND: ${{ needs.round-cap.outputs.next_round }}
          MAX_ROUNDS: ${{ needs.round-cap.outputs.max_rounds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Same identity precedence as `Dismiss stale auto-approval`: the login
          # passed here is the one whose earlier approvals an untrusted round
          # withdraws.
          # CAN_RELABEL: whether this token can re-run a round by removing and
          # re-adding the review label (BE-19526). A GITHUB_TOKEN-applied label
          # fires NO workflow run — the reason cursor-review-auto-label.yml
          # exists at all — so the fallback identity must never auto-retry: the
          # relabel would land and start nothing. A PAT and an App token both
          # fire runs. Needs label write on whichever is configured.
          if [ -n "$APPROVER_TOKEN" ]; then
            export GH_TOKEN="$APPROVER_TOKEN"
            LOGIN="$(gh api user --jq .login)"
            CAN_RELABEL=true
          elif [ -n "$BOT_TOKEN" ]; then
            export GH_TOKEN="$BOT_TOKEN"
            LOGIN="${APP_SLUG}[bot]"
            CAN_RELABEL=true
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            LOGIN="github-actions[bot]"
            CAN_RELABEL=false
          fi
          # The identity `Post review` posted the findings under — keyed on the
          # same `bot_token.outputs.token || GITHUB_TOKEN` choice it made, not on
          # the slug alone: on APPROVE, only threads it started are auto-resolved.
          if [ -n "$BOT_TOKEN" ] && [ -n "$APP_SLUG" ]; then POSTER="${APP_SLUG}[bot]"; else POSTER="github-actions[bot]"; fi
          python3 "$CURSOR_REVIEW_ASSETS/auto-approve.py" decide \
            --threshold "$THRESHOLD" \
            --findings /tmp/consolidated/consolidated.json \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --commit-sha "$HEAD_SHA" \
            --judge-status "$JUDGE_STATUS" \
            --delivered "$DELIVERED" \
            --ungated "${UNGATED:-0}" \
            --approver-login "$LOGIN" \
            --reviewed-diff /tmp/pr-diff.patch \
            --base-ref "$BASE_REF" \
            --poster-login "$POSTER" \
            --defer-approval "$DEFER_APPROVAL" \
            --approve-scope "$APPROVE_SCOPE" \
            --incremental /tmp/pr-diff-new.patch \
            --incremental-state "$INCREMENTAL_STATE" \
            --ledger /tmp/ledger/ledger.json \
            --open-anchors /tmp/open-anchors.json \
            --max-failed-reviewers "${MAX_FAILED_REVIEWERS:-0}" \
            --panel-inconsistent "$PANEL_INCONSISTENT" \
            --author-enabled "$AUTHOR_ENABLED" \
            --pr-author "$PR_AUTHOR" \
            --card true \
            --round "$ROUND" \
            --max-rounds "$MAX_ROUNDS" \
            --run-url "$RUN_URL" \
            --review-label "$REVIEW_LABEL" \
            --can-relabel "$CAN_RELABEL"

  dismiss-stale-approval:
    # Companion to `Auto-approve decision`. A ruleset with
    # `dismiss_stale_reviews_on_push: false` keeps an approval valid for every
    # later commit, so when what was reviewed changes the bot withdraws its own
    # auto-approve APPROVALS. A request-changes stays on a push: a push under a
    # label-triggered caller starts no new round, so only a later round's own
    # review may supersede the veto. It is withdrawn only once no round is
    # coming: the PR carries `skip-cursor-review` or `needs-human-review`, or
    # `approve_max_severity` is empty (`--threshold`). Only reviews carrying the auto-approve
    # marker and authored by the approver identity are touched. Independent of
    # `gate`: it must run on a push whether or not a panel runs. Checks out no
    # PR code.
    #
    # NOT gated on `approve_max_severity`: unsetting that input is the kill
    # switch for NEW approvals, and an approval already on the PR must still be
    # withdrawn by the next push. On a caller that never approved, the job lists
    # the reviews, finds none of its own marked approvals, and does nothing.
    #
    # Three events change what was reviewed: `synchronize` (a push), `reopened`
    # (a push that landed while the PR was closed arrives as this, not as
    # `synchronize`) and an `edited` that carries `changes.base` (a retarget —
    # same head, different diff). Each fires only if the caller lists it in
    # `types:`. Staleness is read from the PR's LIVE head and base, never from
    # the event, so the job runs on EVERY action of an open PR: any event in the
    # same concurrency slot can cancel an in-flight dismissal, and whichever run
    # replaces it must redo that dismissal from live state. Each approval
    # records its base, so a retarget is caught that way too; `BASE_FROM`
    # (`--all-approvals`) only covers approvals posted before that record.
    # A third trigger is the `skip-cursor-review` veto label (auto-approve.py's
    # VETO_LABELS, read off the live PR): `gate` runs no round on a vetoed PR,
    # so a `labeled` event reaching this job is what withdraws EVERY marked
    # approval, same head or not — as does `needs-human-review`, the hand-off
    # (BE-19492). Hence no `github.event.action` filter here.
    # Open PRs only: a title edit on a merged PR must not try a dismissal.
    name: Dismiss stale auto-approval
    if: >-
      ${{ github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      # Now that this job runs for every caller, not only auto-approve ones, a
      # `bot_app_id` caller reaches it on runs with no secrets (Dependabot PRs
      # read the Dependabot store). Mint only when the key is present; the
      # `secrets` context is unavailable in step `if:`, hence the job env.
      BOT_CONFIGURED: ${{ inputs.bot_app_id != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Mint bot-identity token (optional)
        id: bot_token
        if: env.BOT_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Dismiss stale auto-approve reviews
        env:
          APPROVER_TOKEN: ${{ secrets.APPROVER_TOKEN }}
          BOT_TOKEN: ${{ steps.bot_token.outputs.token }}
          APP_SLUG: ${{ steps.bot_token.outputs.app-slug }}
          FALLBACK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BOT_APP_ID: ${{ inputs.bot_app_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # The head at event delivery: a fallback ONLY for when the live head
          # cannot be read — staleness is judged against the live PR otherwise.
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Non-empty only on a base retarget (`edited` with `changes.base`).
          BASE_FROM: ${{ github.event.changes.base.ref.from }}
          # Empty = auto-approve is off: its standing requests for changes are
          # withdrawn, since no round will ever approve over them.
          THRESHOLD: ${{ inputs.approve_max_severity }}
        run: |
          # Same identity precedence as `Auto-approve decision`, so the login
          # whose reviews are dismissed is the login that posted them.
          if [ -n "$APPROVER_TOKEN" ]; then
            export GH_TOKEN="$APPROVER_TOKEN"
            LOGIN="$(gh api user --jq .login)"
          elif [ -n "$BOT_TOKEN" ]; then
            export GH_TOKEN="$BOT_TOKEN"
            LOGIN="${APP_SLUG}[bot]"
          elif [ -n "$BOT_APP_ID" ]; then
            # The App is the approver identity but its key is not in this run's
            # secrets (e.g. a Dependabot PR), so we can neither name nor act as
            # it. Read-only with the job token and an EMPTY login: nothing is
            # dismissed, and any stale marked approval turns the job red.
            echo "::warning::bot_app_id is set but BOT_APP_PRIVATE_KEY is not available to this run — checking for stale auto-approvals without dismissing any."
            export GH_TOKEN="$FALLBACK_TOKEN"
            LOGIN=""
          else
            export GH_TOKEN="$FALLBACK_TOKEN"
            LOGIN="github-actions[bot]"
          fi
          # A retarget: the head did not move, the diff did — so an approval
          # pinned to the head is as stale as an off-head one. (Approvals that
          # record their base are caught without this; older ones are not.)
          # Under APPROVER_TOKEN / the fallback, a stale marked approval by any
          # OTHER login (e.g. APPROVER_TOKEN unavailable on a Dependabot PR)
          # also turns the job red rather than passing unchecked.
          ALL=()
          if [ -n "$BASE_FROM" ]; then
            ALL=(--all-approvals)
          fi
          python3 "$CURSOR_REVIEW_ASSETS/auto-approve.py" dismiss-stale \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --approver-login "$LOGIN" \
            --head-sha "$EVENT_HEAD_SHA" \
            --threshold "$THRESHOLD" \
            "${ALL[@]}"

  panel-integrity:
    # ONE advisory check-run that says whether the panel that just ran was whole.
    #
    # Everything it reports was already knowable — and none of it reached a
    # check-run conclusion, which is the only surface an automated merge gate
    # reads. `Aggregate panel findings` printed "2/6 cells contributed findings"
    # into a log; post-review.py emitted `ungated_findings=<n>` as a job output
    # nothing consumed; a leg that never submitted exited green. Measured on one
    # consumer repo over 92 panel runs: 38 runs had at least one errored leg, 52
    # of 552 cells errored, and every leg check in every one of those runs
    # reported `success`, so `statusCheckRollup` was fully green over panels that
    # were a third of a panel (BE-15554).
    #
    # This is the panel-level half of that fix; `Fail the leg when the cell did
    # not submit` in the `review` job is the per-cell half. This job is what a
    # gate should read, because a matrix leg's context name carries the model id
    # and therefore CHANGES whenever the panel list does — a required check on
    # `edge-case (kimi-k3-max)` bricks every PR the day that pin moves.
    #
    # ADVISORY by default, exactly like `Blocking gate`: red here fails no other
    # job IN THIS WORKFLOW, gates no merge, and does not gate `post-review` — a
    # caller that wants it to block marks `<caller job id> / Panel integrity` a
    # required check in its own ruleset. See docs/callers/cursor-review.md.
    #
    # "Advisory" stops at this workflow's edge, and the distinction is not
    # academic. Red here puts the CALLER's `uses:` job in `failure`, so any
    # caller job chained off it with a bare `needs:` is skipped by GitHub's
    # default rule — which is how one errored cell silently stopped the
    # cursor-approve axes from running at all, and withheld every approval, on a
    # caller that had set `approve_max_failed_reviewers: 1` precisely to tolerate
    # it. A red matrix leg does this on its own too, so dropping the check would
    # not have helped. Downstream caller jobs must be guarded with `!cancelled()`
    # and gated on `approve_gate`, which already fails closed; see
    # docs/callers/cursor-approve.md ("A red panel cell must not skip the axes").
    #
    # `always()`, and the same four gate conditions `consolidate` uses, so this
    # reports on exactly the runs where a panel was supposed to happen and stays
    # skipped on the ones where nothing was (no trigger label, already reviewed,
    # capped by `max_rounds`, over the diff-size cap, panel skipped). `always()` rather than
    # `!cancelled()` for `Blocking gate`'s reason: GitHub counts a SKIPPED
    # required check as passing, so green-on-cancel would be a fail-open for any
    # caller that requires this. A cancelled run therefore reports red here —
    # under the documented `cancel-in-progress` caller that check lands on the
    # superseded head SHA, not the new one.
    #
    # That same "skipped counts as passing" rule is why those four conditions
    # cannot be read STRAIGHT off `gate`, `diff-size` and the matrix. Three of
    # them are job OUTPUTS, and a job that FAILED has empty outputs — so a gate
    # whose dup-check API call errored, or a diff-size that could not build the
    # diff at all, would make all four false, skip this job, and mint a GREEN
    # required check on a run where whether the PR was reviewed is unknown. The
    # fourth, `needs.review.result != 'skipped'`, has the same hole from the
    # other end: the matrix declares `needs: [gate, diff-size, preflight,
    # ledger]`, so a non-success in ANY of those four skips the whole matrix and
    # leaves a 'skipped' result that reads exactly like the deliberate no-panel
    # branches — a green check over a run where not one cell ever started. An
    # undecided run is not a clean run. So the condition below runs this job
    # whenever an upstream DECISION job (`gate`, `diff-size`, `preflight`,
    # `ledger`) did not succeed, and `Fail if the panel decision itself did
    # not complete` turns that into red — the same fail-closed shape, and the
    # same reasoning, as `Blocking gate`'s first two guards. The deliberate
    # skips are unchanged: they are the branches where `gate` and `diff-size`
    # both SUCCEEDED and said no panel was warranted.
    #
    # Every job the matrix `needs:` must be listed here. That list is the
    # invariant — not the four names that happen to be in it today — because a
    # job added to `review`'s `needs:` without being added here re-opens this
    # exact fail-open silently, which is how `preflight` and then `ledger` were
    # each missed in turn. `test_workflow_panel_integrity.py` pins the two lists
    # against each other so the next one cannot be.
    #
    # `round-cap` is the one decision job the matrix does NOT need directly: it
    # sits upstream of `diff-size`, whose own `if:` skips on `capped == 'true'`.
    # So it is read here on BOTH sides. A `round-cap` that did not succeed skips
    # `diff-size` and the panel with it — undecided, so red, like the four
    # above. A `round-cap` that SUCCEEDED and said `capped` is the deliberate
    # `max_rounds` stop: no panel was warranted on this head, the PR is labelled
    # `needs-human-review`, and the Blocking gate already fails closed on it, so
    # this check skips exactly as it does over the diff-size cap. Without the
    # `capped` disjunct the skipped `diff-size` reads as a failure and the guard
    # below goes red telling the caller to "re-run the failed job" — which just
    # hits the cap again.
    name: Panel integrity
    needs: [gate, round-cap, diff-size, preflight, ledger, review, consolidate, post-review]
    if: ${{ always() && (needs.gate.result != 'success' || (needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && (needs.round-cap.result != 'success' || (needs.round-cap.outputs.capped != 'true' && (needs.diff-size.result != 'success' || (needs.diff-size.outputs.within_cap == 'true' && (needs.preflight.result != 'success' || needs.ledger.result != 'success' || needs.review.result != 'skipped'))))))) }}
    runs-on: ubuntu-latest
    # Reads job outputs and prints. No API call, no checkout, no network.
    timeout-minutes: 5
    # Nothing at all: this job reads `needs` outputs and writes annotations.
    # An empty block is not the same as an absent one — a `workflow_call`
    # reusable with no `permissions:` INHERITS the caller job's, and the
    # documented caller grants `pull-requests: write`.
    permissions: {}
    steps:
      - name: Fail if the panel decision itself did not complete
        # Fail-closed guard, and it has to come FIRST because every cause in the
        # step below is phrased in terms of job outputs that are EMPTY when the
        # job producing them failed — and every one of those causes treats the
        # empty string as a pass. Reaching `Report panel integrity` on this path
        # would print "no review delivered" over a run whose panel was never
        # even decided on, which is a true statement about the wrong question.
        #
        # This condition is exact GIVEN the job `if:` above, which admits only
        # four ways to arrive here with an upstream decision job unfinished:
        # `gate` did not succeed; `gate` selected a fresh in-scope review and
        # `round-cap` did not succeed; `round-cap` succeeded uncapped and
        # `diff-size` did not succeed; or all three succeeded and said review,
        # and `preflight` or `ledger` did not succeed. All five are read back
        # verbatim. (`within_cap` can only be the string 'true' when `diff-size`
        # succeeded, and a `capped` round-cap skips the job outright, so neither
        # deliberate stop ever reaches this step.)
        #
        # `preflight` and `ledger` are here because they are the decision jobs
        # whose failure is invisible from the outputs: `review` needs BOTH, so a
        # non-success in either SKIPS the whole matrix, `needs.review.result` is
        # then 'skipped' — indistinguishable from the deliberate no-panel
        # branches — and gating on that alone skipped this job and minted a
        # GREEN required check on a run where NOTHING was reviewed. The job
        # `if:` therefore admits a non-success `preflight` or `ledger` under a
        # within-cap fresh review, and this step turns it red. A panel that
        # never started is not a whole one.
        #
        # `ledger` is the one that reads like it cannot happen: every step in it
        # is `continue-on-error`, precisely so it never skips the matrix. That
        # makes a red `ledger` rare, NOT unreachable — its own job comment is
        # written around the consequence. `Ensure ledger artifact exists` carries
        # no `continue-on-error`; the job's 20-minute cap sits above only 15
        # minutes of step caps, so the two untimed steps can trip the JOB
        # timeout; and a cancelled or infrastructure-lost `ledger` is neither
        # 'success' nor a step outcome at all. Rare is the wrong bar for a guard
        # whose failure mode is handing out a green required check.
        #
        # Note these are read as RESULTS, not as a reason to believe the matrix
        # ran: if `review` ran at all, all four succeeded, so this guard can only
        # fire on runs where the panel never started.
        if: ${{ needs.gate.result != 'success' || needs.round-cap.result != 'success' || needs.diff-size.result != 'success' || needs.preflight.result != 'success' || needs.ledger.result != 'success' }}
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          ROUND_CAP_RESULT: ${{ needs.round-cap.result }}
          DIFF_SIZE_RESULT: ${{ needs.diff-size.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          LEDGER_RESULT: ${{ needs.ledger.result }}
        run: |
          echo "::error::Panel integrity cannot be judged: the jobs that decide whether a panel should run did not succeed (gate: ${GATE_RESULT}, round cap: ${ROUND_CAP_RESULT}, diff size: ${DIFF_SIZE_RESULT}, preflight: ${PREFLIGHT_RESULT}, ledger: ${LEDGER_RESULT}). Whether this PR was reviewed at all is unknown — re-run the failed job."
          exit 1

      - name: Report panel integrity
        env:
          OK_COUNT: ${{ needs.consolidate.outputs.ok_count }}
          TOTAL: ${{ needs.consolidate.outputs.total }}
          PANEL_INCONSISTENT: ${{ needs.consolidate.outputs.panel_inconsistent }}
          DEGRADED: ${{ needs.consolidate.outputs.degraded }}
          JUDGE_STATUS: ${{ needs.consolidate.outputs.judge_status }}
          DELIVERED: ${{ needs.post-review.outputs.delivered }}
          GATED: ${{ needs.post-review.outputs.gated_findings }}
          UNGATED: ${{ needs.post-review.outputs.ungated_findings }}
          # The RESULTS of the two jobs every value above comes out of. Each
          # cause below is phrased against an OUTPUT, and an output is the empty
          # string when the job producing it failed, was skipped or was
          # cancelled — a state every one of those causes would otherwise read
          # as a pass. `OK_COUNT != TOTAL` is the sharpest case: both are empty
          # on a dead `consolidate`, so the comparison is unset-vs-unset and
          # says "whole panel". That is caught today only because `DELIVERED`
          # happens to be empty on those same runs, which is coincidence, not a
          # guard — `post-review.py` writes `delivered=true` the moment the POST
          # returns and keeps working, so a `post-review` that dies in a LATER
          # step leaves delivered=true behind a red job. Read both signals, the
          # way `Blocking gate`'s second guard does.
          CONSOLIDATE_RESULT: ${{ needs.consolidate.result }}
          POST_REVIEW_RESULT: ${{ needs.post-review.result }}
          # LIVE since #321, which landed the incremental-diff fix this used to
          # wait on: `diff-size` now declares the output on every run it
          # completes, so this expression is the literal 'true' or 'false', and
          # empty only when `diff-size` did NOT succeed — a path the guard step
          # above has already exited 1 on.
          #
          # Read what 'false' MEANS, though, because it is not what the name
          # suggests and it is why this is reported below as a ::warning:: that
          # does NOT count toward `causes`. #321 made the subset check fail
          # CLOSED: a block that does not verify is DISCARDED WHOLE and the
          # panel runs on the full reviewed diff alone. So a 'false' run hands
          # the cells byte-identical input to a run that never built a block at
          # all — round 1, or any "could not build one" branch — and both of
          # those report 'true'. The panel is provably just as whole; nothing
          # was skipped and no finding was suppressed. `Panel integrity` is a
          # check callers are told to mark REQUIRED, so reddening it over a run
          # whose reviewed content is indistinguishable from a normal one is a
          # merge-blocking false positive. The anomaly is still worth seeing —
          # a 'false' means the BUILDER emitted a non-subset, a real defect —
          # so it is annotated, just not as a panel-integrity failure.
          INCREMENTAL_SUBSET: ${{ needs.diff-size.outputs.incremental_subset }}
        run: |
          # Every value below is a job output, and two of them (`JUDGE_STATUS`
          # from the judge agent's own tool output, and the counts that follow a
          # panel cell's artifact) originate in agent-written files inside jobs
          # that run `--trust` over PR code. They land in ::workflow command::
          # lines here, where a newline would forge a second command, so flatten
          # and clamp before echoing.
          #
          # Escaping `%` is the other half of that, and it is not optional: the
          # runner UNESCAPES `%25`, `%0D` and `%0A` in a command's message, so
          # deleting real newlines alone is not enough. A judge that writes its
          # `status` as `error%0A::stop-commands::x` reaches this line carrying
          # no newline at all — and the runner puts one back, forging the second
          # command `tr` was supposed to prevent. `%` -> `%25` turns that into
          # the inert literal text `%0A`. It is the same escape every checker in
          # this repo already applies before annotating (`check_agents_md.py`,
          # `check_workflow_pins.py`, `check-org-repo-literals.sh`), and only
          # `JUDGE_STATUS` can actually carry a `%` today: the counts are
          # python-formatted integers and the rest are job results.
          #
          # Order is load-bearing at both ends. AFTER `tr`, so a real newline is
          # dropped rather than escaped back into one by the runner; and AFTER
          # `cut`, so the clamp can never split a `%25` it just created (`cut`
          # only ever removes characters, so it cannot forge one either).
          flatten() { printf '%s' "$1" | tr -d '\r\n' | cut -c1-64 | sed 's/%/%25/g'; }

          causes=0

          # Job-result causes FIRST, so a dead producer is named as itself
          # rather than inferred from the empty outputs it left behind.
          if [ "$CONSOLIDATE_RESULT" != "success" ]; then
            echo "::error::The panel was never adjudicated: the Consolidate panel job did not succeed (result=$(flatten "${CONSOLIDATE_RESULT:-<unset>}")). Its cell counts and judge status are unavailable, so panel completeness is unknown rather than clean."
            causes=$((causes + 1))
          fi

          if [ "$POST_REVIEW_RESULT" != "success" ]; then
            echo "::error::The Post review job did not succeed (result=$(flatten "${POST_REVIEW_RESULT:-<unset>}")), so whether a review with resolvable threads reached this PR is unknown — delivered=true is written the moment the POST returns, before the rest of that job runs."
            causes=$((causes + 1))
          fi

          # An EMPTY count is not a matching count. Guarded separately from the
          # comparison below because unset-vs-unset compares EQUAL in `test`,
          # which is the one way this check could print "whole panel" having
          # counted nothing at all.
          if [ -z "$OK_COUNT" ] || [ -z "$TOTAL" ]; then
            echo "::error::Panel cell counts are missing (ok_count=$(flatten "${OK_COUNT:-<unset>}"), total=$(flatten "${TOTAL:-<unset>}")), so how many reviewer cells submitted cannot be established. Treat this as an incomplete panel, not a whole one."
            causes=$((causes + 1))
          elif [ "$OK_COUNT" != "$TOTAL" ]; then
            echo "::error::Panel incomplete: $(flatten "$OK_COUNT") of $(flatten "$TOTAL") reviewer cells submitted a review. The consolidated review was adjudicated over a short panel — see the red leg checks for which cells did not submit."
            causes=$((causes + 1))
          fi

          # Separate from the counts: here they can MATCH, and that is the
          # problem. See aggregate-panel.py's two cross-checks.
          if [ "$PANEL_INCONSISTENT" = "true" ]; then
            echo "::error::A findings artifact may not be its own cell's: a reviewer leg did not succeed although every findings artifact reads ok, or a record disagrees with the artifact name it sits under (see the Aggregate panel findings warnings). Something other than that cell uploaded it, or an upload failed after the review. The panel count is untrusted; see the red leg checks."
            causes=$((causes + 1))
          fi

          # Non-empty AND greater than zero: an EMPTY value means post-review
          # never got as far as deciding, which `DELIVERED` below reports on its
          # own terms rather than as a phantom unanchored finding.
          if [ -n "$UNGATED" ] && [ "$UNGATED" != "0" ]; then
            echo "::error::$(flatten "$UNGATED") finding(s) could not be anchored to the reviewed diff and were demoted to the review body, where they have no thread to resolve. Read the review body, not just the inline comments."
            causes=$((causes + 1))
          fi

          if [ "$DELIVERED" != "true" ]; then
            echo "::error::No review carrying resolvable finding threads was delivered to this PR (post-review delivered=$(flatten "${DELIVERED:-<unset>}")). The findings, if any, are in the post-review job summary."
            causes=$((causes + 1))
          fi

          if [ "$DEGRADED" = "true" ]; then
            echo "::error::The judge did not adjudicate this panel (judge status=$(flatten "${JUDGE_STATUS:-?}")); the review was built from the raw union of the cells' findings, so duplicates and false positives were not filtered."
            causes=$((causes + 1))
          fi

          # Deliberately NOT a cause, and deliberately not phrased as one —
          # see the INCREMENTAL_SUBSET comment above. The block was thrown
          # away, so the cells read the full reviewed diff, exactly as they do
          # on round 1. Surfaced because a non-subset block means the BUILDER
          # misbehaved, never because this panel came up short.
          if [ "$INCREMENTAL_SUBSET" = "false" ]; then
            echo "::warning::The incremental \"new since the last reviewed round\" block failed its subset check and was discarded, so the panel reviewed the full diff without a prioritization hint. Nothing was skipped and no finding was suppressed — see the 'Incremental diff discarded' warning on the Diff size check job for the counts."
          fi

          if [ "$causes" -ne 0 ]; then
            echo "Panel integrity: $causes problem(s) above."
            exit 1
          fi

          echo "::notice::Panel integrity: $(flatten "$OK_COUNT")/$(flatten "$TOTAL") cells, $(flatten "${GATED:-0}") anchored finding(s), 0 unanchored."

  blocking-gate:
    # Opt-in merge gate (inputs.blocking), restored by BE-4691 after #31
    # dropped it unintentionally. Fails this check while the PR has unresolved,
    # non-outdated cursor-review finding threads, so a caller that marks
    # "Blocking gate" a required status check blocks merge until every finding
    # thread is addressed. With blocking:false (default) this job is skipped
    # entirely — the review stays advisory and no enrolled caller's behavior
    # changes.
    #
    # With blocking on, this job runs on EVERY delivered event — deliberately
    # NOT conditioned on `should_run`, unlike the original #16 job. A skipped
    # required check counts as PASSING, so any run where the trigger step says
    # "don't review" (an unrelated label toggled, skip-cursor-review present,
    # the trigger label removed) would otherwise mint a green "Blocking gate"
    # over open finding threads. Running unconditionally makes the verdict
    # event-independent: are there live unresolved cursor-review threads on
    # this PR right now. That is also what makes a pull_request_review_thread
    # trigger in the caller's `on:` block a pure re-check — the trigger step
    # leaves should_run=false, so the panel, comments and DMs all stay skipped
    # while this gate re-queries thread state and flips green on the last
    # resolve. The same holds for plain PR events under a label-gated caller,
    # so a blocking caller that widens its `types:` gets a gate verdict on
    # every push instead of a required check stuck at "Expected".
    # (Fork PRs never gate red: their runs can post no review, so they have no
    # finding threads to be unresolved.)
    #
    # `needs: post-review` orders it after the review's threads exist on a
    # fresh run; `always()` (not `!cancelled()`) is what keeps it reporting.
    # post-review uses `!cancelled()` because it WRITES and must not race the
    # run that superseded it — this job writes nothing, it re-reads live thread
    # state, so a superseded run and its replacement can only agree. What
    # `!cancelled()` would cost is the whole point of the job: a cancelled run
    # skips it, GitHub counts a skipped required check as PASSING, and the
    # documented caller makes cancellation easy to reach (`cancel-in-progress`
    # puts thread-resolve events in the same group as panel runs, and an author
    # can cancel by hand). Green-on-cancel is the exact fail-OPEN this job
    # exists to close, so it runs on cancellation too — and if the teardown
    # takes its steps down with it, the check goes RED, which is the safe side.
    name: Blocking gate
    needs: [gate, round-cap, diff-size, post-review]
    if: ${{ always() && inputs.blocking }}
    runs-on: ubuntu-latest
    # One paged GraphQL query through gh — minutes at most; bounded like every
    # other job here so a hung API call cannot hold a runner for the 6-hour
    # default.
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if the trigger decision itself failed
        # FIRST fail-closed guard, and it has to come first because every guard
        # below is phrased in terms of `needs.gate.outputs.*`. Those outputs are
        # EMPTY when the gate job failed — its dup-check API call and its label
        # `jq` can both error — so `should_run == 'true'` is false, every
        # downstream guard skips, and the run falls through to a thread query
        # that finds nothing on a PR nobody ever decided to review. That is a
        # green required check produced by a red job, on exactly the path these
        # guards exist to close. An undecided run is not a clean run.
        if: ${{ needs.gate.result != 'success' }}
        env:
          GATE_RESULT: ${{ needs.gate.result }}
        run: |
          echo "::error::The cursor-review trigger job did not succeed (gate: $GATE_RESULT), so whether this PR should have been reviewed is unknown — refusing to pass the blocking gate. Re-run the failed job."
          exit 1

      - name: Fail if the fresh review did not land
        # SECOND fail-closed guard. A gate that passed while the review it gates
        # on never landed would be fail-OPEN: no threads exist, the query below
        # finds nothing, green check. So on the fresh path — the trigger step
        # said a panel should run and no dedupe hit — refuse to pass unless the
        # pipeline actually delivered a review.
        #
        # Two things are checked, and BOTH are needed:
        #
        # * `needs.post-review.result == 'success'`. post-review, not
        #   consolidate, is the terminal write since the credential split: a
        #   consolidate that succeeded into a failed post still posted nothing.
        # * `needs.post-review.outputs.delivered == 'true'`. The job result is
        #   NOT sufficient on its own — post-review.py exits 0 after a
        #   read-only-token 403 (review written to the job summary, never to the
        #   PR), after the body-only "Review failed" error review, after the
        #   no-findings review a run posts when every panel cell errored, and
        #   after the 422 inline-anchor fallback. Each of those is a zero exit
        #   over a round that adjudicated nothing, and each leaves the thread
        #   query below empty. The script therefore emits the claim positively
        #   (see its emit_delivery); an unset value — the script died before
        #   deciding — is not `'true'`, so the default is closed.
        #
        # Over the cap is NOT exempt any more. It used to fall through to the
        # thread query as a "documented, announced skip", but diff size is fully
        # author-controlled: padding a PR past `diff_size_cap` skipped the panel
        # AND outdated every thread an earlier under-cap round had posted, so one
        # commit both cleared the existing findings and greened the gate. "Too
        # big to review" is not evidence a PR is clean. For a blocking caller the
        # over-cap path now holds the check red (post-review is skipped, so this
        # guard fires) until the diff comes under the cap or the caller raises
        # `diff_size_cap`. Only the genuinely review-free paths stay exempt —
        # should_run=false events and the already_reviewed re-trigger — and those
        # fall through to the live thread query, which is the whole verdict there.
        if: ${{ needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && (needs.diff-size.result != 'success' || needs.post-review.result != 'success' || needs.post-review.outputs.delivered != 'true') }}
        env:
          DIFF_SIZE_RESULT: ${{ needs.diff-size.result }}
          WITHIN_CAP: ${{ needs.diff-size.outputs.within_cap }}
          POST_REVIEW_RESULT: ${{ needs.post-review.result }}
          DELIVERED: ${{ needs.post-review.outputs.delivered }}
          CAPPED: ${{ needs.round-cap.outputs.capped }}
        run: |
          # The round cap is not exempt either, for the same reason as the size
          # cap below: no panel looked at this head. The PR is handed to a human
          # (needs-human-review); removing that label resets the cap.
          if [ "$CAPPED" = "true" ]; then
            echo "::error::This PR hit cursor-review's max_rounds cap, so no review ran on this head and it is labelled needs-human-review — an unreviewed head cannot pass a blocking gate. Have a human review it, then remove the label to resume automated rounds."
            exit 1
          fi
          if [ "$DIFF_SIZE_RESULT" = "success" ] && [ "$WITHIN_CAP" != "true" ]; then
            echo "::error::This PR's counted diff exceeds diff_size_cap, so no review ran — and an unreviewed PR cannot pass a blocking gate. Split the PR under the cap and re-trigger the review, or raise diff_size_cap on the caller."
            exit 1
          fi
          echo "::error::A fresh review was triggered but did not land on this PR (diff-size: $DIFF_SIZE_RESULT, post-review: $POST_REVIEW_RESULT, delivered: ${DELIVERED:-<unset>}) — refusing to pass the blocking gate. Re-run the failed jobs or re-trigger the review."
          exit 1

      - name: Fail if the review landed with no resolvable threads
        # THIRD fail-closed guard, for the one delivery that is real and still
        # invisible to the query below. post-review.py demotes a finding whose
        # anchor misses the reviewed diff into the review BODY, and falls back to
        # a wholly body-only review when GitHub 422s the inline payload. Neither
        # creates a thread. A round in which EVERY finding was demoted posts N
        # real findings and leaves zero threads — indistinguishable, to a thread
        # query, from a clean PR — so the gate would report green over findings
        # nobody can even reply to, which is precisely the "every finding was
        # explicitly looked at and closed out" claim falsified.
        #
        # Scoped to the fully-degraded round (threads == 0 while body-only
        # findings exist) on purpose. A PARTIALLY demoted round keeps its inline
        # half, so the gate already holds red on those threads; failing on the
        # demoted half too would be a check no thread resolution could ever clear
        # — a bricked PR rather than a gate. That residual is documented in the
        # setup guide's blocking-gate gotchas rather than papered over here.
        if: ${{ needs.post-review.outputs.delivered == 'true' && needs.post-review.outputs.gated_findings == '0' && needs.post-review.outputs.ungated_findings != '0' && needs.post-review.outputs.ungated_findings != '' }}
        env:
          UNGATED: ${{ needs.post-review.outputs.ungated_findings }}
        run: |
          echo "::error::The review landed but every one of its $UNGATED finding(s) was posted in the review body with no inline thread (the anchors missed the reviewed diff, or GitHub rejected the inline payload), so there is nothing for this gate to watch resolve. Read the findings in the review body, push a fix, and re-trigger the review."
          exit 1

      - name: Require a pull-request event
        # gate-unresolved.py's --pr-number is argparse `type=int`, and this job
        # runs on EVERY delivered event by design. On any payload without a pull
        # request — `merge_group` (which a merge queue runs required checks on),
        # `workflow_dispatch`, `push`, `issue_comment` — the expression below is
        # empty and argparse exits 2, leaving a required check permanently red
        # whose only explanation is a traceback and which no thread resolution
        # can clear. Say what is wrong instead. Still a FAILURE, not a skip: a
        # skipped required check counts as passing, and this gate cannot judge a
        # PR it was not handed. The fix is the caller's `on:` block — see the
        # blocking caller shape in docs/callers/cursor-review.md.
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::The blocking gate was triggered by '$EVENT_NAME', which carries no pull_request payload, so it cannot read this PR's review threads. Trigger cursor-review from pull_request / pull_request_review_thread events (see the blocking caller shape in docs/callers/cursor-review.md)."
            exit 1
          fi

      - name: Fail while the PR is handed to a human (round cap)
        # The `round-cap` output above only exists on a run that counted rounds.
        # Every later non-review event on a capped PR — a thread resolve, an
        # unrelated label, the bot's own label write — skips `round-cap`, so the
        # CAPPED check above never fires and the thread query alone would pass
        # once the old threads are resolved or outdated, over a head no panel
        # reviewed. The label is the cap's persistent state (removing it is the
        # reset), so read it live on every event. A failed read fails closed,
        # like every other guard here.
        if: ${{ inputs.max_rounds > 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! labels="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.labels[].name')"; then
            echo "::error::Could not read this PR's labels to check the max_rounds cap — refusing to pass the blocking gate. Re-run the job."
            exit 1
          fi
          if printf '%s\n' "$labels" | grep -qixF 'needs-human-review'; then
            echo "::error::This PR carries needs-human-review (cursor-review's max_rounds cap, or a human hand-off), so automated rounds are paused and no panel has reviewed this head — an unreviewed head cannot pass a blocking gate. Have a human review it, then remove the label to resume automated rounds."
            exit 1
          fi

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Fail on unresolved cursor-review threads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 "$CURSOR_REVIEW_ASSETS/gate-unresolved.py" \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER"


name: Cursor Review (reusable)

# Reusable, label-triggered multi-model code review. A multi-lab × 2-review-type
# panel (one cursor-agent cell per model × pass; 6 by default) runs adversarial +
# edge-case passes, then a
# judge model consolidates the findings into ONE review posted on the PR,
# with per-finding severity badges (critical/high/medium/low/nit).
#
# Single source of truth: the prompts and the output/post/notify scripts
# live in THIS repo under .github/cursor-review/. Consumer repos add only a
# thin caller — they don't carry copies of the review logic, so there's no
# drift to keep in sync.
#
# Credential isolation (same two-job split pr-size.yml uses). The invariant:
# NO job both checks out PR code and holds a write-scoped credential. The jobs
# that check out PR code and run cursor-agent over it — `review` and
# `consolidate` — hold `contents: read` and nothing else; the consolidated
# review is posted from a separate `post-review` job that checks out NO PR code
# and receives its payload as an artifact. The jobs that DO carry
# `pull-requests: write` and the BOT_APP_PRIVATE_KEY mint — `post-review`,
# `over-cap-comment`, `dismiss-stale-approval` and `round-cap` — check out
# nothing but this repo's pinned assets. The
# panel and the judge run `cursor-agent --print --trust` without `--sandbox`,
# and print mode can use write and shell tools, so a prompt-injected model could
# rewrite the assets checkout or a downloaded action inside its own job; on a
# fresh runner with a fresh pinned checkout there is nothing tampered for the
# minted token to meet. The optional `runs_on` input moves ONLY the
# credential-free jobs (`diff-size`, `preflight`, `review`, `consolidate`) to a
# caller's pool; every job that mints the App token or holds a write scope is
# hard-pinned to GitHub-hosted `ubuntu-latest`, so a pool never meets one. `.github/cursor-review/tests/test_workflow_job_isolation.py`
# pins this.
#
# Caller pattern (place in source repo at .github/workflows/ci-cursor-review.yml):
#
#   name: CI - Cursor Review
#   on:
#     # The BLOCKING caller shape, because this example sets `blocking: true`
#     # below. A required check must report on the head SHA, and a label-only
#     # `types: [labeled, unlabeled]` delivers no event on push — the check
#     # would sit at "Expected" and brick the PR until someone toggled the
#     # label. `pull_request_review_thread` is what flips the gate green the
#     # moment the last finding thread is resolved. Advisory callers
#     # (`blocking` unset) can keep the narrower label-only pair; see
#     # docs/callers/cursor-review.md for both shapes.
#     pull_request:
#       types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]
#     pull_request_review_thread:
#       types: [resolved, unresolved]
#   permissions:
#     contents: read
#     pull-requests: write
#   concurrency:
#     # KEEP THIS. The reusable owns a workflow-level `concurrency:` block of
#     # its own — that is what makes skip-cursor-review cancel a panel already
#     # running — but it REFINES this group rather than replacing it: under the
#     # default `run_without_label: false` it does not cancel on push. Never
#     # name a caller group `cursor-review-reusable-*` (a caller sharing the
#     # reusable's group deadlocks its own run), and call this from a dedicated
#     # workflow file, not one job of a larger ci.yml — cancellation is
#     # run-scoped. PR number ONLY: `github.event.label.name` is empty on every
#     # widened event, so keying on it splits one PR across groups that cannot
#     # cancel each other.
#     group: cursor-review-pr-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   jobs:
#     cursor-review:
#       uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@<sha>  # v1
#       with:
#         # Repo-specific generated/vendored paths. Fed to the shared
#         # check-pr-size classifier, so they're excluded from BOTH the size gate
#         # and the reviewed diff — the same codegen detection the PR-size cap
#         # uses (lockfiles, base-ref linguist-generated, Go markers are already
#         # built in). Use diff_excludes only for diff-only, non-generated paths.
#         # Setting this REPLACES the default list, so the defaults are re-stated
#         # verbatim here before the repo's own paths. These are plain globs, not
#         # git pathspecs (no `:!` prefix — that is diff_excludes' syntax), and
#         # the shape is load-bearing both ways: a pattern with no `/` matches
#         # the base name only, while one WITH a `/` is anchored to the whole
#         # repo-relative path unless it opens with `**/` — so the
#         # data/object_info.json.gz below is root-only on purpose.
#         extra_generated_globs: >-
#           **/node_modules/**
#           **/dist/**
#           **/vendor/**
#           **/*.generated.*
#           **/*.min.js
#           **/*.min.css
#           data/object_info.json.gz
#           **/*.snap
#         # REQUIRED. Pin the assets ref to the SAME commit SHA you pin `uses:`
#         # to — otherwise the workflow is pinned but its scripts are not.
#         # The workflow checks this against the uses: pin at run time and fails
#         # on a mismatch.
#         workflows_ref: <same-sha-as-uses>
#         # Optional: post the review under your own GitHub App so its threads are
#         # a distinct, queryable identity instead of github-actions[bot]. Supply
#         # your App's id + private key (App IDs aren't secret, so id is an input).
#         bot_app_id: ${{ vars.REVIEW_BOT_APP_ID }}
#         # Optional: make the review blocking. true → the "Blocking gate" check
#         # goes red while any cursor-review finding thread is unresolved. To
#         # actually block merge you must ALSO mark "Blocking gate" as a required
#         # status check in this repo's branch-protection / ruleset settings —
#         # see docs/callers/cursor-review.md for the full flow, including the
#         # pull_request_review_thread trigger that re-checks on thread resolution.
#         blocking: true
#       secrets:
#         CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
#         SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
#         # Optional — the private key paired with bot_app_id.
#         BOT_APP_PRIVATE_KEY: ${{ secrets.REVIEW_BOT_PRIVATE_KEY }}

on:
  workflow_call:
    inputs:
      judge_model:
        description: >-
          Single judge model that adjudicates panel findings into one
          consolidated review. Currently the SAME pin as the panel's Anthropic
          cell (`claude-opus-5-5-xhigh`) — it used to sit one reasoning tier
          below it, until the cell itself moved to `-xhigh` on 2026-10-07. The
          judge adjudicates a bounded text payload with no tools, and ran at
          xhigh until 2026-07-18 with no recorded quality gap, while `max` cost
          ~10% of every run's spend.
        type: string
        required: false
        default: claude-opus-5-5-xhigh
      diff_size_cap:
        description: >-
          Max counted changed lines. PRs over the cap are skipped — too large
          for a useful single-pass review. "Counted" is added + removed lines
          after the shared classifier's generated-file exclusion and (when
          ignore_comments is true) blank/comment-line discounting. The skip is
          NOT silent: it emits a ::warning:: annotation and a step-summary block,
          and upserts one sticky PR comment saying no panel ran — as the bot app
          when bot_app_id + BOT_APP_PRIVATE_KEY are configured, else as
          github-actions[bot] — flipped to ✅ once the PR is back under the cap.
          The run stays green either way; nothing gates.
        type: number
        required: false
        default: 5000
      ignore_comments:
        description: >-
          Discount blank lines and comment-only lines from the counted total, so
          AI-generated comment volume doesn't push a PR over the cap and skip the
          review. Count-only: comments are still sent to the review panel (a
          reviewer should catch wrong or misleading comments). Heuristic
          (per-language, single-line comment markers; multi-line block-comment
          bodies and string literals aren't lexed), so it's approximate. Default
          true; set false to count every changed line.
        type: boolean
        required: false
        default: true
      review_label:
        description: Label whose addition triggers the review.
        type: string
        required: false
        default: cursor-review
      extra_generated_globs:
        description: >-
          Extra glob patterns treated as generated, fed to the shared
          check-pr-size classifier. Matching files are excluded from BOTH the
          diff-size gate AND the diff handed to the review panel + judge — the
          exact same "what is codegen" logic the PR-size cap uses, so the two
          workflows can't drift. `*` matches within a path segment, `**` across
          segments, `?` one character; a pattern without `/` matches the base
          name at any depth, while a pattern WITH a `/` is anchored to the whole
          repo-relative path unless it opens with `**/` (`data/gen.json` misses
          `pkg/x/data/gen.json`). These are plain globs, not git pathspecs — a
          `:!` prefix carried over from `diff_excludes` is matched literally and
          excludes nothing. This is the preferred knob for generated/vendored
          paths: the classifier already covers eight common dependency lockfiles
          (see `extra_lockfiles` for the exact set — anything outside it, e.g.
          Gemfile.lock or composer.lock, must be added there), files
          marked `linguist-generated` in the BASE ref's `.gitattributes` (so a
          PR can't exempt itself), and the canonical Go
          `// Code generated ... DO NOT EDIT.` marker — so you rarely need more.
          Because this classification decides what the review panel SEES, the
          Go marker is honored only from the BASE blob (same base-ref invariant
          as `.gitattributes`): a PR cannot hide a file from review by adding
          the marker, and a file NEW in the PR never matches it — cover newly
          generated files with a glob here or a base `.gitattributes` rule.
          Supplying this input REPLACES the default list wholesale, so restate
          the defaults you still want: a repo whose `.claude/` tree is
          vendored/tool-installed output (a BMAD-method install, say) rather
          than hand-authored agent instructions should pass the defaults plus
          its own `**/.claude/**` glob — hand-authored agent instructions are
          prose worth reviewing, so the default no longer excludes them. Until
          such a repo does, that tree counts against `diff_size_cap`, and a PR
          over the cap is skipped silently (no review, no Slack notice).
        type: string
        required: false
        default: >-
          **/node_modules/**
          **/dist/**
          **/vendor/**
          **/*.generated.*
          **/*.min.js
          **/*.min.css
      extra_lockfiles:
        description: >-
          Extra dependency-lockfile base names to exclude (count + diff), on top
          of the classifier's built-ins (go.sum, go.work.sum, package-lock.json,
          pnpm-lock.yaml, yarn.lock, Cargo.lock, poetry.lock, uv.lock).
          Whitespace- or comma-separated; matched at any directory depth.
        type: string
        required: false
        default: ''
      diff_excludes:
        description: >-
          Additional git pathspecs excluded from the reviewed diff ONLY (not the
          size gate), applied verbatim ON TOP of the shared classifier's
          generated-file exclusion. Back-compat escape hatch for one-off paths
          that aren't "generated" per se; for generated/vendored paths prefer
          `extra_generated_globs`, which also keeps them out of the size gate.
          Folded scalar collapses newlines to spaces so the value word-splits
          into pathspec args. Paths with a leading underscore need the long-form
          `:(exclude)` syntax — the short-form `:!` parser reads `_` as pathspec
          magic. (Previously this fed both the count and the diff and defaulted
          to the lockfile/vendored list; that list now lives in the classifier
          and `extra_generated_globs`, so the default here is empty. Callers that
          listed generated paths here should move them to `extra_generated_globs`
          to keep them out of the size gate too.)
        type: string
        required: false
        default: ''
      workflows_ref:
        description: >-
          REQUIRED. Ref of Comfy-Org/github-workflows to load the prompts and
          scripts from. Must be the SAME commit SHA you pin `uses:` to —
          otherwise the workflow is pinned but the code it runs is not. There is
          deliberately no default: a floating `main` default would silently load
          mutable scripts into jobs that hold write permissions.
        type: string
        required: true
      bot_app_id:
        description: >-
          GitHub App ID. When set (with the bot_app_private_key secret), the
          consolidated review + per-finding line comments post under that App's
          identity (your App's "<app>[bot]" login) instead of
          github-actions[bot], so its threads are distinct and queryable.
          Optional — omit to post as github-actions[bot] (default; unchanged for
          OSS consumers). App IDs aren't secret, so this is an input, not a secret.
        type: string
        required: false
        default: ''
      ledger_prior_review:
        description: >-
          Give each review round the PRIOR rounds' findings and the author's
          replies (the "prior-review ledger"), so a finding that was refuted,
          declined, or deferred earlier is not silently re-litigated. Set false
          to disable the ledger — the kill switch for the case where it degrades
          reviews after rollout; flipping this input beats reverting SHA pins
          across every consumer. With it false the panel/judge prompts are
          exactly the pre-ledger ones. Default true.
        type: boolean
        required: false
        default: true
      run_without_label:
        description: >-
          Run on plain pull_request events (opened / reopened / ready_for_review
          / synchronize) instead of requiring the trigger label — for repos with
          no labeling automation. The fork skip, the skip-cursor-review label,
          and the same-commit dedupe all still apply. Default false
          (label-triggered, unchanged for existing callers).
        type: boolean
        required: false
        default: false
      panel_models:
        description: >-
          Optional JSON array of Cursor catalog model ids that REPLACES the
          default panel list (see the preflight "Define panel models" step for
          the current defaults). Each id still runs both review types and is
          validated against the live catalog by preflight, so a typo or a
          delisted id fails loud before any cell spends. Intended for
          per-repo experiments — e.g. an A/B of `-xhigh` vs `-max` reasoning
          tiers — without forking the workflow. Empty (default) = built-in list.
        type: string
        required: false
        default: ''
      openai_direct_model:
        description: >-
          OPT-IN. An OpenAI model id (e.g. `gpt-6.1-sol`) reviewed through the
          OpenAI API directly, via the Codex CLI, as two cells — adversarial
          and edge-case, the same passes and prompts a Cursor model gets.
          Empty (default) = the job is skipped and nothing changes. Requires the
          `OPENAI_API_KEY` secret and a plain id (`[A-Za-z0-9._-]`); set
          without either, preflight warns, the cells stay off and the panel is
          unchanged.
          Deliberately NOT part of `panel_models`: that list is validated
          against the live CURSOR catalog, which a direct-API id is not in.
          By default the cells REPLACE the Cursor OpenAI cells rather than
          adding to them, and then GATE like them; see
          `openai_direct_replaces_cursor_openai`.
        type: string
        required: false
        default: ''
      openai_direct_replaces_cursor_openai:
        description: >-
          When the direct cells are in effect (`openai_direct_model` set, a
          plain id, and its key present), drop the Cursor-hosted OpenAI cells
          from the panel so the lane is reviewed once rather than twice. Default
          true: the direct cells REPLACE them, and so gate exactly as the Cursor
          cells would — counted in `Panel integrity` and the auto-approve gate
          (`approve_max_failed_reviewers`), a failed one red in the rollup and
          named in the review's "did not contribute" line. Matching is by vendor prefix
          (`gpt-`) against the resolved panel list, which is how every OpenAI id
          in Cursor's catalog is spelled today — the other labs' ids are
          untouched. Set false to run both for a side-by-side comparison of the
          two backends on identical diffs; the direct cells are then ADVISORY —
          their findings reach the judge, but the legs never fail the run and
          are not counted. Refuses to leave the Cursor panel empty: if
          every remaining id would be dropped, preflight fails rather than
          silently shrinking the panel to the direct cells alone.
        type: boolean
        required: false
        default: true
      anthropic_direct_model:
        description: >-
          OPT-IN. An Anthropic model id (e.g. `claude-opus-5-5`) reviewed
          through the Anthropic API directly, via the Claude Code CLI, as two
          cells — adversarial and edge-case, the same passes and prompts a
          Cursor model gets. The Anthropic twin of `openai_direct_model`, with
          the same rules: empty (default) = the job is skipped and nothing
          changes; requires the `ANTHROPIC_API_KEY` secret and a plain id
          (`[A-Za-z0-9._-]`) other than `openai_direct_model`'s, and set
          without any of those, preflight warns, the cells stay off and the
          panel is unchanged. Unlike the OpenAI cells,
          which see the diff only, the agent also reads a read-only checkout of
          the PR with Read, Grep and Glob alone — no Bash or other
          code-running tool — and `--restricted` confines those file tools to
          that checkout. This panel reviews private-repo diffs and the workflow
          cannot check the Anthropic organization's data-retention terms, so a
          caller on a private repo must use a key from an organization with
          zero data retention. By default the cells REPLACE the Cursor
          Anthropic cells; see `anthropic_direct_replaces_cursor_anthropic`.
        type: string
        required: false
        default: ''
      anthropic_direct_effort:
        description: >-
          Reasoning effort for the direct Anthropic cells (`--effort`): one of
          `low`, `medium`, `high`, `xhigh`, `max`. Any other value warns and
          falls back to `xhigh`, the default. Ignored unless
          `anthropic_direct_model` is in effect.
        type: string
        required: false
        default: xhigh
      anthropic_direct_replaces_cursor_anthropic:
        description: >-
          The Anthropic twin of `openai_direct_replaces_cursor_openai`, with
          the same semantics: when the direct Anthropic cells are in effect,
          drop the Cursor-hosted Anthropic cells (vendor prefix `claude-`,
          case-insensitive) so they REPLACE them and gate exactly as they
          would. Set false for a side-by-side comparison in which the direct
          cells are ADVISORY. Refuses to leave the Cursor panel empty. Never
          touches `judge_model`.
        type: boolean
        required: false
        default: true
      judge_direct_model:
        description: >-
          OPT-IN. An Anthropic model id (e.g. `claude-opus-5-5`) that runs the
          JUDGE through the Anthropic API directly, via the same pinned Claude
          Code CLI and `ANTHROPIC_API_KEY` secret as `anthropic_direct_model`,
          instead of `judge_model` through Cursor. Empty (default) = the judge
          stays on Cursor and nothing changes. Requires a plain id
          (`[A-Za-z0-9._-]`, at most 100) and the key; set without either,
          preflight warns and the Cursor judge runs. Same prompt, same
          structured-output tool, same timeout and same degraded panel-union
          fallback as the Cursor judge. The agent reads the PR checkout with
          Read, Grep and Glob alone — no Bash or other code-running tool —
          confined to it by `--restricted`. It runs in its own `judge-direct`
          job on GitHub-hosted `ubuntu-latest`, whatever `runs_on` says, so the
          key never reaches `consolidate`. This judge reads private-repo diffs
          and the workflow cannot check the Anthropic organization's
          data-retention terms, so a caller on a private repo must use a key
          from an organization with zero data retention.
        type: string
        required: false
        default: ''
      judge_direct_effort:
        description: >-
          Reasoning effort for the direct judge (`--effort`): one of `low`,
          `medium`, `high`, `xhigh`, `max`. Any other value warns and falls
          back to `xhigh`, the default. Ignored unless `judge_direct_model` is
          in effect.
        type: string
        required: false
        default: xhigh
      skip_bot_branch_prefixes:
        description: >-
          Space-separated head-branch prefixes that skip the review when the PR
          AUTHOR is a GitHub App / Bot account. Targets machine-generated pin
          bumps and catalog refreshes (`ci/bump-…`, `chore/refresh-…`,
          `auto/refresh-…`) that otherwise pay for a full panel with nothing a
          reviewer can judge. Matched only for `user.type == Bot` authors, so a
          human pushing to a `ci/bump-…` branch is still reviewed. Set to '' to
          review every bot PR. Skips are logged in the gate step, and the
          `skip-cursor-review` label remains the per-PR override in both
          directions.
        type: string
        required: false
        default: ci/bump- chore/refresh- auto/refresh-
      blocking:
        description: >-
          Opt-in merge gate (restored by BE-4691 after #31 dropped it). false
          (default) → the review is advisory, exactly as before: it posts
          findings but never fails a check on them, so no caller's behavior
          changes until it opts in. true → a final "Blocking gate" job fails
          (red check) while the PR has unresolved, non-outdated cursor-review
          finding threads, and passes once they are all resolved — idempotent
          on re-run, and fail-closed: a fresh panel that was supposed to post
          its review and didn't refuses to pass. NOTE: this workflow cannot set
          branch protection. To actually block the merge you must ALSO mark the
          "Blocking gate" check as a required status check in the caller repo's
          branch-protection / ruleset settings — until you do, the red check is
          visible but non-blocking. Require THIS check and no other: a skipped
          required check counts as passing, and "Consolidate panel" /
          "Post review" skip exactly when no review ran. See
          docs/callers/cursor-review.md for the resolve→re-check flow.
        type: boolean
        required: false
        default: false
      approve_max_severity:
        description: >-
          Opt-in auto-approve. '' (default) → off: the bot never approves or
          requests changes. `medium`, `low` or `nit` → after a round, the bot
          APPROVES (pinned to the reviewed commit) when every finding is at or
          below that severity, and REQUESTS CHANGES when any finding is above
          it. Any other value fails the run. No approval when the judge did not
          adjudicate, a panel reviewer did not complete (beyond what
          `approve_max_failed_reviewers` tolerates), the review did not land
          as threads, the head moved or the base was retargeted mid-run, an
          earlier critical/high thread is still open, or the reviewed diff is
          empty (every changed path excluded by diff_excludes / the
          generated-file classifier). A caller
          that sets this must also deliver `synchronize`, `reopened` and
          `edited`, so a push or a base retarget dismisses the bot's earlier
          approval; that dismissal runs whether or not this input is still
          set, so unsetting it stops new approvals without stranding old ones. Pass a
          repo variable (e.g. `vars.CURSOR_APPROVE_MAX_SEVERITY`) to flip it
          without a PR. The approval only counts where the approving identity
          can satisfy the ruleset — see APPROVER_TOKEN and
          docs/callers/cursor-review.md. TRUST MODEL: the decision rests on
          model output over the PR's own content, so a diff that prompt-injects
          the panel and judge can earn an approval; and for `pull_request`
          events this input is read from the caller workflow at the PR's head,
          so a same-repo PR can switch it on for itself. Enabling it makes the
          approval no stronger than push access — see the guide's trust-model
          section before letting it satisfy a required review.
        type: string
        required: false
        default: ''
      approve_authors:
        description: >-
          Per-author opt-in for auto-approve. A comma- or space-separated list
          of GitHub logins (case-insensitive; a leading `@` is ignored). ''
          (default) → every author, the behaviour before this input existed.
          Otherwise a PR whose author (`pull_request.user.login`) is not listed
          gets auto-approve OFF: `approve_gate` is `off`, no APPROVE or
          REQUEST_CHANGES is posted (the decision note says "auto-approve not
          enabled for author <login>"), and the panel still reviews and posts
          its threads. `Dismiss stale auto-approval` still withdraws an earlier
          marked approval as usual. No effect unless `approve_max_severity` is
          set. Pass a repo variable (e.g. `vars.CURSOR_APPROVE_AUTHORS`) to
          change it without a PR — and note it is read from the caller at the
          PR's head, like `approve_max_severity`, so it is no stronger than
          push access either.
        type: string
        required: false
        default: ''
      approve_scope:
        description: >-
          What an auto-approve round after the first gates on. `delta`
          (default) → a finding above `approve_max_severity` blocks only when it
          sits inside a hunk of the verified incremental block (the changes
          since the last reviewed commit), re-raises an earlier finding whose
          thread is still unresolved (named in `repeat_of`, or on the path and
          line of an earlier round's still-open thread), or is High/Critical
          anywhere in the reviewed diff. Every other finding is still posted, as a thread
          marked "Outside this round's changes: not blocking auto-approve",
          and is never auto-resolved. Round 1, an incremental block that was
          unavailable, discarded or empty (a pure rebase), one naming a path
          that cannot be parsed, an unknown prior-review ledger, an
          unreadable list of earlier open threads and an explicitly empty
          value all fail closed to `full`. `full` → every finding counts, wherever it
          sits (the behaviour before this input existed). The panel reviews
          the full diff either way. No effect unless `approve_max_severity` is
          set; any other value fails the decision step.
        type: string
        required: false
        default: delta
      defer_approval:
        description: >-
          For a caller that runs cursor-approve's per-axis approval after this
          workflow. false (default) → no change. true → a round that would
          APPROVE still reports `approve_gate` = `pass`, but posts no review and
          auto-resolves no thread; it withdraws the approver identity's own
          earlier auto-approvals (and requests for changes) instead, so cursor-approve's `phase: decide`
          is the only approver and no severity-only approval stands while the
          axes judge — nor after a run that fails before they start.
          REQUEST_CHANGES is still posted. No effect unless
          `approve_max_severity` is set. See docs/callers/cursor-approve.md.
        type: boolean
        required: false
        default: false
      approve_max_failed_reviewers:
        description: >-
          How many panel reviewers may ERROR (status `error`: the cell ran but
          failed, timed out, or never uploaded) before auto-approve withholds its
          decision. 0 (default) → any reviewer that did not complete withholds,
          as before. N → up to N errored reviewers are tolerated and the round
          is decided normally (the decision names them, e.g. "approved with
          1/6 reviewers errored: <model>:edge-case"), but it is still withheld
          when more than N errored, a reviewer has any other status, the panel
          metadata is missing, or a review type (`adversarial` or `edge-case`)
          has no reviewer that completed. Applies to the decision `defer_approval`
          hands to cursor-approve too. No effect unless `approve_max_severity`
          is set. A tolerated errored cell still turns THIS WORKFLOW's called job
          red (the leg itself, and `Panel integrity` with it), so a caller that
          chains jobs off it — the cursor-approve axes above all — must guard
          them with `!cancelled()` or GitHub's default `needs:` rule skips them
          and the tolerance buys nothing. `!cancelled()` also drops the implicit
          success requirement on EVERY other `needs:` entry, so restate those
          explicitly (the axes keep `needs.approve-start.result == 'success'`).
          See docs/callers/cursor-approve.md ("A red panel cell must not skip
          the axes").
        type: number
        required: false
        default: 0
      cell_timeout_minutes:
        description: >-
          Wall-clock cap, in minutes, on ONE reviewer cell's agent step —
          `Run cursor review` for a Cursor cell, `Run direct-API review` for a
          direct-OpenAI one. 15 (default) is the historical value, so an unset
          input changes nothing. A cell that runs out of clock exits 130,
          uploads `status: error` with no findings, fails its leg and so fails
          `Panel integrity` — the cap is a guillotine, not a safety net, and
          raising it is the only way to review a diff that honestly needs
          longer. It is also the budget a cell's RETRIES share
          (`resource_exhausted` is retried in-step), so it bounds attempts plus
          backoff, not one attempt. Three further caps are DERIVED from this and
          cannot be set separately, which is what keeps the panel and its judge
          in step: each cell's JOB cap is this + 15 (checkout, CLI install,
          artifact up/download — overhead outside the agent step), the judge's
          `Run judge` step cap is this x 2 but never below 30 (it reads EVERY
          cell's findings at the same reasoning tier, so it needs more than any
          one of them, and its workload scales with the panel, not with this
          cap), and the judge's job cap is its step + 10. At the default that
          reproduces today's 30 / 15 / 30 / 40 exactly. Bounded 10-45 by
          preflight, which
          fails before any cell spends rather than letting a typo mint an
          hours-long job.
        type: number
        required: false
        default: 15
      max_rounds:
        description: >-
          Cap on review rounds per PR. Before the panel starts, the run counts
          the consolidated reviews the posting identity has already left on this
          PR; at or over this number it runs NO panel, labels the PR
          `needs-human-review` (creating the label if missing), posts one
          comment listing the latest round's open findings above
          `approve_max_severity` (every open finding when that is empty), and
          sets the `approve_gate` output to `capped`. Auto-approve never
          approves a PR carrying that label. Removing the label resets the
          count: only rounds after its most recent removal count. 0 → no cap. A
          count that cannot be read, or a label that cannot be applied, fails
          open (the panel runs). Creating the label needs `issues: write`, so
          pre-create it unless the bot App has it. Default 5.
        type: number
        required: false
        default: 5
      runs_on:
        description: >-
          JSON-encoded `runs-on` for the four jobs that hold no write-scoped
          credential and do the heavy lifting: `diff-size`, `preflight`, the
          `review` panel and `consolidate`. Same shape as
          cursor-review-auto-label.yml's `runs_on`, so one repo variable can
          feed both. Default '"ubuntu-latest"' (a JSON string); an empty value
          falls back to it too. Pass a JSON array for a self-hosted pool, e.g.
          '["self-hosted", "linux", "x64"]'. Every other job — the gate, the
          ledger, the Slack notices, and every job that mints the App token or
          holds `pull-requests: write` — stays on GitHub-hosted `ubuntu-latest`
          regardless, so a pool never sees a write credential, as do the
          direct-API cells and the direct judge, which hold a model key.
          Review and consolidate run models with unsandboxed shell over the
          PR's code, so pick a pool that gives each job a fresh pod (fresh filesystem and
          $HOME), carries no cloud identity or service-account token, and
          cannot reach private networks or the metadata server — anything a
          prompt-injected PR runs there can reach whatever the runner can. The
          image must be linux/x64 (the cursor-agent installer pins that one
          artifact) with bash, git, curl, jq, python3, gh, tar and GNU
          coreutils (sha256sum); diff-size installs Go itself.
        type: string
        required: false
        default: '"ubuntu-latest"'
    secrets:
      CURSOR_API_KEY:
        description: Cursor API key for cursor-agent (the panel + judge models bill through it).
        required: true
      OPENAI_API_KEY:
        description: >-
          OpenAI API key for the optional direct-API review cell. Required only
          when the `openai_direct_model` input is set; ignored otherwise. Use a
          service-account key scoped to its own project with a spend limit, not
          a user key — the cell bills per call against it directly rather than
          against a pooled seat.
        required: false
      ANTHROPIC_API_KEY:
        description: >-
          Anthropic API key for the optional direct-API Anthropic review cells
          and direct judge. Required only when the `anthropic_direct_model` or
          `judge_direct_model` input is set; ignored otherwise. Only the gate
          (a presence check), the direct cells and the `judge-direct` job read
          it, all on GitHub-hosted `ubuntu-latest`. Use a key scoped to its
          own Anthropic workspace with a spend limit, never a personal key —
          the cells and judge bill per call against it directly rather than
          against a pooled seat.
        required: false
      SLACK_BOT_TOKEN:
        description: Slack bot token for the start/complete DM notifications. Optional — DMs are skipped if absent.
        required: false
      BOT_APP_PRIVATE_KEY:
        description: PEM private key matching the bot_app_id input. Required only when bot_app_id is set.
        required: false
      APPROVER_TOKEN:
        description: >-
          Optional token for approve_max_severity's reviews (approve, request
          changes, dismiss). Use a user account's token where the ruleset needs a
          CODE OWNER approval — a GitHub App cannot be a code owner. Absent → the
          bot_app_id identity, else github-actions[bot], which can approve only
          when the repo/org setting "Allow GitHub Actions to create and approve
          pull requests" is on. Whichever identity it is must also be allowed to
          dismiss reviews if branch protection restricts dismissals.
        required: false
    outputs:
      approve_gate:
        description: >-
          The round's severity-gate verdict, for a downstream workflow that
          must run only after a round passed. Exactly one of: `pass` (the
          auto-approve decision was APPROVE — posted, unless `defer_approval`
          left it to cursor-approve), `fail` (REQUEST_CHANGES, or an
          open thread above the threshold withheld approval), `untrusted` (the
          judge was degraded, a panel cell failed beyond what
          `approve_max_failed_reviewers` tolerates, the review was not delivered,
          the head moved — or no round was delivered by this run at all, e.g. a
          skipped or already-reviewed event), `capped` (the `max_rounds` cap was
          hit this run, or the PR carries `needs-human-review` while
          `max_rounds` or `approve_max_severity` is set), `off`
          (`approve_max_severity` is empty, or `approve_authors` does not list
          the PR's author, and the cap was not hit).
        value: ${{ (jobs.round-cap.outputs.capped == 'true' || jobs.round-cap.outputs.labelled == 'true') && 'capped' || (inputs.approve_max_severity == '' || jobs.gate.outputs.approve_author_ok == 'false') && 'off' || jobs.post-review.outputs.approve_gate || 'untrusted' }}
      round:
        description: >-
          The 1-based number of the review round this run delivered, counted
          the way `max_rounds` counts (the posting identity's consolidated
          reviews since `needs-human-review` was last removed; a round that
          reviewed nothing does not count). When this run hit the cap, the
          number of the last round instead. Empty when the run delivered no
          round, the count could not be read, or `max_rounds` is 0 (nothing is
          counted then).
        value: ${{ jobs.round-cap.outputs.capped == 'true' && jobs.round-cap.outputs.rounds || jobs.post-review.outputs.delivered == 'true' && jobs.round-cap.outputs.next_round || '' }}
      max_rounds:
        description: >-
          The effective round cap: the `max_rounds` input as applied, `0` when
          there is no cap (including a value the cap step rejected as not a
          whole number). Pairs with `round` for a "round R of M" display.
        value: ${{ jobs.round-cap.outputs.max_rounds || (inputs.max_rounds > 0 && inputs.max_rounds) || 0 }}
      approve_scope_effective:
        description: >-
          The scope this run's auto-approve decision actually gated under:
          `delta` only when `approve_scope` was `delta` and the round did not
          fall back to `full` (round 1, an unavailable, discarded or empty
          incremental block, an unparseable path, an unknown ledger, an
          unreadable list of earlier open threads); `full` otherwise, including
          when no decision ran or the round withdrew it (`untrusted`/`capped`). Pass it to cursor-approve's
          `approve_scope` so a deferred approval resolves threads under the
          same rule this round's decide used.
        value: ${{ jobs.post-review.outputs.approve_scope_effective || 'full' }}

concurrency:
  # Owned by the REUSABLE so every caller gets it at its next pin bump — the
  # same shape pr-size.yml and pr-area-label.yml use here. The `-reusable-`
  # infix keeps the name off what a caller would naturally pick: a caller that
  # declares the SAME group DEADLOCKS its own run, holding the group while its
  # `uses:` job waits to acquire it (see the note in ci-groom.yml and
  # docs/callers/pr-size.md).
  #
  # Slot rule: the trigger label AND the `skip-cursor-review` veto label share
  # one `trigger` slot, so applying skip-cursor-review mid-flight CANCELS the
  # running panel — the Gate's "skip-cursor-review wins" precedence, made true
  # for in-flight runs too — and removing it cancels nothing that matters
  # before starting a fresh one. Every OTHER label gets its own namespaced
  # `label-<name>` slot, so an unrelated label add never kills a running
  # review. `format('label-{0}', …)` is what stops a label literally named
  # `trigger` (or `Trigger`; group names are case-insensitive) from reaching
  # the shared slot.
  #
  # Non-label events carry an EMPTY `github.event.label.name`, so they fall to
  # `label-` and share one slot among themselves. That is deliberate for
  # `pull_request_review_thread` on a blocking caller: resolving a thread must
  # never cancel a panel. But a `run_without_label` caller STARTS panels from
  # plain PR events, so those four actions — and only those four, mirroring the
  # Gate's own case list — join `trigger` as well; otherwise a
  # synchronize-triggered panel would sit in a slot the veto label cannot
  # reach, which is the case this block exists for.
  #
  # `inputs.review_label != ''` guards the first disjunct because the input is
  # `required: false` and a caller CAN pass an empty string. GitHub coerces a
  # missing `github.event.label` and `''` alike in a mixed comparison, so
  # without the guard every non-label event — `pull_request_review_thread`
  # included — would compare EQUAL and join `trigger`, making a thread resolve
  # cancel a running panel: the exact case the paragraph above calls impossible.
  #
  # KNOWN GAP, case. `==` here is case-INSENSITIVE (GitHub expression
  # semantics) while the Gate's own test is a case-SENSITIVE shell `=` and its
  # veto check a case-sensitive `jq index(...)`. A label that differs from
  # `review_label` only in case therefore reaches `trigger` and cancels the
  # panel, then no-ops in the Gate — a review destroyed with nothing replacing
  # it. Unfixable in an expression (there is no `lower()`, and `contains()` is
  # case-insensitive too); it needs a case-matched `review_label`, which is the
  # caller's to get right. Reachable only via that misconfiguration.
  #
  # Cancellation is ASYNCHRONOUS and SLOT-SCOPED, not ordered and total: a
  # superseded run keeps unwinding after the new one starts, and only same-slot
  # runs are cancelled at all. Anything reasoning about the state a cancelled
  # run leaves behind has to allow for both — see the blocking-gate gotchas in
  # docs/callers/cursor-review.md for the one place it is observable.
  #
  # `inputs` is an allowed context in a called workflow's workflow-level
  # `concurrency:`, same as the `env:` block below.
  group: cursor-review-reusable-${{ github.event.pull_request.number || github.ref }}-${{ ((inputs.review_label != '' && github.event.label.name == inputs.review_label) || github.event.label.name == 'skip-cursor-review' || (inputs.run_without_label && github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize'))) && 'trigger' || format('label-{0}', github.event.label.name) }}
  cancel-in-progress: true

# DIFF_SIZE_CAP / REVIEW_LABEL / JUDGE_MODEL / DIFF_EXCLUDES are mapped from
# `inputs` here so the run steps below read them verbatim from the original
# (private-repo) workflow without per-step plumbing. `inputs` is available to
# workflow-level env in a called workflow; `secrets` is not (those stay in jobs).
env:
  DIFF_SIZE_CAP: ${{ inputs.diff_size_cap }}
  REVIEW_LABEL: ${{ inputs.review_label }}
  JUDGE_MODEL: ${{ inputs.judge_model }}
  DIFF_EXCLUDES: ${{ inputs.diff_excludes }}
  EXTRA_GENERATED_GLOBS: ${{ inputs.extra_generated_globs }}
  EXTRA_LOCKFILES: ${{ inputs.extra_lockfiles }}
  # Where the assets checkout lands (this repo, .github/cursor-review/*).
  CURSOR_REVIEW_ASSETS: ${{ github.workspace }}/_cursor_review_assets/.github/cursor-review
  # Cursor CLI pin — a versioned, checksummed artifact instead of the mutable
  # cursor.com/install script (BE-5869). Old versions stay downloadable, so a
  # Cursor release never breaks this; the pin moves only via a reviewed PR.
  # Consumed by .github/cursor-review/install-cursor-cli.sh, the ONE installer
  # all three CLI-using jobs run (preflight, review matrix, consolidate).
  CURSOR_CLI_VERSION: 2026.10.01-e373342
  # sha256 of the linux/x64 agent-cli-package.tar.gz (all jobs run ubuntu-latest).
  # Cross-checked against nixpkgs pkgs/by-name/cu/cursor-cli at pin time.
  CURSOR_CLI_SHA256: a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      already_reviewed: ${{ steps.dup.outputs.already_reviewed }}
      approve_author_ok: ${{ steps.author.outputs.approve_author_ok }}
      openai_key_present: ${{ steps.openai_key.outputs.present }}
      anthropic_key_present: ${{ steps.anthropic_key.outputs.present }}
    steps:
      - name: Resolve OPENAI_API_KEY presence
        # A boolean for `preflight`, which cannot read the secret itself: it
        # follows the caller's `runs_on` pool, and a `secrets.` expression is
        # evaluated ON the runner, so even `!= ''` would ship the key there.
        # This job is GitHub-hosted and checks out nothing, so the key meets
        # no PR-authored code here. Only read when the direct cell is opted in.
        id: openai_key
        if: inputs.openai_direct_model != ''
        env:
          OPENAI_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
        run: echo "present=${OPENAI_KEY_PRESENT}" >> "$GITHUB_OUTPUT"

      - name: Resolve ANTHROPIC_API_KEY presence
        # Same as `Resolve OPENAI_API_KEY presence` above, for the direct
        # Anthropic cells and the direct judge.
        id: anthropic_key
        if: inputs.anthropic_direct_model != '' || inputs.judge_direct_model != ''
        env:
          ANTHROPIC_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: echo "present=${ANTHROPIC_KEY_PRESENT}" >> "$GITHUB_OUTPUT"

      - name: Resolve the auto-approve author opt-in
        # approve_authors, resolved ONCE here so the workflow-level
        # `approve_gate` output (which must say `off` on every event, round or
        # not) and `Auto-approve decision` read the same answer. Runs on every
        # event, before any skip below. `false` when a non-empty list does not
        # name the PR author — including a list that names nobody (`,`, `@`):
        # a restriction that evaluates empty fails closed. An empty (or
        # all-whitespace) list is everyone. No PR author (a non-PR event) leaves
        # the output unset, so `approve_gate` keeps its "no round" meaning.
        id: author
        env:
          APPROVE_AUTHORS: ${{ inputs.approve_authors }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -f  # the list is caller text: no glob expansion of its words
          if [ -z "$(printf '%s' "$APPROVE_AUTHORS" | tr -d '[:space:]')" ]; then
            echo "approve_authors is empty — no author restriction."
            echo "approve_author_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$PR_AUTHOR" ]; then
            echo "No PR author on this event — approve_authors not evaluated."
            exit 0
          fi
          author="$(printf '%s' "$PR_AUTHOR" | tr '[:upper:]' '[:lower:]')"
          listed=false
          for login in $(printf '%s' "$APPROVE_AUTHORS" | tr ',' ' '); do
            login="$(printf '%s' "${login#@}" | tr '[:upper:]' '[:lower:]')"
            [ -n "$login" ] || continue
            if [ "$login" = "$author" ]; then listed=true; fi
          done
          if [ "$listed" = true ]; then
            echo "approve_author_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "approve_authors does not list the PR author '$PR_AUTHOR' — auto-approve is off for this PR."
            echo "approve_author_ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check trigger label
        id: check
        env:
          LABEL_NAME: ${{ github.event.label.name }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          GH_EVENT_ACTION: ${{ github.event.action }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          RUN_WITHOUT_LABEL: ${{ inputs.run_without_label }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SKIP_BOT_PREFIXES: ${{ inputs.skip_bot_branch_prefixes }}
        run: |
          # PRs from forks can't run this review. The pull_request event grants
          # fork PRs no access to secrets — so CURSOR_API_KEY is empty and every
          # panel cell fails before submitting output — and a read-only GITHUB_TOKEN, so
          # posting the consolidated review returns HTTP 403. The review can
          # neither analyze nor post, so skip cleanly instead of burning the
          # 8-cell matrix + judge and failing red on every external contribution.
          # (head.repo.full_name != github.repository is the cross-repo signal.)
          if [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PR is from a fork ($HEAD_REPO != $BASE_REPO) — review needs secrets and write access a fork PR can't have. Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # skip-cursor-review wins even if the trigger label is also present.
          if echo "$PR_LABELS" | jq -e 'index("skip-cursor-review")' > /dev/null; then
            echo "skip-cursor-review label present — skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Machine-generated PRs (bot author AND a configured branch prefix)
          # skip the panel: a pinned-SHA bump or a catalog refresh has nothing a
          # reviewer can judge, and each one otherwise costs a full matrix run.
          # Author TYPE is checked, not just the branch, so a human pushing a
          # `ci/bump-…` branch is still reviewed. Configurable per caller via
          # skip_bot_branch_prefixes ('' disables).
          if [ "$PR_AUTHOR_TYPE" = "Bot" ]; then
            for prefix in $SKIP_BOT_PREFIXES; do
              case "$HEAD_REF" in
                "$prefix"*)
                  echo "Bot-authored PR ($PR_AUTHOR) on '$HEAD_REF' matches skip prefix '$prefix' — skipping the panel."
                  echo "should_run=false" >> "$GITHUB_OUTPUT"
                  exit 0
                  ;;
              esac
            done
          fi

          # Label-free mode (run_without_label input): callers in repos with no
          # labeling automation opt in to running on plain PR events. Sits
          # BELOW the fork skip and skip-cursor-review checks — those still
          # veto — and the same-commit dedupe below still prevents re-reviews.
          if [ "$RUN_WITHOUT_LABEL" = "true" ]; then
            case "$GH_EVENT_ACTION" in
              opened|reopened|ready_for_review|synchronize)
                echo "run_without_label mode — running on '$GH_EVENT_ACTION'."
                echo "should_run=true" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          # Only adding the trigger label fires the matrix. Adding or removing
          # the trigger label, and ADDING skip-cursor-review, all resolve to the
          # reusable's shared `trigger` concurrency slot (see the workflow-level
          # `concurrency:` block), so GitHub has REQUESTED cancellation of any
          # in-flight same-slot run for this PR by the time this step decides —
          # which is what makes the skip-cursor-review veto above true for a
          # panel that is still running, not just for one that has yet to
          # start. Requested, not completed: cancellation is asynchronous, so
          # the superseded run is still unwinding alongside this one, and it is
          # slot-scoped, so a run sitting in a `label-<name>` slot is not
          # cancelled at all. Do not add a panel starter outside `trigger` on
          # the assumption that this step runs after the field is clear. A
          # caller pinned BELOW that commit has only its own label-scoped group,
          # which covers the trigger label alone: there, applying
          # skip-cursor-review does not stop a running panel.
          if [ "$LABEL_NAME" = "$REVIEW_LABEL" ] && [ "$GH_EVENT_ACTION" = "labeled" ]; then
            echo "$REVIEW_LABEL label added — running."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Removing skip-cursor-review while the trigger label is present
          # unblocks a previously skipped review — treat it as a fresh trigger.
          # This event shares the `trigger` concurrency slot too, so a same-slot
          # run in flight for this PR has been asked to cancel (asynchronously
          # — it may still be unwinding here); the dup check below still covers
          # the case where a review COMPLETED at this SHA.
          if [ "$LABEL_NAME" = "skip-cursor-review" ] && [ "$GH_EVENT_ACTION" = "unlabeled" ]; then
            if echo "$PR_LABELS" | jq -e --arg l "$REVIEW_LABEL" 'index($l)' > /dev/null; then
              echo "skip-cursor-review removed while $REVIEW_LABEL is present — running."
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "Label '$LABEL_NAME' is not the trigger label — skipping."
          echo "should_run=false" >> "$GITHUB_OUTPUT"

      - name: Check for prior review on this commit
        id: dup
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Idempotency: skip the matrix if a Cursor Review consolidated
          # review already exists for this exact HEAD SHA. Protects against
          # label remove+re-add (or any other event-replay path) from
          # re-running the panel on unchanged content.
          #
          # Escape hatches:
          # - Push commits → new HEAD SHA, check finds nothing, runs.
          # - Dismiss the existing review → DISMISSED state filtered out
          #   below, so re-applying the label fires a fresh run.
          #
          # API failure falls through to running, not skipping — better to
          # double-review than silently no-op.
          #
          # The `user.type == "Bot"` term is a permission check, not a tidiness
          # one (BE-4691). The consolidated marker is PUBLIC text in a public
          # repo, and anyone who can open a PR can submit a review on it — so
          # matching the body alone let any user post a body-only review
          # carrying the marker and have this step declare the SHA already
          # reviewed. That skips the panel, the judge and the post, and under
          # `blocking: true` it also waives the gate's fresh-review guard and
          # greens a required check over a PR nothing ever looked at. It also
          # made the documented remedy for a genuine error review (re-trigger on
          # the same SHA) a silent no-op, since that review carries the marker
          # too.
          #
          # Matched on the TYPE rather than a login because the poster is
          # caller-configurable: `github-actions[bot]` by default, or whatever
          # bot the caller's `bot_app_id` App resolves to — a login this job
          # cannot know without minting that token, which is the credential
          # split's whole point. `Bot` narrows the set from "every GitHub user"
          # to "Apps a repo admin installed here", which is the boundary that
          # matters. Residual, accepted: another installed App could post a
          # marked review. Closing THAT needs the identity check to move into
          # the posting job, where the token exists.
          EXISTING=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" 2>/dev/null \
            | jq --arg sha "$HEAD_SHA" '[.[] | select(.commit_id == $sha and .state != "DISMISSED" and (.user.type == "Bot") and (.body | startswith("## 🔍 Cursor Review — Consolidated panel")))] | length' \
            2>/dev/null || echo 0)

          if [ "$EXISTING" -gt 0 ]; then
            echo "Already reviewed at $HEAD_SHA ($EXISTING existing review(s)) — skipping matrix."
            echo "already_reviewed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No prior review for $HEAD_SHA — proceeding."
            echo "already_reviewed=false" >> "$GITHUB_OUTPUT"
          fi

  ledger:
    # Prior-review ledger: what earlier rounds already raised on THIS PR, and how
    # the author answered. Without it every round re-derives the PR from zero, so
    # a finding refuted/declined/deferred in round 1 comes back in rounds 2 and 3
    # and the author hand-writes the same rebuttal again. A dedupe filter can't
    # fix that — the judge rewrites each finding's prose every round, so a true
    # repeat pair scores LOWER on text similarity than two unrelated findings on
    # the same file. The prior context has to enter the prompt.
    #
    # One fetch, nine consumers: the 8 review cells and consolidate all download
    # the `cursor-review-ledger` artifact this job publishes.
    #
    # This job must never fail the run — the review matrix `needs:` it, so a hard
    # failure here would skip the whole panel. Every step is continue-on-error
    # and a fallback guarantees the artifact exists, degrading to status=unknown
    # (which is reported, never silently reported as `empty`).
    name: Prior-review ledger
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    # Deliberately longer than the per-step timeouts below: a hung step must
    # trip its OWN timeout (which continue-on-error absorbs) rather than the
    # job's, because a FAILED job here would skip the entire review matrix.
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      status: ${{ steps.build.outputs.status || steps.fallback.outputs.status }}
      rounds: ${{ steps.build.outputs.rounds || steps.fallback.outputs.rounds }}
      last_reviewed_sha: ${{ steps.build.outputs.last_reviewed_sha }}
      # The merge base the LAST round recorded in its own review (BE-15598), read back
      # out of the round sentinel. The `incremental` step in `diff-size` builds its OLD
      # patch against exactly this commit, and skips the block outright when it is empty
      # — there is no fallback to the current base, which is what made a retargeted PR
      # drop hunks the panel had never seen. Like `last_reviewed_sha` this has no
      # fallback-step reading: a degraded ledger legitimately records nothing.
      last_reviewed_merge_base: ${{ steps.build.outputs.last_reviewed_merge_base }}
    steps:
      - name: Resolve the asset ref
        # This job must never fail (see the job comment), so the fail-closed
        # `Require a pinned workflows_ref` guard the other jobs run is not an
        # option here. Resolve the ref in a step that can only WARN instead, and
        # let the checkout below skip itself when there is nothing safe to check
        # out. Skipping is safe by construction: the `Build prior-review ledger`
        # step then fails under its `continue-on-error: true`, and the
        # `Ensure ledger artifact exists` fallback publishes status=unknown — the
        # already-designed degraded path, reported rather than silently `empty`.
        #
        # The fallback is `job.workflow_sha` — the commit THIS reusable workflow
        # was resolved from via the caller's `uses:` pin — so an omitted
        # `workflows_ref` still pins to an immutable SHA, never to this repo's
        # moving default branch. It is NOT `github.job_workflow_sha`, which this
        # step used to read: that is an OIDC token claim, not a `github` context
        # property, so Actions expanded it to '' and `actions/checkout` read
        # `ref: ''` as "the default branch" — the exact hole the comment here
        # claimed to close (BE-8077). `job.workflow_sha` is the `job`-context
        # accessor added in runner v2.334.0 (Apr 2026); `ubuntu-latest` is always
        # current, so only a stale self-hosted runner reaches the warn branch.
        # (actionlint <= 1.7.12 false-positives on it — its `job`-context schema
        # predates that runner release; nothing here runs actionlint.)
        id: resolve_ref
        continue-on-error: true
        # Every step in this job is time-boxed BELOW the job's own
        # `timeout-minutes` on purpose (see the job comment): a hung step must
        # trip its own timeout, which continue-on-error absorbs, rather than the
        # job's, which would fail the job and skip the whole review matrix.
        timeout-minutes: 2
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref || job.workflow_sha }}
          # The `uses:` commit on its own, WITHOUT the fallback above, so the
          # cross-check at the end of the script has something to compare
          # against. Bound here rather than interpolated into the script body,
          # like every other value this workflow reads.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # Bracket RANGES (`A-Z`) match by COLLATION order, so under a glibc
          # locale such as en_US.UTF-8 they also match accented letters and the
          # negated class below quietly stops rejecting them. Pin the byte order.
          export LC_ALL=C
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here — and JS `trim()` strips U+00A0/U+FEFF that POSIX
          # `[:space:]` leaves alone, so stripping cannot be how this decides.
          # Nor can it emit a stripped value: `tr -d` removes INTERIOR whitespace
          # too, so `a b` would be silently rewritten into the different-but-real
          # ref `ab` instead of being rejected. Validate the SHAPE and emit the
          # value UNTOUCHED. The class is deliberately narrower than git's own
          # ref rules (which also permit `(`, `)`, `,`, `%` and UTF-8) — a policy
          # restriction, not a validity claim — and it keeps out every Unicode
          # space and every newline that could smuggle a ::workflow command::
          # into the log or into $GITHUB_OUTPUT. Anything outside it resolves to
          # the empty output that skips the checkout below.
          REF="$WORKFLOWS_REF"
          case "$REF" in
            *[!A-Za-z0-9._/@+-]*) REF='' ;;
          esac
          if [ -z "$REF" ]; then
            echo "::warning::Could not resolve a usable ref for the cursor-review assets: either the workflows_ref input is empty AND job.workflow_sha resolved to '' (which needs an Actions runner older than v2.334.0), or the value contains characters outside the set this workflow accepts (A-Z a-z 0-9 . _ / - @ +) — a deliberate policy restriction, narrower than git's own ref rules. Skipping the asset checkout rather than silently loading them from this repo's default branch — the prior-review ledger degrades to status=unknown for this run. Set workflows_ref: to the same commit SHA the caller's uses: line pins."
          fi
          # Warn-only cross-check — the counterpart of the fail-closed equality
          # test the guarded jobs run. This job must never fail (see the job
          # comment), so a mismatch cannot `exit` here. It is reported anyway
          # because the ledger is where the signal would otherwise be invisible:
          # this job runs for every caller, including one whose guarded jobs all
          # skip, so its run log can be the only place a split pin is recorded.
          #
          # $REF is the right left-hand side even though it carries the
          # `|| job.workflow_sha` fallback: when the input was omitted it IS
          # WORKFLOW_SHA, so it cannot differ, and a difference therefore means
          # the caller passed a workflows_ref naming a different commit than its
          # `uses:` line. An unusable input has already been rewritten to '' and
          # warned about above, so skip it here rather than warn twice; an empty
          # $SHA means a runner older than v2.334.0, which cannot be checked at
          # all. Lower-cased on both sides, like the guarded jobs' copy of this
          # test: hex is case-insensitive, so an upper-case pin naming the same
          # commit is not a difference. $REF itself stays untouched — it is the
          # value the checkout below consumes. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -n "$REF_LC" ] && [ -n "$SHA" ] && [ "$REF_LC" != "$SHA" ]; then
            echo "::warning::workflows_ref ($REF) differs from job.workflow_sha ($SHA); the prior-review ledger is being read with assets from a different commit than the workflow. Set the uses: pin and workflows_ref to the same commit."
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      - name: Load cursor-review assets
        # Skipped when the ref could not be resolved — see `resolve_ref` above.
        if: steps.resolve_ref.outputs.ref != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ steps.resolve_ref.outputs.ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Build prior-review ledger
        id: build
        continue-on-error: true
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          LEDGER_ENABLED: ${{ inputs.ledger_prior_review }}
        run: |
          mkdir -p /tmp/ledger
          python3 "$CURSOR_REVIEW_ASSETS/build-ledger.py" build \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --pr-author "$PR_AUTHOR" \
            --out-dir /tmp/ledger \
            --enabled "$LEDGER_ENABLED"

      - name: Ensure ledger artifact exists
        id: fallback
        if: always()
        run: |
          # The build step handles its own fetch failures (status=unknown). This
          # covers the harder failure — the checkout or the interpreter itself
          # died — so the downstream download always finds a well-formed ledger
          # and the review body still tells the reader context was missing.
          mkdir -p /tmp/ledger
          if [ -f /tmp/ledger/ledger.json ]; then
            exit 0
          fi
          echo '{"status": "unknown", "rounds": 0, "total_rounds": 0, "entries": [], "entry_count": 0, "unanswered_count": 0, "failed_call": "ledger job", "reason": "the ledger step did not produce an output file (see the job log)"}' > /tmp/ledger/ledger.json
          : > /tmp/ledger/ledger.md
          : > /tmp/ledger/ledger-judge.md
          printf '%s' "⚠️ prior-review context unavailable (ledger job: the ledger step did not produce an output file) — findings may repeat earlier rounds." > /tmp/ledger/ledger-note.txt
          {
            echo "status=unknown"
            echo "rounds=0"
          } >> "$GITHUB_OUTPUT"
          echo "::warning::Prior-review ledger step produced no output — running without prior-round context."

      - name: Upload ledger artifact
        if: always()
        # continue-on-error like every other step in this job, for the reason in
        # the job comment: `review` needs this job and has no always() guard, and
        # `consolidate` then drops out on `needs.review.result != 'skipped'`. An
        # artifact-upload hiccup failing THIS job would therefore post no review
        # at all — strictly worse than the degraded path, where the panel simply
        # runs without prior context and the review body says so (the consumers
        # of the artifact all download it continue-on-error, and consolidate
        # emits the unavailable banner when the file does not arrive).
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cursor-review-ledger
          path: /tmp/ledger
          if-no-files-found: error
          retention-days: 7

  round-cap:
    # Per-PR review-round cap (inputs.max_rounds). Runs ahead of the panel on
    # every fresh round — `diff-size`, and through it everything that spends,
    # `needs:` it — and decides `capped`. Counting needs the POSTING identity's
    # login (a body match alone would let any user burn a PR's rounds with a
    # marker-carrying review), and that login is only known after the bot token
    # is minted, so this is a write-token job: it checks out NO PR code, only
    # this repo's assets at the pinned `workflows_ref`, and stays on
    # GitHub-hosted ubuntu-latest. The logic lives in auto-approve.py's
    # `round-cap`, which fails OPEN on a read error (the panel runs).
    name: Round cap
    needs: gate
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      # `secrets` cannot be read in `if:`, so the credentials-present test is
      # evaluated here — the same guard over-cap-comment uses. An app id without
      # its key is a permitted config and must not take the panel down.
      BOT_CONFIGURED: ${{ inputs.bot_app_id != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
    outputs:
      capped: ${{ steps.cap.outputs.capped }}
      labelled: ${{ steps.cap.outputs.labelled }}
      rounds: ${{ steps.cap.outputs.rounds }}
      next_round: ${{ steps.cap.outputs.next_round }}
      max_rounds: ${{ steps.cap.outputs.max_rounds }}
    steps:
      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Mint bot-identity token (optional)
        id: bot_token
        if: ${{ env.BOT_CONFIGURED == 'true' && inputs.max_rounds > 0 }}
        # Best-effort: a failed mint degrades to github-actions[bot] below rather
        # than failing this job, which `diff-size` (and so the panel) hangs off.
        # The count then matches no bot-posted round and fails open.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Count review rounds
        id: cap
        if: ${{ inputs.max_rounds > 0 }}
        env:
          # The identity post-review posts under: the bot when configured, else
          # github-actions[bot]. Its reviews are the rounds, and its token writes
          # the label and the comment.
          GH_TOKEN: ${{ steps.bot_token.outputs.token || secrets.GITHUB_TOKEN }}
          APP_SLUG: ${{ steps.bot_token.outputs.app-slug }}
          MAX_ROUNDS: ${{ inputs.max_rounds }}
          THRESHOLD: ${{ inputs.approve_max_severity }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$APP_SLUG" ]; then LOGIN="${APP_SLUG}[bot]"; else LOGIN="github-actions[bot]"; fi
          python3 "$CURSOR_REVIEW_ASSETS/auto-approve.py" round-cap \
            --repo "$REPO" \
            --pr-number "$PR_NUMBER" \
            --max-rounds "$MAX_ROUNDS" \
            --threshold "$THRESHOLD" \
            --poster-login "$LOGIN"

  diff-size:
    name: Diff size check
    # Needs `ledger` (not just `gate`) so it can build the incremental
    # "hunks new since the last reviewed round" diff here too, alongside the
    # main reviewed diff — one checkout, one artifact, instead of every panel
    # cell (plus consolidate) re-deriving it from its own PR checkout.
    # `round-cap` is the panel's off switch: every job that spends hangs off this
    # one, so a capped PR (or a red cap job) runs no panel at all.
    needs: [gate, ledger, round-cap]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.round-cap.outputs.capped != 'true'
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    permissions:
      contents: read
    # within_cap is derived from the shared check-pr-size tool's `over_cap`
    # output: counted = non-generated changed lines (minus any comment/blank
    # discount), compared against the review cap passed as --max. Failure
    # handling is explicit and two-tier (see the classify step): a git-level
    # failure fails THIS JOB — fail closed, no review — while a tool-level
    # failure falls back to the RAW changed-line count with no exclusions
    # (strictly >= the classified count), so a degraded run can still review a
    # small PR but can never feed an unbounded diff to the panel.
    outputs:
      within_cap: ${{ steps.check.outputs.over_cap != 'true' }}
      # The counted total behind that verdict, so the over-cap comment can name
      # the number the author has to get under. Written by the tool on the
      # normal path and by the raw-count fallback below on the degraded one, so
      # it always agrees with whichever count actually decided `over_cap`.
      counted: ${{ steps.check.outputs.counted }}
      # Whether that count came from the raw-numstat fallback (classifier tool
      # failed) rather than the classifier. The over-cap comment needs it to
      # describe the number honestly: on the degraded path NOTHING was excluded,
      # so calling it "after generated-file exclusion" would send an author
      # hunting for a lockfile that was, in fact, counted.
      degraded: ${{ steps.check.outputs.degraded }}
      # Whether the incremental "hunks new since last round" block really was
      # the subset of the reviewed diff the prompt calls it (BE-15558).
      # `true` both when the block passed the fail-safe and when there is no
      # block at all (round 1, an unresolvable last-reviewed SHA, an over-cap
      # run where this step never ran) — in none of those cases was anything
      # dropped. `false` ONLY when the fail-safe fired and discarded a block
      # that had been built, which is the one case a panel-integrity signal
      # should report. Written with `!= 'false'` rather than read straight
      # through so the skipped-step empty string reads as `true`, not `''`.
      incremental_subset: ${{ steps.incremental.outputs.incremental_subset != 'false' }}
      # What the incremental block IS, for approve_scope (auto-approve.py
      # resolve_scope): `none` (no usable last-reviewed SHA — round 1, or a re-run
      # on the same head), `built` (verified; EMPTY on a pure rebase),
      # `unavailable` (a later round whose block could not be built) or
      # `discarded` (the fail-safe threw it away). A skipped step reads as
      # `unavailable`, which fails closed to `full`.
      incremental_state: ${{ steps.incremental.outputs.incremental_state || 'unavailable' }}
      # The merge base THIS round's reviewed diff was taken against — the exact left
      # tree `check-pr-size` resolves `BASE_SHA...HEAD_SHA` to. Consumed by `post-review`
      # (BE-15598), which writes it into the consolidated review's round sentinel so the
      # NEXT round can rebuild "what the panel already saw" against this tree rather than
      # recomputing a merge base from a base that may have moved since (a retarget, a
      # base-branch rewrite). Empty when git could not resolve it, which the next round
      # reads as "no recorded merge base" and fails closed to no incremental block.
      merge_base_sha: ${{ steps.merge_base.outputs.merge_base_sha }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the BASE...HEAD three-dot diff resolves and the
          # tool's base-ref reads (linguist-generated via `check-attr --source`,
          # deleted-file blob fallbacks) work without a separate fetch.
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Resolve this round's merge base
        # Recorded in the consolidated review by `post-review`, and read back by the
        # NEXT round to pin the OLD side of its incremental block (BE-15598). Plain
        # shell rather than a check-pr-size output on purpose: the tool does resolve
        # the same commit internally, but it is skipped entirely on the degraded
        # raw-numstat fallback path, and a round that records no merge base costs the
        # NEXT round its whole incremental block. This step runs on both paths.
        #
        # Best-effort by construction — it must never fail the job. `git merge-base`
        # exits non-zero when the two commits share no history (an unrelated-histories
        # base, a base ref the fetch-depth:0 checkout still cannot see), and there is
        # nothing to do about that except record nothing and say so.
        id: merge_base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        #
        # No line-break guard on the value, unlike `resolveMergeBase` in
        # scripts/check-pr-size/main.go, which rejects a result containing \r or \n. The
        # divergence is deliberate, not an oversight: `git merge-base` with two commits
        # and no --all prints exactly ONE line, and `$( )` strips every trailing newline
        # off it, so there is no value this step can emit that the Go check would refuse.
        # post-review.py's `field()` re-validates the shape before it reaches the
        # sentinel besides, and build-ledger.py's `_FULL_SHA_RE` again on the way back.
        run: |
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null || true)"
          if [ -n "$MERGE_BASE" ]; then
            echo "Round merge base: ${MERGE_BASE}"
          else
            echo "::warning::Could not resolve the merge base of ${BASE_SHA} and ${HEAD_SHA} — this round records none, so the next round will skip its incremental diff block rather than diff against the wrong tree."
          fi
          echo "merge_base_sha=${MERGE_BASE}" >> "$GITHUB_OUTPUT"

      - name: Load check-pr-size tool
        # The SAME classifier the PR-size cap uses — the single source of truth
        # for "what is codegen". Comes from THIS repo (public, pinned via
        # workflows_ref), never the PR checkout, so a malicious PR can't rewrite
        # the logic that decides which of its files skip review.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _pr_size_tool
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: _pr_size_tool/scripts/check-pr-size/go.mod
          # Dependency-free module (no go.sum) — nothing to cache.
          cache: false

      - name: Build check-pr-size
        env:
          # See pr-size.yml: the tool is checked out UNDER the consumer repo's
          # checkout, so a root go.work would otherwise refuse the build. The
          # tool is dependency-free; disable workspace mode and build standalone.
          # Quoted "off" — unquoted off is coerced to GOWORK=false by the Actions
          # YAML parser, which Go then rejects as a bad workspace-file path.
          GOWORK: "off"
        run: |
          # Drop anything the PR checkout could have pre-seeded under the tool
          # path so the build compiles only the pinned sources.
          git -C _pr_size_tool clean -ffdx
          (cd _pr_size_tool/scripts/check-pr-size && go build -o "${RUNNER_TEMP}/check-pr-size" .)

      - name: Classify generated files, check size, and build reviewed diff
        id: check
        env:
          # This is the current target-branch tip, not necessarily the commit
          # the PR forked from. check-pr-size resolves BASE_SHA + HEAD_SHA to
          # their merge base once and uses that commit for both classification
          # and the reviewed patch, so later main-only commits never enter an
          # unrebased PR's review.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Read by the tool's --ignore-comments default: discount blank/comment
          # lines from the counted total (count-only; the reviewed diff keeps them).
          PR_SIZE_IGNORE_COMMENTS: ${{ inputs.ignore_comments }}
        run: |
          # Reuse the PR-size classifier as the single source of truth. --max is
          # THIS review's cap (DIFF_SIZE_CAP), so the tool's `over_cap` output
          # means "non-generated changed lines exceed the review cap" — exactly
          # the gate we want. --mode warn: the tool never exits non-zero on
          # overage (this workflow gates via within_cap, not the tool's own
          # pass/fail). The same run writes the reviewed diff (the PR's patch
          # with every generated file's section filtered out, minus any caller
          # diff_excludes pathspecs) to --reviewed-diff-out, so classification
          # happens ONCE and the count and the reviewed diff can never disagree.
          # Filtering the patch — instead of expanding one exclude pathspec per
          # generated file onto argv — means an unbounded number of generated
          # files (they cost nothing against the cap) can't overflow ARG_MAX.
          #
          # --marker-from-base: this classification decides what a (potentially
          # blocking) review SEES, so the Go generated marker is honored only
          # from the BASE blob — a PR can't hide hand-written code from the
          # panel by prepending the one-line marker. Matches the base-ref
          # invariant the linguist-generated attribute path already enforces.
          #
          # Failure handling is two-tier, both explicit:
          #   - git-level breakage (bad ref, missing history): the fallback
          #     `git diff --numstat` below dies under `set -e` and FAILS this
          #     job — fail closed, a loud red X, never a silent skip.
          #   - tool-level failure (classifier bug, patch-write error): fall
          #     back to the RAW changed-line count with no exclusions —
          #     strictly >= the classified count, so a degraded run still
          #     reviews a small PR but can never feed an unbounded diff to the
          #     panel jobs. The next step rebuilds the diff with
          #     diff_excludes only (the pre-classifier behavior).
          rc=0
          "${RUNNER_TEMP}/check-pr-size" \
            --base "${BASE_SHA}" \
            --head "${HEAD_SHA}" \
            --max "${DIFF_SIZE_CAP}" \
            --mode warn \
            --marker-from-base \
            --extra-generated-globs "${EXTRA_GENERATED_GLOBS}" \
            --extra-lockfiles "${EXTRA_LOCKFILES}" \
            --diff-excludes "${DIFF_EXCLUDES}" \
            --reviewed-diff-out "${RUNNER_TEMP}/pr-diff.patch" || rc=$?
          if [ "$rc" -eq 0 ]; then
            if [ -f "${RUNNER_TEMP}/pr-diff.patch" ]; then
              echo "Reviewed diff size: $(wc -l < "${RUNNER_TEMP}/pr-diff.patch") lines"
            fi
          else
            echo "::warning::check-pr-size exited ${rc} — gating on the raw line count and reviewing with no generated-file exclusions (diff_excludes still apply)."
            rm -f "${RUNNER_TEMP}/pr-diff.patch"
            echo "degraded=true" >> "$GITHUB_OUTPUT"
            # Raw-count gate: no exclusions, so always >= the classified count.
            # Appended after any over_cap the tool already wrote — the last
            # value wins, so a raw overage can only tighten the gate. The
            # numstat runs as its own statement (not inside a pipeline, whose
            # exit status `set -e` would ignore) so git-level breakage fails
            # the job here (fail closed, above).
            git diff --numstat "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/raw-numstat"
            RAW=$(awk '{ if ($1 != "-") total += $1; if ($2 != "-") total += $2 } END { print total + 0 }' "${RUNNER_TEMP}/raw-numstat")
            echo "Raw changed lines (no exclusions): ${RAW} (cap: ${DIFF_SIZE_CAP})"
            # Same last-value-wins append as over_cap below: whichever count
            # decided the gate is the one the skip notice must quote. Without
            # this the tool's pre-crash `counted` (or nothing at all) would be
            # reported next to a verdict the RAW count actually made.
            echo "counted=${RAW}" >> "$GITHUB_OUTPUT"
            if [ "${RAW}" -gt "${DIFF_SIZE_CAP}" ]; then
              echo "over_cap=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Announce over-cap skip
        # The over-cap path used to run NOTHING: every downstream job is gated
        # on within_cap, the tool runs in --mode warn (never non-zero), so the
        # whole run went green with no review and no signal — indistinguishable
        # from "the panel reviewed this and found nothing" (BE-7646). This
        # annotation + summary is the credential-free half of the signal, so it
        # reaches Dependabot PRs (whose runs read the Dependabot secret store,
        # not Actions secrets) and any consumer whose comment write fails. NOT
        # fork PRs: `gate` sets should_run=false for a cross-repo head before
        # this job runs at all, so an over-cap fork PR reaches neither half of
        # the signal — it is skipped for being a fork first.
        if: steps.check.outputs.over_cap == 'true'
        env:
          COUNTED: ${{ steps.check.outputs.counted }}
        run: |
          # `counted` is written on both paths above, but a tool that died
          # before writing outputs AND left the raw count within the cap can
          # still leave it empty while over_cap came from elsewhere — say
          # "unknown" rather than render an empty number as fact.
          COUNTED_TEXT="${COUNTED:-unknown}"
          echo "::warning::Cursor review SKIPPED — counted ${COUNTED_TEXT} changed lines exceeds diff_size_cap=${DIFF_SIZE_CAP}. This PR gets no review panel. Split the PR or reduce the counted diff."
          {
            echo "## ⚠️ Cursor review skipped (over cap)"
            echo "Counted ${COUNTED_TEXT} changed lines > cap ${DIFF_SIZE_CAP} — no panel ran."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build reviewed diff (degraded fallback)
        # Only when the classifier tool failed but the raw count is within the
        # cap: no generated-file exclusions are available, so build the diff
        # with just the caller's diff_excludes (the pre-classifier behavior).
        # The raw-count gate above already bounded this diff's size.
        if: steps.check.outputs.over_cap != 'true' && steps.check.outputs.degraded == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # $DIFF_EXCLUDES is intentionally unquoted so bash word-splits it into
          # pathspec args.
          # shellcheck disable=SC2086
          git diff "${BASE_SHA}...${HEAD_SHA}" -- . $DIFF_EXCLUDES \
            > "${RUNNER_TEMP}/pr-diff.patch"
          echo "Reviewed diff size: $(wc -l < "${RUNNER_TEMP}/pr-diff.patch") lines"

      - name: Build incremental diff since last review
        # The subset of the reviewed diff that changed since the last reviewed
        # round — PRIORITIZATION, not narrowing, the full diff above stays the
        # primary input; this just tells the panel where to spend budget. Built
        # here (this job already holds the fetch-depth:0 checkout) so it can
        # ride the same shared artifact instead of every consumer re-deriving it.
        # Best-effort: an unresolvable SHA (force-push, base-branch rewrite)
        # simply produces no incremental block.
        #
        # It is built by DIFFING TWO PR PATCHES, never a commit range (BE-15558).
        # `git diff LAST_REVIEWED...HEAD` looks like the obvious formulation and
        # is wrong: when HEAD is a merge commit that pulled the base branch into
        # the branch, LAST is an ancestor of HEAD, the merge base of the two IS
        # LAST, and the range therefore contains every commit that merge brought
        # in. Measured on a consumer repo, one round built a 9,800-line block
        # against a 1,234-line reviewed diff (119 of its 133 files outside the
        # PR) and two PRs built ~1.16M-line blocks; the prompt went from ~98 KB
        # to ~826 KB, most legs timed out, and the legs that finished reviewed
        # files from the base branch rather than the PR. Each patch here is taken
        # against a MERGE BASE instead, so each carries only the branch's own
        # changes and neither can name a base-branch commit.
        #
        # NEW is `pr-diff.patch` ITSELF — the diff this round is actually
        # reviewing — not a freshly-computed BASE...HEAD diff. Every emitted
        # section is then a verbatim slice of the reviewed diff, so the subset
        # property the prompt asserts holds by construction, and a generated
        # file the classifier stripped from the reviewed diff can never reappear
        # in the block (which would trip the fail-safe and discard the lot).
        #
        # Each patch is pinned to the merge base ITS OWN round used: OLD to the one
        # round N recorded in its review's round sentinel, NEW (via check-pr-size) to
        # merge-base(BASE, HEAD) for this round. Recomputing OLD's from the CURRENT
        # base is the bug BE-15598 fixes — after a retarget or a base-branch rewrite
        # `BASE...LAST_REVIEWED` diffs against a merge base round N never used, so
        # hunks the panel has never seen read as "already reviewed" and are dropped
        # from the block. The subset fail-safe cannot catch that: a block that is too
        # SMALL is still a subset. With no recorded merge base there is no honest
        # answer, so the step emits no block at all rather than guessing one.
        #
        # KNOWN, and not fixed here: on the retarget path this pin exists FOR, the two
        # merge bases can be nearly disjoint, so almost nothing in NEW is in OLD and the
        # block comes out close to the full reviewed diff — which the prompt then carries
        # twice. `check` cannot catch it (`foreign == 0` and `new_lines <= full_lines`
        # both hold), because the block really is a faithful subset; it is just a useless
        # one. The cost is prompt budget on an uncommon path, never coverage, and the
        # alternative — declining a block whose length approaches `full_lines` — needs a
        # threshold nothing here has grounds to pick yet. Left as a known waste rather
        # than guessed at.
        #
        # The two merge bases still differ whenever the base branch was merged in
        # between rounds. A file the base branch AND the branch both touched then reads
        # as changed even if the author's own edit did not move. That is over-inclusion
        # strictly WITHIN the PR's own files, which costs a little prompt budget and
        # never breaks the subset property; it is the accepted direction, because the
        # alternative hides a hunk whose surrounding code really did change under it.
        id: incremental
        if: steps.check.outputs.over_cap != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LAST_REVIEWED_SHA: ${{ needs.ledger.outputs.last_reviewed_sha }}
          # The merge base round N recorded, NOT this round's — see above. Empty for
          # every round reviewed before the round sentinel existed, and for one whose
          # sentinel did not parse or did not name the reviewed commit.
          LAST_REVIEWED_MERGE_BASE: ${{ needs.ledger.outputs.last_reviewed_merge_base }}
          LEDGER_ROUNDS: ${{ needs.ledger.outputs.rounds }}
        run: |
          NEW_PATCH="${RUNNER_TEMP}/pr-diff-new.patch"
          OLD_PATCH="${RUNNER_TEMP}/pr-diff-old.patch"
          FULL_PATCH="${RUNNER_TEMP}/pr-diff.patch"
          # The helper comes from the pinned checkout of THIS repo (same one the
          # classifier was built from), never the PR checkout — a PR must not be
          # able to rewrite the logic that decides what the panel is shown.
          INCREMENTAL_PY="_pr_size_tool/.github/cursor-review/incremental-diff.py"
          : > "$NEW_PATCH"
          # An OLD patch larger than this is declined rather than parsed. NEW is
          # bounded by diff_size_cap; OLD is NOT — the last-reviewed patch keeps
          # the generated-file sections the classifier strips out of the
          # reviewed diff, and those cost nothing against that cap — so a PR
          # comfortably under the review cap can still hand this step a patch
          # big enough to burn the runner's memory on. Declining fails closed to
          # "no block", the same as every other case below.
          OLD_PATCH_MAX_BYTES=33554432   # 32 MiB
          # Wrapped in a function so the shellcheck directive sits in front of a
          # complete command — it is rejected in front of an `elif` branch.
          build_old_patch() {
            # core.quotePath=false to match check-pr-size's `writeReviewedDiff`,
            # which builds the NEW side. Under the default (quoting ON) a
            # non-ASCII path arrives C-quoted here and PLAIN there, so the two
            # sides key differently and every such file is re-emitted in full on
            # every round — including a pure rebase.
            # TWO-DOT, against the RECORDED merge base: that commit is the exact left
            # tree round N diffed, so this is the same two-tree diff its own
            # `mergeBase...head` resolved to — and check-pr-size builds NEW the same
            # way. Three dots here would re-resolve a merge base from a ref that has
            # already moved, which is precisely the bug (BE-15598).
            # $DIFF_EXCLUDES is intentionally unquoted so bash word-splits it
            # into pathspec args.
            # shellcheck disable=SC2086
            git -c core.quotePath=false diff "${LAST_REVIEWED_MERGE_BASE}" "${LAST_REVIEWED_SHA}" -- . $DIFF_EXCLUDES > "$OLD_PATCH"
          }
          # Default the output to the honest "nothing was discarded" value, and
          # let the fail-safe below append 'false' over it — same last-value-wins
          # append the raw-count fallback above uses.
          echo "incremental_subset=true" >> "$GITHUB_OUTPUT"
          # Same last-value-wins append for approve_scope's view of the block.
          echo "incremental_state=unavailable" >> "$GITHUB_OUTPUT"
          # Every "can't build one" case below leaves the block EMPTY and
          # `incremental_subset` true: nothing was discarded, there was simply
          # nothing to prioritize, and the panel reviews the full diff as it
          # does on round 1. Only the fail-safe at the bottom writes `false`.
          if [ -z "$LAST_REVIEWED_SHA" ] || [ "$LAST_REVIEWED_SHA" = "$HEAD_SHA" ]; then
            echo "No usable last-reviewed SHA — skipping the incremental diff block."
            echo "incremental_state=none" >> "$GITHUB_OUTPUT"
          elif ! git cat-file -e "${LAST_REVIEWED_SHA}^{commit}" 2>/dev/null; then
            echo "Last-reviewed SHA ${LAST_REVIEWED_SHA} is unreachable (force-push or base-branch rewrite) — skipping the incremental diff block."
          elif [ -z "$LAST_REVIEWED_MERGE_BASE" ]; then
            # Fail CLOSED, and do NOT fall back to ${BASE_SHA}: that fallback IS the bug
            # (BE-15598). Every live PR sees this once after rollout — the round it is
            # comparing against was posted before the sentinel existed — and then the
            # block comes back on the round after, which is the first one with a
            # recorded merge base to pin to.
            echo "No recorded merge base for round ${LEDGER_ROUNDS:-?} (reviewed before the round sentinel existed, or the sentinel did not parse) — skipping the incremental diff block."
          elif ! git cat-file -e "${LAST_REVIEWED_MERGE_BASE}^{commit}" 2>/dev/null \
               || ! git merge-base --is-ancestor "$LAST_REVIEWED_MERGE_BASE" "$LAST_REVIEWED_SHA" 2>/dev/null; then
            # The recorded commit has to be reachable in THIS checkout and has to still
            # be an ancestor of the commit it was the merge base of. A base-branch
            # rewrite can drop the commit entirely, and a rewritten PR branch can leave
            # it reachable but no longer in the last-reviewed commit's history — in
            # which case `git diff <merge base> <last reviewed>` succeeds and returns
            # something that is not "what round N saw" at all.
            echo "Recorded merge base ${LAST_REVIEWED_MERGE_BASE} is unreachable or not an ancestor of the last-reviewed commit ${LAST_REVIEWED_SHA} — skipping the incremental diff block."
          elif [ ! -s "$FULL_PATCH" ]; then
            echo "The reviewed diff is empty — skipping the incremental diff block."
          elif ! build_old_patch || [ ! -s "$OLD_PATCH" ]; then
            # Fail CLOSED to "no block" — for a FAILED build and an EMPTY one
            # alike. Falling through with an empty OLD would make every file
            # read as new and emit the whole reviewed diff a second time: a
            # doubled prompt that prioritizes nothing, which the fail-safe
            # below cannot catch either (nothing is foreign, and new_lines
            # EQUALS full_lines rather than exceeding it). An empty OLD is not
            # an error git reports — it is simply what the recorded merge base
            # against the last-reviewed commit yields whenever round N's own
            # patch was empty (the recorded merge base IS that commit), or
            # whenever $DIFF_EXCLUDES filters every file out.
            echo "Could not build a non-empty last-reviewed patch (${LAST_REVIEWED_SHA}) — skipping the incremental diff block."
          elif [ "$(wc -c < "$OLD_PATCH")" -gt "$OLD_PATCH_MAX_BYTES" ]; then
            echo "The last-reviewed patch is larger than ${OLD_PATCH_MAX_BYTES} bytes — skipping the incremental diff block rather than parsing it."
          elif ! python3 "$INCREMENTAL_PY" build \
                 --old "$OLD_PATCH" --new "$FULL_PATCH" --out "$NEW_PATCH"; then
            echo "::warning::Could not build the incremental diff block — the panel will run on the full reviewed diff alone."
            : > "$NEW_PATCH"
          else
            echo "Incremental diff since round ${LEDGER_ROUNDS:-?} (${LAST_REVIEWED_SHA}): $(wc -l < "$NEW_PATCH") lines"
            # Fail-safe. The prompt tells the panel this block "is the subset of
            # the diff above", so VERIFY it rather than trusting the builder:
            # any path the reviewed diff does not carry, or more lines than the
            # reviewed diff, and the block is discarded whole. The panel then
            # runs on the full diff alone, which is always correct.
            if SUBSET_OUT="$(python3 "$INCREMENTAL_PY" check --new "$NEW_PATCH" --full "$FULL_PATCH")"; then
              echo "Incremental block verified as a subset of the reviewed diff."
              echo "incremental_state=built" >> "$GITHUB_OUTPUT"
            else
              FOREIGN="$(printf '%s\n' "$SUBSET_OUT" | sed -n 's/^foreign=//p')"
              NEW_LINES="$(printf '%s\n' "$SUBSET_OUT" | sed -n 's/^new_lines=//p')"
              FULL_LINES="$(printf '%s\n' "$SUBSET_OUT" | sed -n 's/^full_lines=//p')"
              : > "$NEW_PATCH"
              echo "::warning::Incremental diff discarded: it was not a subset of the reviewed diff (${FOREIGN:-unknown} foreign file(s), ${NEW_LINES:-unknown} vs ${FULL_LINES:-unknown} lines)."
              echo "incremental_subset=false" >> "$GITHUB_OUTPUT"
              echo "incremental_state=discarded" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Upload reviewed diff
        # Shared with the panel cells + judge so the diff is generated ONCE, and
        # those jobs need no PR checkout of their own.
        if: steps.check.outputs.over_cap != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-diff
          path: |
            ${{ runner.temp }}/pr-diff.patch
            ${{ runner.temp }}/pr-diff-new.patch
          if-no-files-found: error
          retention-days: 7

  # Sticky PR comment for the over-cap skip. Modelled on pr-size.yml's `comment`
  # job, same best-effort contract: the verdict lives in `diff-size` (its
  # ::warning:: annotation and step summary), and this path may never redden the
  # run — hence continue-on-error on both the mint and the upsert.
  #
  # Non-blocking on purpose. cursor-review is advisory by default — it posts a
  # review, it does not gate (gating is the opt-in `blocking` input's separate
  # Blocking gate job, and even for a blocking caller an over-cap skip is a
  # documented pass-through there, not a failure) — so failing the run over an
  # over-cap PR would gate nothing while breaking the reusable's contract for
  # every caller. The fix here is VISIBILITY, not enforcement.
  #
  # Isolation: this job checks out NO code at all — it only reads job outputs
  # and calls the comments API — so its write-scoped token is never present in
  # a job that held a PR checkout.
  over-cap-comment:
    name: Comment when over the diff-size cap
    needs: [gate, diff-size]
    # Gating on diff-size's RESULT, not on within_cap, is load-bearing twice
    # over. A git-level diff-size failure leaves every output empty, and an
    # empty within_cap satisfies `!= 'true'` — which would post a confident
    # "over cap" comment about a job that never counted anything. And the job
    # must ALSO run on within-cap runs, because that is the only way a stale
    # over-cap comment ever gets flipped to ✅ once the PR is trimmed.
    #
    # `!cancelled()` rather than `always()`: the documented caller sets
    # cancel-in-progress, so a superseded run reaching here would PATCH its
    # obsolete verdict over the newer run's — and this comment's whole content
    # is "did a review run", the one thing that must not go stale. The upsert
    # additionally re-checks the live PR head, which covers the other half
    # (someone manually re-running an old, uncancelled run).
    if: ${{ !cancelled() && needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.result == 'success' }}
    runs-on: ubuntu-latest
    # Bounded like every other job here. The work is two API calls, but the list
    # paginates over an attacker-growable comment list, so the 6-hour default
    # would let a rate-limited or hung call hold a runner all day.
    timeout-minutes: 5
    permissions:
      contents: read
      # For the GITHUB_TOKEN fallback below. Not a new demand on callers:
      # `post-review` already requires this exact scope to post the review, so
      # every caller that can run this workflow at all already grants it.
      pull-requests: write
    env:
      # The `secrets` context is unavailable in `if` conditions, so the
      # credentials-present test is evaluated here (job env allows it) and the
      # mint below gates on the result. Absent creds are NOT the end of the
      # road any more — the upsert falls back to the run token.
      BOT_CONFIGURED: ${{ inputs.bot_app_id != '' && secrets.BOT_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint bot token
        id: bot
        if: env.BOT_CONFIGURED == 'true'
        # Best-effort: a consumer whose bot app lacks the requested scope (or
        # has creds misconfigured) falls back to the run token below, and never
        # gets a red check from the comment path.
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ inputs.bot_app_id }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Exactly what the upsert uses. The sticky comment rides the
          # issues-comments API on a PULL REQUEST, and for GitHub Apps that
          # endpoint checks the app's Pull requests permission (not Issues) — so
          # pull-requests:write is the one scope required (read is implied for
          # the list GET). Requesting an ungranted extra (e.g. issues:write)
          # would 422 the mint on installations that never granted it.
          permission-pull-requests: write

      - name: Upsert sticky over-cap comment
        id: upsert
        # Same best-effort contract as the mint: a runtime permission failure
        # (e.g. a 403 because the bot app lacks Pull requests on this
        # installation) must not fail the job — "Note degraded mode" reports it.
        continue-on-error: true
        env:
          # Dedicated bot identity when configured, else github-actions[bot] —
          # the same fallback `consolidate` uses to post the review itself.
          # Without it the sticky half of this fix would never fire for the
          # (likely majority) of callers that configure no bot app, leaving them
          # with exactly the silent green run BE-7646 is about.
          GH_TOKEN: ${{ steps.bot.outputs.token || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # The minted token's OWN bot login. app-slug comes from the mint, so
          # it identifies this installation whether bot_app_id was given as a
          # numeric App ID or a Client ID (`Iv1.…`). Empty when no app is
          # configured or the mint failed; RUN_LOGIN then carries the identity.
          BOT_LOGIN: ${{ steps.bot.outputs.app-slug && format('{0}[bot]', steps.bot.outputs.app-slug) || '' }}
          # The fallback identity. BOTH logins are matched when finding the
          # sticky comment, because the identity can change between runs (a bot
          # app added later, or a mint that fails once) and a finder that knew
          # only the current one would post a second comment beside the old one
          # and then maintain two contradictory verdicts. Still safe as an
          # author filter: a PR author cannot post as either login.
          RUN_LOGIN: github-actions[bot]
          WITHIN_CAP: ${{ needs.diff-size.outputs.within_cap }}
          COUNTED: ${{ needs.diff-size.outputs.counted }}
          DEGRADED: ${{ needs.diff-size.outputs.degraded }}
        run: |
          set -euo pipefail
          # Don't let an obsolete run overwrite a newer verdict. `!cancelled()`
          # covers the cancel-in-progress path; this covers a manual re-run of
          # an older run, whose event payload still carries the head SHA that
          # was current when it was queued.
          #
          # FAILS CLOSED. A lookup that errors leaves us unable to tell a
          # current run from an obsolete one, and writing anyway would let a
          # stale "no panel ran" (or a premature ✅) land on top of the right
          # answer — the one failure this guard exists to prevent. Skipping
          # costs little: the list and write below hit the same API with the
          # same token, so a real outage would take them out a line later
          # regardless. `exit 1` under continue-on-error routes it to "Note
          # degraded mode", which reports it against the annotation + summary
          # that remain the primary signal.
          if ! LIVE_HEAD="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.head.sha')" || [ -z "$LIVE_HEAD" ]; then
            echo "Could not read the PR's current head (see gh error above) — refusing to write a verdict that may already be stale." >&2
            exit 1
          fi
          if [ "$LIVE_HEAD" != "$EVENT_HEAD_SHA" ]; then
            echo "This run's head (${EVENT_HEAD_SHA}) is no longer the PR head (${LIVE_HEAD}) — a newer run owns the verdict. Not writing."
            exit 0
          fi
          # Distinct from the panel's CONSOLIDATED_MARKER (gate-unresolved.py):
          # that one matches PR *reviews*, this one an issue comment, and
          # nothing in cursor-review reads issues/*/comments at all — so the two
          # cannot collide.
          MARKER='<!-- cursor-review-over-cap -->'
          COUNTED_TEXT="${COUNTED:-an unknown number of}"
          # On the degraded path `counted` is the RAW numstat total — the
          # classifier never ran, so no generated file was excluded from it.
          # Describing it as "after generated-file exclusion" there would tell
          # an author whose lockfile tipped the PR over the cap to go shrink a
          # number the stated rule says already excludes their lockfile.
          if [ "${DEGRADED:-}" = "true" ]; then
            BASIS='raw changed lines; the generated-file classifier failed on this run, so nothing was excluded from the count'
          else
            BASIS='changed lines, after generated-file exclusion'
          fi
          if [ "$WITHIN_CAP" = "true" ]; then
            {
              printf '%s\n\n' "$MARKER"
              # Deliberately claims only what THIS job knows. It needs just
              # `gate` + `diff-size`, so it runs alongside the panel and cannot
              # see whether the panel finished, failed preflight, or was
              # cancelled — asserting "the panel ran" here would re-create the
              # false green this whole change exists to kill.
              # shellcheck disable=SC2016
              printf '✅ **Now under the cap** — this PR no longer exceeds `diff_size_cap`, so the review is no longer skipped for size. Check this run for the panel'"'"'s result.\n'
            } > body.md
          else
            {
              printf '%s\n\n' "$MARKER"
              # The backticks are a markdown code span in the comment body, not
              # a command substitution — single quotes are what keeps them so.
              # shellcheck disable=SC2016
              printf '⚠️ **Cursor review skipped** — the counted diff (%s %s) exceeds `diff_size_cap` (%s). **No review panel ran on this PR.**\n\n' \
                "$COUNTED_TEXT" "$BASIS" "$DIFF_SIZE_CAP"
              # NOT "re-runs automatically on the next push": the documented
              # caller subscribes to `types: [labeled, unlabeled]` only, so a
              # push fires nothing and the gate only sets should_run on a
              # `labeled` event (or in run_without_label mode). Telling the
              # author to push would leave them waiting on a run that never
              # starts, under a comment that never flips.
              # shellcheck disable=SC2016
              printf 'Reduce the counted diff or split the PR, then re-apply the `%s` label to trigger a fresh review. (If this repo runs the review on every push, a push is enough.)\n' \
                "$REVIEW_LABEL"
            } > body.md
          fi
          # Find our existing sticky comment(s) by the hidden marker, so we
          # update across pushes instead of stacking new ones. Both filters are
          # load-bearing, and this mirrors pr-size.yml's `comment` job (and
          # `find_sticky` in scripts/pr-risk/publish-risk-surfaces.sh)
          # deliberately — same hazards, so the same shape rather than a third
          # dialect of it.
          #
          #   .user.login is one of OUR two possible identities (the bot app, if
          #     configured, and the run token's github-actions[bot]) — the
          #     marker is published in this PUBLIC workflow file, so without an
          #     author filter a PR author could pre-seed a comment carrying it
          #     and we would PATCH THEIRS instead of posting ours, after which
          #     they rewrite the "no review ran" notice freely. Matching the
          #     LOGIN (not merely `.user.type == "Bot"`) also keeps us off any
          #     OTHER app's comment that happens to echo author-controlled text
          #     as its first line. Neither login is postable by a human.
          #
          #   startswith, not contains — the body renders the marker as its
          #     FIRST line, while another bot QUOTING this comment carries the
          #     marker nested in its own prose.
          #
          # Both values are passed as jq DATA (--arg), never spliced into the
          # program text, so nothing can turn the filter into a syntax error —
          # which under `set -euo pipefail` plus continue-on-error would become
          # a silent "no comment posted".
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            | jq -r --arg m "$MARKER" --arg login "$BOT_LOGIN" --arg run_login "$RUN_LOGIN" '
                # $login is "" when no app token was minted; the != "" guard
                # keeps that empty string from matching a login-less comment.
                .[] | select(($login != "" and (.user.login // "") == $login)
                             or (.user.login // "") == $run_login)
                    | select((.user.type // "") == "Bot")
                    | select(((.body // "") | startswith($m)))
                    | .id')"
          if [ -n "$existing" ]; then
            # Update EVERY match, not just the first: the find-then-post is
            # check-then-act with no lock, so two runs that both list before
            # either posts leave two comments — reachable for a caller that adds
            # `synchronize` to its `types:` (or runs in run_without_label mode),
            # where a push can race a label toggle into a different concurrency
            # group. Updating every copy keeps the duplicates in AGREEMENT
            # instead of split-brained. Taking `head -n1` would pin
            # one forever while the other displayed a stale verdict — and here a
            # stale verdict says a review did or did not run, which is the whole
            # point of the comment. Unquoted on purpose: the ids are numeric and
            # newline-separated, so word splitting is the right parse.
            #
            # Per-id failure is TOLERATED rather than fatal — under
            # `set -euo pipefail` a bare call would abort the loop on the first
            # error and leave the remaining copies stale, exactly the split
            # brain this loop exists to prevent. A 404 is expected: a maintainer
            # (or another run) deleting one between the list and the write.
            patched=0
            failed=0
            for id in $existing; do
              if gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -F body=@body.md >/dev/null; then
                echo "Updated sticky over-cap comment ${id}."
                patched=$((patched + 1))
              else
                failed=$((failed + 1))
                # gh's stderr is deliberately NOT discarded: a 403 from
                # permission drift, a 422 on an over-long body and a concurrent
                # delete all land here.
                echo "Failed to update sticky over-cap comment ${id} (see gh error above); continuing." >&2
              fi
            done
            # Fail the step only when NOTHING was patched — a partial failure is
            # the case this loop exists for, and reporting it as a step failure
            # would make the degraded-mode note below claim no comment was
            # posted, which is affirmatively false.
            if [ "$patched" -eq 0 ] && [ "$failed" -gt 0 ]; then
              echo "No sticky comment could be updated (${failed} failed); the PR may show a stale verdict." >&2
              exit 1
            elif [ "$failed" -gt 0 ]; then
              echo "Updated ${patched} sticky comment(s); ${failed} could not be updated (see errors above)."
            fi
          elif [ "$WITHIN_CAP" != "true" ]; then
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@body.md >/dev/null
            echo "Posted over-cap skip comment."
          else
            # Never POST on the happy path — a PR that was always under the cap
            # gets a review, not a comment about not getting one.
            echo "Within the cap and no existing comment — nothing to post."
          fi

      - name: Note degraded mode
        # The upsert no longer depends on the bot app — it falls back to the run
        # token — so the only way no comment is written is the upsert itself
        # failing. Reported here so the job never goes green silently; the
        # ::warning:: annotation and step summary from the diff-size job remain
        # the signal in that case. A failed MINT alone is not degraded mode (the
        # run token covered it), but it is worth naming, since it changes which
        # identity authored the comment.
        if: steps.upsert.outcome == 'failure' || steps.bot.outcome == 'failure'
        env:
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          UPSERT_OUTCOME: ${{ steps.upsert.outcome }}
          WITHIN_CAP: ${{ needs.diff-size.outputs.within_cap }}
        run: |
          if [ "$BOT_OUTCOME" = "failure" ]; then
            echo "Bot app token could not be minted for this repo — the run token (github-actions[bot]) was used instead."
          fi
          if [ "$UPSERT_OUTCOME" != "failure" ]; then
            exit 0
          fi
          echo "Sticky comment NOT written: the upsert failed at runtime — see the 'Upsert sticky over-cap comment' step log above for the actual error (a network/5xx failure, a GitHub rate limit, or a 403 from a token without Pull requests: write on this repo)."
          if [ "$WITHIN_CAP" != "true" ]; then
            echo "This PR is OVER diff_size_cap and got no review panel — the ::warning:: annotation and step summary on the 'Diff size check' job are the signal."
          else
            echo "This PR is within diff_size_cap, so there is no skip to announce; nothing was owed on this run."
          fi

  preflight:
    # Validate the panel's pinned model ids against the LIVE Cursor catalog
    # once, before the 8-cell fan-out. When Cursor delists a pinned id the
    # per-cell `cursor-agent --model <id>` call cannot submit structured output.
    # Failing here turns that drift into a loud, visible job failure before the
    # fan-out starts. This job is ALSO the single source of truth for the
    # matrix model list (emitted as an output the `review` matrix consumes), so
    # the validated list and the reviewed list can never drift apart.
    name: Preflight — validate model catalog
    needs: [gate, diff-size]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      models: ${{ steps.models.outputs.models }}
      # 'true' only when the direct-API cell can actually run: a model id is
      # set, it is artifact-name safe, and OPENAI_API_KEY reached this
      # workflow. `review-openai-direct` gates on THIS rather than on the raw
      # input, so a misconfigured opt-in neither drops the Cursor OpenAI cell
      # nor schedules a cell that can only error.
      openai_direct: ${{ steps.models.outputs.openai_direct }}
      # 'true' when the direct-API cells are in effect AND replace the Cursor
      # OpenAI lane: they are then that lane, so they gate exactly like Cursor
      # cells (counted in ok_count/total, leg red on failure). Side by side
      # ('false') they stay advisory.
      openai_direct_counts: ${{ steps.models.outputs.openai_direct_counts }}
      # The same pair for the direct Anthropic cells (`review-anthropic-direct`).
      anthropic_direct: ${{ steps.models.outputs.anthropic_direct }}
      anthropic_direct_counts: ${{ steps.models.outputs.anthropic_direct_counts }}
      # `anthropic_direct_effort`, validated: always one of the allowed levels.
      anthropic_direct_effort: ${{ steps.models.outputs.anthropic_direct_effort }}
      # 'true' only when the judge can actually run direct: `judge_direct_model`
      # is a plain id and ANTHROPIC_API_KEY reached this workflow. `consolidate`
      # switches its runner and its judge steps on THIS, never the raw input.
      judge_direct: ${{ steps.models.outputs.judge_direct }}
      # `judge_direct_effort`, validated: always one of the allowed levels.
      judge_direct_effort: ${{ steps.models.outputs.judge_direct_effort }}
      # The caps DERIVED from `cell_timeout_minutes`, computed here because
      # Actions expressions have no arithmetic: `${{ x + 15 }}` is a parse
      # error that fails the workflow at load for every caller. Consumers
      # read them through `fromJSON(needs.preflight.outputs.*)`.
      cell_job_timeout: ${{ steps.cell_timeout.outputs.cell_job }}
      judge_step_timeout: ${{ steps.cell_timeout.outputs.judge_step }}
      judge_job_timeout: ${{ steps.cell_timeout.outputs.judge_job }}
    steps:
      - name: Validate the cell timeout
        id: cell_timeout
        # FIRST, and before a single cell spends. `type: number` buys only
        # numeric-ness: 0, -5 and 600 all parse. The three derived caps make a
        # bad value worse than it looks — the judge's job cap is 2x + 10, so a
        # typo'd 600 mints a 20-hour job and a 0 makes every cell fail
        # instantly with no clue why. Neither is visible in a diff of this
        # file, because the numbers are expressions now.
        #
        # Bounded rather than clamped, deliberately: silently correcting a
        # caller's 600 to 45 would review a long diff on a budget nobody chose
        # and report success. The floor is 10 because `Run cursor review`'s
        # wrapper may start its last `resource_exhausted` retry as late as 300s
        # in (`--retry-window 300`), and that attempt still needs room for a
        # healthy 3-7 minute review; at 5 a retried cell was all but certain to
        # hit the cap. The ceiling is 45 because that is already a 100-minute
        # judge job, and anything needing more is a diff-size problem, not a
        # timeout problem. The length check runs first because an all-digit
        # value too long for a 64-bit integer makes `[ -lt ]` error, and an
        # erroring test inside `if` reads as false, so it would pass.
        env:
          CELL_TIMEOUT: ${{ inputs.cell_timeout_minutes }}
        run: |
          set -euo pipefail
          case "$CELL_TIMEOUT" in
            ''|*[!0-9]*)
              echo "::error::cell_timeout_minutes must be a whole number of minutes between 10 and 45; got '${CELL_TIMEOUT}'."
              exit 1
              ;;
          esac
          if [ "${#CELL_TIMEOUT}" -gt 2 ] || [ "$CELL_TIMEOUT" -lt 10 ] || [ "$CELL_TIMEOUT" -gt 45 ]; then
            echo "::error::cell_timeout_minutes must be between 10 and 45; got ${CELL_TIMEOUT}. The judge's job cap is twice this plus 10, so the ceiling is what keeps a typo from minting an hours-long job."
            exit 1
          fi
          # 10# forces base 10; a two-digit value with a leading zero is < 10
          # and already rejected above, but this keeps "08" from reading as octal.
          cell=$((10#$CELL_TIMEOUT))
          judge_step=$((cell * 2))
          # Never below 30: the judge's workload grows with the panel, not with
          # the cell cap, so tightening cells to fail fast must not starve it.
          if [ "$judge_step" -lt 30 ]; then judge_step=30; fi
          echo "::notice::Cell agent cap ${cell}m; cell job $((cell + 15))m; judge step ${judge_step}m; judge job $((judge_step + 10))m."
          {
            echo "cell_job=$((cell + 15))"
            echo "judge_step=${judge_step}"
            echo "judge_job=$((judge_step + 10))"
          } >> "$GITHUB_OUTPUT"

      - name: Define panel models
        id: models
        # Single source of truth for the per-lab model pins. The `review`
        # matrix consumes this list via fromJSON, and the catalog check below
        # validates every entry — so a bump only ever touches this one list.
        # Keep in sync with the README model table.
        #
        # Three labs. OpenAI: GPT-5.6 Sol is the 5.6-family coding flagship
        # (Luna is the cost tier, Terra mid; the Codex line stops at 5.3).
        # Anthropic: Opus 5.5 at the `xhigh` tier — confirmed present and
        # ZDR-eligible against the live catalog, which prints
        # `claude-opus-5-5-xhigh - Claude Opus 5.5 1M Extra High` with no
        # NO-ZDR marker (preflight log of run 37688671671). That is a positive
        # read of the id's own line, not an inference from the family: an id
        # with no marker is not thereby ZDR-eligible, and the preflight below
        # only checks existence. Fable tops the catalog but every Fable entry
        # IS marked NO ZDR, and this panel reviews private-repo diffs, so that
        # family stays excluded. Note 5.5 ships NO `-thinking-` variants —
        # Opus 5 had both lines, 5.5 has only `claude-opus-5-5-<tier>`, so
        # `claude-opus-5-thinking-max` has no literal counterpart and the
        # nearest is a plain tier id. That plain line IS the thinking model:
        # Cursor labels non-thinking explicitly where it applies (every plain
        # Haiku 5.5 entry reads "No Thinking") and no Opus 5.5 or Sonnet 5.5
        # entry carries that marker. Moonshot: Kimi K3 at the `max` tier —
        # RESTORED 2026-10-09 after the `-high` tier proved capacity-bound; see
        # the note below. No NO-ZDR marker.
        #
        # Gemini 3.1 Pro was removed 2026-08-27. Over 1,450 judge-kept
        # findings (172 PRs), its two cells were the sole raiser of 2.5% of
        # kept findings and 3 of 213 critical/high ones, while costing ~9% of
        # every run; every other Gemini finding was also raised by the OpenAI
        # or Anthropic cell. The Kimi tier drop and the judge's move to
        # `-xhigh` come from the same spend review, and the Anthropic cell
        # moved from Opus 5 `-thinking-max` to Opus 5.5 `-xhigh` on
        # 2026-10-07 for the same reason: a newer model one reasoning notch
        # down. That is deliberately TWO axes at once (version + tier) — it
        # is a default change, not an attribution experiment.
        #
        # Kimi went BACK to `-max` on 2026-10-09. The `-high` tier turned
        # capacity-bound, not slow: cells died in ~25 seconds with
        # `RetriableError: [resource_exhausted]` after three internal
        # reconnects, zero findings, leg red, `Panel integrity` red with it.
        # Measured on one consumer over 56 panels: 24 of 76 `kimi-k3-high`
        # cells red (32%), 19 of them this error, and 12 of 22 on the last day.
        # It is not a property of one repo — the same model threw the same error
        # the same day on two unrelated consumers — and #388's in-step retry
        # does not rescue it, because the condition is sustained rather than
        # transient: both cells on github-workflows#392's own panel exhausted
        # all three attempts.
        #
        # `-max` rather than dropping the lane, because the lane EARNS its
        # place. Re-running the 2026-08-27 attribution over 1,158 judge-kept
        # findings (82 PRs), normalised per finding raised so panel size does
        # not flatter anyone: Kimi was the sole raiser of 17% of what it raised
        # at `-max` and 27% at `-high` — 1.05 unique findings per PR at BOTH
        # tiers — and uniquely caught 3 of 58 critical/high at `-max`. Compare
        # Gemini, cut for exactly this reason: 12% and 0.33 per PR, 0 of 58
        # critical/high. Dropping Kimi would cost roughly three times what
        # dropping Gemini did.
        #
        # What this trades away is the spend the tier drop was for, so it is a
        # deliberate reversal of part of #243, not an oversight. The reliability
        # it buys is also NOT established at this tier under present conditions:
        # `-max` was 0 of 36 cells red, but that was measured on 2026-10-07,
        # before the capacity trouble, and the two tiers may well share a pool.
        # If `-max` goes the same way, the evidence above says drop to a
        # two-lab Cursor panel rather than substitute Gemini or Grok — Grok
        # `4.7-high` was tried on 2026-10-09 and raised 0 unique findings in 17
        # while timing out on 11 of 20 cells.
        #
        # The `panel_models` input — or the CURSOR_PANEL_MODELS variable, see the
        # env block below — overrides this list for A/B experiments.
        #
        # The OpenAI cell moved from `gpt-5.6-sol-max` to `gpt-5.6-sol-xhigh`:
        # one reasoning notch down, to cut the timeouts and run-to-cap
        # failures seen on that lane. `gpt-5.6-sol-xhigh` is a live catalog id.
        #
        # Pins last checked 2026-08-27. This date is deliberately the OLDEST
        # pin's audit, and deliberately the only `last checked` literal in the
        # 40 lines above the heredoc: catalog-drift.py's `_LAST_CHECKED` does a
        # plain `re.search` over that window and applies the FIRST date it
        # finds to the WHOLE pin set. Putting a fresher per-lab date here — the
        # Anthropic cell was re-audited 2026-10-07 — resets the staleness clock
        # for every pin that was NOT re-audited, silently suppressing a finding
        # that is already due. Keep this line last, keep it the oldest, and
        # phrase any per-lab re-check so the regex cannot match it.
        env:
          # Falls back to a VARIABLE when the caller passes no input, so the
          # panel list is settable in ONE place for the whole fleet with no
          # caller edit. `vars` inside a reusable resolves against the CALLER's
          # repo and org — same as CURSOR_REVIEW_DM_EMAIL_MAP further down — so
          # an org-level CURSOR_PANEL_MODELS reaches every enrolled repo, and a
          # repo-level one of the same name overrides it for that repo alone.
          # Unset at both levels is '' → the built-in list below. An explicit
          # `panel_models` input still wins, so a caller pinning its own list is
          # unaffected.
          PANEL_MODELS_OVERRIDE: ${{ inputs.panel_models || vars.CURSOR_PANEL_MODELS }}
          # Which of the two won, for the log line below. With two sources the
          # effective list alone no longer says where to go change it.
          PANEL_MODELS_INPUT: ${{ inputs.panel_models }}
          # Drive the direct-cell replacement below. Read here rather than in
          # the `review` job so ONE resolved list feeds the matrix, the judge's
          # `expected` set and `Panel integrity` alike — filtering anywhere else
          # would leave consolidate expecting a cell that was never scheduled.
          OPENAI_DIRECT_MODEL: ${{ inputs.openai_direct_model }}
          OPENAI_DIRECT_REPLACES: ${{ inputs.openai_direct_replaces_cursor_openai }}
          # Resolved in the hosted `gate` job: this one follows `runs_on`, so
          # it must not reference the secret at all.
          OPENAI_KEY_PRESENT: ${{ needs.gate.outputs.openai_key_present }}
          # The same three for the direct Anthropic cells.
          ANTHROPIC_DIRECT_MODEL: ${{ inputs.anthropic_direct_model }}
          ANTHROPIC_DIRECT_REPLACES: ${{ inputs.anthropic_direct_replaces_cursor_anthropic }}
          ANTHROPIC_DIRECT_EFFORT: ${{ inputs.anthropic_direct_effort }}
          ANTHROPIC_KEY_PRESENT: ${{ needs.gate.outputs.anthropic_key_present }}
          # The direct judge (touches no panel list).
          JUDGE_DIRECT_MODEL: ${{ inputs.judge_direct_model }}
          JUDGE_DIRECT_EFFORT: ${{ inputs.judge_direct_effort }}
        run: |
          cat > /tmp/models.json <<'JSON'
          [
            "gpt-5.6-sol-xhigh",
            "claude-opus-5-5-xhigh",
            "kimi-k3-max"
          ]
          JSON
          if [ -n "$(printf '%s' "$PANEL_MODELS_OVERRIDE" | tr -d '[:space:]')" ]; then
            # Caller override. Must be a non-empty JSON array of catalog-shaped
            # ids; the shape check here and the live-catalog check below both
            # fail loud, so a bad override costs zero cells.
            # Bounded at BOTH ends. The matrix fans out to models x 2 review
            # types and GitHub caps a matrix at 256 jobs, so an oversized array
            # fails the whole run at startup (permanently red under
            # `blocking: true`) — and every extra id is another full
            # cursor-agent pass over the diff. 12 is far above any real panel
            # (the built-in list is 3) and far below the cap.
            # Slurped (-s) and held to exactly ONE document: jq reads a stream,
            # so `["a"] ["b"]` or `null ["a"]` would otherwise pass on its last
            # value and normalize to two lines, not the one array the matrix
            # needs.
            if ! printf '%s' "$PANEL_MODELS_OVERRIDE" | jq -e -s \
                 'length == 1 and (.[0] | type == "array" and length > 0 and length <= 12 and all(.[]; type == "string" and test("^[a-z0-9][a-z0-9._-]*$")))' > /dev/null; then
              # Echo the rejected value with newlines stripped and truncated.
              # This input is caller-settable, and a caller wiring it to a
              # variable makes it settable with no PR at all, so a raw
              # multi-line echo would let it smuggle ::workflow commands:: into
              # a PUBLIC repo's run log. Same reason the `Require a pinned
              # workflows_ref` step below strips before echoing.
              SAFE_OVERRIDE="$(printf '%s' "$PANEL_MODELS_OVERRIDE" | tr -d '\n\r' | cut -c1-200)"
              echo "::error::panel_models must be a JSON array of 1-12 Cursor model ids (e.g. [\"gpt-5.6-sol-xhigh\", \"claude-opus-5-5-xhigh\"]); got: $SAFE_OVERRIDE"
              exit 1
            fi
            printf '%s' "$PANEL_MODELS_OVERRIDE" | jq -c -s '.[0] | unique' > /tmp/models.json
            if [ -n "$(printf '%s' "$PANEL_MODELS_INPUT" | tr -d '[:space:]')" ]; then
              SRC="panel_models input"
            else
              SRC="CURSOR_PANEL_MODELS variable"
            fi
            echo "panel_models override in effect (from the $SRC): $(cat /tmp/models.json)"
          else
            # Logged in BOTH branches so the run says which list produced the
            # review. A caller driving panel_models from a variable makes the
            # empty case reachable by DELETING that variable, and without this
            # line a mid-experiment deletion is indistinguishable in the log
            # from one that was never set — the panel quietly reverts and the
            # rounds either side of it look the same.
            echo "panel_models not set (no input, no CURSOR_PANEL_MODELS variable) — using the built-in list: $(jq -c . /tmp/models.json)"
          fi
          # The direct-API cell reviews the OpenAI lane itself, so by default the
          # Cursor-hosted OpenAI cell comes OUT of the panel — otherwise that lane
          # is reviewed twice and billed twice. Applied after the override has
          # been resolved, so it filters whichever list actually won.
          #
          # Resolved to ONE verdict first, because replacing the Cursor cell is
          # only safe when the direct cell will genuinely run: a set input with
          # no key, or an id `upload-artifact` would reject (a fine-tuned
          # `ft:...` id carries `:`), would otherwise drop the OpenAI lane AND
          # leave nothing reviewing it. Either case warns and leaves the panel
          # exactly as it would be without the opt-in.
          openai_direct=false
          if [ -n "$(printf '%s' "${OPENAI_DIRECT_MODEL:-}" | tr -d '[:space:]')" ]; then
            # `grep -x` matches line by line, so a multi-line value would pass
            # on any one clean line; refuse every whitespace character (a
            # newline included, which a grep could not see) first.
            case "$OPENAI_DIRECT_MODEL" in *[[:space:]]*) openai_ws=true ;; *) openai_ws=false ;; esac
            if [ "$openai_ws" = "true" ] \
               || ! printf '%s' "$OPENAI_DIRECT_MODEL" | grep -Eqx '[A-Za-z0-9._-]{1,100}'; then
              echo "::warning::openai_direct_model is not a plain model id (letters, digits, '.', '_', '-'; at most 100), so the direct-API cell is off for this run and the panel is unchanged."
            elif [ "${OPENAI_KEY_PRESENT:-false}" != "true" ]; then
              echo "::warning::openai_direct_model is set but the OPENAI_API_KEY secret did not reach this workflow, so the direct-API cell is off for this run and the panel is unchanged. Pass the secret through from the caller to enable it."
            else
              openai_direct=true
            fi
          fi
          echo "openai_direct=${openai_direct}" >> "$GITHUB_OUTPUT"
          openai_direct_counts=false
          if [ "$openai_direct" = "true" ] \
             && [ "${OPENAI_DIRECT_REPLACES:-true}" = "true" ]; then
            openai_direct_counts=true
            # ascii_downcase so a differently-cased id cannot slip past the
            # vendor match and leave a duplicate OpenAI cell running.
            dropped="$(jq -c '[.[] | select((ascii_downcase | startswith("gpt-")))]' /tmp/models.json)"
            kept="$(jq -c '[.[] | select((ascii_downcase | startswith("gpt-")) | not)]' /tmp/models.json)"
            if [ "$(printf '%s' "$dropped" | jq 'length')" -gt 0 ]; then
              if [ "$(printf '%s' "$kept" | jq 'length')" -eq 0 ]; then
                echo "::error::openai_direct_model is set and openai_direct_replaces_cursor_openai is true, but every id in the panel list is an OpenAI id, so replacing them would leave no Cursor cell at all. Set openai_direct_replaces_cursor_openai: false, or widen panel_models."
                exit 1
              fi
              printf '%s' "$kept" > /tmp/models.json
              echo "direct-API cell is on, so the Cursor OpenAI cell(s) $dropped were dropped from the panel; remaining: $kept"
            else
              echo "direct-API cell is on, but the panel list carries no Cursor OpenAI id to replace; panel unchanged."
            fi
          fi
          echo "openai_direct_counts=${openai_direct_counts}" >> "$GITHUB_OUTPUT"
          # The direct Anthropic cells, by exactly the rules above: one verdict
          # first, then the replacement, applied to whatever the OpenAI branch
          # left, so the empty-panel check sees both drops. `judge_model` is
          # never touched — the judge stays on Cursor.
          anthropic_direct=false
          if [ -n "$(printf '%s' "${ANTHROPIC_DIRECT_MODEL:-}" | tr -d '[:space:]')" ]; then
            # `grep -x` matches line by line, so a multi-line value would pass
            # on any one clean line; refuse every whitespace character (a
            # newline included, which a grep could not see) first.
            case "$ANTHROPIC_DIRECT_MODEL" in *[[:space:]]*) anthropic_ws=true ;; *) anthropic_ws=false ;; esac
            if [ "$anthropic_ws" = "true" ] \
               || ! printf '%s' "$ANTHROPIC_DIRECT_MODEL" | grep -Eqx '[A-Za-z0-9._-]{1,100}'; then
              echo "::warning::anthropic_direct_model is not a plain model id (letters, digits, '.', '_', '-'; at most 100), so the direct-API Anthropic cells are off for this run and the panel is unchanged."
            elif [ "${ANTHROPIC_KEY_PRESENT:-false}" != "true" ]; then
              echo "::warning::anthropic_direct_model is set but the ANTHROPIC_API_KEY secret did not reach this workflow, so the direct-API Anthropic cells are off for this run and the panel is unchanged. Pass the secret through from the caller to enable it."
            elif [ "$openai_direct" = "true" ] \
                 && [ "$(printf '%s' "$ANTHROPIC_DIRECT_MODEL" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$OPENAI_DIRECT_MODEL" | tr 'A-Z' 'a-z')" ]; then
              # Both direct jobs name their artifact findings-direct-<type>-<id>,
              # so one id in both lanes collides (one upload fails) and the
              # aggregator, which assigns by model id, credits every record to
              # the OpenAI lab.
              echo "::warning::anthropic_direct_model is the same id as openai_direct_model, so the direct-API Anthropic cells are off for this run and the panel is unchanged. Give each lane its own lab's model id."
            else
              anthropic_direct=true
            fi
          fi
          echo "anthropic_direct=${anthropic_direct}" >> "$GITHUB_OUTPUT"
          case "${ANTHROPIC_DIRECT_EFFORT:-}" in
            low|medium|high|xhigh|max) anthropic_direct_effort="$ANTHROPIC_DIRECT_EFFORT" ;;
            *)
              anthropic_direct_effort=xhigh
              if [ "$anthropic_direct" = "true" ]; then
                echo "::warning::anthropic_direct_effort is not one of low, medium, high, xhigh, max, so the direct-API Anthropic cells use xhigh."
              fi ;;
          esac
          echo "anthropic_direct_effort=${anthropic_direct_effort}" >> "$GITHUB_OUTPUT"
          anthropic_direct_counts=false
          if [ "$anthropic_direct" = "true" ] \
             && [ "${ANTHROPIC_DIRECT_REPLACES:-true}" = "true" ]; then
            anthropic_direct_counts=true
            dropped="$(jq -c '[.[] | select((ascii_downcase | startswith("claude-")))]' /tmp/models.json)"
            kept="$(jq -c '[.[] | select((ascii_downcase | startswith("claude-")) | not)]' /tmp/models.json)"
            if [ "$(printf '%s' "$dropped" | jq 'length')" -gt 0 ]; then
              if [ "$(printf '%s' "$kept" | jq 'length')" -eq 0 ]; then
                echo "::error::anthropic_direct_model is set and anthropic_direct_replaces_cursor_anthropic is true, but every id left in the panel list is an Anthropic id, so replacing them would leave no Cursor cell at all. Set anthropic_direct_replaces_cursor_anthropic: false, or widen panel_models."
                exit 1
              fi
              printf '%s' "$kept" > /tmp/models.json
              echo "direct-API Anthropic cells are on, so the Cursor Anthropic cell(s) $dropped were dropped from the panel; remaining: $kept"
            else
              echo "direct-API Anthropic cells are on, but the panel list carries no Cursor Anthropic id to replace; panel unchanged."
            fi
          fi
          echo "anthropic_direct_counts=${anthropic_direct_counts}" >> "$GITHUB_OUTPUT"
          # The direct judge, by the cells' rules: a plain id (no whitespace at
          # all) and the key present, or it warns and the Cursor judge runs.
          # No collision check — the judge uploads no per-model artifact.
          judge_direct=false
          if [ -n "$(printf '%s' "${JUDGE_DIRECT_MODEL:-}" | tr -d '[:space:]')" ]; then
            case "$JUDGE_DIRECT_MODEL" in *[[:space:]]*) judge_ws=true ;; *) judge_ws=false ;; esac
            if [ "$judge_ws" = "true" ] \
               || ! printf '%s' "$JUDGE_DIRECT_MODEL" | grep -Eqx '[A-Za-z0-9._-]{1,100}'; then
              echo "::warning::judge_direct_model is not a plain model id (letters, digits, '.', '_', '-'; at most 100), so the judge runs on Cursor (judge_model) for this run."
            elif [ "${ANTHROPIC_KEY_PRESENT:-false}" != "true" ]; then
              echo "::warning::judge_direct_model is set but the ANTHROPIC_API_KEY secret did not reach this workflow, so the judge runs on Cursor (judge_model) for this run. Pass the secret through from the caller to enable it."
            else
              judge_direct=true
              echo "The judge runs direct through the Anthropic API ($JUDGE_DIRECT_MODEL)."
            fi
          fi
          echo "judge_direct=${judge_direct}" >> "$GITHUB_OUTPUT"
          case "${JUDGE_DIRECT_EFFORT:-}" in
            low|medium|high|xhigh|max) judge_direct_effort="$JUDGE_DIRECT_EFFORT" ;;
            *)
              judge_direct_effort=xhigh
              if [ "$judge_direct" = "true" ]; then
                echo "::warning::judge_direct_effort is not one of low, medium, high, xhigh, max, so the direct judge uses xhigh."
              fi ;;
          esac
          echo "judge_direct_effort=${judge_direct_effort}" >> "$GITHUB_OUTPUT"
          echo "models=$(jq -c . /tmp/models.json)" >> "$GITHUB_OUTPUT"

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context
            # accessor added in Actions runner v2.334.0, so only an older runner
            # gets here. GitHub stops queueing jobs to a self-hosted runner more
            # than 30 days behind the latest release, so on any pool — hosted
            # `ubuntu-latest`, or the caller's `runs_on` pool the read-only
            # model jobs may use — that is a transient window. Warn and continue: a
            # property nothing could EVALUATE is not evidence of a violation, and
            # failing would take the whole review down on a caller that changed
            # nothing. (public-repo-hygiene.yml fails closed in this branch on
            # purpose — it is the checker whose own integrity rests on the
            # equality. Here the ledger's warn-and-degrade posture is the fit.)
            echo "::warning::job.workflow_sha is empty (Actions runner older than v2.334.0?), so workflows_ref could not be cross-checked against the uses: pin. The empty and 40-hex tests above still apply."
          elif [ "$REF_LC" != "$SHA" ]; then
            echo "::error::workflows_ref ($REF) is not the commit this workflow was called at ($SHA). The uses: pin and workflows_ref MUST name the same commit — otherwise the workflow is pinned but its prompts and scripts are loaded from a different version. Set both to $SHA. (The bump-callers fleet rewrites both together; Dependabot rewrites only uses:, so a caller that lets Dependabot bump this reusable needs a dependabot.yml ignore entry for Comfy-Org/github-workflows.)"
            exit 1
          fi

      - name: Load cursor-review assets
        # Same trusted-assets checkout the review/consolidate jobs do — this
        # job needs it for install-cursor-cli.sh.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ inputs.workflows_ref }}
          path: _cursor_review_assets
          persist-credentials: false

      - name: Install Cursor agent CLI
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          # Fork PRs (and any run without the secret) get no CURSOR_API_KEY, so
          # `cursor-agent models` can't authenticate. Skip cleanly — matches the
          # gate's fork handling, which already sets should_run=false for forks.
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "No CURSOR_API_KEY (fork PR or unset secret) — skipping catalog preflight."
            exit 0
          fi
          bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Validate model pins against live catalog
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "No CURSOR_API_KEY — skipping catalog preflight (matches fork handling)."
            exit 0
          fi

          # Capture the live catalog. A failure here (auth/network) is itself a
          # hard fail — better red than a silently degraded panel.
          if ! cursor-agent models > /tmp/catalog.txt 2>/tmp/catalog-stderr.txt; then
            echo "::error::'cursor-agent models' failed — cannot verify the panel model pins."
            cat /tmp/catalog-stderr.txt
            exit 1
          fi
          echo "=== Cursor catalog ==="
          cat /tmp/catalog.txt

          python3 - <<'PY'
          import json
          import re
          import sys

          with open("/tmp/models.json", encoding="utf-8") as f:
              pins = json.load(f)
          with open("/tmp/catalog.txt", encoding="utf-8") as f:
              catalog_raw = f.read()

          catalog_lines = [ln.strip() for ln in catalog_raw.splitlines() if ln.strip()]

          def present(model_id):
              # Match the id as a whole token so `kimi-k2.5` doesn't match inside
              # `kimi-k2.55`; ids contain `.`/`-`, so bound on those too.
              pattern = r"(?<![\w.-])" + re.escape(model_id) + r"(?![\w.-])"
              return re.search(pattern, catalog_raw) is not None

          missing = [m for m in pins if not present(m)]
          if not missing:
              print("All pinned models present in the Cursor catalog:")
              for m in pins:
                  print(f"  - {m}")
              sys.exit(0)

          print(f"::error::Cursor catalog is missing pinned model id(s): {', '.join(missing)}")
          for m in missing:
              lab = re.split(r"[-.]", m, maxsplit=1)[0]
              hints = sorted({ln for ln in catalog_lines if lab.lower() in ln.lower()})
              hint = ", ".join(hints) if hints else "(no same-lab id found)"
              print(f"  - {m}: closest available for lab '{lab}': {hint}")
          print(
              "Update the pin in the preflight 'Define panel models' step (and the "
              "README model table) to a current catalog id."
          )
          sys.exit(1)
          PY

  review:
    # Each cell produces a findings artifact. No cell posts a review —
    # consolidate adjudicates the panel and posts ONE review at the end.
    name: '${{ matrix.review_type }} (${{ matrix.model }})'
    # `preflight` gates the fan-out: if a pinned model is delisted it fails
    # there, and this job is skipped instead of quietly running a lab short.
    needs: [gate, diff-size, preflight, ledger]
    if: needs.gate.outputs.should_run == 'true' && needs.gate.outputs.already_reviewed != 'true' && needs.diff-size.outputs.within_cap == 'true'
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    # DERIVED from `cell_timeout_minutes`, and deliberately not settable alone.
    # This coupling used to be a comment telling the next editor to bump three
    # other numbers by hand: the judge reads all of this panel's artifacts at
    # the same reasoning tier, so it needs at least a cell's budget, and its job
    # cap must sit above its step cap so a hung judge trips the step (degraded
    # fallback still posts) rather than the job (all panel cells discarded). A
    # cell cap that outgrew them recreated exactly the silent skew that fix was
    # for — so the arithmetic lives in `preflight` now (expressions cannot do
    # it), where it cannot be half-applied. The +15 is this job's non-agent overhead: checkout, CLI
    # install, artifact download and upload, none of which the step cap covers.
    timeout-minutes: ${{ fromJSON(needs.preflight.outputs.cell_job_timeout) }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Model list comes from the preflight job (single source of truth); it
        # is validated against the live catalog there.
        model: ${{ fromJSON(needs.preflight.outputs.models) }}
        review_type: [adversarial, edge-case]
    steps:
      - name: Seed default findings artifact
        # Pre-seed a minimal artifact tagged status=error so this cell
        # ALWAYS shows up in the panel summary, even if a later step
        # (checkout, Cursor install, prompt build, tool submission) fails. The
        # MCP output tool overwrites this on success. Without
        # this, an early-failing cell silently disappears from the panel
        # and the consolidated review undercounts the matrix.
        env:
          MODEL: ${{ matrix.model }}
          REVIEW_TYPE: ${{ matrix.review_type }}
        run: |
          mkdir -p /tmp/findings-out
          python3 - <<'PY'
          import json, os
          record = {
              "model": os.environ["MODEL"],
              "review_type": os.environ["REVIEW_TYPE"],
              "status": "error",
              "error": "Cell did not complete structured output submission.",
              "findings": [],
          }
          with open("/tmp/findings-out/findings.json", "w", encoding="utf-8") as f:
              json.dump(record, f)
          PY

      - name: Checkout PR repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a pinned workflows_ref
        # workflows_ref has no default on purpose. GitHub does NOT enforce
        # `required: true` for workflow_call inputs, so an omitted input arrives
        # as '' and actions/checkout would silently fall back to this repo's
        # default branch — running MUTABLE scripts under a pin that claims
        # otherwise. Fail fast instead. (BE-5546)
        env:
          WORKFLOWS_REF: ${{ inputs.workflows_ref }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          # actions/checkout reads `ref` through core.getInput, which TRIMS, so a
          # whitespace-only value is an empty ref to IT while sailing past a bare
          # -z test here. Compare the stripped form, and echo only that: dropping
          # newlines also stops a multi-line value from smuggling a ::workflow
          # command:: into the log, and from satisfying the line-oriented grep
          # below on one 40-hex line among many.
          REF="$(printf '%s' "$WORKFLOWS_REF" | tr -d '[:space:]')"
          if [ -z "$REF" ]; then
            echo "::error::workflows_ref is required; pin it to the same commit SHA as the uses: line (see header example)"
            exit 1
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::warning::workflows_ref '$REF' is not a full 40-hex commit SHA — branch and tag refs are mutable and can skew between jobs mid-run"
          fi
          # Equality with the commit the caller's `uses:` line resolved to — the
          # same guard public-repo-hygiene.yml runs, and the check that turns
          # "workflows_ref must be the same SHA as uses:" from a header comment
          # into a fact. `job.workflow_sha` is computed by the RUNNER from the
          # `uses:` pin, so a caller cannot set it. Without this, a caller can
          # pin `uses:` to one commit and load this workflow's prompts, scripts
          # and model list from another. (`job.workflow_sha`, NOT
          # `github.job_workflow_sha` — that one is an OIDC token claim, absent
          # from the `github` context, and expands to ''.) Both sides are
          # lower-cased: hex is case-insensitive, and unlike hygiene's the
          # 40-hex test above only WARNS, so an upper-case ref naming the RIGHT
          # commit reaches here and must not fail. $REF itself is left alone so
          # the messages quote what the caller wrote. (BE-15927)
          REF_LC="$(printf '%s' "$REF" | tr 'A-Z' 'a-z')"
          SHA="$(printf '%s' "$WORKFLOW_SHA" | tr -d '[:space:]' | tr 'A-Z' 'a-z')"
          if [ -z "$SHA" ]; then
            # Cannot check, NOT a mismatch. `job.workflow_sha` is the `job`-context

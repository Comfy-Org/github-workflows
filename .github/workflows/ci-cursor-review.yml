name: CI - Cursor Review

# Thin caller enrolling THIS repo in its own reusable cursor-review workflow.
# The review logic (panel matrix, judge consolidation, prompts, scripts) lives
# in cursor-review.yml in this same repo, but the caller still pins it by full
# commit SHA like every external consumer: a local `uses: ./...` path would run
# the PR's OWN copy of the reviewer, letting a PR weaken the panel judging it.
# Pinning to a merged main SHA keeps the reviewer tamper-proof; the bump-callers
# workflow keeps the pin fresh (this repo is enrolled in CURSOR_REVIEW_CALLERS).
#
# Label-triggered for now (apply `cursor-review` to a PR to fire the panel;
# `skip-cursor-review` vetoes) — the reusable's gate at this pin only honors
# label events. Once the pin advances past the commit adding the reusable's
# `run_without_label` input, the auto-bump PR for this file should also add
# `run_without_label: true` under `with:` and widen the trigger types to
# [opened, reopened, ready_for_review, labeled, unlabeled] — this repo has no
# labeling automation, and every non-draft PR here is worth a review (its
# files become other repos' required checks).

on:
  pull_request:
    types: [labeled, unlabeled]

# Cancel any earlier in-flight review run for the same PR when cursor-review is
# removed or re-applied. Scoping by label name ensures that removing an
# unrelated label does not kill a running cursor review.
concurrency:
  group: cursor-review-pr-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  cursor-review:
    permissions:
      contents: read
      pull-requests: write
    uses: Comfy-Org/github-workflows/.github/workflows/cursor-review.yml@0eac47eef787b9cf9c9ee7c0e8249d470e70e8af # github-workflows main (0eac47e)
    with:
      # Keep the assets ref in lock-step with the `uses:` ref above.
      workflows_ref: 0eac47eef787b9cf9c9ee7c0e8249d470e70e8af
      # Panel model override, as a VARIABLE so a reasoning-tier A/B needs no PR
      # and no fleet bump — set it, watch a few rounds, unset it to revert. The
      # reusable's `panel_models` treats empty as "use the built-in list", so an
      # unset variable is exactly today's behaviour; a repo variable overrides an
      # org one of the same name, so this can be set org-wide later without
      # touching this file.
      #
      # The value is a JSON array of CURSOR CATALOG ids — tier suffix and all
      # (`claude-opus-5-thinking-xhigh`, not `claude-opus-5`). It is deliberately
      # NOT the org's `CLAUDE_MODEL_*` variables: those hold Anthropic API slugs,
      # which the preflight's live-catalog check would reject. Keep the two
      # namespaces apart.
      #
      # Preflight validates every id against the live catalog and fails loud
      # before any cell spends, so a typo costs nothing. The documented first
      # experiment is the panel's `-max` → `-xhigh` tier drop (the judge already
      # made that move in #243 on spend grounds):
      #   gh variable set CURSOR_PANEL_MODELS \
      #     --repo Comfy-Org/github-workflows \
      #     --body '["gpt-5.6-sol-max","claude-opus-5-thinking-xhigh","kimi-k3-high"]'
      #
      # `judge_model` is deliberately NOT wired the same way. Its input carries a
      # real default that catalog-drift.py parses out of cursor-review.yml, and a
      # caller passing an explicitly-empty value gets '' rather than that default
      # — so the override would have to restate the default here and drift from
      # it. Changing that belongs in the reusable, not in a caller.
      panel_models: ${{ vars.CURSOR_PANEL_MODELS }}
      # No vendored/generated content in this repo; defensive excludes only.
      # These live in extra_generated_globs, not diff_excludes: since BE-7633
      # diff_excludes leaves the reviewed diff but is still COUNTED against
      # diff_size_cap, so it is the back-compat escape hatch, not the knob to
      # model. Supplying this input REPLACES the default list, so the six
      # defaults are restated verbatim before this repo's own `*-lock.json`
      # (only `package-lock.json` is a classifier built-in). Plain globs, not
      # git pathspecs — no `:!` prefix.
      extra_generated_globs: >-
        **/node_modules/**
        **/dist/**
        **/vendor/**
        **/*.generated.*
        **/*.min.js
        **/*.min.css
        **/*-lock.json
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

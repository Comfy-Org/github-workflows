name: Bump pr-size callers

# When the pr-size reusable workflow is updated on main, open a SHA-bump PR in
# every repo that pins a caller against it. PRs are opened by Cloud Code Bot so
# they are easy to filter and merge.
#
# This is a thin entrypoint over the shared bumper at
# .github/bump-callers/bump-callers.sh — the same script drives the
# cursor-review and agents-md-integrity caller fleets (bump-cursor-review-
# callers.yml, bump-agents-md-callers.yml). Keeping ONE implementation is
# deliberate: a forked copy is how other shared machinery in the org has
# drifted. The entrypoints differ only in their path-filter trigger and the
# three parameters passed below. (They stay separate rather than a single
# matrix because their triggers differ — a pr-size.yml change must not
# spuriously bump the other fleets' callers, and vice versa.)
#
# The caller list is NOT hardcoded here. This repo is PUBLIC (workflow file and
# Actions run logs are both publicly viewable), and most callers are private, so
# their names must never appear in this file or its logs. The list lives in the
# repo-level Actions SECRET `PR_SIZE_CALLERS` as a JSON array of
# {"repo","file","label"} objects, same shape as the other fleets' rosters. An
# empty list (`[]`, or an unset secret) is a clean no-op here (ALLOW_EMPTY
# below); the rollout's per-repo caller tickets add entries as callers land.
#
# A SECRET, not a variable (BE-6472): the roster reaches the script through the
# step's `env:` below, and Actions prints that env block BEFORE the step runs —
# so a variable's raw value was published in this public repo's run log ahead of
# any masking the script could do (the KNOWN GAP this header used to carry). A
# secret is runner-masked everywhere, that dump included. The cost is read-back:
# there is no `gh secret get`, so the canonical callers.json in the private ops
# repo is the sole source of truth, and the run instead logs a count + sha256
# fingerprint of the roster it used (reproduce with `jq -cS . callers.json |
# sha256sum`) so an edit can be audited against it.
# `bump-callers.sh` still `::add-mask::`es every repo name before IT echoes
# anything — Actions masks the roster as ONE exact string, not each name inside
# it, so a name echoed on its own would otherwise print in the clear.
#
# Update flow — adding/removing a caller needs NO public commit:
#   jq -c . callers.json | gh secret set PR_SIZE_CALLERS --repo Comfy-Org/github-workflows
# Keep the canonical callers.json in a PRIVATE infra/ops repo so roster edits
# have a reviewed source of truth; the org audit log records each edit. (The
# specific home repo is intentionally not named here — this file is public.)

on:
  workflow_dispatch: {}   # allow on-demand runs (e.g. to re-bump callers)
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-size.yml
      # The counting logic consumers actually run lives here, built from the
      # `workflows_ref` SHA a caller pins (see pr-size.yml's header) — a
      # behavior change here needs the same caller bump as a workflow-file
      # change, or pinned callers silently drift onto stale tool behavior.
      - scripts/check-pr-size/**

permissions:
  contents: read

# Serialize runs of this fleet. The bumper now pushes to a STABLE branch
# (ci/bump-pr-size) shared across runs, so two overlapping runs (a rapid second
# main push, or a push racing a manual re-run) would force-reset that branch
# and race the PR update — an older run finishing last could leave the
# committed diff pinned to a stale SHA. cancel-in-progress: false lets the
# running bump finish; GitHub keeps only the newest pending run, so the latest
# SHA always wins (BE-3882).
concurrency:
  group: bump-pr-size-callers
  cancel-in-progress: false

jobs:
  bump:
    # Guard against a workflow_dispatch run from a non-main ref: github.sha is
    # the tip of whatever ref was selected, and the bumper force-resets a stable
    # shared branch — a manual run from an older ref would pin every caller to a
    # stale SHA (and run this job's script, with the App token minted below,
    # from an unreviewed commit). The push trigger is already main-only, so this
    # only ever skips stray manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Cloud Code Bot token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0 — pinned: see dependabot.yml ignore (v2+ breaks cross-repo `owner:` token scoping)
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
          owner: Comfy-Org

      - name: Bump SHA in caller repos
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEW_SHA: ${{ github.sha }}
          # Names the roster to fix in an error message. It is a SECRET now, not a
          # variable; the env key keeps its historical name so every fleet's
          # entrypoint and the shared script stay in step.
          VAR_NAME: PR_SIZE_CALLERS
          TAG: pr-size
          WORKFLOW_FILE: pr-size.yml
          # An empty roster — `[]`, or a secret nobody has set — is a clean no-op
          # here, not an error.
          ALLOW_EMPTY: "true"
          # JSON array of {"repo","file","label"} — see the header comment for the
          # update flow. Kept in a repo-level SECRET (not this file, and not a
          # variable) so private caller names never land in this public repo — nor,
          # since a secret is masked in the step's env dump too, in its run logs.
          CALLERS_JSON: ${{ secrets.PR_SIZE_CALLERS }}
        run: |
          # The main-only ref guard above cannot catch a manual RE-RUN of an
          # older main run: github.ref is refs/heads/main but github.sha is
          # that run's original (now stale) commit, and the bumper would
          # force-repin every caller to it. Only act from the current tip —
          # any newer push has its own queued run that does the bump.
          # Don't pipe into `cut`: the pipeline would report cut's status, so a
          # failed ls-remote (network blip, remote hiccup) yields an EMPTY
          # main_tip that then compares unequal to github.sha and silently
          # no-ops the whole fleet bump as if the run were stale. A lookup we
          # couldn't perform is not evidence of staleness — fail loudly.
          if ! ls_remote=$(git ls-remote origin refs/heads/main); then
            echo "::error::Could not look up the current main tip (git ls-remote failed)"
            exit 1
          fi
          main_tip=${ls_remote%%$'\t'*}
          if [[ -z "$main_tip" ]]; then
            echo "::error::git ls-remote returned no SHA for refs/heads/main"
            exit 1
          fi
          if [[ "$main_tip" != "$GITHUB_SHA" ]]; then
            echo "github.sha $GITHUB_SHA is not the current main tip ($main_tip) — stale run/re-run; nothing to bump"
            exit 0
          fi
          # The push path filter also matches a commit that DELETES the
          # reusable workflow — or the run-time tool sources callers build from
          # the pinned SHA (scripts/check-pr-size/**); bumping callers to a SHA
          # where either is gone would break every caller. Deletion means
          # decommissioning — no-op.
          if [[ ! -f .github/workflows/pr-size.yml || ! -d scripts/check-pr-size ]]; then
            echo "pr-size.yml or scripts/check-pr-size/ absent at this SHA — decommissioned; nothing to bump"
            exit 0
          fi
          bash .github/bump-callers/bump-callers.sh

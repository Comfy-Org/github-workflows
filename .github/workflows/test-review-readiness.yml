name: Test review readiness

on:
  pull_request:
    paths:
      - 'scripts/review-readiness/**'
      - '.github/workflows/test-review-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/review-readiness/**'
      - '.github/workflows/test-review-readiness.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/review-readiness/tests -v

name: Bump pr-risk callers

# When the pr-risk reusable workflow is updated on main, open a SHA-bump PR in
# every repo that pins a caller against it. PRs are opened by Cloud Code Bot so
# they are easy to filter and merge.
#
# This is a thin entrypoint over the shared bumper at
# .github/bump-callers/bump-callers.sh — the same script drives the
# cursor-review and agents-md-integrity caller fleets (bump-cursor-review-
# callers.yml, bump-agents-md-callers.yml). Keeping ONE implementation is
# deliberate: a forked copy is how other shared machinery in the org has
# drifted. The entrypoints differ only in their path-filter trigger and the
# three parameters passed below. (They stay separate rather than a single
# matrix because their triggers differ — a pr-risk.yml change must not
# spuriously bump the other fleets' callers, and vice versa.)
#
# A pr-risk caller pins TWICE — the `uses:` line AND the `workflows_ref:` input
# that the reusable checks itself out at (same double-pin shape as a groom
# caller). The shared rewrite moves both, so never hand-bump one alone.
#
# The caller list is NOT hardcoded here. This repo is PUBLIC (workflow file and
# Actions run logs are both publicly viewable), and most callers are private, so
# their names must never appear in this file or its logs. The list lives in the
# repo-level Actions variable `PR_RISK_CALLERS` (config, not a credential — a
# variable, not a secret, since secrets are write-only via the API) as a JSON
# array of {"repo","file","label"} objects, same shape as the other fleets'
# variables. `bump-callers.sh` `::add-mask::`es every repo name before IT echoes
# anything.
# KNOWN GAP (shared by every entrypoint in this family, tracked separately):
# passing the roster through this step's `env:` means Actions prints the raw
# value in the step's env dump before the script — and its masking — ever runs.
# Closing it means reading the variable at run time (`gh variable get`) and
# masking it first, which needs a token permission this fleet does not mint
# today; it is a fleet-wide change, not one this entrypoint can make alone.
# Until then, treat the roster as visible in the public run log.
# The variable is seeded EMPTY (`[]`) — an empty list is a clean no-op here
# (ALLOW_EMPTY below); the rollout's per-repo caller tickets add entries as
# callers land.
#
# Update flow — adding/removing a caller needs NO public commit:
#   gh variable set PR_RISK_CALLERS --repo Comfy-Org/github-workflows \
#     --body "$(jq -c . callers.json)"
# Keep the canonical callers.json in a PRIVATE infra/ops repo so variable edits
# have a reviewed source of truth; the org audit log records each edit. (The
# specific home repo is intentionally not named here — this file is public.)
#
# Recovery note: GitHub evaluates a `paths:` filter against only the first 300
# changed files of a push, so a `scripts/pr-risk/**` change buried in a larger
# main push can create NO run at all — callers then stay pinned to stale
# grading logic with no red signal anywhere. `workflow_dispatch` above is the
# recovery: run it once from main and the fleet catches up.

on:
  workflow_dispatch: {}   # allow on-demand runs (e.g. to re-bump callers)
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-risk.yml
      # The grading logic consumers actually run lives here, checked out from
      # the `workflows_ref` SHA a caller pins (see pr-risk.yml's header) — a
      # behavior change here needs the same caller bump as a workflow-file
      # change, or pinned callers silently drift onto stale tool behavior.
      - scripts/pr-risk/**
      # …but the tests and the tool README under that dir are NOT part of what a
      # pinned caller executes, so a test-only or docs-only commit would fan a
      # pure-churn SHA-bump PR (identical consumer behavior, a review round in
      # every caller repo) across the whole fleet. Exclude them so a bump PR
      # keeps meaning "consumer-visible behavior changed". Negations only strip
      # the paths they match: a commit touching a tool script AND its test still
      # matches the positive pattern and still bumps.
      - '!scripts/pr-risk/tests/**'
      - '!scripts/pr-risk/README.md'

permissions:
  contents: read

# Serialize runs of this fleet. The bumper now pushes to a STABLE branch
# (ci/bump-pr-risk) shared across runs, so two overlapping runs (a rapid second
# main push, or a push racing a manual re-run) would force-reset that branch
# and race the PR update — an older run finishing last could leave the
# committed diff pinned to a stale SHA. cancel-in-progress: false lets the
# running bump finish; GitHub keeps only the newest pending run, so the latest
# SHA always wins (BE-3882).
concurrency:
  group: bump-pr-risk-callers
  cancel-in-progress: false

jobs:
  bump:
    # Guard against a workflow_dispatch run from a non-main ref: github.sha is
    # the tip of whatever ref was selected, and the bumper force-resets a stable
    # shared branch — a manual run from an older ref would pin every caller to a
    # stale SHA (and run this job's script, with the App token minted below,
    # from an unreviewed commit). The push trigger is already main-only, so this
    # only ever skips stray manual runs.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The job is a bounded loop of `git`/`gh` network calls; nothing here should
    # take minutes. Without this a hung call would hold a runner for the default
    # 6 hours (and, via the serializing concurrency group above, block every
    # later bump behind it).
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Cloud Code Bot token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0 — pinned: see dependabot.yml ignore (v2+ breaks cross-repo `owner:` token scoping)
        id: token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.CLOUD_CODE_BOT_PRIVATE_KEY }}
          # `owner:` with no `repositories:` is deliberate and cannot be narrowed:
          # the caller list is a runtime variable (see the header), so the repos
          # this token must reach are not knowable at authoring time — and naming
          # them here would leak private caller names into a public file.
          #
          # The PERMISSIONS can be narrowed without naming anything, so they are:
          # unset, the minted token carries every permission the app holds on every
          # repo it is installed on, far past what this bumper needs. It commits
          # the rewritten caller file via the Git Data API (contents) and opens or
          # updates the bump PR (pull-requests); `gh pr create --label` stamps the
          # caller's label through the issues API (issues) — same trio, and the
          # same reasoning, as the groom and auto-label fleets' entrypoints.
          owner: Comfy-Org
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Bump SHA in caller repos
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          NEW_SHA: ${{ github.sha }}
          VAR_NAME: PR_RISK_CALLERS
          TAG: pr-risk
          WORKFLOW_FILE: pr-risk.yml
          # Seeded empty; an empty list is a clean no-op, not an error.
          ALLOW_EMPTY: "true"
          # JSON array of {"repo","file","label"} — see the header comment for the
          # update flow. Kept in a variable (not the file) so private caller names
          # never land in this public repo. NOTE: this env binding is itself the
          # known log-exposure gap documented in the header — Actions dumps the
          # step env before the script's `::add-mask::` runs.
          CALLERS_JSON: ${{ vars.PR_RISK_CALLERS }}
        run: |
          # The main-only ref guard above cannot catch a manual RE-RUN of an
          # older main run: github.ref is refs/heads/main but github.sha is
          # that run's original (now stale) commit, and the bumper would
          # force-repin every caller to it. So establish the current main tip
          # first; the guard below decides whether this run is genuinely stale.
          # Don't pipe into `cut`: the pipeline would report cut's status, so a
          # failed ls-remote (network blip, remote hiccup) yields an EMPTY
          # main_tip that then compares unequal to github.sha and silently
          # no-ops the whole fleet bump as if the run were stale. A lookup we
          # couldn't perform is not evidence of staleness — fail loudly.
          if ! ls_remote=$(git ls-remote origin refs/heads/main); then
            echo "::error::Could not look up the current main tip (git ls-remote failed)"
            exit 1
          fi
          main_tip=${ls_remote%%$'\t'*}
          if [[ -z "$main_tip" ]]; then
            echo "::error::git ls-remote returned no SHA for refs/heads/main"
            exit 1
          fi
          # The paths this fleet's push trigger watches — the reusable workflow
          # plus the run-time tool sources a pinned caller executes. This MUST
          # mirror the `paths:` filter above, exclusions included: the check
          # below reads "did a later commit start a run of its own?", and a path
          # the filter ignores starts none. Compare a path the filter excludes
          # (tests/, the tool README) and a test-only commit landing behind us
          # looks like a newer run that will do the bump — when in fact nobody
          # will, and every caller silently freezes.
          WATCHED=(
            .github/workflows/pr-risk.yml
            scripts/pr-risk
            ':(exclude)scripts/pr-risk/tests'
            ':(exclude)scripts/pr-risk/README.md'
          )
          if [[ "$main_tip" != "$GITHUB_SHA" ]]; then
            # main has moved on. That alone does NOT make this run stale: the
            # push trigger is path-filtered to WATCHED, so an unrelated commit
            # landing in the seconds between this run's trigger and this check
            # starts NO run of its own. Skipping on a bare SHA mismatch would
            # discard the only run for this change and leave every caller
            # frozen — the exact pin-drift this fleet exists to prevent.
            # What actually distinguishes a stale re-run is that a WATCHED path
            # has CHANGED since: then a later commit did touch the filter and
            # does have its own run, which will pin the newer content.
            # Needs real history, not just the two tips: the question below is
            # "did a COMMIT touch a watched path", which a shallow --depth=1
            # fetch cannot answer (its grafted tip has no parents, so every
            # path reads as newly added). actions/checkout clones shallow, so
            # deepen — cheap on a repo this size, and --unshallow errors out on
            # an already-complete clone, hence the probe.
            unshallow=()
            [[ -f "$(git rev-parse --git-dir)/shallow" ]] && unshallow=(--unshallow)
            if ! git fetch "${unshallow[@]}" origin main; then
              echo "::error::Could not fetch the current main tip to compare the watched paths"
              exit 1
            fi
            if ! main_tip=$(git rev-parse --verify "FETCH_HEAD^{commit}"); then
              echo "::error::Fetched main but could not resolve FETCH_HEAD to a commit"
              exit 1
            fi
            # Decommissioning check, on the files the reusable actually EXECUTES
            # (see pr-risk.yml) rather than on `scripts/pr-risk/` existing: this
            # change establishes that tests/ and the tool README are not part of
            # what a caller runs, so a commit deleting the graders while leaving
            # those two behind would satisfy a bare directory probe and bump
            # every caller onto a SHA where the tools are gone.
            # FETCH_HEAD resolved above, so a path that fails to resolve here is
            # genuinely absent rather than an unreadable object.
            for gone in .github/workflows/pr-risk.yml \
                        scripts/pr-risk/grade-pr-risk.sh \
                        scripts/pr-risk/grade-targets.sh \
                        scripts/pr-risk/resolve-enabled.sh; do
              if ! git rev-parse --verify --quiet "FETCH_HEAD:$gone" >/dev/null; then
                echo "$gone no longer exists on main ($main_tip) — decommissioned; nothing to bump"
                exit 0
              fi
            done
            # Refuse to pin callers to a commit main can no longer reach (a
            # re-run from a commit a force-push or reset orphaned): it may be
            # garbage-collected, and every caller's `uses:` and `workflows_ref:`
            # would stop resolving.
            if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
              echo "::error::github.sha $GITHUB_SHA is not reachable from main ($main_tip) — refusing to pin callers to an orphaned commit"
              exit 1
            fi
            # Ask "did a later COMMIT touch a watched path", not "does the net
            # content differ". A merge-then-revert of a bad grader change nets
            # to zero, so a content diff would call this run the only one for
            # the change and repin every caller BACKWARDS to $GITHUB_SHA —
            # while both the bad commit and its revert did have runs of their
            # own. rev-list answers the question the guard actually means.
            if ! touched=$(git rev-list --count HEAD..FETCH_HEAD -- "${WATCHED[@]}"); then
              echo "::error::Could not list commits touching the watched paths between $GITHUB_SHA and main ($main_tip)"
              exit 1
            fi
            if (( touched > 0 )); then
              echo "github.sha $GITHUB_SHA is behind main ($main_tip) and $touched later commit(s) touched a watched path — stale run/re-run; those commits have runs of their own. Nothing to bump"
              exit 0
            fi
            echo "main moved to $main_tip since $GITHUB_SHA, but no later commit touched a watched path — this run is still the only one for that change; proceeding"
          fi
          # The push path filter also matches a commit that DELETES the
          # reusable workflow — or the run-time tool sources callers build from
          # the pinned SHA; bumping callers to a SHA where any of them is gone
          # would break every caller. Deletion means decommissioning — no-op.
          # Tested per-file (not `-d scripts/pr-risk`) for the same reason as
          # the FETCH_HEAD probe above: tests/ and the tool README are not part
          # of what a caller executes, so the directory can outlive the graders.
          for required in .github/workflows/pr-risk.yml \
                          scripts/pr-risk/grade-pr-risk.sh \
                          scripts/pr-risk/grade-targets.sh \
                          scripts/pr-risk/resolve-enabled.sh; do
            if [[ ! -f "$required" ]]; then
              echo "$required absent at this SHA — decommissioned; nothing to bump"
              exit 0
            fi
          done
          bash .github/bump-callers/bump-callers.sh

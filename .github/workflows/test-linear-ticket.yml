# CONTRACT: this is one of THIS repo's own path-filtered script tests, NOT a reusable
# workflow. It is not callable and has no caller pattern:
#   TRIGGERS — `pull_request` and `push` to main, both filtered to scripts/linear-ticket/**
#              and this file. A change elsewhere in the repo does not run it.
#   INPUTS   — none. SECRETS — none. Read-only `contents: read`; the suite is hermetic and
#              makes no network call.
# The reusable workflow these scripts back is .github/workflows/linear-ticket.yml.

name: Test linear-ticket scripts

# Runs shellcheck + the hermetic lib suite for the linear-ticket gate. The gate decides
# whether every consuming repo's PRs can merge, so a regression in the policy filter,
# candidate extraction, or error classification silently passes or blocks PRs — cheap to
# guard with a unit run on change. The real-Linear behaviours (URL canonicalization,
# attachment timing) are proven in the pilot, not here.

on:
  pull_request:
    paths:
      - 'scripts/linear-ticket/**'
      - '.github/workflows/test-linear-ticket.yml'
      # linear-ticket.yml passes the scripts their whole input contract through env, so a
      # change to it can break the suite without touching a file under scripts/linear-ticket/.
      - '.github/workflows/linear-ticket.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/linear-ticket/**'
      - '.github/workflows/test-linear-ticket.yml'
      - '.github/workflows/linear-ticket.yml'

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/linear-ticket
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck -x lib.sh validate.sh tests/test_lib.sh
      - name: lib suite
        run: bash tests/test_lib.sh

name: Test bump-callers script

# Runs the functional tests + shellcheck for the shared caller-bump scripts
# (.github/bump-callers/bump-callers.sh and its preflight.sh staleness guard).
# That one bump script drives the SHA-bump
# fan-out for the cursor-review, cursor-review-auto-label, agents-md-integrity,
# pr-size, pr-risk, assign-reviewers, groom AND detect-unreviewed-merge caller fleets,
# so a regression here silently breaks every consumer
# repo's pin auto-bump (or, worse, leaks a private caller name into this public
# repo's run logs) — cheap to guard with a unit run on change. Mirrors
# test-cursor-review-scripts.yml / test-agents-md-integrity.yml.

on:
  pull_request:
    paths:
      - '.github/bump-callers/**'
      - '.github/workflows/bump-cursor-review-callers.yml'
      - '.github/workflows/bump-agents-md-callers.yml'
      - '.github/workflows/bump-pr-size-callers.yml'
      - '.github/workflows/bump-pr-risk-callers.yml'
      - '.github/workflows/bump-assign-reviewers-callers.yml'
      - '.github/workflows/bump-groom-callers.yml'
      - '.github/workflows/bump-auto-label-callers.yml'
      - '.github/workflows/bump-detect-unreviewed-merge-callers.yml'
      - '.github/workflows/test-bump-callers.yml'
  push:
    branches: [main]
    paths:
      - '.github/bump-callers/**'
      - '.github/workflows/bump-cursor-review-callers.yml'
      - '.github/workflows/bump-agents-md-callers.yml'
      - '.github/workflows/bump-pr-size-callers.yml'
      - '.github/workflows/bump-pr-risk-callers.yml'
      - '.github/workflows/bump-assign-reviewers-callers.yml'
      - '.github/workflows/bump-groom-callers.yml'
      - '.github/workflows/bump-auto-label-callers.yml'
      - '.github/workflows/bump-detect-unreviewed-merge-callers.yml'
      - '.github/workflows/test-bump-callers.yml'

permissions:
  contents: read

jobs:
  test:
    name: shellcheck + functional
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ShellCheck the bump scripts + tests
        run: shellcheck -x .github/bump-callers/bump-callers.sh .github/bump-callers/preflight.sh .github/bump-callers/tests/test_bump_callers.sh .github/bump-callers/tests/test_preflight.sh .github/bump-callers/tests/test_paths_contract.sh

      - name: Run bump-callers functional tests
        run: bash .github/bump-callers/tests/test_bump_callers.sh

      - name: Run preflight functional tests
        run: bash .github/bump-callers/tests/test_preflight.sh

      # Reads the real bump-*-callers.yml entrypoints, so it must re-run when any
      # of them changes — the paths: filter above already lists every one.
      - name: Run paths/preflight contract test
        run: bash .github/bump-callers/tests/test_paths_contract.sh

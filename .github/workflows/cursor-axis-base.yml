name: Cursor axis (base)

# Shared body of every cursor-approve axis workflow (axis-correctness.yml,
# axis-conformance.yml, ...). Not called by consumers directly: each axis is a
# thin wrapper that declares ONLY the secrets that axis needs, so an axis can
# never see another axis's credentials. See docs/callers/cursor-approve.md.
#
# Inputs:
#   axis        one of business/design/correctness/completeness/conformance
#   commit_sha  the PR head the axis judges (the commit cursor-review reviewed)
#   model       Cursor model id (default: cursor-review's judge model)
#   runs_on     JSON-encoded runs-on, parsed with fromJSON like cursor-review's
#   checkout    true → full read-only checkout of the PR head at commit_sha
#   context_sources  comma list of linear,notion,slack: the context-proxy.py
#               tools this axis gets (business/design/completeness only). Empty
#               → no MCP server at all.
#   no_shell    true → deny cursor-agent's shell and file-write tools, and fail
#               the job if the transcript shows one was called anyway. Required
#               (with checkout false) for business and design. false → the
#               shell is ALLOWED (an explicit Shell(*) rule), and the job fails
#               if every shell call in the transcript was rejected.
# Secrets:
#   CURSOR_API_KEY
#   LINEAR_KEY, NOTION_TOKEN, SLACK_TOKEN  optional, read-only bot tokens for
#               the context proxy. They are written to a 0600 file in their own
#               step; the proxy reads and deletes it BEFORE the agent starts, so
#               no token is ever in the agent step's env or reachable by it.
#
# Without a checkout (business, design) the workflow, not the agent, fetches the
# change from the GitHub API at commit_sha's merge base: business gets the
# changed-file list with line counts, design the diff truncated to 200 KB.
#
# Output: one artifact, `axis-<axis>`, holding `<axis>.json` — exactly one JSON
# object `{"verdict", "confidence", "headline", "summary", "commit_sha"}`
# (commit_sha is stamped from this job's input, not taken from the model).
# `verdict` is red/yellow/green/n-a; `headline` is the one line the PR card
# shows, so it is REQUIRED and capped at 100 characters, while `summary` is
# the detail behind it and only reaches the run's job summary. A failing run uploads nothing,
# which cursor-approve.yml's decide phase reads as "no result" and never approves.
# The agent's full stream-json transcript (plus the proxy's call log) goes to a
# SEPARATE artifact, `transcript-axis-<axis>`, named so decide's `axis-*` download
# never matches it.
#
# The scripts and prompts load from THIS repo at `job.workflow_sha` — the
# commit the caller's `uses:` resolved to, computed by the runner — so a PR can
# never rewrite the prompt judging it, and no caller-supplied ref is needed.

on:
  workflow_call:
    inputs:
      axis:
        type: string
        required: true
      commit_sha:
        type: string
        required: true
      model:
        type: string
        default: claude-opus-5-5-xhigh
      runs_on:
        type: string
        default: '"ubuntu-latest"'
      checkout:
        type: boolean
        default: false
      context_sources:
        description: Comma list of linear,notion,slack context-proxy tools; empty for none.
        type: string
        default: ''
      no_shell:
        description: Deny cursor-agent's shell and file-write tools.
        type: boolean
        default: false
    secrets:
      CURSOR_API_KEY:
        required: true
      LINEAR_KEY:
        required: false
      NOTION_TOKEN:
        required: false
      SLACK_TOKEN:
        required: false

permissions:
  contents: read

env:
  # Same pin as cursor-review.yml's (a test keeps them equal); consumed by
  # .github/cursor-review/install-cursor-cli.sh.
  CURSOR_CLI_VERSION: 2026.10.01-e373342
  CURSOR_CLI_SHA256: a79726c6e644520e993970be4c45775a6889802b67abe461a677a53219ae28e8
  CURSOR_REVIEW_ASSETS: ${{ github.workspace }}/_cursor_approve_assets/.github/cursor-review
  CURSOR_APPROVE_ASSETS: ${{ github.workspace }}/_cursor_approve_assets/.github/cursor-approve

jobs:
  axis:
    name: 'axis: ${{ inputs.axis }}'
    runs-on: ${{ fromJSON(inputs.runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check inputs
        env:
          AXIS: ${{ inputs.axis }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          MODEL: ${{ inputs.model }}
          CONTEXT_SOURCES: ${{ inputs.context_sources }}
          CHECKOUT: ${{ inputs.checkout }}
          NO_SHELL: ${{ inputs.no_shell }}
          REPO_PRIVATE: ${{ github.event.repository.private }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          case "$AXIS" in
            business|design|correctness|completeness|conformance) ;;
            *) echo "::error::unknown axis '$AXIS'"; exit 1 ;;
          esac
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::commit_sha must be a full 40-hex SHA"; exit 1
          fi
          if ! printf '%s' "$MODEL" | grep -Eq '^[a-z0-9][a-z0-9._-]*$'; then
            echo "::error::model must be a Cursor model id"; exit 1
          fi
          # [[ =~ ]] anchors the whole value; grep's ^...$ would anchor one line.
          if ! [[ "$CONTEXT_SOURCES" =~ ^((linear|notion|slack)(,(linear|notion|slack))*)?$ ]]; then
            echo "::error::context_sources must be a comma list of linear, notion, slack"; exit 1
          fi
          # No axis reads Slack (docs/callers/cursor-approve.md, "Context
          # axes"): enforced here, not only in the wrappers, so a direct caller
          # of this public base cannot turn it back on.
          case ",$CONTEXT_SOURCES," in
            *,slack,*) echo "::error::context_sources may not include slack: no axis reads Slack"; exit 1 ;;
          esac
          if [ -n "$CONTEXT_SOURCES" ]; then
            case "$AXIS" in
              business|design|completeness) ;;
              *) echo "::error::only the business, design and completeness axes get context tools"; exit 1 ;;
            esac
            # The wrappers skip public repos with a notice; this is the
            # backstop. Company context must never meet a public PR.
            if [ "$REPO_PRIVATE" != "true" ]; then
              echo "::error::the context axes run on private repositories only"; exit 1
            fi
          fi
          # Without a checkout the agent reads only what this workflow fetched;
          # a shell would let it reach past that. Fail closed on a miswiring.
          case "$AXIS" in
            business|design)
              if [ "$CHECKOUT" != "false" ] || [ "$NO_SHELL" != "true" ]; then
                echo "::error::the $AXIS axis requires checkout false and no_shell true"; exit 1
              fi ;;
            # Only business and design get the change fetched for them; any
            # other axis without a checkout would judge with no view of it.
            *)
              if [ "$CHECKOUT" != "true" ]; then
                echo "::error::the $AXIS axis requires checkout true"; exit 1
              fi ;;
          esac
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::an axis runs on a pull_request(_target) event only"; exit 1
          fi
          # Same rule as cursor-review.yml's gate: a fork PR never gets a
          # checkout plus a --trust agent run with CURSOR_API_KEY in its env
          # (under pull_request_target it would). Failing uploads no verdict,
          # which decide reads as "no result" and never approves.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::PR is from a fork ($HEAD_REPO != $BASE_REPO); the axes do not run on fork PRs"; exit 1
          fi
          # actions/checkout with ref '' takes the default branch — mutable
          # scripts under a pinned uses:. job.workflow_sha is '' only below
          # runner v2.334.0; fail closed rather than load from main.
          if ! printf '%s' "$WORKFLOW_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::job.workflow_sha is empty or malformed (Actions runner older than v2.334.0?); refusing to load the axis prompts from a mutable ref"
            exit 1
          fi

      - name: Load cursor-approve assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/github-workflows
          ref: ${{ job.workflow_sha }}
          path: _cursor_approve_assets
          persist-credentials: false

      - name: Check out the PR head (read-only)
        if: inputs.checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the change (no checkout)
        if: ${{ !inputs.checkout && (inputs.axis == 'business' || inputs.axis == 'design') }}
        env:
          GH_TOKEN: ${{ github.token }}
          AXIS: ${{ inputs.axis }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
        run: |
          # The three-dot compare is the merge-base diff of exactly commit_sha,
          # the same change the checkout axes review, even if the PR moved on.
          mkdir -p pr
          compare="repos/$REPO/compare/$BASE_SHA...$COMMIT_SHA"
          if [ "$AXIS" = "business" ]; then
            # One page, no --paginate: compare paginates COMMITS, and lists the
            # files (at most 300) on the first page only. The path is JSON-encoded
            # so a newline or tab in a filename cannot forge extra rows.
            gh api "$compare?per_page=1" \
              --jq '(.files // [])[] | "\(.status)\t+\(.additions)\t-\(.deletions)\t\(.filename | @json)"' \
              > pr/changed-files.txt
            rows="$(wc -l < pr/changed-files.txt)"
            if [ "$rows" -ge 300 ]; then
              printf '[file list truncated: the compare API lists at most 300 files]\n' >> pr/changed-files.txt
            fi
            echo "changed files: $rows"
          else
            gh api -H 'Accept: application/vnd.github.diff' "$compare" > "$RUNNER_TEMP/pr-full.diff"
            limit=204800
            size="$(wc -c < "$RUNNER_TEMP/pr-full.diff")"
            head -c "$limit" "$RUNNER_TEMP/pr-full.diff" > pr/pr.diff
            if [ "$size" -gt "$limit" ]; then
              printf '\n[diff truncated: showing %s of %s bytes]\n' "$limit" "$size" >> pr/pr.diff
            fi
            echo "diff bytes: $size"
          fi

      - name: Render prompt
        env:
          AXIS: ${{ inputs.axis }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPO: ${{ github.repository }}
          CHECKOUT: ${{ inputs.checkout }}
          CONTEXT_SOURCES: ${{ inputs.context_sources }}
        run: |
          mkdir -p pr
          # The PR's own text, as data the prompt points at. Kept outside the
          # checkout's tracked tree (under .git) so it never shows in a diff.
          ctx_dir="pr/.git"
          [ -d "$ctx_dir" ] || ctx_dir="pr"
          ctx="$ctx_dir/cursor-approve-context.md"
          { printf '# %s\n\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } > "$ctx"
          merge_base="$BASE_SHA"
          if [ "$CHECKOUT" = "true" ]; then
            merge_base="$(git -C pr merge-base "origin/$BASE_REF" "$COMMIT_SHA" 2>/dev/null || printf '%s' "$BASE_SHA")"
          fi
          {
            python3 "$CURSOR_APPROVE_ASSETS/aggregate.py" render \
              --axis "$AXIS" --pr-number "$PR_NUMBER" --repo "$REPO" \
              --head-sha "$COMMIT_SHA" --merge-base-sha "$merge_base" \
              --base-ref "$BASE_REF" --context-file "${ctx#pr/}"
            case "$CHECKOUT/$AXIS" in
              false/business|false/design) cat "$CURSOR_APPROVE_ASSETS/prompt-no-checkout.md" ;;
            esac
            if [ -n "$CONTEXT_SOURCES" ]; then cat "$CURSOR_APPROVE_ASSETS/prompt-context-tools.md"; fi
          } > "$RUNNER_TEMP/axis-prompt.txt"

      - name: Install Cursor agent CLI
        run: bash "$CURSOR_REVIEW_ASSETS/install-cursor-cli.sh"

      - name: Write the context token file
        # The ONLY step that sees LINEAR_KEY / NOTION_TOKEN / SLACK_TOKEN. It
        # writes the enabled ones to a 0600 file and passes on nothing but the
        # path; context-proxy.py reads and deletes that file before the agent
        # starts. A missing secret just leaves that source unconfigured.
        if: inputs.context_sources != ''
        env:
          CONTEXT_SOURCES: ${{ inputs.context_sources }}
          LINEAR_KEY: ${{ secrets.LINEAR_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os
          enabled = set(os.environ["CONTEXT_SOURCES"].split(","))
          names = {"linear": "LINEAR_KEY", "notion": "NOTION_TOKEN", "slack": "SLACK_TOKEN"}
          tokens = {s: os.environ.get(v, "") for s, v in names.items() if s in enabled and os.environ.get(v)}
          path = os.path.join(os.environ["RUNNER_TEMP"], "cursor-approve-tokens.json")
          fd = os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as f:
              json.dump(tokens, f)
          print("context sources with a token:", ", ".join(sorted(tokens)) or "none")
          PY

      - name: Run the axis
        working-directory: pr
        # No LINEAR_KEY / NOTION_TOKEN / SLACK_TOKEN here, ever (a test enforces
        # it): this step only knows where the proxy's token file WAS.
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          MODEL: ${{ inputs.model }}
          CONTEXT_SOURCES: ${{ inputs.context_sources }}
          NO_SHELL: ${{ inputs.no_shell }}
        run: |
          installed="$(cursor-agent --version)"
          if [ "$installed" != "$CURSOR_CLI_VERSION" ]; then
            echo "::error::cursor-agent reports '${installed}', expected the pinned '${CURSOR_CLI_VERSION}'."
            exit 1
          fi
          out="$RUNNER_TEMP/axis-transcript"
          mkdir -p "$out"
          token_file="$RUNNER_TEMP/cursor-approve-tokens.json"
          fifo_dir=""
          if [ -n "$CONTEXT_SOURCES" ]; then
            # Start the proxy BEFORE the agent, on two FIFOs (opened read-write
            # so neither open blocks), without CURSOR_API_KEY in its env. It
            # reads and deletes the token file at startup; the agent is not
            # started until that file is gone.
            fifo_dir="$(mktemp -d)"
            mkfifo -m 600 "$fifo_dir/in" "$fifo_dir/out"
            set -m
            env -u CURSOR_API_KEY python3 "$CURSOR_APPROVE_ASSETS/context-proxy.py" \
              --token-file "$token_file" --enable "$CONTEXT_SOURCES" --log "$out/context-calls.jsonl" \
              0<>"$fifo_dir/in" 1<>"$fifo_dir/out" 2>"$out/context-proxy-stderr.txt" &
            proxy_pid=$!
            set +m
            for _ in $(seq 1 100); do
              [ -e "$token_file" ] || break
              kill -0 "$proxy_pid" 2>/dev/null || break
              sleep 0.1
            done
            if [ -e "$token_file" ] || ! kill -0 "$proxy_pid" 2>/dev/null; then
              rm -f -- "$token_file"
              echo "::error::context-proxy.py did not start (or did not delete its token file); not starting the agent"
              head -c 2000 "$out/context-proxy-stderr.txt"
              exit 1
            fi
          fi
          # Project-level Cursor config, as cursor-review writes it: replace any
          # PR-authored .cursor/mcp.json or cli.json, so the proxy is the ONLY
          # MCP server and the PR cannot widen the permissions below.
          rm -rf -- .cursor
          # A PR-authored ignore file could hide its own changes from the
          # read and search tools of the reviewer judging it.
          rm -f -- .cursorignore .cursorindexingignore
          mkdir -m 700 .cursor
          python3 - "$fifo_dir" <<'PY'
          import json, os, sys
          fifo_dir = sys.argv[1]
          servers = {}
          allow = []
          if fifo_dir:
              relay = os.path.join(os.environ["CURSOR_APPROVE_ASSETS"], "mcp-relay.py")
              servers["context"] = {"type": "stdio", "command": sys.executable,
                                    "args": [relay, f"{fifo_dir}/in", f"{fifo_dir}/out"]}
              tools = {"linear": ("linear_search", "linear_get_issue"),
                       "notion": ("notion_search", "notion_get_page"),
                       "slack": ("slack_search", "slack_history")}
              for source in os.environ["CONTEXT_SOURCES"].split(","):
                  allow += [f"Mcp(context:{tool})" for tool in tools[source]]
          # Write(**) is the permission behind the edit and delete tools too;
          # WebFetch(*) keeps an agent that has read company context off the network.
          deny = ["Shell(*)", "Write(**)", "WebFetch(*)"] if os.environ["NO_SHELL"] == "true" else []
          # A checkout axis gets its shell by an explicit allow rule. --print
          # has no one to approve a command, so with an empty allow list every
          # shell call comes back `rejected` and the agent reviews blind; the
          # transcript check below fails the job if that ever happens again.
          # This is the same unsandboxed-shell-over-PR-code exposure the
          # cursor-review panel already accepts (see its header).
          if os.environ["NO_SHELL"] != "true":
              allow.append("Shell(*)")
          for name, value in (("mcp.json", {"mcpServers": servers}),
                              ("cli.json", {"permissions": {"allow": allow, "deny": deny}})):
              with open(os.path.join(".cursor", name), "w", encoding="utf-8") as f:
                  json.dump(value, f)
          PY
          cursor-agent --print --trust --approve-mcps --output-format stream-json --model "$MODEL" \
            < "$RUNNER_TEMP/axis-prompt.txt" \
            > "$RUNNER_TEMP/axis-stream.jsonl" 2> "$out/stderr.txt" \
            && rc=0 || rc=$?
          if [ -n "$fifo_dir" ]; then
            kill -TERM -- "-$proxy_pid" 2>/dev/null || kill "$proxy_pid" 2>/dev/null || true
          fi
          echo "cursor-agent exit code: $rc"
          head -c 2000 "$out/stderr.txt"
          # The final reply goes on to extraction; the whole transcript only to
          # its own artifact. With no_shell, a shell or file-write tool call in
          # the transcript means this cursor-agent did not enforce the deny
          # list: fail rather than trust a verdict from an agent that had them.
          # Any agent must read the change, so a transcript with NO recognizable
          # tool call means the stream-json shape drifted and the guards cannot
          # see: fail closed then too, on every axis. With context tools, the
          # uploaded transcript keeps only each tool call's name, never its
          # arguments or results (Linear, Notion and Slack content). The raw
          # stream stays outside the uploaded directory, so a timeout or a
          # failed run never uploads it unredacted.
          AGENT_RC="$rc" python3 - "$RUNNER_TEMP/axis-stream.jsonl" "$RUNNER_TEMP/axis-raw.txt" \
            "$out/transcript.jsonl" <<'PY'
          import json, os, sys
          forbidden = ("shellToolCall", "writeToolCall", "editToolCall", "deleteToolCall")
          redact = bool(os.environ["CONTEXT_SOURCES"])
          result, called, recognized, kept = None, set(), 0, []
          shell_ok, shell_rejected = 0, 0
          with open(sys.argv[1], encoding="utf-8", errors="replace") as f:
              for line in f:
                  try:
                      event = json.loads(line)
                  except ValueError:
                      continue
                  if not isinstance(event, dict):
                      continue
                  if event.get("type") == "result" and isinstance(event.get("result"), str):
                      result = event["result"]
                  call = event.get("tool_call")
                  if event.get("type") == "tool_call" and isinstance(call, dict):
                      names = [k for k in call if k.endswith("ToolCall")]
                      recognized += bool(names)
                      called.update(k for k in call if k in forbidden)
                      shell = call.get("shellToolCall")
                      if event.get("subtype") == "completed" and isinstance(shell, dict):
                          outcome = shell.get("result")
                          if isinstance(outcome, dict) and "rejected" in outcome:
                              shell_rejected += 1
                          else:
                              shell_ok += 1
                      if redact:
                          event = {"type": "tool_call", "subtype": event.get("subtype"),
                                   "call_id": event.get("call_id"), "tools": sorted(call)}
                  kept.append(json.dumps(event, separators=(",", ":")))
          with open(sys.argv[3], "w", encoding="utf-8") as f:
              f.write("".join(k + "\n" for k in kept))
          if os.environ["AGENT_RC"] != "0":
              sys.exit(int(os.environ["AGENT_RC"]))
          if os.environ["NO_SHELL"] == "true" and called:
              sys.exit(f"::error::no_shell is set but the agent called {', '.join(sorted(called))}; "
                       "this cursor-agent version does not enforce the deny list")
          # Every axis must read something, so no recognizable tool call means
          # the stream-json shape drifted (or the agent judged blind): fail.
          if not recognized:
              sys.exit("::error::the transcript has no recognizable tool call; its stream-json "
                       "shape may have changed, or the agent read nothing before its verdict")
          # A checkout axis whose every shell call was rejected never ran the
          # git its prompt points at: the allow rule above stopped working.
          if os.environ["NO_SHELL"] != "true" and shell_rejected and not shell_ok:
              sys.exit(f"::error::all {shell_rejected} shell call(s) were rejected; this axis is "
                       "meant to have a shell, so its verdict would be blind")
          if result is None:
              sys.exit("::error::the cursor-agent transcript has no result event")
          with open(sys.argv[2], "w", encoding="utf-8") as f:
              f.write(result)
          PY

      - name: Remove the context token file
        if: always() && inputs.context_sources != ''
        run: rm -f -- "$RUNNER_TEMP/cursor-approve-tokens.json"

      - name: Upload the transcript
        # Its own artifact, never named axis-*: only the verdict JSON flows on.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: transcript-axis-${{ inputs.axis }}
          path: ${{ runner.temp }}/axis-transcript/
          if-no-files-found: ignore
          retention-days: 7

      - name: Extract the verdict
        env:
          AXIS: ${{ inputs.axis }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/axis-out"
          python3 "$CURSOR_APPROVE_ASSETS/aggregate.py" extract --commit-sha "$COMMIT_SHA" \
            --raw "$RUNNER_TEMP/axis-raw.txt" --out "$RUNNER_TEMP/axis-out/$AXIS.json"
          cat "$RUNNER_TEMP/axis-out/$AXIS.json"

      - name: Upload the verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: axis-${{ inputs.axis }}
          path: ${{ runner.temp }}/axis-out/${{ inputs.axis }}.json
          if-no-files-found: error
          retention-days: 7

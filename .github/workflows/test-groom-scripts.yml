name: Test groom scripts

# Runs the unit tests behind groom's building blocks: the dedup/rejection ledger
# (ledger.py), the cadence gate (interval.py) and the path scoper (scope.py).
# Each is durable memory or a gate whose regression is SILENT — the ledger
# re-opens the spam it exists to prevent, the cadence gate over- or under-runs a
# billed audit, and the path scoper would let a scoped run stamp "done" over a
# whole-repo one. Cheap to guard with a unit run on change.
#
# `.github/workflows/groom.yml` is in the path filter because test_scope.py
# asserts against the workflow's own wiring (the SIG_SCOPE input that keeps dedup
# signatures scope-independent) — a groom.yml-only edit must still run these.

on:
  pull_request:
    paths:
      - '.github/groom/**'
      - '.github/workflows/groom.yml'
      - '.github/workflows/test-groom-scripts.yml'
  push:
    branches: [main]
    paths:
      - '.github/groom/**'
      - '.github/workflows/groom.yml'
      - '.github/workflows/test-groom-scripts.yml'

permissions:
  contents: read

jobs:
  test:
    name: unittest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Run groom script unit tests
        run: python3 -m unittest discover -s .github/groom/tests -p 'test_*.py' -v
